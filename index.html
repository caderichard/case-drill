<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F2F4D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Case Drill">
<title>Case Framework Drill</title>
<style>
:root{
  --navy:#1F2F4D; --navy2:#2E4470; --ink:#17202E; --mut:#66708A; --line:#E3E7EF;
  --bg:#F4F5F8; --card:#FFFFFF; --acc:#C8893A; --ok:#2E7D57; --bad:#B4453A; --okbg:#E6F4EC; --badbg:#FBE9E7;
  --r:16px; --sa-top:env(safe-area-inset-top,0px); --sa-bot:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F141E; --card:#18202E; --ink:#EDF0F6; --mut:#9AA4BA; --line:#273145; --okbg:#173426; --badbg:#3A1E1B; --navy:#0B1220; --navy2:#1C2A48;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Segoe UI,Roboto,sans-serif;height:100%;overscroll-behavior:none}
body{display:flex;flex-direction:column;min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{background:var(--navy);color:#fff;padding:calc(10px + var(--sa-top)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;font-weight:650;flex:1;letter-spacing:.2px}
header .back{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;margin-left:-8px}
header .filt{background:rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
main{flex:1;padding:14px 14px calc(78px + var(--sa-bot));max-width:620px;width:100%;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + var(--sa-bot));z-index:5}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:4px 0;font-weight:600}
nav.tabs button.on{color:var(--acc)}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(20,30,50,.06);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;min-height:104px;position:relative}
.mode .ic{font-size:22px}
.mode b{font-size:15px;line-height:1.2}
.mode small{color:var(--mut);font-size:12px;line-height:1.3}
.mode .pill{position:absolute;top:10px;right:10px;background:var(--acc);color:#fff;border-radius:999px;font-size:11px;padding:2px 7px;font-weight:700}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:18px 2px 8px;font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--okbg);color:var(--ok);padding:3px 8px;border-radius:6px}
.tag.navy{background:var(--navy2);color:#fff}
.tag.gold{background:#F6E9D6;color:#8A5A1A}
.q{font-size:18px;font-weight:600;line-height:1.35;margin:10px 0 4px}
.ctx{color:var(--mut);font-size:14px;margin-bottom:6px}
.prompt{font-size:15.5px;line-height:1.5;margin:8px 0}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{text-align:left;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:15px;line-height:1.35;display:flex;gap:10px;align-items:flex-start}
.opt .k{width:22px;height:22px;border-radius:50%;background:var(--bg);color:var(--mut);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)} .opt.bad .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:14.5px;line-height:1.45;border-left:4px solid var(--ok);background:var(--okbg)}
.fb.bad{border-left-color:var(--bad);background:var(--badbg)}
.fb b{display:block;margin-bottom:3px}
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--navy2);color:#fff;font-weight:650;font-size:16px;margin-top:14px;text-align:center}
.btn.ghost{background:transparent;color:var(--navy2);border:1.5px solid var(--line)}
@media (prefers-color-scheme:dark){.btn.ghost{color:#fff}}
.row{display:flex;gap:10px}.row .btn{flex:1;margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-bottom:8px}
.top b{color:var(--ink)}
.bucket{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.bucket b{display:block;font-size:15px}
.bucket .why{color:var(--mut);font-size:13px;margin:2px 0 4px;font-style:italic}
.bucket ul{margin:4px 0 0;padding-left:18px;font-size:14px;color:var(--ink)}
.bucket li{margin:2px 0}
.kv{margin-top:12px;font-size:14.5px;line-height:1.5}
.kv b{color:var(--acc);font-size:12px;text-transform:uppercase;letter-spacing:.06em;display:block;margin-top:10px}
.flash{min-height:300px;display:flex;flex-direction:column}
.flash .front{font-size:19px;font-weight:600;line-height:1.35}
.flash .hint{color:var(--mut);font-size:13px;margin-top:auto;padding-top:20px;text-align:center}
.srs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.srs button{padding:12px 4px;border-radius:12px;font-weight:700;font-size:14px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:1px}
.srs small{font-weight:500;font-size:11px;opacity:.85}
.srs .ag{background:#B4453A}.srs .hd{background:#C8893A}.srs .gd{background:#2E7D57}.srs .ez{background:#2E5AAC}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;padding:14px 16px calc(16px + var(--sa-bot));z-index:21;max-height:85dvh;overflow:auto;display:none}
.sheet h3{margin:4px 0 10px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:600}
.chip.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.fam{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px;font-weight:700}
.timer{font-variant-numeric:tabular-nums;font-size:54px;font-weight:700;text-align:center;letter-spacing:-1px;margin:6px 0}
.timer.warn{color:var(--bad)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.stat:last-child{border-bottom:0}
.stat .n{font-weight:700}
.deck{display:flex;align-items:center;gap:12px;text-align:left;margin-bottom:10px}
.deck .ic{font-size:24px;width:40px;text-align:center}
.deck b{display:block;font-size:15.5px}.deck small{color:var(--mut);font-size:13px}
.deck .due{margin-left:auto;background:var(--acc);color:#fff;border-radius:999px;font-size:12px;padding:3px 9px;font-weight:700}
.deck .due.z{background:var(--line);color:var(--mut)}
.grade{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.grade button{padding:12px 0;border-radius:10px;border:1.5px solid var(--line);font-weight:700}
.grade button.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.qs{margin-top:10px}
.qs details{border-top:1px solid var(--line);padding:8px 0;font-size:14.5px}
.qs summary{font-weight:600;cursor:pointer}
.qs p{margin:6px 0 0;color:var(--mut)}
.small{font-size:13px;color:var(--mut)}
.streak{font-weight:700;color:var(--acc)}
.center{text-align:center;padding:30px 10px;color:var(--mut)}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <button class="back hide" id="back" aria-label="Back">‹</button>
  <h1 id="title">Case Framework Drill</h1>
  <button class="filt" id="filtBtn">All types</button>
</header>
<main id="main"></main>

  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Stats</button>
</nav>
<div class="sheet-bg" id="sheetBg"></div>

<script>

contractual / regulated"], "why": "You cannot cut what you have not mapped; addressability sets the real pool."}, {"name": "Benchmarks", "subs": ["Cost ratios vs peers", "Internal spread (best vs worst unit)", "Historical run-rate"], "why": "Tells you where the gap is and how big the prize could be."}, {"name": "Levers", "subs": ["Demand (consume less)", "Price (pay less: procurement, renegotiate)", "Productivity (people, process, technology)", "Structure (footprint, make vs buy)"], "why": "Four distinct ways cost falls; each has a different owner and timeline."}, {"name": "Impact & risk", "subs": ["Run-rate vs one-time savings", "Cost to achieve, timing", "Revenue / quality / morale risk"], "why": "A cut that hits revenue or service is not a saving."}], "trap": "Cuts that hit revenue or quality; confusing one-time with run-rate savings; shaving every line equally instead of going where the spread is.", "hyp": "\"Cost-reduction case. The target is $X; my hypothesis is that most of it comes from [the biggest addressable category], where our ratio is above benchmark.\"", "start": "Baseline — size the addressable pool first", "formula": "Savings target ÷ addressable base = % cut required; compare to benchmark gap"}, {"id": "compete", "name": "Competitive Response", "short": "Compete", "fam": "A", "defn": "A competitor moved (entered, cut price, merged, launched) and the client must decide how, or whether, to respond.", "triggers": ["A discounter opened across the street", "Competitor #2 is acquiring #4", "A rival just cut prices 20% / launched free shipping"], "buckets": [{"name": "What changed", "subs": ["Why did the competitor do this — their impetus?", "Scale and durability of the move", "Which customers it targets"], "why": "Understand the move before reacting to it; BCG wants the 'why did this happen'."}, {"name": "Where we're losing", "subs": ["Segment, channel, geography", "Volume vs price vs mix impact", "Market after the move — how does it look?"], "why": "Size the damage and picture the after-state before choosing a response."}, {"name": "Why we're losing", "subs": ["Customer purchase criteria vs our position", "Switching costs and loyalty", "Our relative cost position"], "why": "Price-matching a non-price loss is the classic error."}, {"name": "Response options", "subs": ["Do nothing / monitor", "Match (price, feature) with economics", "Differentiate, reposition, or lock in customers", "Counter-move: M&A, partnerships, exclusive content"], "why": "Each option has an economic case and a likely second-order competitor reaction."}], "trap": "Matching on price when the loss is non-price; ignoring the competitor's second move; forgetting 'do nothing' as an option.", "hyp": "\"Competitive-response case. Hypothesis: the loss is concentrated in [segment] and is about [price/service], so the right response is targeted, not a blanket price cut.\"", "start": "What changed → where we're losing", "formula": "Breakeven volume loss of matching a price cut = Δp ÷ (new price − variable cost)"}, {"id": "turnaround", "name": "Turnaround", "short": "Turnaround", "fam": "A", "defn": "The business is in distress — losses, cash running out, lenders nervous. Stabilize, then fix.", "triggers": ["Losing money for three years and cash is tight", "Lenders are threatening covenants", "New CEO brought in to save the company"], "buckets": [{"name": "Liquidity & runway", "subs": ["Cash burn and months of runway", "Working capital release (receivables, inventory)", "Covenants, debt maturities, refinancing"], "why": "Cash first — a turnaround you cannot fund never happens."}, {"name": "Core diagnosis", "subs": ["Which units / products / customers make money", "Root cause: demand collapse, cost base, pricing, operations", "Keep / fix / exit map"], "why": "Decide what the surviving company is before cutting."}, {"name": "Restructuring levers", "subs": ["Cost base and footprint", "Balance sheet (asset sales, debt restructuring)", "Pricing and mix quick wins"], "why": "The actions, sequenced by speed to cash."}, {"name": "Stakeholders & plan", "subs": ["Lenders, owners, employees, key customers", "90-day plan and milestones", "Management capability"], "why": "A plan nobody will back is not a plan."}], "trap": "Starting with the P&L when the problem is cash; cutting the parts that still make money because they are big.", "hyp": "\"Turnaround case. Runway is ~N months, so my hypothesis is we need cash actions in 90 days — working capital and exiting [loss-making unit] — before any growth story.\"", "start": "Liquidity & runway", "formula": "Runway (months) = Cash ÷ monthly burn; exit a unit only if it is loss-making after allocating shared costs"}, {"id": "ops", "name": "Operations / Throughput", "short": "Ops", "fam": "A", "defn": "A process is too slow, a queue is too long, or capacity is maxed out. Fix wait time or throughput.", "triggers": ["Wait times doubled at the DMV / ED / airport", "Throughput at the port has stalled", "Customers are abandoning the line"], "buckets": [{"name": "Demand", "subs": ["Volume and arrival pattern (peaks)", "Mix — the sector's 'acuity mix' (REAL ID vs renewal; PreCheck share)", "What changed in the rules or market"], "why": "Demand spikes often come from policy or mix, not population."}, {"name": "Process", "subs": ["Steps from arrival to the clock stopping", "Bottleneck step and its cycle time", "Rework, hand-offs, waiting between steps"], "why": "Only the bottleneck step sets throughput."}, {"name": "Capacity (supply)", "subs": ["Staff × hours × productivity", "Physical assets (lanes, beds, berths, cranes)", "Who actually controls capacity (TSA not airport)"], "why": "Capacity is often budget- or hiring-constrained; name who owns it."}, {"name": "Levers", "subs": ["Shift demand: channels, appointments, self-service, triage", "Add or re-time capacity to peaks", "Shorten the bottleneck step"], "why": "Fix the bottleneck first; everything else is cosmetic."}], "trap": "Fixing a non-bottleneck step; including steps after the clock stops (check-out, payment); forgetting the fix may sit outside the unit (ED boarding → discharge).", "hyp": "\"Operations case. My hypothesis is this is a mix-driven demand spike hitting a fixed bottleneck at [step], so the fastest lever is channel shift plus re-timing staff to peaks.\"", "start": "Process — find the bottleneck, then test Demand vs Capacity", "formula": "Throughput = min(step capacities); wait ≈ queue ÷ service rate; Little's Law: WIP = rate × time"}, {"id": "entry", "name": "Market Entry", "short": "Entry", "fam": "B", "defn": "Should the client enter a new geography, segment or product market, and how?", "triggers": ["Should we expand into Texas / Europe / Florida?", "Pharmacy chain adding in-store clinics", "Enter the U.S. with our own distribution?"], "buckets": [{"name": "Market attractiveness", "subs": ["Size and growth by segment", "Concentrated or fragmented; regulation", "Customer preferences and trends"], "why": "Is there a prize, and is it growing?"}, {"name": "Competition", "subs": ["Incumbents, share, pricing", "Barriers to entry; likely response", "Where we could differentiate"], "why": "Big market ≠ attainable share."}, {"name": "Client fit & capabilities", "subs": ["What travels (model, playbook) vs what doesn't (relationships, brand)", "Supply chain, distribution, local expertise", "Brand awareness from zero"], "why": "Can we actually win here with what we have?"}, {"name": "Entry economics & mode", "subs": ["Build / buy / partner / franchise", "Unit economics in the new market vs home", "Investment, breakeven, payback vs target"], "why": "Mode changes capex and risk more than anything else; worth it?"}], "trap": "Big market ≠ attainable share; assuming capabilities travel; jumping to the biggest mode (a plant) before proving demand.", "hyp": "\"Market-entry case. Hypothesis: the market is attractive but crowded, so entry only works via [mode] if unit economics hold at local costs — I'd start with entry economics.\"", "start": "Entry economics & mode (or Client fit when the moat is local relationships)", "formula": "Attainable revenue = market size × realistic share; payback = investment ÷ annual cash flow"}, {"id": "invest", "name": "Opportunity Assessment / Investment", "short": "Invest", "fam": "B", "defn": "A specific go/no-go decision — buy the plant, build the garage, in-source production, divest a line.", "triggers": ["Should we buy the bottling plant for $105M?", "Is the parking garage worth building?", "Should we take production in-house?"], "buckets": [{"name": "Strategic fit", "subs": ["Why this, why now; fit with objective and core", "Alternatives — including do nothing and the best alternative", "Stakeholders"], "why": "Frame the decision against the right baseline."}, {"name": "Economics", "subs": ["Upfront investment", "Incremental revenue or savings per year", "NPV / payback vs hurdle; sensitivity"], "why": "Never state a lean without a one-line benefit-vs-cost comparison."}, {"name": "Execution", "subs": ["Capacity and capabilities to run it", "Timeline, permits, regulation", "Integration or ramp"], "why": "Can we actually do it on time?"}, {"name": "Risks & alternatives", "subs": ["Downside scenarios; reversibility", "Other uses of the money", "Exit costs"], "why": "Risks are a separate bucket from reasons to lean yes."}], "trap": "Stating a lean before the math ('$90M sounds big'); comparing to do-nothing instead of the best alternative; mixing risks into the lean.", "hyp": "\"Investment case. Roughly $Y a year in savings on $X in — payback under N years — so my hypothesis is yes, subject to execution risk and whether the capital has a better use.\"", "start": "Economics — annual benefit vs upfront cost in one line", "formula": "Payback = I₀ ÷ annual CF; NPV = −I₀ + CF × AF(r,t); 5-yr AF at 10% ≈ 3.79"}, {"id": "ma", "name": "Merger / Acquisition", "short": "M&A", "fam": "B", "defn": "A strategic buyer considering acquiring a target: is it worth more to us than to anyone else, net of integration?", "triggers": ["Should we acquire our regional competitor?", "Co-op merger — does it make sense?", "A target is for sale at $X — pay it?"], "buckets": [{"name": "Target's market", "subs": ["Size, growth, trends", "Competitive landscape, comparable deals", "Regulatory climate"], "why": "A target in a shrinking market is cheap for a reason."}, {"name": "Target standalone value", "subs": ["Revenue (price × quantity) and cost (fixed, variable)", "Products, customers, capabilities, management", "Compatibility: IT, staff, culture"], "why": "What it is worth on its own before synergies — bucket 2 is where value math lives."}, {"name": "Synergies & fit", "subs": ["Revenue synergies (cross-sell, new markets) at contribution margin", "Cost synergies (shared services, procurement) — more bankable", "Integration cost and timing; cannibalization as a negative synergy"], "why": "Synergies are the case — they justify the premium."}, {"name": "Deal & risks", "subs": ["Price vs standalone + synergies − integration", "Financing; alternatives (build, partner)", "Customer / competitor / regulatory reaction; exit options"], "why": "Deal math lives here: max price and max premium."}], "trap": "Counting revenue synergies at revenue instead of margin; forgetting integration cost and cannibalization; not saying whether the buyer is strategic or PE.", "hyp": "\"M&A case with a strategic buyer, so I'll weight synergies and fit. Hypothesis: the deal works only if cost synergies cover the premium — I'd size standalone value, then synergies.\"", "start": "Target standalone value, then Synergies", "formula": "Max price = standalone + PV(synergies) − integration; max premium % = [PV(syn) − integration] ÷ standalone"}, {"id": "pe", "name": "PE Due Diligence / LBO", "short": "PE", "fam": "B", "defn": "A private-equity fund deciding whether to buy a company: can it hit its target IRR given entry price, leverage, improvements and exit?", "triggers": ["Our PE client is looking at a dental roll-up platform", "Fund wants 20–25% IRR on a linen-services buyout", "Should the fund acquire and carve out the division?"], "buckets": [{"name": "Market attractiveness", "subs": ["Growth, cyclicality, fragmentation (roll-up potential)", "Comparable deals and multiples", "Regulatory / reimbursement exposure"], "why": "Exit multiple depends on how buyers see the market in 5 years."}, {"name": "Company standalone", "subs": ["Revenue quality: recurring, concentration", "Margin and cash conversion", "Management team"], "why": "Quality of earnings determines what leverage it can carry."}, {"name": "Value-creation plan", "subs": ["EBITDA growth: organic levers, pricing, cost", "Add-on acquisitions", "Operational improvements the fund can actually deliver"], "why": "Name which lever drives returns: EBITDA growth, multiple, or debt paydown."}, {"name": "Deal & exit", "subs": ["Entry multiple and leverage", "Exit routes (strategic sale, IPO, secondary) and multiple", "IRR / MoM vs hurdle"], "why": "PE wins on returns math, not synergies."}], "trap": "Treating it like strategic M&A (synergies) when the question is IRR; banking on multiple expansion; forgetting the fund's hold period changes which levers count.", "hyp": "\"Since the buyer is a PE fund, I'll weight exit and returns more than synergies. Hypothesis: returns hinge on EBITDA growth via [add-ons/pricing]; the multiple should be held flat.\"", "start": "Deal & exit math alongside Value-creation plan", "formula": "EV = EBITDA × multiple; MoM = exit equity ÷ entry equity; IRR ≈ MoM^(1/t) − 1; 2.5× in 5 yrs ≈ 20%"}, {"id": "sizing", "name": "Market Sizing", "short": "Sizing", "fam": "B", "defn": "Estimate the size of a market, demand, or a quantity with a structured chain of assumptions.", "triggers": ["How big is the U.S. market for 911 dispatch software?", "How many hotel rooms does the base need per night?", "Estimate annual revenue of all car washes in Texas"], "buckets": [{"name": "Approach", "subs": ["Top-down or bottom-up — say which and why", "Define the unit and geography", "State the equation before plugging numbers"], "why": "The interviewer scores the logic chain more than the answer."}, {"name": "Segments", "subs": ["Start population (people, households, businesses)", "Split by age, income, B2B/B2C, urban/rural", "Drop segments that don't buy"], "why": "Segmentation is where you show judgment."}, {"name": "Drivers", "subs": ["Penetration / adoption rate", "Frequency or replacement cycle", "Price per unit"], "why": "Each driver is a stated, defendable assumption."}, {"name": "Answer & sanity check", "subs": ["Round at each step", "Cross-check with another method or known anchor", "So what for the client"], "why": "A wrong-by-10× answer with no check is the failure mode."}], "trap": "Forgetting to state the unit; false precision; not sanity-checking against an anchor (US population ~340M, ~130M households).", "hyp": "\"Market-sizing question. I'll go bottom-up: households × penetration × frequency × price, then sanity-check against [anchor].\"", "start": "Approach — state the equation first", "formula": "Market = population × penetration × frequency × price; anchors: US ~340M people, ~130M households, GDP ~$30T"}, {"id": "industry", "name": "Industry Analysis", "short": "Industry", "fam": "B", "defn": "Is this industry attractive, and where is the profit? Often a prelude to entry or investment.", "triggers": ["Is data-center colocation an attractive industry?", "Where are the profit pools in pet care?", "Assess the attractiveness of regional airlines"], "buckets": [{"name": "Size, growth & demand", "subs": ["Market size and growth by segment", "Demand drivers and cyclicality", "Customer needs and purchase criteria"], "why": "Growth sets the headroom."}, {"name": "Structure & competition", "subs": ["Concentration; Five Forces (rivalry, entry, substitutes, buyer/supplier power)", "Basis of competition (price, service, scale)", "Barriers to entry"], "why": "Structure determines who keeps the profit."}, {"name": "Profit pools & value chain", "subs": ["Margin by step of the chain", "Where value is shifting", "Cost structure and scale economics"], "why": "Attractiveness differs by position in the chain."}, {"name": "Trends & disruptors", "subs": ["Technology, regulation, substitutes", "Consolidation", "Implications for the client's position"], "why": "Today's structure is not tomorrow's."}], "trap": "Industry attractiveness ≠ client fit; reciting Porter's without a so-what for the client.", "hyp": "\"Industry-analysis case. Hypothesis: the industry is growing but profit pools sit in [step], so attractiveness depends on which position the client can take.\"", "start": "Structure & competition", "formula": "Use Porter's Five Forces only when the question is literally industry attractiveness"}, {"id": "newbiz", "name": "Starting a New Business", "short": "New biz", "fam": "B", "defn": "Launch a new venture or startup: does the business model work and can it scale?", "triggers": ["Should the founders launch a permitting-software startup?", "Investor asks whether this seed-stage company is viable", "Spin up a new business line from scratch"], "buckets": [{"name": "Market & customer", "subs": ["Who has the problem; how acute", "Market size and willingness to pay", "Alternatives they use today"], "why": "No pain, no business."}, {"name": "Business model & unit economics", "subs": ["Revenue model; price point", "CAC, LTV, gross margin, payback", "Path to contribution margin per unit"], "why": "Unit economics must work before scale."}, {"name": "Operations & team", "subs": ["Capabilities, hiring plan", "Supply, technology, partners", "Regulatory or licensing"], "why": "Can this team execute?"}, {"name": "Investment case", "subs": ["Capital required; runway", "Milestones that de-risk", "Competitive response and exit"], "why": "Funding follows milestones."}], "trap": "Scaling before unit economics work; sizing the TAM instead of the first customers.", "hyp": "\"New-business case. Hypothesis: the model works if CAC payback is under N months at the planned price; I'd test unit economics before market size.\"", "start": "Business model & unit economics", "formula": "LTV ÷ CAC > 3; CAC payback = CAC ÷ (monthly margin per customer)"}, {"id": "public", "name": "Public Sector / Nonprofit", "short": "Public", "fam": "B", "defn": "A program or agency is missing its outcomes or funding is unsustainable; the goal is impact, not profit.", "triggers": ["Childcare subsidy enrollment is far below eligible families", "State workforce agency isn't hitting placement targets", "Food bank's donor base is shrinking"], "buckets": [{"name": "Objective & metrics", "subs": ["Outcomes vs outputs — what success means", "Target population and baseline", "Mandate and constraints"], "why": "The goal isn't profit; define the unit of success first."}, {"name": "Target population funnel", "subs": ["Eligible → aware → applied → enrolled → served", "Drop-off at each stage and why", "Equity across groups"], "why": "Most program gaps are funnel leaks."}, {"name": "Delivery", "subs": ["Process, channels, caseworker capacity", "Partners and vendors", "Data and technology"], "why": "How the service actually reaches people."}, {"name": "Resources & constraints", "subs": ["Budget (fixed) and funding mix", "Staffing, procurement rules, legislation", "Stakeholders and politics"], "why": "Fixed budget means trade-offs, not growth."}], "trap": "Forcing a profit frame; forgetting a fixed budget means trade-offs; funder concentration and overhead cuts that kill fundraising (nonprofits).", "hyp": "\"Public-sector case; the goal is [outcome], not profit. Hypothesis: the gap is a funnel leak between eligible and enrolled, so I'd start with awareness and application friction.\"", "start": "Target population funnel", "formula": "Cost per outcome = program cost ÷ outcomes achieved; funnel conversion at each stage"}, {"id": "unconv", "name": "Unconventional", "short": "Unconv.", "fam": "B", "defn": "A problem with no standard frame — a city bidding for the Olympics, a university's reputation, a sports team's season.", "triggers": ["Should NYC bid for the 2040 Olympics?", "How should the museum respond to falling attendance?", "Help a hospital decide its visitor policy"], "buckets": [{"name": "Objective & measure", "subs": ["What does the decision-maker actually want?", "Convert it to a measurable unit", "Time horizon"], "why": "With no standard frame, the objective is the frame."}, {"name": "Stakeholders", "subs": ["Who gains, who pays, who can block", "Their criteria"], "why": "Unconventional cases are usually multi-stakeholder."}, {"name": "Options & levers", "subs": ["Generate 3–4 options", "Costs and benefits of each in the chosen unit", "Second-order effects"], "why": "Structure the choice, then evaluate."}, {"name": "Constraints & feasibility", "subs": ["Budget, legal, timing", "Risks and reversibility", "Precedents"], "why": "Reality check before recommending."}], "trap": "Force-fitting a profitability tree; failing to define the unit of success; forgetting stakeholders who can veto.", "hyp": "\"This doesn't fit a standard type, so I'll define success as [unit] and structure around objective, stakeholders, options and constraints.\"", "start": "Objective & measure", "formula": "Simple structure wins: internal vs external, or costs vs benefits in one unit"}, {"id": "sales", "name": "Increasing Sales", "short": "Sales", "fam": "C", "defn": "Near-term revenue lift from the existing business — more customers, more per customer, better price, better sales engine.", "triggers": ["Grow same-store sales 10% next year", "Sales reps are missing quota — lift revenue", "Revenue per member has stalled"], "buckets": [{"name": "More customers", "subs": ["Acquire new (marketing, channels)", "Win share from competitors", "Reduce churn"], "why": "Volume from new heads."}, {"name": "More per customer", "subs": ["Frequency / visits", "Basket / attach / cross-sell", "Upsell to premium tiers"], "why": "Volume from existing heads — usually cheaper."}, {"name": "Price & mix", "subs": ["Price increases, less discounting", "Mix shift to higher-margin products", "Bundling"], "why": "Revenue without more units."}, {"name": "Sales engine", "subs": ["Coverage and territories", "Capacity: reps × calls × conversion × deal size", "Incentives and enablement"], "why": "Decompose the funnel before adding reps."}], "trap": "Adding reps before decomposing the funnel; growth that destroys margin via discounting.", "hyp": "\"Increasing-sales case. Hypothesis: the fastest lift is more per customer — frequency and attach — because acquisition is expensive and the base is under-penetrated.\"", "start": "More per customer", "formula": "Revenue = customers × frequency × basket × price; reps × calls × conversion × deal size"}, {"id": "growth", "name": "Growth Strategy", "short": "Growth", "fam": "C", "defn": "Hit an ambitious multi-year revenue target — double in five years — using the Ansoff ladder from core to inorganic.", "triggers": ["Double revenue in five years", "Reach $450M from $300M in four years", "PE owner wants 20% growth over a two-year hold"], "buckets": [{"name": "Core", "subs": ["Penetration, frequency, price in current markets", "Store / online productivity", "Share gains"], "why": "Cheapest growth, but usually only adds a few points."}, {"name": "New reach", "subs": ["New geographies", "New channels (wholesale, DTC, foodservice)", "New customer segments"], "why": "Where most of a big gap usually comes from."}, {"name": "New products / capabilities", "subs": ["Adjacent categories", "Services, private label", "Formats"], "why": "Adjacencies that use the brand."}, {"name": "Inorganic", "subs": ["Tuck-ins, platform deals", "Partnerships, licensing", "Screen: capabilities, capital, cannibalization, timing"], "why": "The backstop — and the primary lever in a PE two-year horizon."}], "trap": "Bolting a profitability frame on a growth case; not sizing the gap first (trajectory vs target); a hypothesis that is a list of options rather than a bet.", "hyp": "\"Growth case. Current trajectory gets us to ~$A, so the gap is ~$B. The market grows X%, so most of it must come from new reach; I'd start there because [constraint].\"", "start": "New reach — after sizing the gap", "formula": "Rule of 72: double in 5 yrs ≈ 15%/yr; gap = target − (current × (1+g)^t)"}, {"id": "launch", "name": "Developing a New Product", "short": "Launch", "fam": "C", "defn": "Should the client launch a new product or service, and how?", "triggers": ["Launch a toddler snack line", "Bank adding a premium account tier", "Pharma facing generic entry — launch a reformulation?"], "buckets": [{"name": "Customer & market", "subs": ["Need, segment, size", "Willingness to pay", "Trends"], "why": "Is there demand for this specifically?"}, {"name": "Product & competition", "subs": ["Differentiation vs alternatives", "Competitor response", "Regulatory / IP"], "why": "Can it win on the shelf?"}, {"name": "Capabilities & go-to-market", "subs": ["Build / partner / license", "Channels and sales model", "Operations, supply"], "why": "Can we make and sell it?"}, {"name": "Financials", "subs": ["Ramp, price, volume", "Investment and breakeven", "Cannibalization — count incremental only"], "why": "Incremental profit, not gross launch revenue, is the test."}], "trap": "Counting cannibalized sales as growth; launching before capabilities and channel exist.", "hyp": "\"New-product case. Hypothesis: the launch is incremental only if it reaches [new segment]; I'd test cannibalization and breakeven volume first.\"", "start": "Financials — incremental economics", "formula": "Breakeven volume = fixed launch cost ÷ unit contribution; incremental = new − cannibalized"}, {"id": "pricing", "name": "Pricing", "short": "Pricing", "fam": "C", "defn": "Set or change a price — raise, cut, re-tier, bundle — and decide how.", "triggers": ["Should we raise the day-pass price 15%?", "Move from per-seat to usage pricing?", "Competitor undercut us — cut price?"], "buckets": [{"name": "Customer value & WTP", "subs": ["Value delivered vs alternatives", "Elasticity by segment", "Switching costs"], "why": "Price ceiling is value, not cost."}, {"name": "Competitive position", "subs": ["Competitor prices and positioning", "Likely response", "Differentiation"], "why": "Sets the realistic range."}, {"name": "Economics", "subs": ["Unit cost and contribution margin", "Breakeven volume change", "Mix and cannibalization across tiers"], "why": "Run breakeven volume math first."}, {"name": "Execution", "subs": ["Pricing model (per unit, tier, bundle, surcharge)", "Channel and communication", "Timing and grandfathering"], "why": "How the price change actually lands with customers."}], "trap": "Not running breakeven volume math first; cost-plus thinking; ignoring the competitor's response.", "hyp": "\"Pricing case. A 10% increase at a 40% margin breaks even if we lose less than ~20% of volume; my hypothesis is elasticity is below that in [segment], so a targeted increase works.\"", "start": "Economics — breakeven volume change", "formula": "Breakeven volume loss for a price increase = Δp ÷ (new price − variable cost)"}], "families": {"A": "Addressing a business challenge", "B": "Evaluating an opportunity", "C": "Growth strategies"}, "scen": [{"id": "s-a1", "type": "profit", "title": "Multi-unit consumer business: profit down, revenue flat", "buckets": [{"name": "Revenue per unit", "subs": ["Traffic × conversion × ticket", "Mix", "Same-store vs new units"]}, {"name": "Unit cost", "subs": ["COGS", "Labor hours × rate", "Occupancy"]}, {"name": "Footprint", "subs": ["Unit count and maturity", "Cannibalization between units"]}, {"name": "External", "subs": ["Input inflation, wage laws", "Competitor openings"]}], "trap": "Averages hide unit and daypart variance.", "hyp": "Mature units are healthy; new-unit ramp and rising labor/rent explain the drop."}, {"id": "s-a2", "type": "profit", "title": "Healthcare provider margin squeeze", "buckets": [{"name": "Volume & case mix", "subs": ["Inpatient vs outpatient vs ED", "Elective vs emergent", "Length of stay"]}, {"name": "Reimbursement", "subs": ["Payer mix", "Contracted rates", "Denials"]}, {"name": "Cost to serve", "subs": ["Clinical labor and agency", "Supplies", "Length of stay"]}, {"name": "Service-line portfolio", "subs": ["Margin by line", "Grow / fix / exit"]}], "trap": "Payers set price; the lever is mix.", "hyp": "Payer-mix shift plus agency labor explain the margin collapse; volume growth is in low-margin settings."}, {"id": "s-a3", "type": "profit", "title": "SaaS / subscription slowing and burning cash", "buckets": [{"name": "Acquisition", "subs": ["CAC by channel", "Conversion by funnel stage"]}, {"name": "Retention & expansion", "subs": ["Logo churn", "Net revenue retention", "Cohorts"]}, {"name": "Unit economics", "subs": ["ARPA", "Gross margin", "CAC payback"]}, {"name": "Cost base vs benchmark", "subs": ["R&D, G&A as % of ARR", "Hosting per customer"]}], "trap": "Bookings ≠ revenue ≠ cash; use cohorts.", "hyp": "The growth engine is inefficient (CAC payback too long), not the cost base bloated."}, {"id": "s-a4", "type": "profit", "title": "Manufacturer margin eroding", "buckets": [{"name": "Input costs", "subs": ["Price × usage / yield", "Scrap"]}, {"name": "Conversion", "subs": ["Productivity, OEE", "Overtime"]}, {"name": "Overhead & logistics", "subs": ["Footprint", "Freight, inventory", "Fixed-cost absorption"]}, {"name": "Price / mix pass-through", "subs": ["Realized price vs input inflation", "Mix shift"]}], "trap": "Fixed-cost absorption with volume decline.", "hyp": "Volume fell and fixed costs did not; absorption and failed pass-through drive the squeeze."}, {"id": "s-a5", "type": "profit", "title": "Asset-heavy network business: full but unprofitable", "buckets": [{"name": "Revenue per asset", "subs": ["Utilization × yield", "Ancillary revenue"]}, {"name": "Cost per unit", "subs": ["Fuel, labor, maintenance", "Ownership cost"]}, {"name": "Network / asset deployment", "subs": ["Which assets on which routes or contracts", "Fleet age"]}, {"name": "External", "subs": ["Fuel and labor markets", "Competitor pricing"]}], "trap": "Full at low yield = underpriced.", "hyp": "Busy but underpriced: contracts won at rates that no longer cover cost increases."}, {"id": "s-a6", "type": "profit", "title": "Insurance / lending profit down", "buckets": [{"name": "Underwriting", "subs": ["Premium vs frequency × severity", "New cohort vs legacy book"]}, {"name": "Expense", "subs": ["Acquisition", "Admin", "Claims handling"]}, {"name": "Investment / funding", "subs": ["Yield on float", "Cost of funds"]}, {"name": "Mix", "subs": ["Line, geography, channel", "Risk selection"]}], "trap": "Combined ratio; bad-risk growth looks good for two years.", "hyp": "The new channel's book is mispriced for its risk; growth bought bad risk."}, {"id": "s-a7", "type": "compete", "title": "Losing share to a competitor or entrant", "buckets": [{"name": "What changed", "subs": ["Competitor's move and why", "Scale and durability"]}, {"name": "Where we're losing", "subs": ["Segment, channel, geography", "Price vs volume vs mix"]}, {"name": "Why", "subs": ["Purchase criteria vs our position", "Switching costs"]}, {"name": "Response options with economics", "subs": ["Match, differentiate, lock in, counter-move", "Do nothing"]}], "trap": "Matching on price when the loss is non-price.", "hyp": "The loss is concentrated in one segment and is about service/convenience, so the response should be targeted."}, {"id": "s-a8", "type": "profit", "title": "Professional services / staffing margin", "buckets": [{"name": "Revenue", "subs": ["Heads × utilization × realized rate"]}, {"name": "Delivery cost", "subs": ["Cost rate", "Bench", "Pyramid"]}, {"name": "Mix", "subs": ["Client, service line", "T&M vs fixed fee"]}, {"name": "Pipeline & pricing", "subs": ["Win rate", "Rate card discipline"]}], "trap": "Fixed-fee hour creep.", "hyp": "Realized rate and utilization slipped as fixed-fee work grew; the pyramid is too senior."}, {"id": "s-b1", "type": "growth", "title": "Mature brand must grow (2× in 5 years)", "buckets": [{"name": "Core", "subs": ["Penetration, frequency", "Price", "Share"]}, {"name": "Adjacent", "subs": ["Products, channels", "Geographies, segments"]}, {"name": "Inorganic", "subs": ["Tuck-ins", "Partnerships"]}, {"name": "Screen", "subs": ["Capabilities, capital", "Cannibalization, timing"]}], "trap": "Revenue target hit by destroying margin.", "hyp": "Core adds a few points; most of the gap comes from new reach, with M&A as backstop."}, {"id": "s-b2", "type": "growth", "title": "B2B distributor growth", "buckets": [{"name": "Customers", "subs": ["New logos", "Wallet share in existing accounts"]}, {"name": "Products", "subs": ["SKU breadth", "Private label"]}, {"name": "Services", "subs": ["Value-added: vending, inventory management"]}, {"name": "Geography / footprint", "subs": ["New territories", "Tuck-in distributors"]}], "trap": "Working capital is the constraint.", "hyp": "Wallet share in existing accounts is the largest, cheapest pool."}, {"id": "s-b3", "type": "pricing", "title": "Pricing decision", "buckets": [{"name": "Customer value & WTP", "subs": ["Elasticity", "Switching costs"]}, {"name": "Competitive position", "subs": ["Competitor prices", "Likely response"]}, {"name": "Economics", "subs": ["Breakeven volume loss = Δp ÷ (new p − VC)", "Cost to serve"]}, {"name": "Execution", "subs": ["Model, channel", "Timing"]}], "trap": "Run breakeven volume math first.", "hyp": "Elasticity in the core segment is below the breakeven loss, so a targeted increase holds."}, {"id": "s-b4", "type": "launch", "title": "New product launch", "buckets": [{"name": "Customer & market", "subs": ["Need, segment, size", "WTP"]}, {"name": "Product & competition", "subs": ["Differentiation", "Response"]}, {"name": "Capabilities & GTM", "subs": ["Build / partner", "Channels"]}, {"name": "Financials", "subs": ["Ramp, cost, investment", "Breakeven", "Cannibalization"]}], "trap": "Count incremental only.", "hyp": "Launch is worth it only where it reaches a new segment rather than cannibalizing the core."}, {"id": "s-b5", "type": "growth", "title": "Channel strategy / go direct", "buckets": [{"name": "Customer", "subs": ["Who buys where, by segment and category"]}, {"name": "Channel economics", "subs": ["Margin captured vs costs inherited", "Incremental vs cannibalized"]}, {"name": "Channel conflict", "subs": ["Retailer reaction, concentration", "Segmentation of assortment"]}, {"name": "Capabilities & investment", "subs": ["E-commerce, CRM, logistics", "Build vs partner"]}], "trap": "Distributor margin isn't free.", "hyp": "A phased direct build adds growth without losing top retailers; an aggressive shift loses more than it gains."}, {"id": "s-b6", "type": "sales", "title": "Retention / churn", "buckets": [{"name": "Who churns", "subs": ["Segment, tenure, cohort"]}, {"name": "Why", "subs": ["Engagement", "Price / value", "Service"]}, {"name": "Value at stake", "subs": ["LTV", "Retain vs acquire cost"]}, {"name": "Levers", "subs": ["Onboarding", "Contract / pricing", "Engagement"]}], "trap": "Retain only profitable customers.", "hyp": "Churn is an early-engagement problem concentrated in the first 90 days."}, {"id": "s-b7", "type": "growth", "title": "Digital / tech growth play", "buckets": [{"name": "Customer demand", "subs": ["Who wants the digital option, how much"]}, {"name": "Revenue impact", "subs": ["Incremental vs cannibalized"]}, {"name": "Cost & ops", "subs": ["Build / partner / buy", "Fulfillment"]}, {"name": "Risks", "subs": ["Channel conflict", "Execution"]}], "trap": "Channel shift ≠ growth.", "hyp": "Most digital revenue is shifted, not new; growth depends on reaching new customers."}, {"id": "s-c1", "type": "entry", "title": "Geographic market entry", "buckets": [{"name": "Market", "subs": ["Size, growth", "Regulation"]}, {"name": "Competition", "subs": ["Incumbents, share", "Response"]}, {"name": "Client fit", "subs": ["What travels vs what doesn't", "Supply chain, brand"]}, {"name": "Entry economics & mode", "subs": ["Build / buy / partner / franchise", "Unit economics, payback"]}], "trap": "Big market ≠ attainable share.", "hyp": "Attractive but crowded; entry works only via the right mode if unit economics hold."}, {"id": "s-c2", "type": "ma", "title": "Strategic acquisition (saved framework)", "buckets": [{"name": "Market", "subs": ["Other deals, comparables", "How acquirers have fared"]}, {"name": "Target financials / value", "subs": ["Revenue = price × quantity", "Costs fixed, variable → value"]}, {"name": "Fit & capabilities", "subs": ["Portfolio mix", "Expertise", "Other opportunities"]}, {"name": "Deal", "subs": ["Synergies, cannibalization", "Risks: customer, competitor, regulatory, funding", "Exit options"]}], "trap": "Synergies are the case.", "hyp": "The premium is justified only if cost synergies are bankable; revenue synergies are upside."}, {"id": "s-c3", "type": "pe", "title": "PE due diligence / LBO", "buckets": [{"name": "Market attractiveness", "subs": ["Growth, fragmentation", "Multiples"]}, {"name": "Company standalone", "subs": ["Revenue quality", "Margin, cash", "Management"]}, {"name": "Value-creation plan", "subs": ["EBITDA growth", "Add-ons", "Operations"]}, {"name": "Deal & exit", "subs": ["Entry multiple, leverage", "Exit routes"]}], "trap": "Name which of EBITDA growth / multiple / debt paydown drives returns.", "hyp": "Returns come from EBITDA growth via add-ons; hold the multiple flat."}, {"id": "s-c4", "type": "invest", "title": "Build vs buy vs partner", "buckets": [{"name": "Strategic need", "subs": ["Speed, control", "Is it core?"]}, {"name": "Economics", "subs": ["NPV", "Time to value"]}, {"name": "Risk", "subs": ["Execution", "Dependency"]}, {"name": "Capabilities & culture", "subs": ["Can we run it?", "Integration"]}], "trap": "Build underestimates time; buy underestimates integration.", "hyp": "Partner wins on speed unless the capability is core, in which case buy."}, {"id": "s-c5", "type": "invest", "title": "Divest a business line", "buckets": [{"name": "Standalone performance", "subs": ["Profit after allocated costs", "Trajectory"]}, {"name": "Interdependence", "subs": ["Shared costs", "Shared customers"]}, {"name": "Value", "subs": ["Sale vs retained value", "Tax"]}, {"name": "Execution", "subs": ["Stranded costs", "Buyer universe"]}], "trap": "Stranded overhead.", "hyp": "The line is worth more to a buyer, but only if stranded overhead can be removed."}, {"id": "s-c6", "type": "invest", "title": "Major capital investment", "buckets": [{"name": "Demand", "subs": ["Can we fill it?", "Growth vs capacity headroom"]}, {"name": "Economics", "subs": ["Capex, opex", "NPV / payback"]}, {"name": "Alternatives", "subs": ["Outsource, retrofit, shift"]}, {"name": "Risks", "subs": ["Overruns", "Demand concentration"]}], "trap": "Compare to the best alternative, not do-nothing.", "hyp": "Annual savings on the upfront cost pay back in under N years, so yes — subject to execution."}, {"id": "s-c7", "type": "invest", "title": "Vertical integration", "buckets": [{"name": "Economics", "subs": ["Margin captured vs cost to operate"]}, {"name": "Control", "subs": ["Supply, quality", "IP"]}, {"name": "Capabilities", "subs": ["Can we run the new step?"]}, {"name": "Risks", "subs": ["Flexibility", "Supplier / customer reactions", "Antitrust"]}], "trap": "You buy a business you don't know how to run.", "hyp": "Margin captured is real but control is the actual reason; the risk is operating competence."}, {"id": "s-c8", "type": "newbiz", "title": "Launch a new business / startup", "buckets": [{"name": "Market & customer", "subs": ["Pain, size", "Alternatives"]}, {"name": "Business model / unit economics", "subs": ["Price, CAC, LTV", "Margin"]}, {"name": "Operations & team", "subs": ["Capabilities", "Hiring"]}, {"name": "Investment case", "subs": ["Runway", "Milestones"]}], "trap": "Unit economics must work before scale.", "hyp": "Viable only if CAC payback works at the planned price before scaling."}, {"id": "s-d1", "type": "ops", "title": "Throughput / wait time", "buckets": [{"name": "Demand", "subs": ["Volume, arrival pattern", "Mix"]}, {"name": "Capacity", "subs": ["Staff × hours × productivity"]}, {"name": "Process", "subs": ["Bottleneck", "Rework"]}, {"name": "Levers", "subs": ["Triage, scheduling", "Self-service"]}], "trap": "Fix the bottleneck only.", "hyp": "A mix-driven demand spike is hitting a fixed bottleneck; channel shift plus re-timing staff is the fix."}, {"id": "s-d2", "type": "cost", "title": "Cost-reduction mandate", "buckets": [{"name": "Baseline", "subs": ["Category", "Fixed / variable", "Addressable"]}, {"name": "Benchmarks", "subs": ["Peers", "Internal spread"]}, {"name": "Levers", "subs": ["Demand, price", "Productivity, structure"]}, {"name": "Impact & risk", "subs": ["Run-rate vs one-time", "Revenue / quality risk"]}], "trap": "Cuts that hit revenue or quality.", "hyp": "Most of the target comes from the biggest addressable category where we exceed benchmark."}, {"id": "s-d3", "type": "public", "title": "Public program missing outcomes", "buckets": [{"name": "Objective & metrics", "subs": ["Outcomes vs outputs"]}, {"name": "Target population funnel", "subs": ["Eligible → aware → enrolled → served"]}, {"name": "Delivery", "subs": ["Process, channels", "Capacity"]}, {"name": "Resources & constraints", "subs": ["Budget", "Staffing, rules"]}], "trap": "Goal isn't profit; fixed budget = trade-offs.", "hyp": "The gap is a funnel leak between eligible and enrolled."}, {"id": "s-d4", "type": "public", "title": "Nonprofit sustainability", "buckets": [{"name": "Mission impact", "subs": ["Cost per outcome"]}, {"name": "Funding mix & concentration", "subs": ["Donor types", "Top-funder share"]}, {"name": "Cost structure", "subs": ["Program vs overhead"]}, {"name": "Capacity & governance", "subs": ["Staff, board"]}], "trap": "Funder concentration; overhead cuts kill fundraising.", "hyp": "The funding base is concentrated and aging; diversification matters more than cost cuts."}, {"id": "s-d5", "type": "ops", "title": "Supply-chain resilience", "buckets": [{"name": "Exposure", "subs": ["Single-source", "Geography"]}, {"name": "Impact", "subs": ["Revenue at risk", "Cost"]}, {"name": "Mitigation", "subs": ["Dual-source, stock", "Nearshore"]}, {"name": "Trade-off", "subs": ["Resilience cost vs probability × impact"]}], "trap": "Price resilience as insurance.", "hyp": "A few single-sourced inputs carry most of the revenue at risk; insure those, not everything."}, {"id": "s-d6", "type": "sales", "title": "Sales-force effectiveness", "buckets": [{"name": "Coverage", "subs": ["Territories, segments"]}, {"name": "Capacity", "subs": ["Reps × calls × conversion × deal size"]}, {"name": "Incentives", "subs": ["Quota, comp plan"]}, {"name": "Enablement", "subs": ["Tools, training"]}], "trap": "Decompose the funnel before adding reps.", "hyp": "Conversion, not call volume, is the broken link."}, {"id": "s-d7", "type": "compete", "title": "Regulatory / external shock", "buckets": [{"name": "What changes", "subs": ["The rule or shock"]}, {"name": "Impact on us", "subs": ["Cost, revenue, operations"]}, {"name": "Impact on market", "subs": ["Relative exposure"]}, {"name": "Response", "subs": ["Absorb, pass through", "Restructure, adapt"]}], "trap": "Relative position can make a shock an opportunity.", "hyp": "We are less exposed than competitors, so the shock is a share opportunity if we hold price."}], "cases": [{"id": "profit-1", "type": "profit", "diff": 1, "title": "Cold Press", "client": "Meadowbrook Juice", "industry": "Consumer / beverage", "prompt": "Meadowbrook Juice sells cold-pressed juice through its own 12 shops in Boston and Providence. Revenue has grown 10% a year for three years, but operating profit fell from $2.1M to $1.4M last year. The CEO wants to know why and what to do.", "questions": [{"q": "How is profit measured here and over what period did it fall?", "a": "Operating profit, full year, fell last year only; prior two years were flat to slightly up."}, {"q": "Did revenue growth come from new shops or same-shop growth?", "a": "Four of the 12 shops opened in the last 18 months; same-shop sales are flat."}, {"q": "Which cost lines moved most?", "a": "Labor and rent rose faster than revenue; produce costs were roughly flat as a % of sales."}, {"q": "Any change in product mix or price?", "a": "Launched a $12 'wellness shot' line that now is 15% of revenue; no price increases in two years."}], "buckets": [{"name": "Revenue per shop", "subs": ["Traffic (visits/day) × conversion × ticket", "Mix shift to wellness shots (lower ticket?)", "Mature shops vs. new-shop ramp"]}, {"name": "Cost per shop", "subs": ["COGS: produce price × yield/waste", "Labor: hours × wage; staffing new shops", "Occupancy: new-shop rent vs. mature"]}, {"name": "Footprint & growth cost", "subs": ["Pre-opening and ramp losses on 4 new shops", "Cannibalization between nearby shops", "Overhead added to support 12 shops"]}, {"name": "External", "subs": ["Produce inflation, minimum wage changes", "Competitor openings near shops"]}], "generic": "Profitability", "tailored": "Split revenue and cost per shop (not total) because the unit count changed; added a Footprint bucket since 4 of 12 shops are still ramping.", "hyp": "Profit fell because new-shop ramp losses and rising labor/rent, not the core business — mature shops are likely still healthy.", "trap": "Chasing total-company averages. With a third of shops under 18 months old, averages hide healthy mature units and bleeding new ones.", "start": "Footprint & growth cost", "startWhy": "Revenue grew but profit fell in the exact window new shops opened; isolating ramp losses tells you if there is a core problem at all."}, {"id": "profit-2", "type": "profit", "diff": 2, "title": "Night Shift", "client": "Riverbend Regional Hospital", "industry": "Healthcare / provider", "prompt": "Riverbend is a 280-bed community hospital in Ohio. Patient volumes are up 4% but the operating margin has gone from +2% to −3% over two years. The board has asked what is driving the loss and how to get back to breakeven.", "questions": [{"q": "What is the payer mix and has it shifted?", "a": "Medicaid share rose from 22% to 30%; commercial fell correspondingly."}, {"q": "Is the volume growth in inpatient, outpatient, or ED?", "a": "Mostly ED and observation stays; elective surgeries are down 8%."}, {"q": "What has happened to clinical labor costs?", "a": "Nursing agency (travel nurse) spend tripled; vacancy rate is 18%."}, {"q": "Any changes in reimbursement rates or denials?", "a": "Commercial rates flat; denial rate up from 6% to 11%."}], "buckets": [{"name": "Volume & case mix", "subs": ["Inpatient vs. outpatient vs. ED growth", "Elective surgery decline (highest margin)", "Length of stay and observation vs. admit"]}, {"name": "Revenue per case", "subs": ["Payer mix shift (Medicaid vs. commercial)", "Contracted rates and annual escalators", "Denials, coding accuracy, collections"]}, {"name": "Cost to serve", "subs": ["Clinical labor: agency vs. staff mix, vacancy", "Supplies and drugs per case", "Fixed costs: facilities, admin"]}, {"name": "Service-line portfolio", "subs": ["Margin by service line", "Lines to grow, fix, or exit", "Referral leakage to competitors"]}], "generic": "Profitability", "tailored": "Price became 'revenue per case' driven by payer mix and denials (hospitals do not set price); cost split into clinical labor vs. supplies vs. fixed; added service-line view.", "hyp": "Margin collapse is driven by payer-mix shift plus agency labor; volume growth is in the lowest-margin settings so it does not help.", "trap": "Treating volume growth as good news. Growth in ED/observation at Medicaid rates with agency nurses can lose money on every incremental patient.", "start": "Revenue per case", "startWhy": "A 8-point payer-mix shift and near-doubling of denials can explain most of a 5-point margin swing; size that before touching cost."}, {"id": "profit-3", "type": "profit", "diff": 2, "title": "Empty Seats", "client": "Lakeline Charter Bus", "industry": "Transportation / charter", "prompt": "Lakeline runs 60 motor coaches for school trips, corporate shuttles, and tour operators across the Midwest. Fleet utilization is at an all-time high, yet EBITDA margin dropped from 14% to 7%. The owner is confused and wants answers.", "questions": [{"q": "How is utilization defined?", "a": "Share of bus-days with at least one booking. Revenue per bus-day has fallen 12%."}, {"q": "Which segment grew?", "a": "Corporate shuttle contracts doubled; they are long-term, fixed-price, and lower rate per mile."}, {"q": "What happened to costs?", "a": "Diesel up 20%, driver wages up 15% (shortage), maintenance up as fleet aged."}, {"q": "Any pricing changes?", "a": "Shuttle contracts were bid aggressively to win; no fuel surcharge clauses."}], "buckets": [{"name": "Revenue per bus-day", "subs": ["Rate per mile by segment (school / corporate / tour)", "Mix shift toward low-rate shuttles", "Deadhead miles and empty return legs"]}, {"name": "Cost per bus-day", "subs": ["Fuel: price × miles × mpg (surcharge pass-through?)", "Driver: wage × hours, overtime, shortage premium", "Maintenance by fleet age"]}, {"name": "Fleet deployment", "subs": ["Which buses on which contracts", "Fleet age and replacement cycle", "Peak vs. off-peak scheduling"]}, {"name": "Contract terms & external", "subs": ["Fixed-price contracts with no escalators", "Fuel and labor market", "Competitor pricing"]}], "generic": "Profitability", "tailored": "Revenue and cost expressed per bus-day (the asset unit); added a Fleet deployment bucket and made contract terms explicit because fixed-price shuttles block cost pass-through.", "hyp": "Lakeline is busy but underpriced: shuttle contracts were won at rates that no longer cover fuel and driver cost increases.", "trap": "Reading 'high utilization' as healthy. Full at a bad yield means every busy day loses more; this is a yield/pricing problem, not a demand problem.", "start": "Revenue per bus-day", "startWhy": "A 12% drop in revenue per bus-day with record utilization points to rate and mix, which also determines whether cost pass-through is possible."}, {"id": "profit-4", "type": "profit", "diff": 3, "title": "Renewal Rate", "client": "Orchard Software", "industry": "Technology / B2B SaaS", "prompt": "Orchard sells workforce-scheduling software to mid-size retailers on annual subscriptions. ARR is $40M, growing 25%, but the company burned $18M last year and the board wants a path to breakeven within 24 months without killing growth.", "questions": [{"q": "What is gross margin and what is in COGS?", "a": "72% gross margin; COGS includes hosting, onboarding, and customer support."}, {"q": "How do new ARR and churn break down?", "a": "$14M new ARR, $4M churned, net new $10M. Gross revenue retention 90%, net retention 105%."}, {"q": "What is CAC and payback?", "a": "Sales and marketing spend $20M; CAC payback about 26 months."}, {"q": "Where does the rest of opex go?", "a": "R&D $12M, G&A $7M. Headcount grew 40% last year."}], "buckets": [{"name": "Unit economics", "subs": ["ARPA and gross margin per customer", "CAC by channel; payback period", "LTV/CAC given churn"]}, {"name": "Acquisition efficiency", "subs": ["Pipeline conversion by stage", "Sales productivity (quota attainment, ramp)", "Channel mix: direct vs. partner"]}, {"name": "Retention & expansion", "subs": ["Logo churn by segment and cohort", "Upsell/cross-sell (seats, modules)", "Onboarding and support cost per customer"]}, {"name": "Cost base vs. benchmark", "subs": ["R&D, G&A as % of ARR vs. peers", "Hosting cost per customer", "Headcount plan vs. growth"]}], "generic": "Profitability", "tailored": "Replaced 'revenue' with ARR mechanics (new, churn, expansion) and 'cost' with CAC, COGS/hosting, and opex ratios; added a benchmark lens because the question is 'path to breakeven'.", "hyp": "Breakeven is reachable by fixing CAC payback (26 months is too long) and churn, not by cutting R&D — the growth engine is inefficient rather than the cost base bloated.", "trap": "Confusing bookings, revenue, and cash. Burn is a cash concept; annual-upfront billing can hide or flatter the picture, so build from cohorts and cash timing.", "start": "Unit economics", "startWhy": "If LTV/CAC is broken, more growth makes burn worse; confirming unit economics decides whether the answer is 'grow smarter' or 'cut'."}, {"id": "profit-5", "type": "profit", "diff": 3, "title": "Fine Print", "client": "Granite State Mutual", "industry": "Financial services / P&C insurance", "prompt": "Granite State Mutual writes homeowners and auto insurance in New England. Premiums written grew 18% over two years, but the company posted its first underwriting loss in a decade. The CEO wants to know what went wrong and whether to keep growing.", "questions": [{"q": "What is the combined ratio and how did it move?", "a": "From 94% to 104%: loss ratio up 8 points, expense ratio up 2."}, {"q": "Where did the premium growth come from?", "a": "A new online channel targeting younger drivers in Massachusetts; auto is now 60% of book."}, {"q": "Is the loss ratio deterioration frequency or severity?", "a": "Both: claim frequency up on the new auto book, severity up from repair-cost inflation."}, {"q": "What about investment income and reinsurance?", "a": "Investment income steady; reinsurance costs up 25% at renewal after a bad cat year."}], "buckets": [{"name": "Underwriting result", "subs": ["Premium adequacy: rate vs. expected loss cost", "Loss ratio = frequency × severity by line and cohort", "New online cohort vs. legacy book"]}, {"name": "Expense ratio", "subs": ["Acquisition cost of online channel", "Claims handling and admin cost", "Reinsurance cost and structure"]}, {"name": "Mix & growth quality", "subs": ["Line mix (auto vs. home), geography", "Risk selection and pricing on new channel", "Retention of profitable policies"]}, {"name": "Investment & capital", "subs": ["Investment yield on float", "Capital needed to support growth", "Rating agency constraints"]}], "generic": "Profitability", "tailored": "Revenue/cost reframed as the combined ratio (loss ratio + expense ratio); added growth-quality and capital buckets because insurance growth can be adverse selection.", "hyp": "The new online auto book is underpriced for its risk; growth bought bad risk and the loss emerged on schedule.", "trap": "Celebrating premium growth. In insurance, mispriced growth looks great for 18-24 months until claims develop; the fix may be to shrink.", "start": "Underwriting result", "startWhy": "An 8-point loss-ratio jump concentrated in one cohort is the whole story; compare the new cohort's loss ratio to the legacy book first."}, {"id": "growth-1", "type": "growth", "diff": 1, "title": "Second Scoop", "client": "Harbor Lane Creamery", "industry": "Consumer / food", "prompt": "Harbor Lane makes premium ice cream sold in 400 grocery stores across New Jersey and eastern Pennsylvania. Revenue is $25M and growing 3% a year. The founder wants to double revenue in five years and asks how.", "questions": [{"q": "Where does revenue come from today?", "a": "90% grocery pints; 10% a single scoop shop. Six flavors; average shelf share is low."}, {"q": "What are the margins and capacity?", "a": "Gross margin 40%; the plant runs at 65% capacity."}, {"q": "Who are the competitors and how is Harbor Lane positioned?", "a": "National premium brands dominate; Harbor Lane wins on local sourcing and is priced 10% below them."}, {"q": "Any constraints?", "a": "Founder wants to keep control; can fund $5M of investment."}], "buckets": [{"name": "Core: sell more where we are", "subs": ["Penetration: more stores in the current region", "Velocity per store: shelf share, promo, flavors", "Price: close the 10% gap to national premium"]}, {"name": "Adjacent: new products/channels", "subs": ["Formats: bars, mini cups, novelties", "Channels: foodservice, direct-to-consumer, scoop shops", "Segments: dairy-free, kids"]}, {"name": "New geographies", "subs": ["Expand to NY metro, DC/Baltimore", "Distribution model: DSD vs. distributor"]}, {"name": "Screen: can we deliver?", "subs": ["Plant capacity (65% used) and cold chain", "Capital ($5M) and brand strength", "Margin impact and cannibalization"]}], "generic": "Revenue growth (core / adjacent / new)", "tailored": "Core split into penetration × velocity × price (grocery math); adjacencies named for ice cream (formats, foodservice); screen bucket includes the founder's control and $5M constraints.", "hyp": "Doubling is achievable mostly through the core — velocity per store and price — plus one adjacent geography; no acquisition needed.", "trap": "Jumping to new geographies. Low shelf share in existing stores means the cheapest growth is velocity in stores you already have.", "start": "Core: sell more where we are", "startWhy": "Spare plant capacity plus low shelf share means core growth is highest-margin and fastest; size it before anything riskier."}, {"id": "growth-2", "type": "growth", "diff": 2, "title": "Shelf Life", "client": "Northfield Industrial Supply", "industry": "B2B distribution", "prompt": "Northfield distributes fasteners, tools, and safety gear to 3,000 manufacturers and contractors in the Great Lakes region. Revenue is $300M, flat for three years. The new CEO wants a plan to reach $450M in four years.", "questions": [{"q": "How concentrated is the customer base?", "a": "Top 100 customers are 55% of revenue; average share of wallet is 30%."}, {"q": "How does Northfield compete?", "a": "Mid-priced; competitors include a national giant and many small locals. Service and delivery speed are the stated edge."}, {"q": "What is in the product mix?", "a": "20,000 SKUs; private label is 8% of sales at 2x the margin."}, {"q": "Any acquisitions available?", "a": "Several small local distributors are for sale; the CEO is open to deals."}], "buckets": [{"name": "Existing customers: wallet share", "subs": ["Share of wallet by segment (30% → ?)", "Cross-sell categories (safety, MRO)", "Pricing and contract coverage"]}, {"name": "New customers", "subs": ["Underpenetrated segments and territories", "Sales coverage model and inside sales", "Digital/e-commerce ordering"]}, {"name": "Products & services", "subs": ["Private label expansion (8% at 2x margin)", "Value-added: vending, inventory management", "SKU rationalization to fund it"]}, {"name": "Inorganic", "subs": ["Tuck-in local distributors", "Fit, price, integration capacity"]}], "generic": "Revenue growth (core / adjacent / new)", "tailored": "Core split by distributor levers (wallet share vs. new logos vs. product/service); inorganic made its own bucket because tuck-ins are live options.", "hyp": "$150M is reachable mostly from wallet share in existing accounts plus one or two tuck-ins; the base is under-served, not saturated.", "trap": "Ignoring working capital. Distributor growth ties up cash in inventory and receivables; a growth plan without a cash plan stalls.", "start": "Existing customers: wallet share", "startWhy": "30% wallet share in 3,000 accounts is a $700M pool already in the door; moving it 10 points covers half the target."}, {"id": "growth-3", "type": "growth", "diff": 2, "title": "Waiting List", "client": "Bright Path Pediatric Dentistry", "industry": "Healthcare / dental practice", "prompt": "Bright Path operates five pediatric dental offices in suburban Atlanta. Each office is profitable and has a waiting list. The two founding dentists want to triple revenue in five years and are debating how.", "questions": [{"q": "What drives revenue per office?", "a": "Chairs × hours × patients per chair-hour × revenue per visit. Offices run 5 days; chairs are full."}, {"q": "What is the payer mix?", "a": "60% commercial, 30% Medicaid, 10% self-pay. Medicaid visits are 40% lower revenue."}, {"q": "What are the bottlenecks?", "a": "Dentist hiring is slow; hygienists are easier. Real estate is available."}, {"q": "Any interest in adjacent services?", "a": "Orthodontics referred out today; parents keep asking."}], "buckets": [{"name": "Capacity in existing offices", "subs": ["Hours: evenings, Saturdays", "Throughput: hygienist-led visits, scheduling", "Chairs per office"]}, {"name": "Revenue per visit", "subs": ["Payer mix and fee schedules", "Add orthodontics and sedation in-house", "Recall and treatment-plan acceptance"]}, {"name": "New offices", "subs": ["Site selection in metro Atlanta", "De novo vs. acquiring practices", "Dentist recruiting pipeline"]}, {"name": "Screen", "subs": ["Dentist supply is the binding constraint", "Capital and founder bandwidth", "Quality and brand consistency"]}], "generic": "Revenue growth (core / adjacent / new)", "tailored": "Core decomposed into clinic math (chairs × hours × throughput × revenue per visit); orthodontics as the named adjacency; dentist hiring made the explicit constraint.", "hyp": "Tripling requires new offices, but the fastest first dollars come from hours and ortho in current offices while the hiring pipeline builds.", "trap": "Opening offices before solving dentist supply. A waiting list proves demand; it does not prove you can staff three times the chairs.", "start": "Capacity in existing offices", "startWhy": "Waiting lists mean demand exceeds supply today; adding hours and ortho is capital-light and tests whether more capacity converts."}, {"id": "growth-4", "type": "sales", "diff": 3, "title": "Lapsed", "client": "Summit Ridge Fitness", "industry": "Consumer services / gyms", "prompt": "Summit Ridge runs 40 mid-priced gyms in Colorado and Utah. New member sign-ups are strong, but revenue has stalled because annual churn is 45%. The CEO wants revenue growth of 15% a year and believes retention is the key.", "questions": [{"q": "Who churns and when?", "a": "Half of churn happens in the first 90 days; 18-30 year-olds churn most."}, {"q": "Why do they leave?", "a": "Exit surveys: 'didn't use it enough', then price; location rarely cited."}, {"q": "What is the economics of a member?", "a": "$45/month, $150 acquisition cost, contribution margin ~70%."}, {"q": "What retention efforts exist?", "a": "A welcome email and a 12-month contract option nobody picks."}], "buckets": [{"name": "Who churns", "subs": ["By tenure (first 90 days vs. later)", "By segment, plan type, and location", "Usage pattern before churn"]}, {"name": "Why they churn", "subs": ["Engagement: visits per week, class attendance", "Price/value perception vs. alternatives", "Service and experience issues"]}, {"name": "Value at stake", "subs": ["LTV lift from each churn point reduced", "Retain vs. acquire cost ($150 CAC)", "Which members are worth saving"]}, {"name": "Levers", "subs": ["Onboarding program for first 90 days", "Pricing/contract structure, freeze options", "Community, classes, app engagement"]}], "generic": "Revenue growth (retention variant)", "tailored": "Used the churn variant: who / why / value / levers rather than core-adjacent-new; built the 'who' bucket around tenure since half of churn is in 90 days.", "hyp": "Churn is an early-engagement problem; a structured first-90-day onboarding would cut churn enough to deliver most of the 15% growth.", "trap": "Trying to retain everyone. Some members are unprofitable to save; target the retention spend where LTV justifies it.", "start": "Who churns", "startWhy": "The 90-day concentration tells you where the leak is; a cohort view sets the size of the prize before designing levers."}, {"id": "growth-5", "type": "growth", "diff": 3, "title": "Direct Line", "client": "Pemberton Outdoor", "industry": "Consumer / apparel & gear", "prompt": "Pemberton makes technical outdoor apparel sold mainly through sporting-goods retailers. Revenue is $180M. Wholesale growth has slowed to 2%, and management is considering going direct-to-consumer to accelerate growth. They want to know if and how.", "questions": [{"q": "What is the channel mix today?", "a": "80% wholesale, 15% own website, 5% two outlet stores. DTC gross margin is 65% vs. 45% wholesale."}, {"q": "How do customers buy outdoor apparel?", "a": "Younger buyers increasingly online and from brand sites; try-on still matters for shells and boots."}, {"q": "How would retailers react?", "a": "The two largest retailers are 40% of wholesale and have cut brands that went direct aggressively."}, {"q": "What capabilities exist?", "a": "Basic e-commerce; no stores team, no CRM, limited marketing analytics."}], "buckets": [{"name": "Customer & demand", "subs": ["Who buys where, by segment and category", "Brand pull: can Pemberton draw traffic on its own?", "Category fit for online vs. try-on"]}, {"name": "Channel economics", "subs": ["DTC margin captured minus fulfillment, returns, marketing", "Incremental vs. cannibalized wholesale sales", "Investment in stores, CRM, logistics"]}, {"name": "Channel conflict", "subs": ["Retailer reaction and 40% concentration risk", "Pricing and assortment segmentation", "Phased approach (exclusives, outlets)"]}, {"name": "Capabilities & execution", "subs": ["E-commerce, marketing, data talent", "Build vs. partner (3PL, marketplaces)", "Sequencing and milestones"]}], "generic": "Revenue growth (channel strategy variant)", "tailored": "Channel version of growth: demand, channel economics, conflict, and capabilities, with retailer concentration (40%) as the headline risk.", "hyp": "A phased DTC build (exclusive products online, no price undercutting) can add growth without losing the top retailers; an aggressive shift would lose more wholesale than DTC gains.", "trap": "Treating the 20-point margin gap as free money. DTC inherits fulfillment, returns, and marketing costs the retailer used to carry.", "start": "Channel conflict", "startWhy": "Two retailers are 40% of wholesale and have punished brands before; whether they tolerate DTC determines the size and pace of everything else."}, {"id": "entry-1", "type": "entry", "diff": 1, "title": "Next Exit", "client": "Prairie Crust Pizza", "industry": "Consumer / restaurants", "prompt": "Prairie Crust is a fast-casual pizza chain with 35 locations in Kansas and Missouri, all profitable. The owners are considering expanding into Texas, starting with Dallas–Fort Worth, and want to know whether to do it.", "questions": [{"q": "What is the objective?", "a": "Grow enterprise value ahead of a sale in five years; want 15+ new units."}, {"q": "How does the current model work?", "a": "$1.2M revenue per unit, 18% unit margin, $600K build cost; strong suburban family traffic."}, {"q": "What is the DFW market like?", "a": "Large, growing, but crowded with fast-casual pizza and strong regional chains."}, {"q": "What capabilities travel?", "a": "Operations playbook is strong; no supply chain or brand awareness in Texas."}], "buckets": [{"name": "Market attractiveness", "subs": ["Size and growth of fast-casual pizza in DFW", "Suburban family demographics by submarket", "Real estate costs and availability"]}, {"name": "Competitive landscape", "subs": ["Incumbents and their share, pricing", "Differentiation: can Prairie Crust win trial?", "Likely competitor response"]}, {"name": "Client fit & capabilities", "subs": ["Operations playbook transferability", "Supply chain: commissary distance, distributors", "Brand awareness from zero; marketing cost"]}, {"name": "Entry economics & mode", "subs": ["Unit economics in DFW vs. home market", "Organic rollout vs. acquire a local chain vs. franchise", "Investment, breakeven, payback, exit value"]}], "generic": "Market entry", "tailored": "Market and competition framed around DFW suburbs; capability bucket names supply chain and zero brand awareness; entry mode includes franchise and acquisition since the exit horizon is five years.", "hyp": "DFW is attractive but crowded; entry makes sense only if unit economics hold at Texas rents with a local supply chain, likely via a cluster of 5+ units to make marketing pay.", "trap": "Big market ≠ attainable share. A large crowded market can offer less realistic share than a smaller underserved one next door.", "start": "Entry economics & mode", "startWhy": "If DFW unit economics are below the 18% home margin after rent and marketing, the market's attractiveness does not matter."}, {"id": "entry-2", "type": "entry", "diff": 2, "title": "Border Crossing", "client": "Castellón Ceramics", "industry": "Industrial / building materials", "prompt": "Castellón is a Spanish porcelain tile manufacturer with €400M revenue, mostly in Europe. U.S. sales are 5% via importers. The board is weighing a direct entry into the U.S. with its own distribution and possibly a plant. Should they?", "questions": [{"q": "What is the U.S. tile market and who wins?", "a": "Large and growing; dominated by big-box retailers and a few large domestic and Italian producers; distributors are key."}, {"q": "What are the economics of importing today?", "a": "Shipping and tariffs add ~25%; importers take 20% margin; Castellón's net margin on U.S. sales is thin."}, {"q": "What does a plant cost?", "a": "€150M for a Tennessee plant; 3-year build; raw materials available locally."}, {"q": "What are Castellón's strengths?", "a": "Design, large-format tile, speed to new collections; weak brand in the U.S."}], "buckets": [{"name": "Market", "subs": ["Size, growth, segments (residential/commercial)", "Channel structure: distributors, big box, showrooms", "Regional demand pockets"]}, {"name": "Competition", "subs": ["Domestic vs. Italian vs. other importers", "Price positioning and design cycle", "Tariff and trade exposure"]}, {"name
