e?","a":"Backlogs grew statewide after the pandemic, but courts that adopted differentiated case tracks and strict continuance policies have come back toward the standard."},{"q":"How full are judges' calendars and courtrooms?","a":"Judges have hearing time available; the court often cannot use it because cases are not ready."}],"buckets":[{"name":"Demand","subs":["Filings by case type and complexity: felony vs misdemeanor vs civil","Pretrial detainees vs released defendants","Growth in filings with county population"]},{"name":"Process","subs":["Continuances per case and the reasons granted","Discovery exchange timing between DA and defense","Time from arraignment to plea offer"]},{"name":"Capacity","subs":["Judge calendar hours and courtroom availability","Prosecutor and public defender caseloads as external capacity","Clerk and scheduling staff"]},{"name":"Levers","subs":["Differentiated case tracks and firm continuance policy","Early case assessment and early plea offers","Senior judges, magistrate referrals and specialty courts for the detained docket"]}],"generic":"Operations / throughput (backlog)","tailored":"The acuity-mix equivalent is case type and detention status, since a detained felony and a civil contract dispute demand different speed; capacity was extended to prosecutors and defenders because the court's own capacity is not the constraint.","hyp":"Judge time is not the bottleneck; readiness is. Six continuances per felony driven by discovery and counsel availability is where the 240 excess days sit, and a firm continuance policy with early case assessment for detained defendants can cut most of it.","trap":"Asking for more judges or courtrooms when calendars already have unused time; the constraint is upstream in the DA and defender offices. Also forgetting the goal is justice and jail population, not throughput for its own sake.","start":"Demand","startWhy":"Separating detained felonies from everything else shows which cases carry the real cost of delay and where a dedicated track pays off."},{"id":"ops-n4","type":"ops","diff":3,"title":"Clear to Close","client":"Sandpiper Home Loans","industry":"Financial services / mortgage origination","prompt":"Sandpiper Home Loans is an independent mortgage lender headquartered in Charlotte, North Carolina, originating about $6 billion a year, roughly 18,000 loans, with 900 employees across loan officers, processors, underwriters and closers. About 60% of its volume is purchase loans referred by real estate agents and 40% is refinancing. Its average time from application to closing has drifted to 48 days, against an industry average near 35 and a fintech competitor advertising 21, and agents have started steering buyers elsewhere; the share of applications that actually close has fallen from 72% to 63%. The CEO has asked you how to bring application-to-close down to 30 days within nine months, and whether that requires more staff.","questions":[{"q":"How does the lender make money, and how do loan types differ in complexity?","a":"It earns gain on sale when loans are sold to investors plus origination fees; conventional loans for salaried borrowers are straightforward, while FHA, VA, jumbo and self-employed borrowers need far more documentation and review."},{"q":"Is the goal 30 days on average, or 30 days for purchase loans where agents are steering, and is the CEO willing to change loan-officer behavior?","a":"Purchase loans are the priority because of agent referrals; the CEO will push loan officers if that is where the problem is."},{"q":"Where do the 48 days go across the stages?","a":"Roughly: a week to collect documents after application, about twelve days waiting in the underwriting queue, around ten days clearing conditions in multiple rounds, two weeks for the appraisal running partly in parallel, and the final closing week."},{"q":"Is the fintech competitor's 21 days real for the same loan mix, or only for simple refinances?","a":"It is mostly simple conventional refinances with automated income and asset verification; its purchase loans are closer to 28 days."},{"q":"How does cycle time vary by loan type and by loan officer?","a":"Widely: conventional salaried borrowers close in about 35 days, while FHA and self-employed loans take closer to 70; a minority of loan officers submit complete files and close much faster."}],"buckets":[{"name":"Demand","subs":["Loan mix: conventional vs FHA/VA vs jumbo and self-employed (complexity)","Purchase vs refinance and seasonal or rate-driven volume swings","Application completeness by loan officer"]},{"name":"Process","subs":["Stage times: documents, underwriting queue, conditions rounds, appraisal, closing","Rework: conditions issued one round at a time","Appraisal ordered at application vs after approval"]},{"name":"Capacity","subs":["Underwriter decisions per day vs daily applications","Processors and closers per loan","Appraiser panel turn times"]},{"name":"Levers","subs":["Automated income and asset verification and complete files upfront","All conditions issued at once and underwriter specialization by loan type","Appraisal waivers and ordering at application"]}],"generic":"Operations / throughput (cycle time)","tailored":"The acuity-mix equivalent is loan complexity, because an FHA self-employed file consumes several times the underwriting effort of a salaried conventional loan; the stage times were made explicit so the candidate can locate the queue and rework rather than assume the problem is staff.","hyp":"About 22 of the 48 days are queue in front of underwriting and repeated condition rounds, neither of which more processors would fix; complete files upfront, conditions issued at once and underwriter specialization get purchase loans to 30 days, with appraisal moved fully in parallel.","trap":"Hiring processors upstream of the bottleneck, which only feeds the underwriting queue faster; and treating all loans alike when conventional salaried borrowers already close near 35 days and the complex files are what drag the average to 48.","start":"Process","startWhy":"The stage breakdown is where the sizing lives; twelve days of queue plus ten days of condition rounds show the bottleneck and the rework before any capacity question is asked."},{"id":"ops-n5","type":"ops","diff":4,"title":"Plug Wait","client":"Currentline Charging","industry":"Energy / EV charging infrastructure","prompt":"Currentline Charging operates about 900 fast-charging stalls at 180 highway and urban sites across southern Norway, with revenue of roughly NOK 1.1 billion, about 240 employees, and a 35% ownership stake held by the City of Oslo that comes with a public mandate for reliable charging. Average network utilization is only 14%, yet on summer holiday weekends drivers on the E6 and E18 corridors queue for 45 minutes or more, the national regulator has flagged reliability targets, and two competitors are adding sites along the same routes. The CEO has asked you how to get peak waits under ten minutes by next summer, and specifically whether that means approving a NOK 400 million network-wide expansion the board is considering.","questions":[{"q":"How does the company make money, and how do the public mandate and the Oslo stake shape its goals?","a":"It earns a margin per kilowatt-hour sold plus idle fees; the Oslo stake means reliability and coverage targets count alongside returns, and the regulator can impose penalties."},{"q":"Is the goal under ten minutes at peak everywhere, or at the corridor sites where queues form, and what return does the board require on capital?","a":"The corridor sites are what matter to the regulator; the board wants any investment to show a credible payback, not just a service improvement."},{"q":"How concentrated are the queues by site and by day?","a":"Very: about 20 corridor sites on roughly 30 peak days account for nearly all queueing; the rest of the network rarely has a wait."},{"q":"Are competitors facing the same peak problem, and how do they handle it?","a":"Yes, across Norway; some use dynamic peak pricing and idle fees and claim shorter queues, while others are simply adding stalls."},{"q":"How much of the stall time at peak is actual charging versus cars sitting after charging is complete, broken stalls, or payment failures, and are grid connections a limit?","a":"A meaningful share of peak occupancy is cars finished but still parked and stalls out of service; grid connections at several corridor sites are already near their limit, so adding stalls there needs grid upgrades or batteries."}],"buckets":[{"name":"Demand","subs":["Peak arrivals by corridor site and holiday day","Vehicle mix: charge speed capability and battery size (acuity)","Charge duration and state of charge on arrival"]},{"name":"Process & site flow","subs":["Idle occupancy after charge complete","Payment and authentication failures","Stall uptime and repair time"]},{"name":"Capacity","subs":["Stalls and kW per site vs peak demand at the 20 corridor sites","Grid connection limits and battery buffer storage","Effective capacity after downtime"]},{"name":"Levers & investment case","subs":["Idle fees, dynamic peak pricing and reservations to shift demand","Targeted stalls at 20 corridor sites vs NOK 400 million network-wide","Annual benefit (revenue, penalties avoided) vs upfront cost and payback"]}],"generic":"Operations / throughput (capacity investment hybrid)","tailored":"The ops spine was kept but the levers bucket carries an investment comparison, because the ask is really whether to spend NOK 400 million; the acuity-mix equivalent is vehicle charge-speed capability, since a slow-charging car occupies a stall far longer, and the goal blends regulator targets with the board's return.","hyp":"Queues come from 20 sites on 30 days, so a network-wide buildout is the wrong shape; idle fees, dynamic pricing and uptime fixes remove roughly half the peak wait, and a targeted 150-stall expansion at the corridor sites, on the order of NOK 100 million, covers the rest with a defensible payback.","trap":"Stating a lean on the NOK 400 million before comparing annual benefit to upfront cost, or using the 14% average utilization to argue there is no problem; the whole case lives in the variance between 20 corridor sites on peak days and the rest of the network.","start":"Demand","startWhy":"If the peak is 20 sites on 30 days, the entire investment question changes shape; confirm the concentration before sizing any capacity."},{"id":"entry-n1","type":"entry","diff":1,"title":"Southern Shelf","client":"Ashgrove Pet Nutrition","industry":"Consumer / pet food","prompt":"Ashgrove Pet Nutrition is a premium dry dog food brand based in Portland, Oregon, with about $220M in revenue, sold through roughly 4,000 independent pet stores and two national pet chains across the Pacific Northwest, California, and the Mountain West. The company makes money on a 38% gross margin per bag and runs a single plant in Salem that is at about 70% utilization. Growth in its home markets has slowed to 3% a year as the category matures and private label expands. The CEO is considering entering the Southeast (Georgia, Florida, the Carolinas, Tennessee), where the brand currently has no distribution. She wants to know whether to enter, and if so, how, with a goal of adding $60M in revenue within three years.","questions":[{"q":"How does Ashgrove make money today — what is the channel and margin structure?","a":"Mostly independents and two chains; independents carry a higher margin but the chains drive volume. Gross margin is around 38%."},{"q":"What does success look like — is $60M in three years the firm target, and at what margin?","a":"Yes, $60M of incremental revenue by year three, and the CEO wants it at or near current margins rather than bought with discounting."},{"q":"Is the premium dry dog food segment in the Southeast growing, and who are the incumbents?","a":"The Southeast premium segment grows faster than the national average; two national premium brands and strong store brands at the big chains dominate."},{"q":"Can the Salem plant serve the Southeast, or would we need new capacity or a co-packer?","a":"Salem has headroom but freight to the Southeast is meaningfully higher per bag; a co-packer in the region is an option."},{"q":"How do independent pet stores in the Southeast get product — direct or through distributors?","a":"Almost entirely through two regional pet distributors who control shelf access for independents."}],"buckets":[{"name":"Southeast premium kibble market","subs":["Premium dry dog food spend in target states and growth","Independent vs chain shelf share by state","Incumbent premium brands and store-brand pressure"]},{"name":"Ashgrove's right to win on the shelf","subs":["Brand awareness outside the West (zero today)","Distributor appetite to carry a fifth premium brand","Formulation and price point vs Southeast incumbents"]},{"name":"Economics of serving the region","subs":["Freight per bag from Salem vs regional co-packer cost","Slotting fees, trade spend, and distributor margin","Breakeven volume and payback against the $60M goal"]},{"name":"Entry mode and risks","subs":["Distributor partnership vs direct to one chain vs acquire a regional brand","Cannibalization of online sales already shipping to the Southeast","Incumbent response: promotions and exclusive shelf deals"]}],"generic":"Market entry","tailored":"The 'market' bucket is about shelf access controlled by two distributors, not consumer demand alone; economics is built around freight and trade spend per bag, which is what decides whether $60M comes at current margins.","hyp":"Enter via a distributor partnership plus one regional co-packer: the Southeast premium segment is large enough that about 5% share of independents and one chain listing reaches $60M, and freight is the swing factor that makes or breaks margin.","trap":"Sizing the whole Southeast dog food market and calling $60M 'tiny'. Ashgrove only competes for premium dry food on shelves its two distributors will give it; attainable share, not total market, is the test.","start":"Southeast premium kibble market","startWhy":"If premium independents and one chain cannot plausibly yield $60M at a reasonable share, nothing in the economics bucket matters."},{"id":"entry-n2","type":"entry","diff":2,"title":"Dry Hour Clinic","client":"Tessaro Dialysis Group","industry":"Healthcare / outpatient dialysis","prompt":"Tessaro Dialysis Group operates 85 outpatient dialysis clinics across Texas and Arizona, treating about 7,000 patients and generating $640M in revenue, mostly from Medicare bundled payments with a minority of higher-paying commercial patients. The two national dialysis chains hold roughly 70% of US clinics; Tessaro has grown by filling gaps they ignore. Medicare recently expanded incentives for home dialysis, and about 15% of US patients now dialyze at home versus 9% five years ago. The CEO is weighing entering home dialysis — supplying equipment, training, and remote monitoring — rather than only building more in-center clinics. He wants a recommendation on whether to enter home dialysis in his two states and how, with the aim of protecting the patient base and adding $80M in revenue within four years.","questions":[{"q":"How does Tessaro get paid — is the bundled rate the same for home and in-center treatments?","a":"Essentially the same Medicare bundle per treatment, but home carries a training add-on and lower chair and staff cost per treatment; commercial patients pay several times Medicare."},{"q":"Is $80M the target and is 'protecting the patient base' about losing patients to competitors' home programs?","a":"Yes to both; Tessaro has lost patients to the national chains' home programs in two metros already."},{"q":"Which clinical staff and equipment does home dialysis require that Tessaro does not have today?","a":"Home training nurses, a remote monitoring platform, and a supplies logistics chain; Tessaro has none of the three."},{"q":"Is the shift to home happening across the industry or specifically in Tessaro's markets?","a":"Industry-wide and policy-driven; Tessaro's states are slightly behind the national home rate, so there is catch-up growth."},{"q":"What share of Tessaro's patients are clinically eligible and have a care partner at home?","a":"Nephrologists estimate roughly a quarter are good candidates; many rural patients would prefer it given long drives."}],"buckets":[{"name":"Home dialysis demand in TX and AZ","subs":["Eligible patients: Tessaro's own 7,000 plus referral base","Nephrologist referral patterns and willingness to prescribe home","National chains' home share in Tessaro's metros"]},{"name":"Capability gap to deliver home care","subs":["Home training nurses: hire vs retrain in-center RNs","Remote monitoring platform: build, license, or partner with a device maker","Supplies logistics to rural patients"]},{"name":"Per-treatment economics and chair effect","subs":["Bundle rate plus training add-on vs home cost per treatment","Freed in-center chairs: backfill with new patients or close shifts","Commercial vs Medicare mix of likely home converters"]},{"name":"Entry path and risks","subs":["Organic build vs partner with device maker vs acquire a small home provider","Patient attrition and dropout back to in-center","Regulatory and staffing risk in a nurse-short market"]}],"generic":"Market entry","tailored":"Capability bucket is split into the three things Tessaro lacks (nurses, platform, logistics) because the entry-mode decision hinges on which can be partnered. Economics must include the chair effect: home conversions free in-center capacity that is only valuable if backfilled.","hyp":"Enter via a partnership with a device maker for platform and supplies while building training nurses in-house: converting a quarter of Tessaro's patients plus modest new referrals gets close to $80M, and the defensive value of not losing patients to the chains is as large as the new revenue.","trap":"Treating home dialysis revenue as fully incremental. Most early home patients are Tessaro's own in-center patients, so net revenue depends on backfilling the chairs they vacate.","start":"Home dialysis demand in TX and AZ","startWhy":"Whether eligible patients plus referral growth can reach $80M decides whether this is an entry case or merely a defensive conversion program."},{"id":"entry-n3","type":"entry","diff":2,"title":"Second Harvest","client":"Kaimana Agritech","industry":"Agriculture / controlled-environment farming","prompt":"Kaimana Agritech runs six hydroponic greenhouse farms in Arizona and Nevada growing leafy greens and herbs, selling about $95M a year to regional grocery chains and foodservice distributors at a 22% gross margin. The farms sit near cheap land and solar power but far from the dense Northeast markets where premium greens command higher prices. A competitor recently opened a large greenhouse outside Philadelphia and signed two Northeast grocers. Kaimana's founder-CEO is deciding whether to enter the Northeast by building a 20-acre facility in New Jersey, which would cost roughly $70M. He wants to know whether to enter and, if so, whether to build, partner with an existing grower, or supply the region from the Southwest by truck, with a target of $40M of Northeast revenue within three years of launch.","questions":[{"q":"How does Kaimana sell today — contracted programs with grocers or spot sales through distributors?","a":"About 60% is under annual programs with four grocery chains; the rest is distributor spot volume at thinner margins."},{"q":"Is $40M by year three the firm target, and does the board require a return threshold on the $70M?","a":"Yes, and the board wants a payback inside seven years on any new facility."},{"q":"What does it cost to truck greens from Arizona to the Northeast, and what happens to shelf life?","a":"Freight roughly doubles landed cost and takes three to four days off a 14-day shelf life, which grocers penalize."},{"q":"Is demand for greenhouse greens growing in the Northeast or is this one competitor's move?","a":"Northeast grocers are actively shifting from California field greens to local greenhouse supply; several have published local-sourcing targets."},{"q":"How different are energy costs for a greenhouse in New Jersey versus the Southwest?","a":"Heating and supplemental lighting roughly triple energy cost per pound in a Northeast winter."}],"buckets":[{"name":"Northeast greenhouse greens demand","subs":["Grocer local-sourcing commitments and open program volume","Price premium for 'local' greens vs trucked product","Competitor capacity already contracted in the region"]},{"name":"Kaimana's advantage transplanted","subs":["Growing know-how and yields per acre vs Northeast energy penalty","Existing grocer relationships that extend east","Brand recognition with Northeast shoppers (none today)"]},{"name":"Landed cost per pound by route","subs":["Build in NJ: energy and capex per pound at 20 acres","Truck from AZ: freight plus shelf-life shrink","Partner grower: toll-growing fee and margin split"]},{"name":"Entry mode, payback, and risks","subs":["$70M build vs partner vs truck against a seven-year payback","Ramp risk: greenhouse yields take two seasons to stabilize","Grocer program concentration and winter energy price spikes"]}],"generic":"Market entry","tailored":"The economics bucket is organized by route to market (build, truck, partner) because the ask is really a mode decision; the 'capability' bucket tests whether Kaimana's Southwest yield advantage survives a Northeast winter.","hyp":"Enter, but via a partnership with an existing Northeast grower rather than a $70M build: trucking fails on shelf life, and the energy penalty plus two-season ramp makes payback on a greenfield facility longer than seven years at $40M of revenue.","trap":"Assuming Kaimana's Southwest cost per pound travels with it. Northeast energy roughly triples the cost line that made the business work, so the build case must be re-underwritten, not copied.","start":"Landed cost per pound by route","startWhy":"The three entry modes have radically different cost structures; knowing which route clears a seven-year payback at $40M settles the recommendation faster than demand sizing."},{"id":"entry-n4","type":"entry","diff":3,"title":"Dock to Door","client":"Portside Reefer Lines","industry":"Logistics / refrigerated shipping","prompt":"Portside Reefer Lines is a Rotterdam-based refrigerated container shipping company with 38 vessels and about EUR 1.4B in revenue, moving perishables between Latin America, Europe, and West Africa. Freight rates have fallen 30% from their peak and the company's fleet is only 78% utilized. The CEO sees shippers increasingly asking for cold-chain service inland — from port to distribution center — and wants to enter the European inland cold logistics market, including refrigerated trucking and cold storage. He wants to know whether Portside should enter, with a goal of adding EUR 150M of revenue within three years and lifting group margin, not just revenue. The board is skeptical because a large forwarder tried the same move and exited two years later.","questions":[{"q":"How does Portside make money today, and what are the margins on ocean freight versus what inland cold logistics typically earns?","a":"Ocean margins are cyclical and currently thin; inland cold trucking is a low-margin, asset-heavy business, while cold storage earns steadier margins."},{"q":"Is the goal EUR 150M in revenue, higher group margin, or both — and over what horizon?","a":"Both: EUR 150M of inland revenue by year three, and inland must earn at least the group's current margin or the board will not approve it."},{"q":"What inland assets or partnerships does Portside have today, and what would it need?","a":"None of its own; it books trucking through third parties at the major ports and owns no warehouses."},{"q":"Is this inland demand across the industry or specific to Portside's customers?","a":"Large produce importers across Europe are consolidating to fewer end-to-end providers; the trend is industry-wide."},{"q":"Why did the forwarder who tried this exit?","a":"It bought a trucking fleet, could not fill it on backhauls, and ran it well below breakeven utilization."}],"buckets":[{"name":"Inland cold-chain demand from Portside's shippers","subs":["Share of Portside's own import volume that needs port-to-DC cold handling","Importers seeking a single end-to-end provider vs those with fixed inland contracts","Cold storage capacity shortage at key ports (Rotterdam, Antwerp, Valencia)"]},{"name":"Right to win beyond the quay","subs":["Existing shipper relationships and container visibility as a selling point","Operating capability in trucking dispatch and warehouse management (none today)","Incumbent inland specialists and their backhaul networks"]},{"name":"Margin economics by inland segment","subs":["Cold storage: margin per pallet-day and capex per facility","Reefer trucking: utilization and empty backhaul share","Bundled pricing: does end-to-end protect ocean rates?"]},{"name":"Entry route and risks","subs":["Asset-light brokerage vs acquire a cold storage operator vs build a fleet","Board's margin floor and the forwarder's failure as a template","Capital tied up while ocean cycle is weak"]}],"generic":"Market entry","tailored":"Economics is split by inland segment (storage vs trucking) because they have opposite margin profiles; the trap in the brief is the goal: the board requires margin accretion, so a revenue-sized entry is not enough.","hyp":"Enter cold storage at the three ports where Portside's own containers land, asset-light on trucking: storage can clear the margin floor and EUR 150M is reachable from existing shippers, while an owned truck fleet repeats the forwarder's backhaul failure.","trap":"Treating the goal as EUR 150M of revenue. The board's binding constraint is group margin; inland trucking could hit the revenue target while diluting margin and still be the wrong answer.","start":"Margin economics by inland segment","startWhy":"Because the board's test is margin accretion, knowing which inland segment can earn above group margin decides what kind of entry is even on the table."},{"id":"entry-n5","type":"entry","diff":4,"title":"Open Enrollment","client":"Bellwether Mutual Life","industry":"Financial services / life insurance","prompt":"Bellwether Mutual Life is a 140-year-old policyholder-owned life insurer headquartered in Hartford, Connecticut, with $9B in annual premiums, 3 million policyholders, and distribution almost entirely through 6,000 career agents selling whole and term life. Its policyholder base is aging, new policy sales have declined 2% a year for five years, and average new-customer age is 48. The board has asked the CEO to enter the direct-to-consumer digital term life market aimed at buyers in their 30s, which several venture-backed insurtechs now dominate. As a mutual, Bellwether has no shareholders; its stated goal is to lower the average policyholder age and keep the company relevant over 20 years, with a secondary target of 150,000 new policies within four years. The CEO wants to know whether to enter, and how to do it without alienating the career agents who generate 95% of today's premiums.","questions":[{"q":"How does Bellwether make money on a policy, and how do agent commissions change that economics?","a":"Profit comes from the spread between premiums plus investment income and claims over decades; agent commissions front-load the first year's premium so new policies take years to turn profitable."},{"q":"Is the primary goal the 150,000 policies, or lowering average policyholder age — and which wins if they conflict?","a":"Age and long-term relevance win; the board said it would accept fewer policies if they are genuinely younger buyers."},{"q":"What digital capability does Bellwether have today — underwriting, pricing, marketing?","a":"Underwriting still involves a medical exam and agent paperwork; there is no online quote-to-bind and no consumer brand spend."},{"q":"Are the insurtechs profitable, and is the digital term segment growing for everyone or only for them?","a":"Digital term is growing fast but most insurtechs lose money on acquisition cost; two have been acquired by traditional carriers."},{"q":"How would career agents react, and what happens to their book if the company sells term online?","a":"Agents see online term as taking leads from them; their contracts include territory protections for some products."}],"buckets":[{"name":"Young-buyer digital term market","subs":["Term buyers aged 30-40 purchasing online vs through agents","Insurtech share, pricing, and their acquisition cost per policy","Lifetime value of a 32-year-old term buyer who later converts to whole life"]},{"name":"Bellwether's assets for a younger buyer","subs":["Mutual brand trust and ratings vs insurtech convenience","Underwriting data to offer accelerated no-exam approval","Balance sheet patience: no shareholders demanding quick payback"]},{"name":"Policy economics without an agent","subs":["Acquisition cost per policy online vs agent commission","Lapse rates of digital buyers vs agent-sold policies","Breakeven year per policy and the 20-year relevance goal"]},{"name":"Channel conflict and entry mode","subs":["Build in-house vs acquire an insurtech vs white-label a platform","Agent territory contracts and a lead-handoff design","Mission test: does the design actually lower policyholder age?"]}],"generic":"Market entry (goal that is not profit, with channel-conflict hybrid)","tailored":"Because the client is a mutual with a demographic goal, the economics bucket tests breakeven year and lapse rather than ROI, and a fourth bucket on channel conflict is added because the career agents, not the market, are the biggest entry barrier.","hyp":"Enter by acquiring a struggling insurtech's platform rather than building: Bellwether's balance sheet lets it accept the long breakeven that sinks insurtechs, and routing online leads to agents for later whole-life conversion is what reconciles the demographic goal with the agent channel.","trap":"Running this as a standard profit-driven entry and recommending against it because digital term loses money early. The mutual's goal is policyholder age and 20-year relevance; the trade-off is what a short payback costs in relevance, not whether year-three profits clear a hurdle.","start":"Young-buyer digital term market","startWhy":"If online term buyers in their 30s cannot be reached at an acquisition cost Bellwether can stomach for a 20-year payoff, no channel design fixes the demographic problem."},{"id":"invest-n1","type":"invest","diff":1,"title":"Cold Rows","client":"Whitlock Farm Stores","industry":"Retail / farm and ranch supply","prompt":"Whitlock Farm Stores is a family-owned chain of 42 farm and ranch supply stores across Kansas, Oklahoma, and Nebraska with about $310M in revenue and $18M in operating profit, selling feed, fencing, tools, workwear, and seasonal goods to rural households and small farms. Feed is the traffic driver but earns thin margins; workwear and tools earn the most. The company has a chance to invest $12M in a 150,000-square-foot regional distribution center outside Wichita that would replace three leased warehouses and let it stock stores directly instead of relying on vendor drop-ships. The CEO, the founder's granddaughter, wants to know whether to make the investment, and she has told you the family typically wants any project to pay back inside five years.","questions":[{"q":"How does Whitlock replenish stores today, and what does that cost?","a":"A mix of vendor direct shipments and three small leased warehouses; freight and lease costs together run a little above the industry norm per dollar of sales."},{"q":"Is the five-year payback the firm hurdle, and is there a return target as well?","a":"Five-year payback is the family's rule; they also want to see the DC still earning once it is paid off."},{"q":"What specifically would the DC change operationally — stockouts, inventory, labor?","a":"Management expects fewer stockouts on fast-moving feed and seasonal items, lower safety stock per store, and consolidated inbound freight."},{"q":"Is this a Whitlock-specific problem or do all regional farm chains run their own DCs?","a":"The two larger national competitors run their own DCs; most chains Whitlock's size do not."},{"q":"What volume of stores and sales does the DC need to be efficient, and does Whitlock plan to open more stores?","a":"The DC is sized for about 60 stores; the plan is to add two or three stores a year."}],"buckets":[{"name":"Annual savings from consolidating supply","subs":["Inbound freight savings from full truckloads vs vendor drop-ship","Three warehouse leases eliminated","Working capital released from lower store safety stock"]},{"name":"Sales lift from better in-stock","subs":["Lost feed and seasonal sales from stockouts today","Margin on recovered sales (feed thin, workwear rich)","Ability to carry private-label items vendors will not drop-ship"]},{"name":"Investment and run cost of the DC","subs":["$12M build plus racking, systems, and fleet","DC labor and operating cost per year","Ramp: stores converted per quarter and transition disruption"]},{"name":"Payback and risks","subs":["Net annual benefit vs $12M against the five-year rule","Utilization if store growth stalls below 60","Execution risk for a company that has never run a DC"]}],"generic":"Investment / go-no-go","tailored":"Benefits are split into cost savings (freight, leases, inventory) and revenue (in-stock lift), because farm supply margins vary so much by category that recovered feed sales are worth far less than recovered workwear sales.","hyp":"Invest: freight consolidation plus three lease eliminations plus in-stock gains on seasonal goods should produce around $3M a year of net benefit, which pays back $12M inside five years, provided store count keeps growing toward the DC's 60-store design.","trap":"Stating a lean before comparing annual net benefit to the $12M. The DC sounds sensible, but the answer is a number: savings plus margin on recovered sales minus DC operating cost, against the five-year rule.","start":"Annual savings from consolidating supply","startWhy":"Cost savings are the most certain part of the benefit; if they alone get close to a five-year payback the in-stock lift is upside rather than a required assumption."},{"id":"invest-n2","type":"invest","diff":2,"title":"Own the Rails","client":"Quillon Benefits Administration","industry":"Professional services / HR benefits administration","prompt":"Quillon Benefits Administration is a Minneapolis-based third-party administrator that runs health and retirement benefits enrollment for about 900 mid-sized employers covering 2.1 million employees, generating $380M in revenue at a 14% operating margin. Its core enrollment and eligibility software is licensed from a vendor for $22M a year, and the contract comes up for renewal in 18 months with a proposed 25% price increase. Quillon's CTO argues the company should build its own platform, which engineering estimates at $45M over three years plus ongoing maintenance; alternatively Quillon could buy a small software firm that already has a modern platform for roughly $60M. The CEO wants a recommendation on build, buy, or renew, with the requirement that whichever path is chosen does not disrupt the January open-enrollment season for any client.","questions":[{"q":"How does Quillon make money — per employee per month fees, and how much does the platform shape what clients pay for?","a":"Per-employee-per-month fees; clients increasingly ask for features the current vendor is slow to deliver, and Quillon has lost two renewals over it."},{"q":"What is the decision criterion — lowest total cost over a horizon, or something else, and over how many years?","a":"The board wants the lowest total cost over seven years, but it also wants the platform to stop being a reason clients leave."},{"q":"How much of Quillon's operation depends on the vendor platform — could a migration be phased?","a":"Everything runs on it; migrations would have to be done client by client between enrollment seasons."},{"q":"Do competitors build or license, and is the vendor raising prices for everyone?","a":"The two largest administrators run proprietary platforms; the vendor is raising prices across its customer base."},{"q":"What is the state of the acquisition target — client base, technology, team?","a":"A modern cloud platform, about 40 small clients, 70 engineers; it is losing money and its investors want out."}],"buckets":[{"name":"Seven-year cost of each path","subs":["Renew: $27.5M a year escalating, zero migration cost","Build: $45M plus a maintenance team, platform live in year three","Buy: $60M plus integration, platform live in roughly a year"]},{"name":"Client retention and revenue effect","subs":["Renewals lost to platform gaps and the fee revenue at stake","Feature control: speed of delivering what employers now expect","Cross-sell to the target's 40 clients"]},{"name":"Migration and open-enrollment risk","subs":["Client-by-client migration windows between January seasons","Build risk: 18-month runway vs three-year build means a bridge renewal","Key-engineer retention at the target"]},{"name":"Strategic fit and recommendation","subs":["Does owning the platform change Quillon's competitive position vs the two large administrators?","Capability to run software engineering long term","Reversibility: which path can be undone if wrong?"]}],"generic":"Investment / go-no-go (build vs buy variant)","tailored":"Instead of a single cost comparison, the first bucket lines up three paths on a seven-year basis, and a timing bucket is added because the vendor contract ends before any build could be finished, which quietly eliminates pure 'build'.","hyp":"Buy: over seven years the acquisition costs less than renewing at the higher rate once lost renewals are counted, and it is the only path that delivers a platform before the current contract expires; pure build requires a bridge renewal that destroys its cost advantage.","trap":"Comparing $45M build versus $60M buy and picking build as cheaper. Build takes three years against an 18-month contract runway, so build actually means build plus renewal, and its total cost and risk are higher than they look.","start":"Seven-year cost of each path","startWhy":"The board's stated criterion is seven-year total cost, and laying out the three paths on that basis immediately exposes the timing problem with build."},{"id":"invest-n3","type":"invest","diff":2,"title":"Letting Go","client":"Ardent Media Group","industry":"Media / broadcasting and events","prompt":"Ardent Media Group is a Nashville-based owner of 31 regional radio stations and a live-events business with about $540M in revenue and $95M in EBITDA. The events division, which runs 12 outdoor music festivals, brought in $120M of revenue last year but only $6M of EBITDA, and it ties up a large share of management time and working capital each summer. A private equity firm has offered $90M for the events division. The CEO and the board are divided: radio advertising is in slow decline and some directors see events as the company's growth story, while others see a distraction. The board has asked you to recommend whether Ardent should divest the events business at the offered price.","questions":[{"q":"How does the events division make money, and why is its margin so much lower than radio?","a":"Ticket sales, sponsorships, and concessions; margins are thin because of weather cancellations, artist fees, and a long cash cycle that peaks before festivals happen."},{"q":"What does the board want from the decision — maximize value, reduce risk, or focus management — and what will it do with $90M?","a":"Value first; the likely uses of proceeds are paying down debt or buying stations in markets where Ardent is already strong."},{"q":"How intertwined are radio and events — shared sponsors, shared promotion, shared staff?","a":"Stations promote the festivals heavily and about a third of festival sponsors also buy radio ads; some staff split time."},{"q":"Is the low events margin typical for festival operators or specific to Ardent?","a":"Well-run festival operators earn roughly double Ardent's margin; Ardent's division has had three weather-hit years in five."},{"q":"What would the events business be worth if Ardent kept it and fixed it?","a":"Management believes margins could double in three years with better insurance, routing, and sponsorship sales, but has not committed resources to it."}],"buckets":[{"name":"Standalone value of the events division","subs":["EBITDA today vs fixed-margin potential (weather insurance, routing, sponsorship)","Working capital and management time it consumes","Comparable festival operator multiples vs the $90M offer"]},{"name":"What radio loses if events go","subs":["Cross-promotion value: station airtime that sells festival tickets","Shared sponsors who buy both and may cut radio spend","Growth narrative for a company whose core is in decline"]},{"name":"Value of the proceeds","subs":["Debt paydown and interest saved","Station acquisitions in strong markets at current multiples","Management focus redeployed to radio digital transition"]},{"name":"Deal terms and risks","subs":["Transition services and sponsor contract assignments","Earn-out or stake retention if the fix-up upside is real","Stranded overhead left behind at Ardent"]}],"generic":"Investment / go-no-go (divestiture variant)","tailored":"The usual 'value to buyer' bucket becomes 'standalone value including fix-up potential', and a bucket is added for what the remaining radio business loses, because festivals are cross-promoted on Ardent's own airwaves.","hyp":"Sell, but not at $90M as structured: the division's fixed-up value exceeds the offer, so Ardent should either run the fix for two years before selling or take a lower upfront price with an earn-out, and redeploy proceeds into stations in markets it already leads.","trap":"Valuing the division only on its current $6M of EBITDA and concluding $90M is generous. The relevant comparison is to the business a competent owner would run, and to what radio loses in sponsors and promotion when it leaves.","start":"Standalone value of the events division","startWhy":"The entire decision is whether $90M exceeds what the division is worth to Ardent, so sizing standalone value including the fix-up potential comes first."},{"id":"invest-n4","type":"invest","diff":3,"title":"Twenty Megawatts","client":"Caldera Battery Systems","industry":"Energy / grid-scale battery storage","prompt":"Caldera Battery Systems is a Denver-based developer and operator of grid-scale battery storage with 14 projects totaling 900 megawatts across Texas and the Southwest, earning about $180M a year from energy arbitrage, capacity payments, and grid services. The company has an option on a site in West Texas where it could build a 200-megawatt, four-hour battery for roughly $260M, interconnection secured. Energy arbitrage revenues in Texas have fallen sharply over the past year as more batteries have been built, while capacity and ancillary service prices have also compressed. Caldera's CEO is under pressure from his infrastructure-fund investors, who expect a 12% unlevered return on new projects. He wants a recommendation on whether to exercise the option and build, and if so, under what revenue structure.","questions":[{"q":"How does a battery earn money, and how much of Caldera's revenue today comes from arbitrage versus contracted payments?","a":"Buy power cheap and sell it at peaks, plus grid services and capacity; Caldera is more than half merchant arbitrage, which is the volatile part."},{"q":"Is 12% the hurdle for merchant projects too, and over what project life?","a":"12% unlevered over a 20-year life, though investors would accept lower if a larger share of revenue is under long-term contract."},{"q":"What is causing the arbitrage revenue decline, and is it expected to persist?","a":"Battery buildout has flattened the daily price spread; most forecasts expect spreads to keep compressing for a few years before load growth catches up."},{"q":"Could the project sign a long-term tolling or capacity contract with a utility or large data center instead of running merchant?","a":"Two data center developers in the region are seeking firm capacity and have indicated interest in a 10- to 15-year contract at a fixed price."},{"q":"What does the interconnection option cost to hold or let lapse?","a":"The option expires in nine months; interconnection queues in Texas now take four to five years, so the position itself has scarcity value."}],"buckets":[{"name":"Revenue per megawatt by structure","subs":["Merchant: daily price spread per MWh, cycles per day, and spread compression forecast","Contracted: tolling or capacity price from data center buyers over 10-15 years","Ancillary services as a shrinking top-up"]},{"name":"Cost to build and operate","subs":["$260M capex vs falling battery cell prices if delayed","Degradation and augmentation cost over 20 years","Operations, insurance, and interconnection charges"]},{"name":"Return against the 12% hurdle","subs":["Unlevered IRR under merchant vs contracted vs blended revenue","Downside case: spreads compress further for five years","Value of the interconnection position itself"]},{"name":"Strategic options and risks","subs":["Build now vs sell the interconnection position vs delay to the option deadline","Counterparty risk on a data center contract","Regulatory change in Texas market rules"]}],"generic":"Investment / go-no-go","tailored":"Revenue is bucketed by contract structure rather than by product because the real decision is what share of the 200 MW to lock under contract; the interconnection position is treated as an asset with its own value, giving a third option beyond build or not.","hyp":"Build, but only with at least half the capacity under a long-term data center contract: merchant arbitrage alone no longer clears 12% as spreads compress, while a contracted base brings the blended return to the hurdle and the interconnection position is too scarce to let lapse.","trap":"Running the return on last year's arbitrage revenue per megawatt. Spreads have compressed and are forecast to compress further, so historical merchant revenue overstates the project; the honest base case uses forward spreads.","start":"Revenue per megawatt by structure","startWhy":"The $260M is roughly fixed; whether the project clears 12% is almost entirely a question of revenue per megawatt and how much of it can be contracted."},{"id":"invest-n5","type":"invest","diff":4,"title":"Last Mile Shelter","client":"Harborlight Housing Trust","industry":"Nonprofit / supportive housing","prompt":"Harborlight Housing Trust is a Seattle nonprofit that owns and operates 1,800 units of permanent supportive housing for formerly homeless adults across 22 buildings, with a $95M annual budget funded by rental subsidies, Medicaid-billed services, county contracts, and philanthropy. It has been offered a former 160-room extended-stay hotel for $38M that it could convert to 150 units; a state program would cover $24M of the acquisition and the rest would need to be borrowed or raised. Harborlight's board has a mission goal of housing 500 more people within five years, but it also has a rule that every building must cover its own operating costs from recurring revenue after year two. The executive director wants a recommendation on whether to buy and convert the hotel, and how to think about the trade-off between mission scale and the operating self-sufficiency rule.","questions":[{"q":"How does a Harborlight building cover its costs — what are the recurring revenue sources per unit and what do services cost?","a":"Tenant rent plus a project-based subsidy per unit, Medicaid billing for case management, and a county services contract; services run about as much per unit as housing operations."},{"q":"What is the primary goal — 500 people housed, or every building self-sustaining — and which prevails if they conflict?","a":"The board treats self-sufficiency as a hard constraint; the 500-person target is the goal within it."},{"q":"What does conversion involve beyond purchase — kitchens, accessibility, services space — and how long does it take?","a":"Kitchenettes, accessibility upgrades, and office space for case managers; about 14 months and an estimated $9M on top of the purchase."},{"q":"Are subsidies for the new units already committed, or would Harborlight compete for them?","a":"The state covers the capital; operating subsidy vouchers for 150 units are likely but not yet awarded."},{"q":"Is this hotel-conversion model working elsewhere, or is Harborlight the first in the region?","a":"Several nonprofits in California have converted hotels; results vary mostly on whether operating subsidies came through."}],"buckets":[{"name":"Mission impact per dollar","subs":["150 units vs the 500-person goal and alternative ways to add units","Tenant outcomes in converted hotels vs purpose-built housing","Speed: 14 months to occupancy vs new construction timelines"]},{"name":"Recurring revenue per unit","subs":["Project-based subsidy awards: likelihood and timing for 150 vouchers","Medicaid billable services per tenant and county contract coverage","Tenant rent collections in a high-acuity population"]},{"name":"Operating and capital cost","subs":["Services and property operations per unit in a converted hotel layout","$38M purchase plus $9M conversion against $24M state capital","Debt service on the roughly $23M gap and how it hits the year-two test"]},{"name":"Risk and decision","subs":["Subsidy not awarded: what the building costs Harborlight with no vouchers","Philanthropic capacity to cover the gap without debt","Reputational and neighborhood risk of a failed conversion"]}],"generic":"Investment / go-no-go (goal is not profit)","tailored":"ROI is replaced by two tests the board actually applies: mission impact per dollar and a year-two operating self-sufficiency test per building; the capital gap is examined through debt service because that is what breaks self-sufficiency.","hyp":"Buy, conditional on the operating subsidy award: with 150 vouchers the building covers its operations by year two, and 150 units in 14 months is nearly a third of the five-year goal; without the vouchers, debt service on the $23M gap makes it fail the board's rule regardless of mission value.","trap":"Judging the project on mission scale or on a profit-style ROI. The board's binding test is operating self-sufficiency after year two, which hinges on subsidy awards and debt service, not on how many people the building houses.","start":"Recurring revenue per unit","startWhy":"Self-sufficiency is the board's hard constraint and it turns almost entirely on whether 150 operating vouchers are awarded, so that is the first thing to size."},{"id":"ma-n1","type":"ma","diff":1,"title":"Two Taprooms","client":"Ferrisburg Spirits Company","industry":"Consumer / distilled spirits","prompt":"Ferrisburg Spirits Company is a Louisville, Kentucky bourbon producer with about $420M in revenue and $85M in EBITDA, selling two heritage bourbon brands through distributors in all 50 states and 20 export markets. Bourbon demand has been strong but Ferrisburg has no presence in the fast-growing ready-to-drink cocktail category. It is considering acquiring Tollgate Canned Cocktails, a Denver company with $60M in revenue and $5M of EBITDA that makes bourbon-based canned cocktails sold mainly in the Mountain West and Texas. Tollgate's owners are asking $150M. Ferrisburg's CEO wants to know whether to acquire Tollgate and what the most he should pay is.","questions":[{"q":"How does Tollgate make money, and does it produce its own spirit or buy it?","a":"It buys bulk bourbon on the open market, which is its largest cost; it sells through distributors at about a 30% gross margin."},{"q":"What does Ferrisburg want from the deal — category entry, a growth engine, or using its own bourbon as an input?","a":"All three, but mainly to get into ready-to-drink before competitors lock up distributor attention."},{"q":"How fast is the ready-to-drink category growing and how fragmented is it?","a":"Growing high single digits to low double digits a year; dozens of brands, but a few national players are consolidating."},{"q":"How much overlap is there between Tollgate's distributors and Ferrisburg's?","a":"Ferrisburg's distributor network covers every state Tollgate is not in; Tollgate has strong relationships in its home region."},{"q":"Could Ferrisburg supply Tollgate's bourbon from its own distillery, and at what cost compared to the open market?","a":"Yes; Ferrisburg's cost to produce is well below what Tollgate pays on the bulk market."}],"buckets":[{"name":"Canned cocktail category","subs":["Category growth and bourbon-based share of RTD","Competitor consolidation and shelf-space pressure","Distributor priorities in a crowded category"]},{"name":"Tollgate standalone","subs":["Brand strength and repeat purchase in its home region","$5M EBITDA and margin at current bulk bourbon prices","Management team and production capacity"]},{"name":"Synergies with Ferrisburg","subs":["Cost: replace open-market bourbon with Ferrisburg's own at production cost","Revenue: national distribution through Ferrisburg's distributors, counted at margin","Dis-synergy: cannibalization of bourbon sold neat"]},{"name":"Deal and risks","subs":["Max price = standalone value + PV of synergies - integration cost vs $150M ask","Integration: distributor transitions and brand independence","Founder retention and culture of a craft brand inside a heritage house"]}],"generic":"Merger / acquisition (strategic buyer)","tailored":"Synergies are split into the input-cost synergy unique to a distiller buying a cocktail brand (own bourbon replaces bulk purchases) and the distribution synergy, which is counted at margin, not revenue.","hyp":"Acquire, but closer to $110M-$120M than the $150M ask: Tollgate standalone is worth roughly $60M-$75M at category multiples, and the input-cost plus distribution synergies at margin add perhaps $50M of present value before integration costs.","trap":"Counting national distribution as revenue synergy at full value. Only the gross margin on incremental cans, net of distributor fees and slotting, accrues to Ferrisburg, and some of it cannibalizes bourbon sold neat.","start":"Tollgate standalone","startWhy":"The ask is 30 times EBITDA, so establishing what Tollgate is worth on its own frames how much synergy Ferrisburg would be paying the seller for."},{"id":"ma-n2","type":"ma","diff":2,"title":"Shared Spectrum","client":"Vireya Telecom","industry":"TMT / regional wireless carrier","prompt":"Vireya Telecom is a regional wireless carrier serving 1.8 million subscribers across rural Montana, Idaho, Wyoming, and the Dakotas with about $1.3B in revenue and $380M in EBITDA, competing against the three national carriers largely on local coverage and customer service. Its network is reaching capacity in several growth corridors and it needs more mid-band spectrum. Vireya is considering acquiring Sagebrush Wireless, a smaller carrier with 400,000 subscribers in Nevada and Utah, $280M in revenue, $60M of EBITDA, and a large spectrum portfolio that it has only partly deployed. Sagebrush's owners want $900M. Vireya's CEO wants to know whether the acquisition makes sense and the maximum price Vireya should pay, given that the board will not take leverage above three times EBITDA.","questions":[{"q":"How does Vireya make money and how does spectrum constrain it?","a":"Monthly postpaid plans plus roaming revenue from national carriers whose customers travel through its territory; spectrum limits how many customers each tower can serve at acceptable speeds."},{"q":"What is the primary objective — the spectrum, the subscribers, or the geography?","a":"Spectrum first, then subscribers; Nevada and Utah are not a natural fit with Vireya's footprint."},{"q":"How much of Sagebrush's spectrum could Vireya use in its own markets versus only in Nevada and Utah?","a":"Licenses are geographic; only a portion covers Vireya's existing territory, the rest is tied to Sagebrush's markets."},{"q":"How are the national carriers behaving in rural markets right now?","a":"Aggressively building out with government subsidies; roaming revenue to regional carriers is shrinking as they do."},{"q":"What integration cost would combining two carrier networks and billing systems entail?","a":"Network integration and billing migration typically run into the tens of millions and take about two years."}],"buckets":[{"name":"Rural wireless market","subs":["National carrier buildout and shrinking roaming revenue","Subscriber growth and ARPU trends in rural markets","Spectrum scarcity and what mid-band licenses trade for"]},{"name":"Sagebrush standalone","subs":["$60M EBITDA quality: churn, ARPU, and roaming dependence","Undeployed spectrum valued separately from the operating business","Network condition and capex backlog"]},{"name":"Synergies and fit","subs":["Spectrum usable in Vireya's own corridors: capacity unlocked and capex avoided","Cost: shared billing, customer care, and backhaul contracts","Dis-synergy: non-contiguous footprint with no roaming or tower overlap"]},{"name":"Deal and risks","subs":["Max price = standalone + PV(synergies) - integration cost vs $900M","Financing within three times EBITDA leverage cap","Regulatory approval and spectrum license transfer conditions"]}],"generic":"Merger / acquisition (strategic buyer)","tailored":"Sagebrush's undeployed spectrum is valued as a separate asset from the operating business, and the synergy bucket distinguishes licenses that cover Vireya's territory from those that do not, because only the former solve the stated problem.","hyp":"Decline at $900M: Sagebrush's operating business is worth perhaps $400M-$450M, and the spectrum that actually covers Vireya's corridors is a fraction of the portfolio; combined with a non-contiguous footprint the synergies do not close the gap, and the leverage cap likely cannot fund the price anyway.","trap":"Treating 'a large spectrum portfolio' as a synergy. Spectrum is licensed by geography, so most of Sagebrush's licenses cannot be used where Vireya is capacity-constrained; the candidate must ask which licenses overlap.","start":"Synergies and fit","startWhy":"The stated reason for the deal is spectrum, so the first question is how much of Sagebrush's spectrum Vireya can actually use in its own markets."},{"id":"ma-n3","type":"ma","diff":2,"title":"Union Bakery","client":"Corvallis Craft Bakeries","industry":"Consumer / industrial baking","prompt":"Corvallis Craft Bakeries is a commercial bakery in Oregon's Willamette Valley making artisan breads and rolls for grocery in-store bakeries and restaurant chains across the West Coast, with $190M in revenue and $24M of EBITDA from two plants. Demand from restaurant chains in the Southwest is growing but Corvallis cannot serve it from Oregon because bread has a 48-hour fresh window. It is considering buying Mesa Verde Baking, a Phoenix bakery with one plant, $70M of revenue, $7M EBITDA, and a unionized workforce, for an asking price of $85M. Mesa Verde serves mostly grocery chains in Arizona and New Mexico. Corvallis's CEO wants to know whether to acquire Mesa Verde and the most he should pay.","questions":[{"q":"How does Corvallis make money — by customer segment, and what are the margins on restaurant chains versus grocery?","a":"Restaurant chain contracts carry higher margins and longer terms; grocery in-store bakery is higher volume but more price-sensitive."},{"q":"What is the strategic goal — a plant in the Southwest to serve restaurant chains, or Mesa Verde's grocery customers?","a":"Mainly the plant and its location; the grocery customers are a bonus."},{"q":"How much spare capacity does the Mesa Verde plant have, and could it bake Corvallis's products?","a":"The plant runs around 65% of capacity; it would need some equipment changes to make artisan lines."},{"q":"Are there alternatives — building a plant in Phoenix or co-packing with a bakery there?","a":"A greenfield plant would cost roughly $50M and take two years; two co-packers exist but neither does artisan bread well."},{"q":"What does the union contract look like, and when does it expire?","a":"Wages are moderately above Corvallis's non-union plants; the contract expires in 18 months."}],"buckets":[{"name":"Southwest fresh bread market","subs":["Restaurant chain demand in AZ, NM, and Southern California","Grocery in-store bakery outsourcing trend","Regional bakery competitors and their capacity"]},{"name":"Mesa Verde standalone","subs":["$7M EBITDA and customer concentration in grocery","Plant condition, 35% spare capacity, and equipment fit for artisan lines","Union labor cost and contract renewal timing"]},{"name":"Synergies and fit","subs":["Revenue: Corvallis restaurant chain products baked in Phoenix, at contract margin","Cost: ingredient purchasing and route consolidation","Avoided cost of a $50M greenfield plant and two years of lost contracts"]},{"name":"Deal and risks","subs":["Max price = standalone + PV(synergies) - integration cost vs $85M, benchmarked against build","Union negotiation risk and labor relations at a non-union acquirer","Capital cost of equipment changes and product transfer"]}],"generic":"Merger / acquisition (strategic buyer)","tailored":"The deal is framed against the greenfield alternative because the buyer's goal is the plant, not the business; synergy value is capped by the cost of building, and the union contract is treated as an integration risk with a specific clock.","hyp":"Acquire at or a little below $85M: Mesa Verde is worth roughly $55M-$65M standalone, and using its spare capacity for restaurant chain contracts adds synergy value well above the gap, so long as the price stays below the roughly $50M build cost plus the two years of contract margin a build would forfeit.","trap":"Treating the $85M ask against $7M EBITDA as absurdly expensive. For Corvallis the relevant benchmark is the greenfield alternative: $50M plus two years without Southwest contracts, which makes the spare capacity in Phoenix worth far more than its standalone earnings.","start":"Mesa Verde standalone","startWhy":"Establishing standalone value, including plant capacity and the union cost base, sets the floor before adding the synergies that are the whole reason for the deal."},{"id":"ma-n4","type":"ma","diff":3,"title":"Counting Beds","client":"Strathmore Student Living","industry":"Real estate / student housing","prompt":"Strathmore Student Living is an Atlanta-based owner-operator of purpose-built student housing with 28 properties and 19,000 beds near large public universities in the Southeast, generating $310M in rental revenue and $165M in net operating income. Enrollment at its universities is stable but new supply from developers is increasing in several markets. Strathmore is considering acquiring Cobbleridge Campus Communities, which owns 11 properties with 7,500 beds in the Midwest, for an asking price of $1.1B; Cobbleridge generates $95M of NOI. Strathmore's CEO argues the acquisition brings scale, operating efficiencies, and diversification; several board members think the Midwest portfolio is in weaker markets. The board wants a recommendation on whether to buy and a maximum price.","questions":[{"q":"How does Strathmore make money — what drives NOI per bed, and how do leases work?","a":"Twelve-month leases signed by the bed, with rent per bed and occupancy driving revenue; operating costs are mostly fixed per property."},{"q":"What is the board's goal — NOI growth, lower risk through diversification, or a target return on the deal?","a":"The board wants the deal to be accretive to returns per share and will not pursue diversification for its own sake."},{"q":"How do Cobbleridge's markets compare — enrollment trends, new supply, and occupancy?","a":"Three of its eleven universities have declining enrollment; occupancy is a few points below Strathmore's and new supply is lighter."},{"q":"What operating synergies are realistic — can Strathmore run Midwest properties from Atlanta?","a":"Leasing, marketing, and procurement can be centralized; on-site staff cannot be reduced much."},{"q":"Is $1.1B in line with what student housing portfolios trade for?","a":"The implied cap rate is on the low end of recent portfolio deals, meaning the ask is rich."}],"buckets":[{"name":"Midwest student housing markets","subs":["Enrollment trajectory at each of Cobbleridge's 11 universities","New bed supply pipeline near each campus","Rent-per-bed growth vs Southeast markets"]},{"name":"Cobbleridge standalone","subs":["$95M NOI: occupancy and rent per bed by property, not portfolio average","Deferred maintenance and capex backlog","Properties at declining-enrollment schools valued separately"]},{"name":"Synergies and fit","subs":["Cost: centralized leasing, marketing, and procurement across 35,000 beds","Revenue: Strathmore's revenue management on Cobbleridge rents","Dis-synergy: management attention spread across two regions"]},{"name":"Deal and risks","subs":["Max price = standalone + PV(synergies) - integration cost vs $1.1B","Accretion to returns per share at the financing cost","Alternative: buy the eight strong properties and leave the three weak ones"]}],"generic":"Merger / acquisition (strategic buyer)","tailored":"Standalone value is broken down property by property rather than at portfolio level because three of eleven universities have declining enrollment, which opens a structural alternative: a partial acquisition.","hyp":"Do not pay $1.1B for the whole portfolio: the eight properties at stable universities are worth most of the ask, while the three declining-enrollment assets drag standalone value and face long-term occupancy risk; propose acquiring the eight or a price that reflects the three as impaired.","trap":"Valuing Cobbleridge on portfolio-average NOI and occupancy. The average hides three properties that will lose occupancy as enrollment declines, and they are worth far less than their current NOI suggests.","start":"Cobbleridge standalone","startWhy":"At a cap rate already on the rich side, standalone value by property is the test; if the three weak campuses are impaired, no realistic synergy covers the gap."},{"id":"ma-n5","type":"ma","diff":4,"title":"Buying the Classroom","client":"Pennant Learning","industry":"Education / K-12 curriculum and assessment","prompt":"Pennant Learning is a Boston-based publisher of K-12 math and literacy curriculum with $720M in revenue and $130M of EBITDA, selling multi-year textbook and digital license adoptions to about 4,000 US school districts. Districts are shifting budgets from curriculum to assessment and intervention software, and Pennant's adoption revenue has been flat for three years. The CEO has set a growth target of $1B in revenue in five years. To get there, he proposes acquiring Lumenaire Assessments, a venture-backed adaptive testing company with $110M of revenue growing 35% a year but negative EBITDA, for $1.2B. He tells you the deal is 'obviously the growth engine' and wants you to confirm the price and figure out the integration plan.","questions":[{"q":"How does Pennant make money, and how does an adaptive assessment company's model differ?","a":"Pennant sells multi-year adoptions paid upfront with renewals every 5-7 years; Lumenaire sells annual per-student software subscriptions, renewed every year."},{"q":"Is the goal $1B in revenue, or profitable growth — and how does the board view a money-losing target?","a":"The CEO frames it as revenue, but the board will only approve a deal that is EBITDA-accretive within three years."},{"q":"Could Pennant reach $1B organically or through smaller deals, and what is the gap?","a":"Organic growth is near zero, so the gap is essentially $280M; a few smaller assessment companies exist but none at Lumenaire's scale."},{"q":"How much do Pennant's districts overlap with Lumenaire's, and do districts buy curriculum and assessment from the same vendor?","a":"About a third of Lumenaire's districts are Pennant customers; districts increasingly want curriculum and assessment integrated, but procurement is often separate."},{"q":"Why is Lumenaire unprofitable, and when does it expect to break even?","a":"Heavy sales and engineering spend chasing growth; it projects break-even in three years if growth continues."}],"buckets":[{"name":"K-12 assessment market","subs":["District budget shift from curriculum to assessment and intervention","Competitors in adaptive testing and state testing contracts","Procurement: are curriculum and assessment bought together?"]},{"name":"Lumenaire standalone","subs":["Growth durability: 35% from new districts vs expanding seats","Path to break-even and cash burn until then","Annual renewal rates vs Pennant's multi-year adoptions"]},{"name":"Synergies and fit","subs":["Revenue: Lumenaire sold into Pennant's 4,000 districts, counted at margin","Cost: combined sales force and shared district relationships","Product: curriculum linked to assessment data as a defensible bundle"]},{"name":"Deal and the growth gap","subs":["Max price = standalone + PV(synergies) - integration cost vs $1.2B","Does Lumenaire actually close the $280M gap by year five, and at what EBITDA?","Alternatives: build assessment organically or acquire two smaller players"]}],"generic":"Merger / acquisition (strategic buyer) — growth target that is really an M&A case","tailored":"The fourth bucket connects deal value to the CEO's $1B growth target and the board's EBITDA-accretion test, because the real question is whether this acquisition is the right way to close a $280M gap, not just whether $1.2B is fair.","hyp":"Lumenaire does close most of the revenue gap — at 35% growth it approaches $500M by year five — but $1.2B exceeds standalone value plus synergies, and it is not EBITDA-accretive within three years; propose a lower price or a structure with earn-outs tied to break-even, and do not simply confirm the CEO's number.","trap":"Taking the CEO's framing and jumping to integration planning. The ask is to confirm a price, which means the candidate must still size standalone value, synergies at margin, and the board's accretion test, and be willing to say the price is too high.","start":"Lumenaire standalone","startWhy":"A money-losing target at 11 times revenue lives or dies on whether its growth and break-even path are real; that sets whether any synergy story can justify $1.2B."},{"id":"pe-n1","type":"pe","diff":1,"title":"Roll the Dumpsters","client":"Greyfield Capital Partners","industry":"Industrial services / waste collection","prompt":"Greyfield Capital Partners is a mid-market private equity fund based in Chicago with $2B under management that focuses on industrial services. It is evaluating the acquisition of Tri-County Disposal, a family-owned waste hauler in central Indiana with 70 trucks, 90,000 residential and commercial customers, $85M in revenue, and $20M of EBITDA. The founder is retiring and has agreed to an $160M price, which would be funded about half with debt. Greyfield's thesis is that waste hauling is a stable, route-dense business where it can raise prices and bolt on smaller haulers. The deal partner wants your view on whether to proceed and on what the fund's 5-year return would be driven by.","questions":[{"q":"How does Tri-County make money, and how are its contracts structured?","a":"Monthly fees from municipal residential contracts and commercial accounts; municipal contracts run 5-7 years with built-in escalators, commercial accounts are renewed annually."},{"q":"What return does Greyfield target and over what hold period?","a":"At least 2.5 times its equity over five years."},{"q":"How dense are the routes and how much of the cost base is trucks, labor, and landfill fees?","a":"Routes are dense in three counties; landfill tipping fees are the largest cost after drivers and are rising."},{"q":"Are there many small haulers nearby to acquire, and what do they sell for?","a":"Roughly a dozen within 60 miles, mostly owner-operators, typically trading at lower multiples than Tri-County."},{"q":"Does Tri-County own a landfill or transfer station, or does it pay a competitor?","a":"It pays a national competitor's landfill; owning or securing disposal is a common value lever in this industry."}],"buckets":[{"name":"Regional waste hauling market","subs":["Municipal contract renewals and rate escalators in central Indiana","Competition from national haulers who own the landfills","Tipping fee trends and disposal capacity"]},{"name":"Tri-County standalone","subs":["EBITDA quality: contract mix and customer churn","Route density and fleet age vs replacement capex","Founder dependence and management bench"]},{"name":"Value-creation plan","subs":["Price: catch-up pricing on commercial accounts and escalators on municipal","Bolt-ons: a dozen small haulers at lower multiples folded into existing routes","Disposal: transfer station or landfill rights to cap tipping costs"]},{"name":"Deal and exit","subs":["Entry at 8x EBITDA, half debt: leverage capacity on stable contract cash flows","Exit multiple to a national hauler or larger fund at year five","Return bridge: EBITDA growth vs multiple expansion vs debt paydown"]}],"generic":"PE due diligence / LBO","tailored":"Value creation is organized around the three waste-industry levers (pricing, route-dense bolt-ons, disposal control) rather than generic cost cuts, and the standalone bucket flags founder dependence because a retiring owner is the deal's origin.","hyp":"Proceed: returns will be driven mainly by EBITDA growth, from pricing catch-up on commercial accounts and bolt-ons bought at lower multiples than the platform, with debt paydown from steady contract cash flow as the second driver; multiple expansion is a bonus if a national hauler buys at exit.","trap":"Assuming the return comes from buying at 8x and selling at a higher multiple. The defensible return bridge is EBITDA growth from pricing and bolt-ons; multiple arbitrage on small haulers only works if they are integrated into dense routes.","start":"Value-creation plan","startWhy":"At 8x EBITDA in a stable industry, the deal only clears 2.5x if EBITDA grows, so the credibility of the pricing and bolt-on levers decides the investment."},{"id":"pe-n2","type":"pe","diff":2,"title":"Tuition Carry","client":"Oriel Growth Partners","industry":"Education / early childhood centers","prompt":"Oriel Growth Partners is a London-based private equity fund with GBP 1.5B under management that invests in consumer services. It is in exclusive talks to acquire Brightfield Nurseries, a chain of 65 childcare nurseries across the Midlands and North of England caring for 6,000 children, with GBP 95M of revenue and GBP 14M of EBITDA. The seller is a founder who has grown through acquisitions and wants GBP 170M. The UK government recently expanded funded childcare hours for working parents, which has pushed up demand but pays nurseries a fixed hourly rate below private fees. Staff turnover in the sector is high and minimum wage increases hit margins every April. Oriel's deal team wants your assessment of whether to proceed and what would need to be true for the fund to achieve its target return.","questions":[{"q":"How does a nursery make money — what share of hours are government-funded versus privately paid, and how do the two rates compare?","a":"About 55% of Brightfield's hours are government-funded at a fixed rate; private rates are meaningfully higher, and the gap is the margin squeeze."},{"q":"What is Oriel's return target and intended hold period?","a":"Three times equity over five to six years, with a sale to a larger operator or a listed childcare group."},{"q":"What is occupancy across the 65 nurseries, and how much variance is there?","a":"Average occupancy is 82%, but it ranges from 60% in a few newly acquired sites to over 95% in the best."},{"q":"Is staff turnover a Brightfield problem or sector-wide, and what does it cost?","a":"Sector-wide at around 30% a year; Brightfield is slightly worse, and agency staff cover gaps at a premium."},{"q":"What does the funded-hours expansion mean for demand and for the rate nurseries receive?","a":"Demand for places is up sharply; the funded rate rose but remains below cost in many regions."}],"buckets":[{"name":"UK childcare market","subs":["Funded hours expansion: demand surge vs below-cost hourly rate","Fragmentation: thousands of single-site owners as bolt-on supply","Regulatory ratios (staff per child) and inspection regime"]},{"name":"Brightfield standalone","subs":["Occupancy by site: 60% to 95% range, not the 82% average","Staff cost per child-hour, turnover, and agency premium","Integration debt from the founder's acquisitions"]},{"name":"Value-creation plan","subs":["Fill the under-occupied sites toward chain average","Mix: add private hours (extended days, meals, extras) on top of funded hours","Retention: pay and training to cut agency spend; bolt-on single sites"]},{"name":"Deal and exit","subs":["Entry at about 12x EBITDA: leverage capacity given wage-driven margin volatility","Exit to a large operator or listed group at year five or six","Return bridge: occupancy-driven EBITDA growth vs multiple vs deleveraging"]}],"generic":"PE due diligence / LBO","tailored":"Standalone analysis insists on occupancy by site rather than the chain average, because a few 60% sites are where EBITDA growth lives; value creation is built on the UK funding model (private 'extras' layered on fixed-rate funded hours).","hyp":"Proceed only if the under-occupied sites can be filled: returns must come from EBITDA growth through occupancy and private add-on hours, because at 12x entry and with wage inflation squeezing funded-hour margins, neither multiple expansion nor deleveraging can be relied on.","trap":"Taking 82% average occupancy as the business. The spread from 60% to 95% is the opportunity and the risk; the deal case depends on the specific low-occupancy sites, and the funded-hours demand surge does not help if the rate is below cost.","start":"Brightfield standalone","startWhy":"Occupancy variance by site and the staff cost per child-hour determine whether there is a real EBITDA growth path at a 12x entry multiple."},{"id":"pe-n3","type":"pe","diff":2,"title":"Blades and Bolts","client":"Westhollow Equity","industry":"Energy / wind turbine maintenance services","prompt":"Westhollow Equity is a Houston-based private equity fund with $3.5B under management, focused on energy services. It is evaluating the buyout of Aeris Wind Services, an independent provider of operations and maintenance for onshore wind farms, with 1,100 technicians servicing about 9 gigawatts of turbines across Texas, Oklahoma, and the Great Plains, $410M in revenue, and $55M of EBITDA. Aeris's owner, a family holding company, is asking $600M. Turbine manufacturers service most new turbines under warranty, but a growing share of the US fleet is aging out of warranty and owners are looking for cheaper independent service. The fund's deal team wants to know whether to buy, what the value-creation plan would be, and where the returns would come from over a five-year hold.","questions":[{"q":"How does Aeris make money — fixed-fee servi
