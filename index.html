<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#15150F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Case Drill</title>
<style>
:root{
 --bg:#F7F5F0;--card:#FFFFFF;--ink:#15150F;--mute:#6B6760;--line:#E6E2DA;--soft:#EFECE5;
 --diag:#2457F5;--grow:#12A86A;--eval:#8A4DFF;--ops:#F2742B;
 --ok:#12A86A;--bad:#E0423A;--gold:#F5B81C;--xp:#F5B81C;
 --r:16px;--sh:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,system-ui,sans-serif;font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-.01em;margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font:inherit}
.hide{display:none!important}

/* top bar */
#top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
#top .rank{font-family:Fraunces,serif;font-size:15px;flex:1;line-height:1.1}
#top .rank small{display:block;font-family:Inter;font-size:11px;opacity:.65;margin-top:2px}
#top .pill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600}
#top .pill svg{width:14px;height:14px}
#xpbar{height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;margin-top:8px}
#xpbar i{display:block;height:100%;background:var(--xp);border-radius:2px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
#topwrap{position:sticky;top:0;z-index:20;background:var(--ink)}
#topwrap .xprow{padding:0 16px 10px;font-size:11px;color:rgba(255,255,255,.6);display:flex;justify-content:space-between}

main{padding:16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.grow1{flex:1}
.mute{color:var(--mute)}
.sm{font-size:13px}.xs{font-size:11.5px}
.b{font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:14px;background:var(--ink);color:#fff;font-weight:600;font-size:16px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--mute);padding:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.fam{color:#fff}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.fam-diag{--c:var(--diag)}.fam-grow{--c:var(--grow)}.fam-eval{--c:var(--eval)}.fam-ops{--c:var(--ops)}
.tag.fam{background:var(--c);color:#fff}
.tag.soft{background:var(--soft);color:var(--mute)}

/* daily goal */
.goal{display:flex;align-items:center;gap:14px}
.ring{width:64px;height:64px;position:relative;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.streak{display:flex;align-items:center;gap:6px;font-weight:700}
.streak svg{width:18px;height:18px}

/* path */
.path{position:relative;padding:8px 0 20px}
.path:before{content:"";position:absolute;left:31px;top:0;bottom:0;width:3px;background:var(--line);border-radius:2px}
.node{position:relative;display:flex;gap:14px;align-items:flex-start;padding:8px 0;cursor:pointer}
.node .dot{width:42px;height:42px;border-radius:50%;background:#fff;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;position:relative;margin-left:11px;z-index:1}
.node.unlocked .dot{border-color:var(--c);color:var(--c)}
.node.current .dot{background:var(--c);color:#fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 18%,transparent)}
.node.mastered .dot{background:var(--gold);border-color:var(--gold);color:#fff}
.node.locked{opacity:.45}
.node .body{flex:1;background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:12px 14px}
.node .body h3{font-size:17px}
.stages{display:flex;gap:4px;margin-top:8px}
.stages i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.stages i.on{background:var(--c)}
.stages i.gold{background:var(--gold)}
.sect{font-family:Fraunces,serif;font-size:13px;color:var(--mute);margin:18px 0 6px 0;letter-spacing:.04em;text-transform:uppercase;font-weight:500}

/* level */
.ladder .st{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ladder .st:first-child{border-top:0}
.ladder .st .k{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--soft);color:var(--mute);flex-shrink:0}
.ladder .st.open .k{background:var(--c);color:#fff}
.ladder .st.done .k{background:var(--ok);color:#fff}
.ladder .st.locked{opacity:.45}
.ladder .st .t{flex:1}
.ladder .st .t small{display:block;color:var(--mute);font-size:12px}
.tree .bk{margin:10px 0 0;padding-left:10px;border-left:3px solid var(--c)}
.tree .bk b{display:block;font-size:14px}
.tree .bk ul{margin:3px 0 0;padding-left:18px;font-size:13px;color:#3a3832}
.tree .bk li{margin:2px 0}

/* play */
.playhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.prog{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);transition:width .3s}
.combo{font-size:12px;font-weight:700;color:var(--xp);min-width:40px;text-align:right}
.q{font-size:19px;line-height:1.3;margin:4px 0 14px}
.q .path{font-size:12px;font-weight:600;color:var(--c);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px;padding:0;display:block}
.q .path:before{display:none}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;background:var(--card);box-shadow:var(--sh);margin-bottom:8px;border:2px solid transparent;font-size:15px}
.opt.pick{border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:#EAF8F0}
.opt.bad{border-color:var(--bad);background:#FDECEB}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;min-height:44px}
.chip{padding:9px 12px;border-radius:999px;background:var(--card);box-shadow:var(--sh);font-size:14px;border:2px solid transparent;text-align:left}
.chip.pick{border-color:var(--ink)}
.chip.ok{border-color:var(--ok);background:#EAF8F0}.chip.bad{border-color:var(--bad);background:#FDECEB}
.chip.ghost{opacity:.35}
.slots{min-height:48px;border:2px dashed var(--line);border-radius:12px;padding:8px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.slot{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--soft);font-size:14px}
.slot .n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.slot.ok{background:#EAF8F0}.slot.bad{background:#FDECEB}
textarea.ans{width:100%;min-height:120px;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:15px;background:var(--card);resize:vertical;outline:none}
textarea.ans:focus{border-color:var(--ink)}
.hint{font-size:12.5px;color:var(--mute);margin:-4px 0 10px}
.fb{border-radius:14px;padding:14px;margin:12px 0}
.fb.ok{background:#EAF8F0}.fb.bad{background:#FDECEB}
.fb h3{font-size:16px;margin-bottom:4px}
.fb .xp{font-weight:700;color:#B8860B;font-size:13px}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kw span{padding:4px 9px;border-radius:999px;font-size:12.5px;background:#fff;border:1.5px solid var(--line)}
.kw span.ok{border-color:var(--ok);color:#0b6b43}.kw span.bad{border-color:var(--bad);color:#a3251f;text-decoration:line-through}
.tip{background:#FFF8E1;border-radius:12px;padding:12px;font-size:13.5px;margin-top:10px}
.tip b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#8a6a00;margin-bottom:3px}

/* results */
.big{font-family:Fraunces,serif;font-size:44px;line-height:1}
.badge{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:#FFF8E1;margin-top:8px}
.badge .ic{width:38px;height:38px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-family:Fraunces,serif}
.stat small{font-size:11px;color:var(--mute)}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--c)}

nav{position:fixed;left:0;right:0;bottom:0;background:rgba(247,245,240,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);padding:6px}
nav button.on{color:var(--ink)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.fly{position:fixed;font-weight:800;color:var(--xp);font-size:18px;pointer-events:none;z-index:45;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translateY(-60px);opacity:0}}
.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.acc{border-top:1px solid var(--line)}
.acc summary{padding:12px 0;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
.acc summary:after{content:"+";color:var(--mute)}
.acc[open] summary:after{content:"–"}
.libcard{padding:12px 0;border-top:1px solid var(--line)}
.libcard:first-child{border-top:0}
.libcard p{margin:4px 0 0;font-size:13.5px;color:#3a3832}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:10px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.lock{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
</style>
</head>
<body>
<div id="topwrap"><div id="top"></div><div class="xprow" id="xprow"></div></div>
<main id="view"></main>
<nav>
 <button id="nav-home" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M4 19V9l8-6 8 6v10"/><path d="M9 19v-6h6v6"/></svg>Path</button>
 <button id="nav-review" onclick="go('review')"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Review</button>
 <button id="nav-library" onclick="go('library')"><svg viewBox="0 0 24 24"><path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/></svg>Library</button>
 <button id="nav-stats" onclick="go('stats')"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Stats</button>
</nav>
<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>
<script>
const D = {"types":[{"id":"profit","name":"Profitability","short":"Profit","fam":"diag","buckets":[{"name":"Revenue","subs":["Price (realized vs list, discounting)","Volume (customers × frequency)","Mix (product, channel, unit)"]},{"name":"Costs","subs":["Fixed (rent, salaried labor, depreciation)","Variable (COGS, hourly labor, freight)","Which lines moved — all units or a subset?"]},{"name":"External causes","subs":["Industry-wide vs company-specific?","Competitor pricing or entry","Demand, input prices, regulation"]}],"trap":"Averages hide the problem — ask which units, products or lines moved. Labor is often fixed, not variable.","hyp":"\"This is a profitability case. Revenue is flat and profit fell $X, so costs rose ~$X; my hypothesis is cost growth in [labor/occupancy], with a secondary question on price.\"","start":"Costs","formula":"Profit = Revenue − Cost; Revenue = Price × Volume; always ask company-specific vs industry-wide","prompt":"Profit fell 30% in two years. Why, and how do we get it back?","cut":"Profit = Revenue − Cost (exhaustive by identity), then one attribution question: is the cause ours or the industry's?","startWhy":"When revenue is flat, the profit drop is cost growth by arithmetic; otherwise start with revenue per unit.","risks":"close","std":true,"order":1},{"id":"cost","name":"Cost Reduction","short":"Cost","fam":"diag","buckets":[{"name":"Baseline","subs":["By category & function","Fixed vs variable, direct vs indirect","Addressable vs contractual"]},{"name":"Benchmarks","subs":["Vs peers","Internal spread (best vs worst unit)","Historical run-rate"]},{"name":"Levers","subs":["Consume less (demand / spec)","Pay less (price, procurement)","Use less per unit (productivity)","Eliminate the activity (footprint, outsource, automate)"]},{"name":"Impact & risk","subs":["Run-rate vs one-time","Cost & time to achieve","Revenue / quality / morale risk"]}],"trap":"Cuts that hit revenue or quality; confusing one-time with run-rate; shaving every line equally instead of going where the spread is.","hyp":"\"Cost-reduction case. The target is $X; my hypothesis is that most of it comes from [the biggest addressable category], where our ratio is above benchmark.\"","start":"Baseline","formula":"Savings target ÷ addressable base = % cut required; compare to benchmark gap","prompt":"Cut operating costs 15% without hurting service.","cut":"Four sequential questions — what is the cost, what should it be, how does it fall, what is it worth. Levers are MECE because cost = units consumed × price per unit × activities performed.","startWhy":"You cannot cut what you have not mapped — size the addressable pool first.","risks":"bucket","std":true,"order":2},{"id":"compete","name":"Competitive Response","short":"Compete","fam":"diag","buckets":[{"name":"What changed","subs":["Competitor's impetus — why?","Scale and durability of the move","Customers targeted"]},{"name":"Impact on us","subs":["Where: segment, channel, geography","How much: volume vs price vs mix","Market after the move"]},{"name":"Why we're exposed","subs":["Purchase criteria vs our position","Switching costs & loyalty","Relative cost position"]},{"name":"Response options","subs":["Do nothing / monitor","Match (price, feature) — with the economics","Differentiate, lock in, counter-move — each with second-order reaction"]}],"trap":"Matching on price when the loss is non-price; forgetting \"do nothing\" as an option.","hyp":"\"Competitive-response case. Hypothesis: the loss is concentrated in [segment] and is about [price/service], so the right response is targeted, not a blanket price cut.\"","start":"What changed","formula":"Breakeven volume loss of matching a price cut = Δp ÷ (new price − variable cost)","prompt":"A competitor just made a move that is taking our share. What should we do?","cut":"Them → us → why → decide. BCG's sequence: why did this happen → what does the market look like after → what should we do.","startWhy":"Understand the move before reacting to it; the impetus tells you how durable it is.","risks":"close","std":true,"order":3},{"id":"growth","name":"Revenue Growth","short":"Growth","fam":"grow","buckets":[{"name":"Core (existing × existing)","subs":["Price & mix","Penetration & frequency","Share gains, productivity"]},{"name":"New markets (existing product)","subs":["New geographies","New channels (wholesale, DTC)","New customer segments"]},{"name":"New products (existing market)","subs":["Adjacent categories","Services & formats","Private label"]},{"name":"New businesses (new × new)","subs":["Adjacencies via acquisition / partnership","Platform deals","Screen: capabilities, capital, cannibalization, timing"]}],"trap":"Size the gap first (Rule of 72: 2× in 5 years ≈ 15%/yr). The hypothesis is a bet, not a list.","hyp":"\"Growth case. Current trajectory gets us to ~$A, so the gap is ~$B. The market grows X%, so most of it must come from new markets; I'd start there because [constraint].\"","start":"New markets (existing product)","formula":"Rule of 72: double in 5 yrs ≈ 15%/yr; gap = target − (current × (1+g)^t)","prompt":"Double revenue in five years. How?","cut":"Ansoff: existing/new product × existing/new market gives four cells that cannot overlap and cover every growth path. Build / buy / partner is a mode, so it is a click-down in every cell — not a bucket.","startWhy":"The core adds a few points; a big gap usually has to come from reaching customers you don't reach today.","risks":"close","std":true,"order":4},{"id":"launch","name":"New Product Launch","short":"Launch","fam":"grow","buckets":[{"name":"Customer & market","subs":["Need & target segment","Market size","Willingness to pay"]},{"name":"Product & competition","subs":["Differentiation vs alternatives","Competitor response","Regulatory / IP"]},{"name":"Capabilities & go-to-market","subs":["Build / partner / license","Channel & sales model","Operations, supply"]},{"name":"Economics & risks","subs":["Ramp: price × volume","Investment, breakeven","Cannibalization (incremental only); downside"]}],"trap":"Counting cannibalized sales as growth; launching before channel and capabilities exist.","hyp":"\"New-product case. Hypothesis: the launch is incremental only if it reaches [new segment]; I'd test cannibalization and breakeven volume first.\"","start":"Economics & risks","formula":"Breakeven volume = fixed launch cost ÷ unit contribution; incremental = new − cannibalized","prompt":"Should we launch this new product line?","cut":"Four decision questions — demand exists, we can win, we can deliver, it pays.","startWhy":"Incremental profit, not gross launch revenue, is the test — check cannibalization and breakeven first.","risks":"bucket","std":true,"order":5},{"id":"entry","name":"Market Entry","short":"Entry","fam":"eval","buckets":[{"name":"Market attractiveness","subs":["Size & growth by segment","Profit pools, regulation","Customer needs & trends"]},{"name":"Competitive landscape","subs":["Incumbents, share, pricing","Barriers & likely reaction","Basis of competition"]},{"name":"Right to win","subs":["What transfers (model, playbook) vs what doesn't (brand, relationships)","Gaps: distribution, local know-how","Differentiation we bring"]},{"name":"Economics, mode & risks","subs":["Attainable share × price − local cost","Investment, breakeven","Build / buy / partner; timing; downside"]}],"trap":"Big market ≠ attainable share; assuming capabilities travel.","hyp":"\"Market-entry case. Hypothesis: the market is attractive but crowded, so entry only works via [mode] if unit economics hold at local costs — I'd start with entry economics.\"","start":"Economics, mode & risks","formula":"Attainable revenue = market size × realistic share; payback = investment ÷ annual cash flow","prompt":"Should we enter the [country / segment] market?","cut":"The market (demand side) · the players already there (supply side) · us relative to them · the money and the way in. Competition appears once only, in bucket 2; mode of entry is a click-down of bucket 4.","startWhy":"Mode changes capex and risk more than anything else; entry only works if unit economics hold at local costs.","risks":"bucket","std":true,"order":6},{"id":"ma","name":"M&A (Strategic) / PE","short":"M&A","fam":"eval","buckets":[{"name":"Target's market","subs":["Size, growth, trends","Competitive landscape, comparables","Regulatory climate"]},{"name":"Target standalone","subs":["Revenue (P × Q), costs, margins","Products, customers, capabilities, management","Compatibility: IT, staff, culture"]},{"name":"Synergies","subs":["Revenue synergies (at contribution margin)","Cost synergies (more bankable)","Integration cost; cannibalization = negative synergy"]},{"name":"Deal & risks","subs":["Price vs standalone + synergies − integration","Financing; alternatives (build / partner)","Customer / competitor / regulatory reaction"]}],"trap":"Say who the buyer is. Strategic = synergies; PE = exit and returns (IRR 20–25%). Count revenue synergies at margin, not revenue.","hyp":"\"M&A case with a strategic buyer, so I'll weight synergies and fit. Hypothesis: the deal works only if cost synergies cover the premium — I'd size standalone value, then synergies.\"","start":"Target standalone","formula":"Max price = standalone + PV(synergies) − integration; max premium % = [PV(syn) − integration] ÷ standalone","prompt":"Our client wants to acquire [target]. Should they, and at what price?","cut":"Value to buyer = standalone + synergies − price; the market is the context both are valued in. PE swap: bucket 3 becomes the value-creation plan, bucket 4 adds leverage, exit route and IRR vs hurdle.","startWhy":"What it is worth on its own before synergies — bucket 2 is where the value math lives; then synergies.","risks":"bucket","std":true,"order":7},{"id":"invest","name":"Investment / Go–No-Go","short":"Invest","fam":"eval","buckets":[{"name":"Strategic fit","subs":["Why this, why now?","Fit with objective & core","Alternatives incl. do-nothing & best alternative"]},{"name":"Economics","subs":["Upfront investment","Annual benefit (revenue or savings)","NPV / payback vs hurdle; sensitivity"]},{"name":"Execution","subs":["Capacity & capabilities","Timeline, permits, regulation","Ramp / integration"]},{"name":"Risks & alternatives","subs":["Downside scenarios","Reversibility / exit cost","Other uses of the money"]}],"trap":"No lean before one line of math (annual benefit vs upfront cost); compare to the best alternative, not do-nothing.","hyp":"\"Investment case. Roughly $Y a year in savings on $X in — payback under N years — so my hypothesis is yes, subject to execution risk and whether the capital has a better use.\"","start":"Economics","formula":"Payback = I₀ ÷ annual CF; NPV = −I₀ + CF × AF(r,t); 5-yr AF at 10% ≈ 3.79","prompt":"Should we build the new facility / fund this project?","cut":"Should we · is it worth it · can we · what if. Risks are a separate bucket from reasons to lean yes.","startWhy":"One line — annual benefit against upfront cost — tells you which way to lean before anything else.","risks":"bucket","std":true,"order":8},{"id":"pricing","name":"Pricing","short":"Pricing","fam":"eval","buckets":[{"name":"Customer value & WTP (ceiling)","subs":["Value vs alternatives","Elasticity by segment","Switching costs"]},{"name":"Competitive position (range)","subs":["Competitor prices & positioning","Likely response","Differentiation"]},{"name":"Economics (floor)","subs":["Unit cost & contribution","Breakeven volume change","Mix / cannibalization across tiers"]},{"name":"Execution & risks","subs":["Model: per unit, tier, bundle, surcharge","Channel & communication","Timing, grandfathering, backlash"]}],"trap":"Run breakeven volume loss first: Δp ÷ (new price − variable cost). Cost-plus thinking; ignoring the competitor's response.","hyp":"\"Pricing case. A 10% increase at a 40% margin breaks even if we lose less than ~20% of volume; my hypothesis is elasticity is below that in [segment], so a targeted increase works.\"","start":"Economics (floor)","formula":"Breakeven volume loss for a price increase = Δp ÷ (new price − variable cost)","prompt":"How should we price the product — and can we raise prices 10%?","cut":"Value sets the ceiling, cost sets the floor, competition sets the realistic range, execution is how it lands.","startWhy":"The breakeven volume change tells you how much elasticity you can afford before anything else matters.","risks":"bucket","std":true,"order":9},{"id":"ops","name":"Operations / Throughput","short":"Ops","fam":"ops","buckets":[{"name":"Demand","subs":["Volume & arrival pattern (peaks)","Mix / \"acuity\"","Levers: channel shift, appointments, self-service, triage"]},{"name":"Process","subs":["Steps until the clock stops","Bottleneck step & cycle time","Levers: shorten / remove bottleneck, rework, hand-offs"]},{"name":"Capacity","subs":["Staff × hours × productivity","Physical assets (lanes, beds, berths)","Levers: add or re-time to peaks"]},{"name":"Constraints & goal","subs":["Service standard / target","Budget & hiring limits","Who controls capacity; stakeholders"]}],"trap":"Fix the bottleneck only; stop at the step where the clock stops. The fix may sit outside the unit (ED boarding → discharge).","hyp":"\"Operations case. My hypothesis is this is a mix-driven demand spike hitting a fixed bottleneck at [step], so the fastest lever is channel shift plus re-timing staff to peaks.\"","start":"Process","formula":"Throughput = min(step capacities); wait ≈ queue ÷ service rate; Little's Law: WIP = rate × time","prompt":"Wait times have doubled. Get them back down.","cut":"Wait time is a function of exactly three things — how much arrives, how it flows, how much can be served — plus the boundary the fix must fit inside. Levers live inside each driver, not in a bucket of their own.","startWhy":"Only the bottleneck step sets throughput — find it, then test whether Demand or Capacity moved.","risks":"close","std":true,"order":10},{"id":"sizing","name":"Market Sizing","short":"Sizing","fam":"eval","buckets":[{"name":"Approach","subs":["Top-down or bottom-up — say which and why","Define the unit and geography","State the equation before plugging numbers"]},{"name":"Segments","subs":["Start population (people, households, businesses)","Split by age, income, B2B/B2C, urban/rural","Drop segments that don't buy"]},{"name":"Drivers","subs":["Penetration / adoption rate","Frequency or replacement cycle","Price per unit"]},{"name":"Answer & sanity check","subs":["Round at each step","Cross-check with another method or known anchor","So what for the client"]}],"trap":"Forgetting to state the unit; false precision; not sanity-checking against an anchor (US population ~340M, ~130M households).","hyp":"\"Market-sizing question. I'll go bottom-up: households × penetration × frequency × price, then sanity-check against [anchor].\"","start":"Approach","formula":"Market = population × penetration × frequency × price; anchors: US ~340M people, ~130M households, GDP ~$30T","cut":"Pick an approach, segment the population, apply the drivers, sanity-check — the equation is the structure.","prompt":"How many [units] are sold in the US each year?","std":false,"risks":"close","startWhy":"Approach — state the equation first","order":11},{"id":"public","name":"Public Sector / Nonprofit","short":"Public","fam":"ops","buckets":[{"name":"Objective & metrics","subs":["Outcomes vs outputs — what success means","Target population and baseline","Mandate and constraints"]},{"name":"Target population funnel","subs":["Eligible → aware → applied → enrolled → served","Drop-off at each stage and why","Equity across groups"]},{"name":"Delivery","subs":["Process, channels, caseworker capacity","Partners and vendors","Data and technology"]},{"name":"Resources & constraints","subs":["Budget (fixed) and funding mix","Staffing, procurement rules, legislation","Stakeholders and politics"]}],"trap":"Forcing a profit frame; forgetting a fixed budget means trade-offs; funder concentration and overhead cuts that kill fundraising (nonprofits).","hyp":"\"Public-sector case; the goal is [outcome], not profit. Hypothesis: the gap is a funnel leak between eligible and enrolled, so I'd start with awareness and application friction.\"","start":"Target population funnel","formula":"Cost per outcome = program cost ÷ outcomes achieved; funnel conversion at each stage","cut":"The goal isn't profit: define success, trace the population funnel, check delivery, fit inside fixed resources.","prompt":"A state program is missing its enrollment target. Why, and what should it do?","std":false,"risks":"close","startWhy":"Target population funnel","order":12},{"id":"sales","name":"Increasing Sales","short":"Sales","fam":"grow","buckets":[{"name":"More customers","subs":["Acquire new (marketing, channels)","Win share from competitors","Reduce churn"]},{"name":"More per customer","subs":["Frequency / visits","Basket / attach / cross-sell","Upsell to premium tiers"]},{"name":"Price & mix","subs":["Price increases, less discounting","Mix shift to higher-margin products","Bundling"]},{"name":"Sales engine","subs":["Coverage and territories","Capacity: reps × calls × conversion × deal size","Incentives and enablement"]}],"trap":"Adding reps before decomposing the funnel; growth that destroys margin via discounting.","hyp":"\"Increasing-sales case. Hypothesis: the fastest lift is more per customer — frequency and attach — because acquisition is expensive and the base is under-penetrated.\"","start":"More per customer","formula":"Revenue = customers × frequency × basket × price; reps × calls × conversion × deal size","cut":"Revenue = customers × frequency × basket × price; more heads, more per head, more per unit, and the engine that produces all three.","prompt":"Grow sales 20% next year without new products.","std":false,"risks":"close","startWhy":"More per customer","order":13},{"id":"turnaround","name":"Turnaround","short":"Turnaround","fam":"diag","buckets":[{"name":"Liquidity & runway","subs":["Cash burn and months of runway","Working capital release (receivables, inventory)","Covenants, debt maturities, refinancing"]},{"name":"Core diagnosis","subs":["Which units / products / customers make money","Root cause: demand collapse, cost base, pricing, operations","Keep / fix / exit map"]},{"name":"Restructuring levers","subs":["Cost base and footprint","Balance sheet (asset sales, debt restructuring)","Pricing and mix quick wins"]},{"name":"Stakeholders & plan","subs":["Lenders, owners, employees, key customers","90-day plan and milestones","Management capability"]}],"trap":"Starting with the P&L when the problem is cash; cutting the parts that still make money because they are big.","hyp":"\"Turnaround case. Runway is ~N months, so my hypothesis is we need cash actions in 90 days — working capital and exiting [loss-making unit] — before any growth story.\"","start":"Liquidity & runway","formula":"Runway (months) = Cash ÷ monthly burn; exit a unit only if it is loss-making after allocating shared costs","cut":"Cash first, then diagnosis, then levers, then the people who must back the plan — sequenced by speed to cash.","prompt":"The company will run out of cash in nine months. What do we do?","std":false,"risks":"close","startWhy":"Liquidity & runway","order":14},{"id":"pe","name":"PE Due Diligence / LBO","short":"PE","fam":"eval","buckets":[{"name":"Market attractiveness","subs":["Growth, cyclicality, fragmentation (roll-up potential)","Comparable deals and multiples","Regulatory / reimbursement exposure"]},{"name":"Company standalone","subs":["Revenue quality: recurring, concentration","Margin and cash conversion","Management team"]},{"name":"Value-creation plan","subs":["EBITDA growth: organic levers, pricing, cost","Add-on acquisitions","Operational improvements the fund can actually deliver"]},{"name":"Deal & exit","subs":["Entry multiple and leverage","Exit routes (strategic sale, IPO, secondary) and multiple","IRR / MoM vs hurdle"]}],"trap":"Treating it like strategic M&A (synergies) when the question is IRR; banking on multiple expansion; forgetting the fund's hold period changes which levers count.","hyp":"\"Since the buyer is a PE fund, I'll weight exit and returns more than synergies. Hypothesis: returns hinge on EBITDA growth via [add-ons/pricing]; the multiple should be held flat.\"","start":"Deal & exit","formula":"EV = EBITDA × multiple; MoM = exit equity ÷ entry equity; IRR ≈ MoM^(1/t) − 1; 2.5× in 5 yrs ≈ 20%","cut":"Returns, not synergies: market sets the exit multiple, the company sets what leverage it carries, the plan drives EBITDA, the deal sets entry and exit.","prompt":"A PE fund is considering buying [target]. Should it, and at what price?","std":false,"risks":"close","startWhy":"Deal & exit math alongside Value-creation plan","order":15},{"id":"industry","name":"Industry Analysis","short":"Industry","fam":"eval","buckets":[{"name":"Size, growth & demand","subs":["Market size and growth by segment","Demand drivers and cyclicality","Customer needs and purchase criteria"]},{"name":"Structure & competition","subs":["Concentration; Five Forces (rivalry, entry, substitutes, buyer/supplier power)","Basis of competition (price, service, scale)","Barriers to entry"]},{"name":"Profit pools & value chain","subs":["Margin by step of the chain","Where value is shifting","Cost structure and scale economics"]},{"name":"Trends & disruptors","subs":["Technology, regulation, substitutes","Consolidation","Implications for the client's position"]}],"trap":"Industry attractiveness ≠ client fit; reciting Porter's without a so-what for the client.","hyp":"\"Industry-analysis case. Hypothesis: the industry is growing but profit pools sit in [step], so attractiveness depends on which position the client can take.\"","start":"Structure & competition","formula":"Use Porter's Five Forces only when the question is literally industry attractiveness","cut":"How big and growing · who keeps the profit · where in the chain · what changes next.","prompt":"Is the [X] industry attractive to be in?","std":false,"risks":"close","startWhy":"Structure & competition","order":16},{"id":"newbiz","name":"Starting a New Business","short":"New biz","fam":"grow","buckets":[{"name":"Market & customer","subs":["Who has the problem; how acute","Market size and willingness to pay","Alternatives they use today"]},{"name":"Business model & unit economics","subs":["Revenue model; price point","CAC, LTV, gross margin, payback","Path to contribution margin per unit"]},{"name":"Operations & team","subs":["Capabilities, hiring plan","Supply, technology, partners","Regulatory or licensing"]},{"name":"Investment case","subs":["Capital required; runway","Milestones that de-risk","Competitive response and exit"]}],"trap":"Scaling before unit economics work; sizing the TAM instead of the first customers.","hyp":"\"New-business case. Hypothesis: the model works if CAC payback is under N months at the planned price; I'd test unit economics before market size.\"","start":"Business model & unit economics","formula":"LTV ÷ CAC > 3; CAC payback = CAC ÷ (monthly margin per customer)","cut":"No pain no business · unit economics before scale · can this team execute · funding follows milestones.","prompt":"Should we start a [new business]?","std":false,"risks":"close","startWhy":"Business model & unit economics","order":17},{"id":"unconv","name":"Unconventional","short":"Unconv.","fam":"ops","buckets":[{"name":"Objective & measure","subs":["What does the decision-maker actually want?","Convert it to a measurable unit","Time horizon"]},{"name":"Stakeholders","subs":["Who gains, who pays, who can block","Their criteria"]},{"name":"Options & levers","subs":["Generate 3–4 options","Costs and benefits of each in the chosen unit","Second-order effects"]},{"name":"Constraints & feasibility","subs":["Budget, legal, timing","Risks and reversibility","Precedents"]}],"trap":"Force-fitting a profitability tree; failing to define the unit of success; forgetting stakeholders who can veto.","hyp":"\"This doesn't fit a standard type, so I'll define success as [unit] and structure around objective, stakeholders, options and constraints.\"","start":"Objective & measure","formula":"Simple structure wins: internal vs external, or costs vs benefits in one unit","cut":"With no standard frame, the objective is the frame: define the unit of success, then stakeholders, options, constraints.","prompt":"Should the city bid for the Olympics?","std":false,"risks":"close","startWhy":"Objective & measure","order":18}],"cases":[{"id":"profit-1","type":"profit","diff":1,"title":"Cold Press","client":"Meadowbrook Juice","industry":"Consumer / beverage","prompt":"Meadowbrook Juice sells cold-pressed juice through its own 12 shops in Boston and Providence. Revenue has grown 10% a year for three years, but operating profit fell from $2.1M to $1.4M last year. The CEO wants to know why and what to do.","questions":[{"q":"How is profit measured here and over what period did it fall?","a":"Operating profit, full year, fell last year only; prior two years were flat to slightly up."},{"q":"Did revenue growth come from new shops or same-shop growth?","a":"Four of the 12 shops opened in the last 18 months; same-shop sales are flat."},{"q":"Which cost lines moved most?","a":"Labor and rent rose faster than revenue; produce costs were roughly flat as a % of sales."},{"q":"Any change in product mix or price?","a":"Launched a $12 'wellness shot' line that now is 15% of revenue; no price increases in two years."}],"buckets":[{"name":"Revenue per shop","subs":["Traffic (visits/day) × conversion × ticket","Mix shift to wellness shots (lower ticket?)","Mature shops vs. new-shop ramp"]},{"name":"Cost per shop","subs":["COGS: produce price × yield/waste","Labor: hours × wage; staffing new shops","Occupancy: new-shop rent vs. mature"]},{"name":"Footprint & growth cost","subs":["Pre-opening and ramp losses on 4 new shops","Cannibalization between nearby shops","Overhead added to support 12 shops"]},{"name":"External","subs":["Produce inflation, minimum wage changes","Competitor openings near shops"]}],"generic":"Profitability","tailored":"Split revenue and cost per shop (not total) because the unit count changed; added a Footprint bucket since 4 of 12 shops are still ramping.","hyp":"Profit fell because new-shop ramp losses and rising labor/rent, not the core business — mature shops are likely still healthy.","trap":"Chasing total-company averages. With a third of shops under 18 months old, averages hide healthy mature units and bleeding new ones.","start":"Footprint & growth cost","startWhy":"Revenue grew but profit fell in the exact window new shops opened; isolating ramp losses tells you if there is a core problem at all."},{"id":"profit-2","type":"profit","diff":2,"title":"Night Shift","client":"Riverbend Regional Hospital","industry":"Healthcare / provider","prompt":"Riverbend is a 280-bed community hospital in Ohio. Patient volumes are up 4% but the operating margin has gone from +2% to −3% over two years. The board has asked what is driving the loss and how to get back to breakeven.","questions":[{"q":"What is the payer mix and has it shifted?","a":"Medicaid share rose from 22% to 30%; commercial fell correspondingly."},{"q":"Is the volume growth in inpatient, outpatient, or ED?","a":"Mostly ED and observation stays; elective surgeries are down 8%."},{"q":"What has happened to clinical labor costs?","a":"Nursing agency (travel nurse) spend tripled; vacancy rate is 18%."},{"q":"Any changes in reimbursement rates or denials?","a":"Commercial rates flat; denial rate up from 6% to 11%."}],"buckets":[{"name":"Volume & case mix","subs":["Inpatient vs. outpatient vs. ED growth","Elective surgery decline (highest margin)","Length of stay and observation vs. admit"]},{"name":"Revenue per case","subs":["Payer mix shift (Medicaid vs. commercial)","Contracted rates and annual escalators","Denials, coding accuracy, collections"]},{"name":"Cost to serve","subs":["Clinical labor: agency vs. staff mix, vacancy","Supplies and drugs per case","Fixed costs: facilities, admin"]},{"name":"Service-line portfolio","subs":["Margin by service line","Lines to grow, fix, or exit","Referral leakage to competitors"]}],"generic":"Profitability","tailored":"Price became 'revenue per case' driven by payer mix and denials (hospitals do not set price); cost split into clinical labor vs. supplies vs. fixed; added service-line view.","hyp":"Margin collapse is driven by payer-mix shift plus agency labor; volume growth is in the lowest-margin settings so it does not help.","trap":"Treating volume growth as good news. Growth in ED/observation at Medicaid rates with agency nurses can lose money on every incremental patient.","start":"Revenue per case","startWhy":"A 8-point payer-mix shift and near-doubling of denials can explain most of a 5-point margin swing; size that before touching cost."},{"id":"profit-3","type":"profit","diff":2,"title":"Empty Seats","client":"Lakeline Charter Bus","industry":"Transportation / charter","prompt":"Lakeline runs 60 motor coaches for school trips, corporate shuttles, and tour operators across the Midwest. Fleet utilization is at an all-time high, yet EBITDA margin dropped from 14% to 7%. The owner is confused and wants answers.","questions":[{"q":"How is utilization defined?","a":"Share of bus-days with at least one booking. Revenue per bus-day has fallen 12%."},{"q":"Which segment grew?","a":"Corporate shuttle contracts doubled; they are long-term, fixed-price, and lower rate per mile."},{"q":"What happened to costs?","a":"Diesel up 20%, driver wages up 15% (shortage), maintenance up as fleet aged."},{"q":"Any pricing changes?","a":"Shuttle contracts were bid aggressively to win; no fuel surcharge clauses."}],"buckets":[{"name":"Revenue per bus-day","subs":["Rate per mile by segment (school / corporate / tour)","Mix shift toward low-rate shuttles","Deadhead miles and empty return legs"]},{"name":"Cost per bus-day","subs":["Fuel: price × miles × mpg (surcharge pass-through?)","Driver: wage × hours, overtime, shortage premium","Maintenance by fleet age"]},{"name":"Fleet deployment","subs":["Which buses on which contracts","Fleet age and replacement cycle","Peak vs. off-peak scheduling"]},{"name":"Contract terms & external","subs":["Fixed-price contracts with no escalators","Fuel and labor market","Competitor pricing"]}],"generic":"Profitability","tailored":"Revenue and cost expressed per bus-day (the asset unit); added a Fleet deployment bucket and made contract terms explicit because fixed-price shuttles block cost pass-through.","hyp":"Lakeline is busy but underpriced: shuttle contracts were won at rates that no longer cover fuel and driver cost increases.","trap":"Reading 'high utilization' as healthy. Full at a bad yield means every busy day loses more; this is a yield/pricing problem, not a demand problem.","start":"Revenue per bus-day","startWhy":"A 12% drop in revenue per bus-day with record utilization points to rate and mix, which also determines whether cost pass-through is possible."},{"id":"profit-4","type":"profit","diff":3,"title":"Renewal Rate","client":"Orchard Software","industry":"Technology / B2B SaaS","prompt":"Orchard sells workforce-scheduling software to mid-size retailers on annual subscriptions. ARR is $40M, growing 25%, but the company burned $18M last year and the board wants a path to breakeven within 24 months without killing growth.","questions":[{"q":"What is gross margin and what is in COGS?","a":"72% gross margin; COGS includes hosting, onboarding, and customer support."},{"q":"How do new ARR and churn break down?","a":"$14M new ARR, $4M churned, net new $10M. Gross revenue retention 90%, net retention 105%."},{"q":"What is CAC and payback?","a":"Sales and marketing spend $20M; CAC payback about 26 months."},{"q":"Where does the rest of opex go?","a":"R&D $12M, G&A $7M. Headcount grew 40% last year."}],"buckets":[{"name":"Unit economics","subs":["ARPA and gross margin per customer","CAC by channel; payback period","LTV/CAC given churn"]},{"name":"Acquisition efficiency","subs":["Pipeline conversion by stage","Sales productivity (quota attainment, ramp)","Channel mix: direct vs. partner"]},{"name":"Retention & expansion","subs":["Logo churn by segment and cohort","Upsell/cross-sell (seats, modules)","Onboarding and support cost per customer"]},{"name":"Cost base vs. benchmark","subs":["R&D, G&A as % of ARR vs. peers","Hosting cost per customer","Headcount plan vs. growth"]}],"generic":"Profitability","tailored":"Replaced 'revenue' with ARR mechanics (new, churn, expansion) and 'cost' with CAC, COGS/hosting, and opex ratios; added a benchmark lens because the question is 'path to breakeven'.","hyp":"Breakeven is reachable by fixing CAC payback (26 months is too long) and churn, not by cutting R&D — the growth engine is inefficient rather than the cost base bloated.","trap":"Confusing bookings, revenue, and cash. Burn is a cash concept; annual-upfront billing can hide or flatter the picture, so build from cohorts and cash timing.","start":"Unit economics","startWhy":"If LTV/CAC is broken, more growth makes burn worse; confirming unit economics decides whether the answer is 'grow smarter' or 'cut'."},{"id":"profit-5","type":"profit","diff":3,"title":"Fine Print","client":"Granite State Mutual","industry":"Financial services / P&C insurance","prompt":"Granite State Mutual writes homeowners and auto insurance in New England. Premiums written grew 18% over two years, but the company posted its first underwriting loss in a decade. The CEO wants to know what went wrong and whether to keep growing.","questions":[{"q":"What is the combined ratio and how did it move?","a":"From 94% to 104%: loss ratio up 8 points, expense ratio up 2."},{"q":"Where did the premium growth come from?","a":"A new online channel targeting younger drivers in Massachusetts; auto is now 60% of book."},{"q":"Is the loss ratio deterioration frequency or severity?","a":"Both: claim frequency up on the new auto book, severity up from repair-cost inflation."},{"q":"What about investment income and reinsurance?","a":"Investment income steady; reinsurance costs up 25% at renewal after a bad cat year."}],"buckets":[{"name":"Underwriting result","subs":["Premium adequacy: rate vs. expected loss cost","Loss ratio = frequency × severity by line and cohort","New online cohort vs. legacy book"]},{"name":"Expense ratio","subs":["Acquisition cost of online channel","Claims handling and admin cost","Reinsurance cost and structure"]},{"name":"Mix & growth quality","subs":["Line mix (auto vs. home), geography","Risk selection and pricing on new channel","Retention of profitable policies"]},{"name":"Investment & capital","subs":["Investment yield on float","Capital needed to support growth","Rating agency constraints"]}],"generic":"Profitability","tailored":"Revenue/cost reframed as the combined ratio (loss ratio + expense ratio); added growth-quality and capital buckets because insurance growth can be adverse selection.","hyp":"The new online auto book is underpriced for its risk; growth bought bad risk and the loss emerged on schedule.","trap":"Celebrating premium growth. In insurance, mispriced growth looks great for 18-24 months until claims develop; the fix may be to shrink.","start":"Underwriting result","startWhy":"An 8-point loss-ratio jump concentrated in one cohort is the whole story; compare the new cohort's loss ratio to the legacy book first."},{"id":"growth-1","type":"growth","diff":1,"title":"Second Scoop","client":"Harbor Lane Creamery","industry":"Consumer / food","prompt":"Harbor Lane makes premium ice cream sold in 400 grocery stores across New Jersey and eastern Pennsylvania. Revenue is $25M and growing 3% a year. The founder wants to double revenue in five years and asks how.","questions":[{"q":"Where does revenue come from today?","a":"90% grocery pints; 10% a single scoop shop. Six flavors; average shelf share is low."},{"q":"What are the margins and capacity?","a":"Gross margin 40%; the plant runs at 65% capacity."},{"q":"Who are the competitors and how is Harbor Lane positioned?","a":"National premium brands dominate; Harbor Lane wins on local sourcing and is priced 10% below them."},{"q":"Any constraints?","a":"Founder wants to keep control; can fund $5M of investment."}],"buckets":[{"name":"Core: sell more where we are","subs":["Penetration: more stores in the current region","Velocity per store: shelf share, promo, flavors","Price: close the 10% gap to national premium"]},{"name":"Adjacent: new products/channels","subs":["Formats: bars, mini cups, novelties","Channels: foodservice, direct-to-consumer, scoop shops","Segments: dairy-free, kids"]},{"name":"New geographies","subs":["Expand to NY metro, DC/Baltimore","Distribution model: DSD vs. distributor"]},{"name":"Screen: can we deliver?","subs":["Plant capacity (65% used) and cold chain","Capital ($5M) and brand strength","Margin impact and cannibalization"]}],"generic":"Revenue growth (core / adjacent / new)","tailored":"Core split into penetration × velocity × price (grocery math); adjacencies named for ice cream (formats, foodservice); screen bucket includes the founder's control and $5M constraints.","hyp":"Doubling is achievable mostly through the core — velocity per store and price — plus one adjacent geography; no acquisition needed.","trap":"Jumping to new geographies. Low shelf share in existing stores means the cheapest growth is velocity in stores you already have.","start":"Core: sell more where we are","startWhy":"Spare plant capacity plus low shelf share means core growth is highest-margin and fastest; size it before anything riskier."},{"id":"growth-2","type":"growth","diff":2,"title":"Shelf Life","client":"Northfield Industrial Supply","industry":"B2B distribution","prompt":"Northfield distributes fasteners, tools, and safety gear to 3,000 manufacturers and contractors in the Great Lakes region. Revenue is $300M, flat for three years. The new CEO wants a plan to reach $450M in four years.","questions":[{"q":"How concentrated is the customer base?","a":"Top 100 customers are 55% of revenue; average share of wallet is 30%."},{"q":"How does Northfield compete?","a":"Mid-priced; competitors include a national giant and many small locals. Service and delivery speed are the stated edge."},{"q":"What is in the product mix?","a":"20,000 SKUs; private label is 8% of sales at 2x the margin."},{"q":"Any acquisitions available?","a":"Several small local distributors are for sale; the CEO is open to deals."}],"buckets":[{"name":"Existing customers: wallet share","subs":["Share of wallet by segment (30% → ?)","Cross-sell categories (safety, MRO)","Pricing and contract coverage"]},{"name":"New customers","subs":["Underpenetrated segments and territories","Sales coverage model and inside sales","Digital/e-commerce ordering"]},{"name":"Products & services","subs":["Private label expansion (8% at 2x margin)","Value-added: vending, inventory management","SKU rationalization to fund it"]},{"name":"Inorganic","subs":["Tuck-in local distributors","Fit, price, integration capacity"]}],"generic":"Revenue growth (core / adjacent / new)","tailored":"Core split by distributor levers (wallet share vs. new logos vs. product/service); inorganic made its own bucket because tuck-ins are live options.","hyp":"$150M is reachable mostly from wallet share in existing accounts plus one or two tuck-ins; the base is under-served, not saturated.","trap":"Ignoring working capital. Distributor growth ties up cash in inventory and receivables; a growth plan without a cash plan stalls.","start":"Existing customers: wallet share","startWhy":"30% wallet share in 3,000 accounts is a $700M pool already in the door; moving it 10 points covers half the target."},{"id":"growth-3","type":"growth","diff":2,"title":"Waiting List","client":"Bright Path Pediatric Dentistry","industry":"Healthcare / dental practice","prompt":"Bright Path operates five pediatric dental offices in suburban Atlanta. Each office is profitable and has a waiting list. The two founding dentists want to triple revenue in five years and are debating how.","questions":[{"q":"What drives revenue per office?","a":"Chairs × hours × patients per chair-hour × revenue per visit. Offices run 5 days; chairs are full."},{"q":"What is the payer mix?","a":"60% commercial, 30% Medicaid, 10% self-pay. Medicaid visits are 40% lower revenue."},{"q":"What are the bottlenecks?","a":"Dentist hiring is slow; hygienists are easier. Real estate is available."},{"q":"Any interest in adjacent services?","a":"Orthodontics referred out today; parents keep asking."}],"buckets":[{"name":"Capacity in existing offices","subs":["Hours: evenings, Saturdays","Throughput: hygienist-led visits, scheduling","Chairs per office"]},{"name":"Revenue per visit","subs":["Payer mix and fee schedules","Add orthodontics and sedation in-house","Recall and treatment-plan acceptance"]},{"name":"New offices","subs":["Site selection in metro Atlanta","De novo vs. acquiring practices","Dentist recruiting pipeline"]},{"name":"Screen","subs":["Dentist supply is the binding constraint","Capital and founder bandwidth","Quality and brand consistency"]}],"generic":"Revenue growth (core / adjacent / new)","tailored":"Core decomposed into clinic math (chairs × hours × throughput × revenue per visit); orthodontics as the named adjacency; dentist hiring made the explicit constraint.","hyp":"Tripling requires new offices, but the fastest first dollars come from hours and ortho in current offices while the hiring pipeline builds.","trap":"Opening offices before solving dentist supply. A waiting list proves demand; it does not prove you can staff three times the chairs.","start":"Capacity in existing offices","startWhy":"Waiting lists mean demand exceeds supply today; adding hours and ortho is capital-light and tests whether more capacity converts."},{"id":"growth-4","type":"sales","diff":3,"title":"Lapsed","client":"Summit Ridge Fitness","industry":"Consumer services / gyms","prompt":"Summit Ridge runs 40 mid-priced gyms in Colorado and Utah. New member sign-ups are strong, but revenue has stalled because annual churn is 45%. The CEO wants revenue growth of 15% a year and believes retention is the key.","questions":[{"q":"Who churns and when?","a":"Half of churn happens in the first 90 days; 18-30 year-olds churn most."},{"q":"Why do they leave?","a":"Exit surveys: 'didn't use it enough', then price; location rarely cited."},{"q":"What is the economics of a member?","a":"$45/month, $150 acquisition cost, contribution margin ~70%."},{"q":"What retention efforts exist?","a":"A welcome email and a 12-month contract option nobody picks."}],"buckets":[{"name":"Who churns","subs":["By tenure (first 90 days vs. later)","By segment, plan type, and location","Usage pattern before churn"]},{"name":"Why they churn","subs":["Engagement: visits per week, class attendance","Price/value perception vs. alternatives","Service and experience issues"]},{"name":"Value at stake","subs":["LTV lift from each churn point reduced","Retain vs. acquire cost ($150 CAC)","Which members are worth saving"]},{"name":"Levers","subs":["Onboarding program for first 90 days","Pricing/contract structure, freeze options","Community, classes, app engagement"]}],"generic":"Revenue growth (retention variant)","tailored":"Used the churn variant: who / why / value / levers rather than core-adjacent-new; built the 'who' bucket around tenure since half of churn is in 90 days.","hyp":"Churn is an early-engagement problem; a structured first-90-day onboarding would cut churn enough to deliver most of the 15% growth.","trap":"Trying to retain everyone. Some members are unprofitable to save; target the retention spend where LTV justifies it.","start":"Who churns","startWhy":"The 90-day concentration tells you where the leak is; a cohort view sets the size of the prize before designing levers."},{"id":"growth-5","type":"growth","diff":3,"title":"Direct Line","client":"Pemberton Outdoor","industry":"Consumer / apparel & gear","prompt":"Pemberton makes technical outdoor apparel sold mainly through sporting-goods retailers. Revenue is $180M. Wholesale growth has slowed to 2%, and management is considering going direct-to-consumer to accelerate growth. They want to know if and how.","questions":[{"q":"What is the channel mix today?","a":"80% wholesale, 15% own website, 5% two outlet stores. DTC gross margin is 65% vs. 45% wholesale."},{"q":"How do customers buy outdoor apparel?","a":"Younger buyers increasingly online and from brand sites; try-on still matters for shells and boots."},{"q":"How would retailers react?","a":"The two largest retailers are 40% of wholesale and have cut brands that went direct aggressively."},{"q":"What capabilities exist?","a":"Basic e-commerce; no stores team, no CRM, limited marketing analytics."}],"buckets":[{"name":"Customer & demand","subs":["Who buys where, by segment and category","Brand pull: can Pemberton draw traffic on its own?","Category fit for online vs. try-on"]},{"name":"Channel economics","subs":["DTC margin captured minus fulfillment, returns, marketing","Incremental vs. cannibalized wholesale sales","Investment in stores, CRM, logistics"]},{"name":"Channel conflict","subs":["Retailer reaction and 40% concentration risk","Pricing and assortment segmentation","Phased approach (exclusives, outlets)"]},{"name":"Capabilities & execution","subs":["E-commerce, marketing, data talent","Build vs. partner (3PL, marketplaces)","Sequencing and milestones"]}],"generic":"Revenue growth (channel strategy variant)","tailored":"Channel version of growth: demand, channel economics, conflict, and capabilities, with retailer concentration (40%) as the headline risk.","hyp":"A phased DTC build (exclusive products online, no price undercutting) can add growth without losing the top retailers; an aggressive shift would lose more wholesale than DTC gains.","trap":"Treating the 20-point margin gap as free money. DTC inherits fulfillment, returns, and marketing costs the retailer used to carry.","start":"Channel conflict","startWhy":"Two retailers are 40% of wholesale and have punished brands before; whether they tolerate DTC determines the size and pace of everything else."},{"id":"entry-1","type":"entry","diff":1,"title":"Next Exit","client":"Prairie Crust Pizza","industry":"Consumer / restaurants","prompt":"Prairie Crust is a fast-casual pizza chain with 35 locations in Kansas and Missouri, all profitable. The owners are considering expanding into Texas, starting with Dallas–Fort Worth, and want to know whether to do it.","questions":[{"q":"What is the objective?","a":"Grow enterprise value ahead of a sale in five years; want 15+ new units."},{"q":"How does the current model work?","a":"$1.2M revenue per unit, 18% unit margin, $600K build cost; strong suburban family traffic."},{"q":"What is the DFW market like?","a":"Large, growing, but crowded with fast-casual pizza and strong regional chains."},{"q":"What capabilities travel?","a":"Operations playbook is strong; no supply chain or brand awareness in Texas."}],"buckets":[{"name":"Market attractiveness","subs":["Size and growth of fast-casual pizza in DFW","Suburban family demographics by submarket","Real estate costs and availability"]},{"name":"Competitive landscape","subs":["Incumbents and their share, pricing","Differentiation: can Prairie Crust win trial?","Likely competitor response"]},{"name":"Client fit & capabilities","subs":["Operations playbook transferability","Supply chain: commissary distance, distributors","Brand awareness from zero; marketing cost"]},{"name":"Entry economics & mode","subs":["Unit economics in DFW vs. home market","Organic rollout vs. acquire a local chain vs. franchise","Investment, breakeven, payback, exit value"]}],"generic":"Market entry","tailored":"Market and competition framed around DFW suburbs; capability bucket names supply chain and zero brand awareness; entry mode includes franchise and acquisition since the exit horizon is five years.","hyp":"DFW is attractive but crowded; entry makes sense only if unit economics hold at Texas rents with a local supply chain, likely via a cluster of 5+ units to make marketing pay.","trap":"Big market ≠ attainable share. A large crowded market can offer less realistic share than a smaller underserved one next door.","start":"Entry economics & mode","startWhy":"If DFW unit economics are below the 18% home margin after rent and marketing, the market's attractiveness does not matter."},{"id":"entry-2","type":"entry","diff":2,"title":"Border Crossing","client":"Castellón Ceramics","industry":"Industrial / building materials","prompt":"Castellón is a Spanish porcelain tile manufacturer with €400M revenue, mostly in Europe. U.S. sales are 5% via importers. The board is weighing a direct entry into the U.S. with its own distribution and possibly a plant. Should they?","questions":[{"q":"What is the U.S. tile market and who wins?","a":"Large and growing; dominated by big-box retailers and a few large domestic and Italian producers; distributors are key."},{"q":"What are the economics of importing today?","a":"Shipping and tariffs add ~25%; importers take 20% margin; Castellón's net margin on U.S. sales is thin."},{"q":"What does a plant cost?","a":"€150M for a Tennessee plant; 3-year build; raw materials available locally."},{"q":"What are Castellón's strengths?","a":"Design, large-format tile, speed to new collections; weak brand in the U.S."}],"buckets":[{"name":"Market","subs":["Size, growth, segments (residential/commercial)","Channel structure: distributors, big box, showrooms","Regional demand pockets"]},{"name":"Competition","subs":["Domestic vs. Italian vs. other importers","Price positioning and design cycle","Tariff and trade exposure"]},{"name":"Fit & capabilities","subs":["Design/large-format edge vs. U.S. needs","Distribution and sales force gap","Brand building required"]},{"name":"Entry mode & economics","subs":["Own distribution vs. acquire distributor vs. plant","Landed cost per m² by mode","Capex, breakeven, risk by mode"]}],"generic":"Market entry","tailored":"Entry mode is the heart: import with own distribution vs. buy a distributor vs. build a plant, each with its own landed cost per m²; tariffs added under competition.","hyp":"Direct distribution (or acquiring a distributor) captures most of the importer margin at low risk; a plant only pays if U.S. volume triples and tariffs persist.","trap":"Jumping to the plant because it is the biggest decision. Sequence: prove demand with distribution first, then decide on manufacturing.","start":"Entry mode & economics","startWhy":"The three modes have wildly different capex and risk; landed cost per m² by mode frames which questions about the market even matter."},{"id":"entry-3","type":"entry","diff":2,"title":"Sunbelt","client":"Keystone Home Health","industry":"Healthcare / home health","prompt":"Keystone provides Medicare-certified home health and hospice services in Pennsylvania and New Jersey. A PE owner wants to enter Florida, a large but competitive market. They ask whether and how to enter.","questions":[{"q":"What is the regulatory situation?","a":"Florida has no certificate-of-need for home health but licensing takes 12-18 months; Medicare rates are similar."},{"q":"How does Keystone win at home?","a":"Hospital referral relationships, clinical quality scores, nurse retention above peers."},{"q":"What does the Florida market look like?","a":"Fragmented: hundreds of small agencies plus three national chains; many small agencies are for sale."},{"q":"What is the labor market?","a":"Nurse shortages are acute in Florida; wages 10% higher than PA."}],"buckets":[{"name":"Market attractiveness","subs":["Senior population growth by county","Reimbursement and regulatory timing","Referral sources: hospitals, physician groups"]},{"name":"Competition","subs":["National chains vs. fragmented locals","Quality scores and referral share","Consolidation trend and pricing of targets"]},{"name":"Keystone fit","subs":["Transferable: clinical model, quality program","Not transferable: referral relationships","Nurse recruiting at Florida wages"]},{"name":"Entry mode & economics","subs":["Acquire a platform agency vs. de novo license","Roll-up of small agencies after platform","Investment, margin, time to scale"]}],"generic":"Market entry","tailored":"Regulatory timing (licensing) and referral relationships are the market-specific items; entry mode compares platform acquisition vs. de novo given a PE owner's timeline.","hyp":"Enter by acquiring a mid-size platform agency with existing referrals, then roll up locals; de novo is too slow for a PE hold period.","trap":"Assuming clinical quality travels. Referral relationships are local and are the real moat in home health.","start":"Keystone fit","startWhy":"Whether referrals and nurses can be secured decides mode; if they must be bought, the entry is really an M&A case."},{"id":"entry-4","type":"entry","diff":3,"title":"New Markets","client":"Vireo Payments","industry":"Technology / fintech","prompt":"Vireo provides payment processing to 50,000 small restaurants in the U.S. Growth is slowing as the market saturates. Leadership is choosing between entering Canada, entering the U.K., or expanding into U.S. retail (non-restaurant) merchants. Which should they pick?","questions":[{"q":"What is the goal and horizon?","a":"Add $100M in net revenue within four years; IPO in five."},{"q":"How does Vireo win?","a":"Restaurant-specific features (tips, table management integration), fast onboarding; pricing is at market."},{"q":"What do the three options look like?","a":"Canada: similar market, 10% the size of U.S. U.K.: larger, different regulation and acquirer landscape. U.S. retail: large, but generic competitors dominate."},{"q":"What capabilities exist?","a":"U.S. bank and card-network relationships; no international licenses; product team is restaurant-focused."}],"buckets":[{"name":"Market attractiveness (each option)","subs":["Size, growth, and merchant count","Take rate and revenue per merchant","Regulatory and licensing effort"]},{"name":"Competitive position","subs":["Incumbents and their restaurant depth","Does Vireo's restaurant edge transfer?","Pricing pressure"]},{"name":"Vireo fit","subs":["Product transferability (tips, integrations)","Licensing, banking, local sales needed","Management bandwidth with IPO ahead"]},{"name":"Economics & risk","subs":["Revenue reachable in 4 years per option","Investment and breakeven","Execution and regulatory risk; sequencing"]}],"generic":"Market entry","tailored":"Same four buckets, applied as a scoring grid across three options; fit emphasizes whether the restaurant-specific edge transfers, which is the real differentiator.","hyp":"Canada first: the restaurant edge transfers intact with modest regulatory lift; U.K. is a later wave; U.S. retail abandons the moat.","trap":"Picking the biggest market. U.S. retail is largest but strips the one thing Vireo wins on; attainable revenue is what matters.","start":"Vireo fit","startWhy":"The restaurant-specific edge is the whole thesis; testing transferability across the three options filters the list fastest."},{"id":"entry-5","type":"entry","diff":3,"title":"Capital City","client":"Ridgeway Transit Partners","industry":"Public sector / transit contracting","prompt":"Ridgeway operates outsourced bus services for 20 mid-size U.S. cities. A large state capital is tendering its entire bus network for the first time (a $200M-a-year contract). Ridgeway asks whether to bid, and how to position.","questions":[{"q":"What does the contract involve?","a":"Operate 400 buses, employ 1,200 unionized drivers, 7-year term, performance penalties for on-time service."},{"q":"Who else is bidding?","a":"Two global operators with larger contracts and lower cost of capital."},{"q":"What are Ridgeway's strengths?","a":"Best on-time performance and safety record in its segment; never run a network this large."},{"q":"How is the bid scored?","a":"60% price, 40% quality/technical."}],"buckets":[{"name":"Market/contract attractiveness","subs":["Revenue, margin potential, 7-year certainty","Risk transfer: penalties, fuel, labor cost escalators","Political and renewal dynamics"]},{"name":"Competitive position","subs":["Global operators: scale and cost of capital","Ridgeway's quality record vs. 60% price weight","Likely competitor pricing"]},{"name":"Ridgeway fit","subs":["Scaling from ~100 to 400 buses: management depth","Union transition and labor relations","Balance-sheet capacity for bonds and fleet"]},{"name":"Bid economics & mode","subs":["Cost to bid and probability of winning","Price-to-win vs. margin; bid as JV or alone","Downside if won and underperformed"]}],"generic":"Market entry","tailored":"'Market' is a single contract, so the bucket covers contract terms and risk transfer; mode becomes bid-alone vs. JV; fit focuses on scale jump and union transition.","hyp":"Bid only as a JV with a partner that brings scale and capital; a solo bid either loses on price or wins a contract Ridgeway cannot deliver.","trap":"Bidding to win rather than to make money. A 7-year contract won on a thin price with on-time penalties can sink the whole company.","start":"Bid economics & mode","startWhy":"With price at 60% of scoring, the price-to-win versus the margin Ridgeway needs settles whether any version of this bid is worth pursuing."},{"id":"launch-1","type":"launch","diff":1,"title":"Spoonful","client":"Little Sprout Foods","industry":"Consumer / baby food","prompt":"Little Sprout sells organic baby-food pouches in 2,000 grocery stores. The team wants to launch a toddler snack line (puffs and bars). Should they, and how?","questions":[{"q":"Why toddler snacks?","a":"Parents age out of pouches at 12-15 months; the brand loses them. Toddler snacks is a growing category."},{"q":"Who are the competitors?","a":"Two large brands own ~60% of toddler snacks; private label is growing."},{"q":"What capabilities exist?","a":"Strong brand with parents; co-manufacturing for pouches; no dry-snack manufacturing."},{"q":"What is the financial target?","a":"Launch must reach $10M revenue and positive contribution in 3 years."}],"buckets":[{"name":"Customer & market","subs":["Category size, growth, and purchase drivers","Does the pouch parent follow the brand into snacks?","Price points and retail placement"]},{"name":"Product & competition","subs":["Differentiation vs. two leaders and private label","Product range: puffs first vs. full line","Retailer willingness to add SKUs"]},{"name":"Capabilities & go-to-market","subs":["Co-manufacturer sourcing for dry snacks","Sales and shelf-space negotiation","Marketing to existing customer base"]},{"name":"Financials","subs":["Volume ramp, margin, co-man costs","Launch investment, slotting fees, breakeven","Cannibalization of pouches (minimal) and halo"]}],"generic":"New product launch","tailored":"Customer bucket centers on the brand's own aging-out parents; capability bucket names co-manufacturing for a new format; financials include slotting fees, specific to grocery launches.","hyp":"Launch a narrow line (puffs) marketed to existing pouch customers; the brand can earn a slot if the product is differentiated on ingredients.","trap":"Counting all revenue as incremental. Here cannibalization is low, but slotting fees and trade spend can erase the first two years of margin.","start":"Customer & market","startWhy":"The launch thesis is brand follow-through from pouch to snack; if parents do not follow, nothing else matters."},{"id":"launch-2","type":"launch","diff":2,"title":"Premium Tier","client":"Clearwater Bank","industry":"Financial services / retail banking","prompt":"Clearwater is a regional bank with 150 branches and 800,000 retail customers. Management wants to launch a premium checking and advisory bundle for mass-affluent customers ($250K–$1M in assets). Evaluate the idea.","questions":[{"q":"How many customers qualify and what do they do today?","a":"About 80,000 mass-affluent households; most hold deposits at Clearwater but invest elsewhere."},{"q":"What would the bundle include?","a":"Fee-waived accounts, dedicated banker, financial planning, discounted mortgage rates; $25/month or waived at $100K balances."},{"q":"Who competes?","a":"National banks' premium tiers and independent advisors; robo-advisors for the younger segment."},{"q":"What capabilities are needed?","a":"Need to hire or train 100 advisors; wealth platform exists but is underused."}],"buckets":[{"name":"Customer & market","subs":["Mass-affluent segment size and needs","Current wallet: deposits here, investments elsewhere","Willingness to consolidate; switching triggers"]},{"name":"Product & competition","subs":["Bundle design vs. national banks' premium tiers","Differentiation: local relationship, pricing","Advisor vs. robo positioning"]},{"name":"Capabilities & GTM","subs":["Advisor hiring and training (100 FTE)","Branch staff referral model and incentives","Platform and compliance readiness"]},{"name":"Financials","subs":["Revenue: fees, AUM, mortgage, deposit margin","Cost: advisors, fee waivers, marketing","Cannibalization of existing fee income; NPV"]}],"generic":"New product launch","tailored":"Revenue model expanded to the bank's many lines (fees, AUM, lending, deposits); cannibalization explicit because fee waivers hit existing income.","hyp":"The bundle wins if it pulls investment assets in-house; fee income alone will not pay for 100 advisors.","trap":"Measuring success by sign-ups. The bundle is a cost unless AUM and lending follow; set the metric as assets consolidated.","start":"Financials","startWhy":"The economics depend on AUM capture; sizing that against the advisor cost tells you if the product design is even in the right range."},{"id":"launch-3","type":"launch","diff":2,"title":"Loaner","client":"Atlas Construction Equipment","industry":"Industrial / equipment","prompt":"Atlas manufactures mid-size excavators and loaders sold through dealers. Leadership wants to launch a subscription offering: customers pay monthly for equipment with maintenance and telematics included. Should they?","questions":[{"q":"Why now?","a":"Contractors face high interest rates and want flexibility; rental companies are taking share."},{"q":"What would the economics be?","a":"Machine costs Atlas $150K; subscription at $4,500/month, 36-month term; Atlas keeps residual value."},{"q":"How would dealers react?","a":"Dealers earn margin on sales and parts; subscription could bypass them."},{"q":"What capabilities are needed?","a":"Fleet financing, maintenance network, telematics (partially built), remarketing of used machines."}],"buckets":[{"name":"Customer & demand","subs":["Which contractors want subscriptions and why","Price sensitivity vs. rental and purchase","Utilization and contract length preferences"]},{"name":"Offering & competition","subs":["Design: term, maintenance, telematics, swaps","Rental companies and captive finance arms","Differentiation on uptime and data"]},{"name":"Capabilities & channel","subs":["Balance sheet / financing partner","Maintenance delivery through dealers (dealer role and margin)","Remarketing and residual-value management"]},{"name":"Financials & risk","subs":["Lifetime economics per machine incl. residual","Cannibalization of outright sales","Residual value and credit risk; breakeven"]}],"generic":"New product launch","tailored":"The 'product' is a business model, so capability bucket includes financing and remarketing; dealers appear as both channel and conflict; risk bucket adds residual and credit risk.","hyp":"Subscription can win share from rental companies if dealers deliver maintenance and earn a cut; it should be launched through dealers, not around them.","trap":"Modeling subscription like a sale. The profit lives in utilization, maintenance cost, and residual value over 36+ months, not in month one.","start":"Financials & risk","startWhy":"Residual value assumptions swing the lifetime economics more than anything else; if they do not work, demand is irrelevant."},{"id":"launch-4","type":"launch","diff":3,"title":"Generic Threat","client":"Halcyon Pharma","industry":"Healthcare / pharma","prompt":"Halcyon's leading drug for a chronic respiratory condition loses patent protection in three years. R&D has a once-weekly reformulation ready for Phase III. Halcyon asks whether to launch the reformulation and how to position it against coming generics.","questions":[{"q":"What is the current drug's economics?","a":"$1.2B annual sales, 85% gross margin; generics typically take 80% of volume within a year."},{"q":"What does the reformulation offer?","a":"Weekly instead of daily dosing; same efficacy; likely new patent to 2040."},{"q":"How do payers behave?","a":"Payers push generics hard; will cover a new formulation only with proven adherence benefits or price concessions."},{"q":"What does Phase III cost and when would it launch?","a":"$200M; launch 12 months before patent expiry if on schedule."}],"buckets":[{"name":"Customer & market","subs":["Patients/physicians: value of weekly dosing (adherence)","Payer coverage and formulary dynamics","Share of patients likely to switch before generics"]},{"name":"Product & competition","subs":["Clinical differentiation vs. daily generic","Generic entrants' timing and pricing","Other branded alternatives in class"]},{"name":"Capabilities & GTM","subs":["Phase III execution and timing risk","Sales force transition plan","Pricing/contracting with payers"]},{"name":"Financials","subs":["Revenue retained vs. generic erosion scenarios","$200M tria
