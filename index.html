ns have fallen 20% over five years as working professionals opt for online and part-time programs. The dean wants to launch an online, part-time MBA at $45,000 total tuition aimed at working adults in the mid-Atlantic. The board, which cares about the school's ranking and its endowment draw, has asked us whether to launch and what it does to the full-time program.","questions":[{"q":"How does the school make money — tuition net of scholarships, cost per student, fixed vs. variable?","a":"Net tuition after scholarships is about 60% of list; faculty and facilities are largely fixed, so marginal cost per student is low until a new section is needed."},{"q":"What is the goal — revenue, enrollment, mission reach, or ranking protection?","a":"The dean wants $15M of net new revenue in four years; the board will not accept a drop in the full-time program's ranking inputs like GMAT scores and selectivity."},{"q":"Would the online program use the same faculty, and what does it cost to build?","a":"Mostly the same faculty teaching extra sections plus an online-platform partner that takes a revenue share of around 40% in the early years."},{"q":"How crowded is the online MBA market in the mid-Atlantic, and what do competitors charge?","a":"Several large universities offer online MBAs from $30,000 to $80,000; the market is still growing but discounting is intense."},{"q":"How many full-time applicants might choose the online program instead?","a":"Admissions estimates that roughly a fifth of full-time applicants are local working professionals who could switch."}],"buckets":[{"name":"Demand from working adults","subs":["Mid-Atlantic working-professional applicant pool and Linden's brand reach","Price position at $45,000 vs. competitors from $30K to $80K","Employer tuition reimbursement as a funding source"]},{"name":"Program economics","subs":["Net tuition per student after 40% platform revenue share","Faculty section cost and class-size breakpoints","Startup cost: course development, marketing, accreditation"]},{"name":"Effect on the full-time MBA","subs":["Local applicants who switch from $70K/yr full-time to $45K total online","Ranking inputs: selectivity, test scores, employment outcomes","Faculty time diverted from research and the flagship"]},{"name":"Delivery capability","subs":["Online platform partner vs. in-house build","Student services and career support for remote students","Accreditation and state authorization for online delivery"]}],"generic":"New product launch (nonprofit, non-profit-maximizing goal)","tailored":"Cannibalization is measured in two currencies, tuition and ranking, so the fit bucket carries both; economics use net tuition after the platform's 40% share, not list price, which cuts the apparent revenue in half.","hyp":"At $45,000 list, 60% net and a 40% platform share, Linden keeps roughly $16,000 per student, so $15M needs about 950 enrolled students in year four, a very large program. The bet is that it reaches the number only if it is positioned so local full-time applicants cannot easily switch, for example by requiring five-plus years of work experience.","trap":"Sizing revenue at list tuition. Each online student is worth about a quarter of the sticker price after scholarships and platform share, and each full-time applicant who switches costs the school roughly $84,000 of net tuition over two years plus a ranking hit, so the cannibalization hurdle is five online students per lost full-timer.","start":"Program economics","startWhy":"Net revenue per online student is the number that converts the $15M goal into required enrollment, and that enrollment figure decides whether the demand bucket is even plausible."},{"id":"launch-n5","type":"launch","diff":4,"title":"Own Label","client":"Tidemark Freight Forwarding","industry":"Logistics / freight forwarding & customs brokerage","prompt":"Tidemark Freight Forwarding is a Long Beach-based freight forwarder with about $1.1B in gross revenue, 1,300 employees and 2,800 importer customers, mostly mid-sized consumer-goods companies bringing containers from Asia. Like most forwarders it does not own ships or trucks; it buys ocean and trucking capacity, resells it with a margin and earns fees on customs brokerage and documentation. Net revenue after transport costs is about $160M. Digital forwarders have been undercutting on price with online booking platforms. The CEO wants to launch a self-service digital booking and tracking product that quotes instantly at lower margins, targeting small importers Tidemark does not serve today. The board has asked us whether to launch it and how it affects the existing managed-service business, which is where the profit is.","questions":[{"q":"How does Tidemark make money on a shipment — margin on capacity resale vs. fees, and how much does an account manager cost?","a":"About 60% of net revenue is the spread on ocean and trucking capacity, 40% is brokerage and documentation fees; each account manager handles about 40 customers."},{"q":"What is the goal of the digital product — new customers, defending existing ones, or lower cost to serve?","a":"The CEO says new small importers; the CFO suspects the real value is in moving existing low-value customers to self-service to cut cost."},{"q":"What do small importers ship, how often, and what do digital forwarders charge them?","a":"A few containers a year each, highly price-sensitive; digital forwarders quote 10–15% below Tidemark's managed rates."},{"q":"Would existing customers be able to use the cheaper digital product, and would they?","a":"Technically yes; the sales team estimates a third of current customers would ask for the lower digital rate if offered."},{"q":"Does Tidemark have the technology, and does offering lower prices change its negotiating position with carriers?","a":"It would license a booking platform; more volume, even at lower margin, improves carrier contract terms."}],"buckets":[{"name":"Small-importer market Tidemark does not serve","subs":["Number and shipment volume of small importers on the Asia–West Coast lane","Share digital forwarders hold and their price position","Acquisition cost for a self-service customer"]},{"name":"Economics of a self-service shipment","subs":["Spread and fee per container at 10–15% lower price","Cost to serve without an account manager","Platform license and build as fixed cost"]},{"name":"Cannibalization of the managed book","subs":["Third of existing customers who would demand the digital rate","Which customers are unprofitable under managed service today and should migrate","Fencing: service levels, volume thresholds, or a separate brand"]},{"name":"Scale effects and capability","subs":["Carrier contract terms improving with total volume","Integration of digital bookings into existing customs and documentation operations","Sales and account-manager roles after launch"]}],"generic":"New product launch (hybrid with pricing/segmentation and cost-to-serve)","tailored":"This is a launch case wearing a pricing case underneath: the product is the same shipment at a lower price with less service, so the cannibalization bucket must separate customers who should migrate (unprofitable under managed service) from those who must be fenced out. Added scale effects because volume improves carrier rates for the whole company.","hyp":"Launch, but as a fenced offering. If a third of existing customers took a 12% lower rate the managed book would lose roughly $6M of net revenue a year, which small importers alone will not replace quickly. The win comes from deliberately migrating low-volume managed customers, where cost to serve exceeds margin, and using combined volume to improve carrier contracts.","trap":"Treating the digital product as pure new-market revenue and sizing it against small importers only. The same product repriced for existing customers is where the money moves, and a repricing of a third of the book without a fence is a self-inflicted price cut.","start":"Cannibalization of the managed book","startWhy":"The downside to the existing $160M of net revenue is larger and more certain than the upside from small importers, so the fence design decides whether to launch at all."},{"id":"pricing-n1","type":"pricing","diff":1,"title":"Sticker Shock","client":"Bramblewood Car Wash","industry":"Consumer services / automotive services","prompt":"Bramblewood Car Wash operates 31 express tunnel car washes in the Dallas–Fort Worth area, with about $38M in revenue and 260 employees. It sells single washes from $10 to $20 and an unlimited monthly membership at $25 that about 40% of customers hold; memberships are now 55% of revenue. Labor, chemicals and water costs have risen about 12% over two years while prices have been flat since the membership launched. The CEO wants to raise prices and has asked us how much, on which products, and what happens to volume if he does.","questions":[{"q":"How do the economics of a wash work — variable cost per wash, fixed cost per site, utilization?","a":"Variable cost is about $2.50 per wash; each site costs about $600K a year to run regardless of volume; tunnels run well below capacity most hours."},{"q":"What is the goal — a margin target, a revenue number, or recovering the cost increase?","a":"Recover the roughly $3M of annual cost inflation and get site margins back to where they were, without losing members."},{"q":"How often do members wash, and how does member churn behave after price changes?","a":"Members wash about four times a month; the one time Bramblewood raised the membership $2, monthly churn ticked up briefly and then returned to normal."},{"q":"What do competitors charge for single washes and memberships?","a":"National chains in DFW charge $30 to $35 for a comparable unlimited plan and $12 to $22 for single washes."},{"q":"Is the tiered single-wash menu or the membership where most price sensitivity sits?","a":"Single-wash customers are more price-sensitive; members mostly value convenience and rarely compare."}],"buckets":[{"name":"Membership price and tiers","subs":["$25 vs. $30–35 competitor plans: headroom","Churn response from members who wash 4x a month (effective $6 a wash)","Good-better-best tiers with ceramic or tire shine"]},{"name":"Single-wash menu","subs":["Price ladder from $10 to $20 and where customers cluster","Conversion of single-wash buyers into members at a higher membership price","Off-peak discounts to fill empty tunnel hours"]},{"name":"Volume at risk vs. margin gained","subs":["Breakeven volume loss = price increase ÷ (new price − $2.50 variable cost)","Fixed site cost of $600K means lost washes barely save anything","Member wash frequency falling as price rises"]}],"generic":"Pricing (price increase)","tailored":"Split the menu by customer behavior, members versus single-wash buyers, because they respond differently, and added an explicit breakeven bucket since near-zero variable cost makes the tolerable volume loss very large.","hyp":"Raise the membership from $25 to $30. Breakeven volume loss is $5 ÷ ($30 − $10 of monthly variable cost at four washes) = 25% of members, far more than the brief churn seen after the last $2 increase; this alone recovers most of the $3M.","trap":"Fearing member churn in the abstract. With $2.50 variable cost per wash and a $600K fixed site cost, Bramblewood can lose a quarter of its members and still come out ahead on a $5 increase; the risk is overstated unless churn approaches that number.","start":"Membership price and tiers","startWhy":"Memberships are 55% of revenue, sit $5–10 below competitors, and have the least price-sensitive customers, so that is where the $3M is recovered with the least volume risk."},{"id":"pricing-n2","type":"pricing","diff":2,"title":"Flat Fee","client":"Ravensworth Accounting Group","industry":"Professional services / accounting & advisory","prompt":"Ravensworth Accounting Group is a regional accounting firm headquartered in Cleveland with 11 offices across Ohio and Pennsylvania, 38 partners, about 520 staff and $110M in revenue. Roughly 60% of revenue is tax and audit for small and mid-sized businesses, billed by the hour, and 40% is outsourced bookkeeping and CFO services. Clients increasingly ask for fixed fees, and two national firms have entered the market with subscription-style packages. Realization on hourly work, the share of billed hours actually collected, has fallen from 88% to 79% in three years. The managing partner wants to move the firm to fixed-fee and subscription pricing and has asked us how to structure it and what it does to revenue and margin.","questions":[{"q":"How does the firm make money — rates, utilization, leverage of partners to staff, and what realization means in dollars?","a":"Blended rate is about $210 an hour; staff are 70% utilized; every point of realization is roughly $800K of revenue."},{"q":"What is the goal — hold revenue, improve margin, or win and keep clients?","a":"Stop the realization slide and lift partner profit per partner by 10% within two years without losing the top 100 clients."},{"q":"Which services are predictable enough to price as a fixed fee, and which have high variance in hours?","a":"Bookkeeping and routine tax are predictable; audit and advisory vary widely by client complexity."},{"q":"What do the national entrants charge, and how do clients react to their packages?","a":"Tiered monthly subscriptions bundling bookkeeping, tax and advisory; clients like the predictability and some have left for them."},{"q":"How are partners compensated — on hours billed, revenue collected, or profit?","a":"Mostly on billed hours and book of business, which rewards doing more hours rather than pricing well."}],"buckets":[{"name":"Which work moves to fixed fees","subs":["Hour-variance by service line: bookkeeping and routine tax vs. audit and advisory","Scope definition and change-order rules for out-of-scope work","Price anchoring to client value vs. historical hours"]},{"name":"Subscription tiers and bundles","subs":["Good-better-best monthly packages for the 40% recurring business","Migration of hourly clients to a tier without a revenue drop","Advisory upsell inside the bundle"]},{"name":"Economics of the shift","subs":["Realization recovered: 79% to 88% is about $7M","Staff utilization and leverage under fixed scope (efficiency becomes profit, not lost billings)","Margin risk on under-scoped engagements"]},{"name":"Partner incentives and client retention","subs":["Compensation tied to collected margin rather than hours","Top-100 client pilot and feedback","Pricing governance and discount authority"]}],"generic":"Pricing (model change: hourly to fixed fee / subscription)","tailored":"A pricing-model change in professional services is really a scope-and-incentive problem, so the buckets are organized by predictability of hours and partner behavior rather than by product; economics are framed as realization recovered plus efficiency captured.","hyp":"Move bookkeeping and routine tax, roughly half of revenue, to fixed and subscription pricing first and keep audit hourly. Recovering realization toward 88% is worth about $7M, and under fixed fees every efficiency gain becomes margin instead of a smaller invoice, which is enough for the 10% profit-per-partner goal.","trap":"Setting the fixed fee at last year's hours times rate, which just locks in the write-downs, and ignoring that partners paid on billed hours have no reason to price for value. Also moving high-variance audit work to fixed fees first, where under-scoping destroys margin.","start":"Which work moves to fixed fees","startWhy":"Hour predictability determines where fixed fees are safe; getting that split right before designing tiers avoids pricing the risky work wrong."},{"id":"pricing-n3","type":"pricing","diff":2,"title":"Peak Load","client":"Port Lavinia Marine Terminal","industry":"Logistics / port & terminal operations","prompt":"Port Lavinia Marine Terminal operates a container terminal on the Gulf Coast under a long-term lease from the port authority, handling about 1.4 million containers a year with $310M in revenue and 1,100 employees. It charges shipping lines a fee per container moved and charges truckers and cargo owners for storage beyond a free period, plus gate fees. Truck traffic is heavily concentrated between 8 a.m. and 2 p.m., producing four-hour queues, while evening gates sit nearly empty. The terminal's general manager wants to introduce time-of-day pricing, a peak surcharge and off-peak discount, to spread demand and avoid a $90M expansion of gate capacity. The parent company's CFO has asked us whether this works and how to set the prices.","questions":[{"q":"How does the terminal make money by customer — lines, truckers, cargo owners — and who actually decides when a truck arrives?","a":"Shipping lines pay most of the revenue per container; truckers pay gate fees but the pickup time is largely set by warehouses that receive the cargo and close at 5 p.m."},{"q":"What is the goal — revenue, throughput, queue time, or avoiding the capital spend?","a":"Avoid or defer the $90M expansion while cutting peak queue time in half; incremental revenue is welcome but secondary."},{"q":"How much demand needs to move off-peak to clear the queues, and is there a precedent?","a":"Engineers say shifting about 20% of daytime trucks to evenings removes the queue; Los Angeles and Long Beach ran a similar program with mixed results."},{"q":"What does it cost the terminal to run evening gates, and are they staffed now?","a":"Evening gates run with a skeleton crew; adding full staffing costs about $8M a year."},{"q":"Would truckers and cargo owners actually change behavior for a surcharge, or would they absorb it?","a":"Truckers say they would shift if warehouses accept night deliveries; large retailers can, small importers often cannot."}],"buckets":[{"name":"Who pays and who decides the pickup time","subs":["Surcharge on trucker vs. cargo owner vs. shipping line","Warehouse receiving hours as the real constraint","Appointment system that enforces the time slot"]},{"name":"Setting the peak premium and off-peak discount","subs":["Price gap needed to move 20% of daytime moves","Revenue neutrality vs. incremental revenue","Exemptions and caps for small importers"]},{"name":"Cost and capacity trade-off","subs":["$8M a year of evening staffing vs. $90M expansion","Queue time, driver turn time and line service levels","Storage-fee revenue changes as cargo clears faster"]},{"name":"Stakeholder and regulatory path","subs":["Port authority lease terms on fee changes","Shipping line contracts and pass-through clauses","Trucker association and community response"]}],"generic":"Pricing (surcharge / congestion pricing)","tailored":"Standard surcharge pricing assumes the payer controls demand; here the payer (trucker) and the decision-maker (warehouse) are different, so the first bucket is about who to charge. Economics are framed as pricing versus capital, not profit.","hyp":"A peak surcharge works only if it lands on the cargo owner, who controls warehouse hours, and is paired with an appointment system. Set so that about 20% of moves shift, it defers the $90M expansion for the cost of $8M a year of evening staffing, which is the real return.","trap":"Pricing the trucker, who cannot change when the warehouse opens. The surcharge gets absorbed, queues stay, and the terminal collects a fee that angers everyone; the second trap is judging success by surcharge revenue rather than by queue time and capital avoided.","start":"Who pays and who decides the pickup time","startWhy":"If the price signal cannot reach the party who sets the pickup time, no price level will shift demand, so the payer question comes before the price level."},{"id":"pricing-n4","type":"pricing","diff":3,"title":"Rent Roll","client":"Coldwater Self Storage","industry":"Real estate / self-storage","prompt":"Coldwater Self Storage owns and operates 85 self-storage facilities in the Southeast with about 58,000 units, $125M in revenue and 320 employees, held in a private REIT. It rents units month to month, uses promotional 'first month $1' pricing to attract new tenants online, and raises rents on existing tenants once or twice a year. Occupancy is 91% but the average rent paid by a new tenant is now 30% below what existing tenants pay in the same facility, and a wave of new storage supply has opened nearby. The CEO has asked us whether Coldwater should cut rents to defend occupancy, keep pushing increases on existing tenants, or change the pricing model altogether, with the goal of growing net operating income 8% next year.","questions":[{"q":"How does a facility make money — fixed vs. variable cost, and what does one more occupied unit cost to serve?","a":"Almost everything is fixed: property tax, staff, insurance; an extra occupied unit costs almost nothing, so revenue per available unit is the key metric."},{"q":"How long does a tenant stay, and how do they react to rent increases?","a":"Average stay is about 14 months; most tenants accept increases of 8–10% because moving is a hassle, and move-outs tick up only above 15%."},{"q":"Is the 30% gap between new and existing rents normal in the industry, and is the new supply sustained?","a":"A gap is normal but 30% is wide; three new competitor facilities opened within three miles of 20 Coldwater sites and are in lease-up at deep discounts."},{"q":"Is 8% NOI growth achievable through price alone at 91% occupancy, or does occupancy need to rise?","a":"The CFO thinks price must carry it; there are only about 5,000 vacant units and pushing occupancy to 95% is worth maybe 2–3%."},{"q":"Does the online pricing engine set prices by unit size and facility, or is it one promotional rate?","a":"Promotions are broad; unit-level dynamic pricing exists but is lightly used, and climate-controlled units sell out while drive-up units sit empty."}],"buckets":[{"name":"Existing-tenant rent increases","subs":["Increase size and frequency vs. move-out curve above 15%","Tenure-based targeting: who is far below street rate","Replacement cost: a move-out is re-rented at the 30%-lower new rate"]},{"name":"New-tenant street rates and promotions","subs":["'$1 first month' vs. a smaller promotion in markets without new supply","Unit-type pricing: climate-controlled sells out, drive-up sits empty","Competitor lease-up discounts and how long they last"]},{"name":"Revenue per available unit by facility","subs":["Occupancy headroom: 5,000 vacant units worth only 2–3%","Facilities facing new supply (20 sites) vs. the other 65","Breakeven on a street-rate cut: volume gain needed = Δp ÷ (new price − ~zero variable cost)"]},{"name":"Pricing capability","subs":["Dynamic pricing engine use by unit and facility","Tenant data for predicting move-out risk","Call-center and web pricing consistency"]}],"generic":"Pricing (raise vs. cut vs. re-tier; two-customer-pool variant)","tailored":"Standard pricing frames treat one price; self-storage has two pools, existing tenants and new tenants, with different elasticities, so each gets its own bucket and the facility-level bucket splits the 20 sites facing new supply from the 65 that are not.","hyp":"Price must deliver the 8%, and existing tenants are the lever: a 9% average increase on 53,000 occupied units sits below the 15% move-out threshold and is worth roughly 7–8% of NOI on its own. Do not cut street rates except at the 20 sites facing new supply, and there only on drive-up units.","trap":"Averaging across the portfolio. The 20 sites facing new supply need a different answer from the other 65, and climate-controlled units need a different answer from drive-up; one portfolio-wide rent cut to defend occupancy gives away margin on 65 sites that are not under attack.","start":"Existing-tenant rent increases","startWhy":"Existing tenants are 91% of units, pay 30% more than new tenants, and tolerate increases up to about 15%, so this bucket alone can deliver most of the 8% target before touching street rates."},{"id":"pricing-n5","type":"pricing","diff":4,"title":"Fare Box","client":"Greater Tullamore Transit District","industry":"Public sector / regional transit","prompt":"Greater Tullamore Transit District runs bus and light-rail service for a US metro region of 1.8 million people, carrying about 42 million riders a year with a $380M operating budget, 2,300 employees, and a flat $2.25 fare that has not changed in nine years. Fares cover only about 22% of operating costs; the rest comes from a regional sales tax and federal grants. Ridership is still 15% below pre-2020 levels, a $45M budget gap opens next year as federal relief ends, and the board is split between raising fares, going fare-free to rebuild ridership, and replacing the flat fare with distance- or zone-based pricing. The board chair has asked us to recommend a fare policy that closes as much of the gap as possible without pushing low-income riders off the system.","questions":[{"q":"How does the district's money work — what does a rider pay, who rides, and what does a marginal rider cost?","a":"Average fare actually paid is about $1.60 after passes and discounts; about 40% of riders are low-income or transit-dependent; a marginal rider costs essentially nothing since buses run regardless."},{"q":"Is the goal to close the full $45M, protect ridership, protect equity, or some weighted mix?","a":"The board's priority order is equity, then ridership, then revenue, but the $45M gap is real and service cuts are the alternative."},{"q":"What has happened when peer agencies raised fares or went fare-free?","a":"Fare increases typically lose about 3% of ridership for every 10% increase; fare-free pilots grew ridership 20–30% but gave up all fare revenue."},{"q":"What do fares cost to collect, and does the system already have the technology for zone pricing?","a":"Fare collection costs about $18M a year; a tap-card system exists on rail but not on all buses."},{"q":"Who are the riders who could pay more — commuters, airport travelers, suburban rail riders?","a":"Suburban rail commuters and airport riders are higher-income and travel the longest distances at the same $2.25 flat fare."}],"buckets":[{"name":"Fare level and structure","subs":["Flat $2.25 vs. zone or distance pricing that charges long suburban trips more","Elasticity: ~3% ridership loss per 10% increase","Peak and premium fares for airport and express rail"]},{"name":"Who pays and who is protected","subs":["Low-income fare program and eligibility verification","Fare capping so frequent riders never pay more than a pass","Employer and university pass programs as bulk revenue"]},{"name":"Cost of collecting the fare","subs":["$18M a year collection cost vs. ~$67M fare revenue","Fare-free on buses only vs. system-wide","Tap-card rollout cost to enable zone pricing"]},{"name":"Closing the gap beyond fares","subs":["Sales-tax measure or state contribution","Advertising, real estate and parking revenue","Service redesign vs. cuts"]}],"generic":"Pricing (hybrid: re-tier + public-sector goal that is not profit)","tailored":"Pricing frame kept, but the objective function is equity-weighted ridership, not margin; the structure adds a 'who is protected' bucket and a cost-of-collection bucket, because at 22% farebox recovery the cost of collecting fares is a real lever.","hyp":"Neither flat increase nor fare-free closes the gap. Bet on zone pricing that raises long suburban and airport trips to $3.50–4.00 while a low-income fare and fare capping hold transit-dependent riders at or below $2.25; that mix can raise roughly $20–25M, and the remaining gap must come from non-fare sources, not from riders.","trap":"Running the breakeven volume math as if this were a business: fares cover 22% of cost and marginal riders cost nothing, so a 'profitable' fare increase that empties buses fails the board's stated goal. Equally, treating fare-free as free: it costs $67M of revenue to save $18M of collection.","start":"Who pays and who is protected","startWhy":"The board ranked equity first, so defining who is shielded from any increase sets the constraint that every fare-structure option must satisfy before you size revenue."}],"brain":[{"prompt":"We've been working with Ashby Metalworks, a 600-person maker of HVAC ductwork and sheet-metal components in Dayton, Ohio. Revenue has been flat at about $140M for three years while steel and labor costs have climbed, and the margin has slipped from 11% to 6%. Before we look at the exhibits, what are some ways the company could reduce its cost base?","lens":"fixvar","why":"Cost brainstorm — Fixed vs Variable, then direct vs indirect, keeps you MECE and lets you name where each idea lands.","model":[{"bucket":"Variable costs","ideas":["Steel: index-linked supplier contracts and scrap-rate reduction on the lines","Direct labor: standard-hours per part, cross-training to cut overtime","Freight: consolidate outbound loads, renegotiate LTL rates"]},{"bucket":"Fixed costs","ideas":["Footprint: consolidate two plants onto one shift structure","Overhead: shared services for finance and HR across plants","Maintenance: preventive schedule to cut unplanned downtime"]}],"priority":"I'd start with steel and scrap — it's the biggest line and the margin slipped exactly as steel rose, so pass-through clauses and yield are the fastest lever."},{"prompt":"Our client is Lantern Fitness, a chain of 38 mid-priced gyms across Colorado and Utah. We've established that new sign-ups are healthy but annual churn runs about 45%, with half of it in the first 90 days, mostly members under 30. The CEO turns to you: why might members be leaving so early, and what could the chain do about it?","lens":"intext","why":"Internal vs External — the simplest on-the-spot structure, and it separates what the gym controls from what it doesn't.","model":[{"bucket":"Internal drivers","ideas":["Onboarding: no guided first-30-day plan, so new members never form a habit","Class schedule and capacity at peak hours for a younger, after-work crowd","Price-to-value: monthly plan with no commitment makes quitting frictionless"]},{"bucket":"External drivers","ideas":["Budget-gym entrants at $10–15/month in the same suburbs","Seasonality — January joiners lapse by April","Boutique studios and at-home apps pulling the under-30 segment"]}],"priority":"I'd prioritize internal — a structured first-90-day onboarding and a 12-month plan with a discount, because half the churn is inside the window we control."},{"prompt":"Golden Crust is a 22-store bakery-café chain in the Portland metro doing about $31M in revenue with stores averaging $1.4M each. Same-store sales have grown just 1% a year, and the founder wants 10% revenue growth next year without opening new stores. What levers could lift revenue in the existing stores?","lens":"volprice","why":"Volume vs Price for a revenue brainstorm: more customers, more per customer, then price and mix.","model":[{"bucket":"More customers","ideas":["Extend hours into the afternoon and early evening (currently closes at 2pm)","Catering and office-delivery program for downtown Portland","Loyalty app to win back lapsed customers"]},{"bucket":"More per customer","ideas":["Attach rate: pair a drink with every pastry at the register","Lunch menu to raise the average ticket past breakfast","Pre-order for pickup to add a second daily visit"]},{"bucket":"Price and mix","ideas":["Raise price on signature items where elasticity is low","Shift mix toward higher-margin specialty coffee","Reduce discounting on day-old product"]}],"priority":"More per customer first — attach rate and a lunch daypart are capital-light and work in every store tomorrow."},{"prompt":"We've been advising Tallwater Bottling, a Tennessee beverage co-packer, on whether to buy a 12-year-old plant for $105M to bring production in-house. The economics look favorable — about $30M a year in savings and payback under four years. The CFO asks: what risks should we weigh before we recommend the purchase?","lens":"mefr","why":"Risk brainstorm — Market, Execution, Financial, Regulatory gives four clean buckets and forces you to separate risks from reasons to lean yes.","model":[{"bucket":"Market","ideas":["Volume falls short of the 110M-unit plan if the lead customer renegotiates","Format shift (cans vs PET) strands the installed lines"]},{"bucket":"Execution","ideas":["Upgrade overruns on a 12-year-old plant","Inheriting a 220-person workforce and its contracts","Transition risk while the co-packer contract winds down"]},{"bucket":"Financial","ideas":["$105M tied up versus other uses of capital","Savings assume full utilization from year one"]},{"bucket":"Regulatory / reputational","ideas":["Environmental permits on an older site","Water-rights and wastewater compliance"]}],"priority":"Execution is the one I'd flag first — the savings case depends on a smooth upgrade, and old-plant overruns are the most common way these deals miss."},{"prompt":"Mercy Ridge Hospital runs a 42-bed emergency department in Columbus, Ohio. Visit volume has been flat, yet the median door-to-provider time has risen from 28 to 51 minutes over 18 months and left-without-being-seen rates have doubled. The COO asks: what could be driving longer waits with the same volume?","lens":"supdem","why":"Demand side vs Supply side — with volume flat, the answer sits in mix or capacity, and this lens makes you look at both.","model":[{"bucket":"Demand side","ideas":["Acuity mix shifted up (sicker patients take longer in triage and beds)","Arrival pattern bunching — evening peaks, same daily total","Boarding: admitted patients holding ED beds because inpatient discharges run late"]},{"bucket":"Supply side","ideas":["Nurse vacancies covered by agency staff unfamiliar with the flow","Fewer provider hours at peak after a schedule change","Bed-turnover and cleaning delays between patients"]}],"priority":"I'd look at boarding first — it's the classic reason an ED slows with flat volume, and the fix sits in inpatient discharge timing, not in the ED."},{"prompt":"Our client, Pemberton Outdoor, is a $180M technical-apparel brand that sells 80% through sporting-goods retailers. Wholesale growth has slowed to 2% and the board wants a growth plan. Setting aside the direct-to-consumer debate for a moment, what are the ways this brand could grow?","lens":"ansoff","why":"Ansoff — existing/new products × existing/new markets — gives four cells that cover every growth path without overlap.","model":[{"bucket":"Existing products, existing markets","ideas":["Win shelf space and sell-through at the top two retailers","Pricing and promotion discipline to lift realized price"]},{"bucket":"Existing products, new markets","ideas":["International distribution (Canada, Nordics)","New channels: own e-commerce, outlets, corporate/uniform programs"]},{"bucket":"New products, existing markets","ideas":["Footwear and packs for the same customer","Kids' and women's-specific lines"]},{"bucket":"New products, new markets","ideas":["Rental or resale program reaching a younger buyer","Licensing the brand into adjacent categories"]}],"priority":"New channels for existing products first — wholesale is 80% of revenue and slowing, so reaching the same buyer somewhere else is the biggest, lowest-risk cell."},{"prompt":"Birchline Home is a $220M online retailer of mid-range furniture based in Austin. Site traffic is up 15% year over year, but conversion has fallen from 2.4% to 1.7%, and revenue is flat. The head of e-commerce asks: what could explain the drop in conversion?","lens":"journey","why":"Customer journey — awareness → consideration → purchase → use → repeat — pinpoints which stage is leaking.","model":[{"bucket":"Awareness and traffic quality","ideas":["Paid traffic mix shifted to broad social campaigns that bring browsers, not buyers","New-visitor share rose, and new visitors convert at a fraction of returning ones"]},{"bucket":"Consideration","ideas":["Price comparison: competitors offering free white-glove delivery","Thin product content (no room-scale photos, no reviews on new lines)"]},{"bucket":"Purchase","ideas":["Checkout friction after a payments-provider change","Delivery lead times quoted at 8–10 weeks versus 3 at competitors"]}],"priority":"Traffic quality first — a 15% traffic rise with falling conversion usually means the marginal visitor changed, and that's one report away from confirming."},{"prompt":"The City of Fallbrook, population 410,000, is deciding whether to bid for a regional multi-sport games in 2032. The mayor's office has asked us for a view. Before we size anything, who are the stakeholders whose interests would shape this decision, and what would each care about?","lens":"4c","why":"Stakeholders / 4 Cs — Customers, Company, Competitors, Collaborators — adapted to a city gives a complete map of who gains, pays and can block.","model":[{"bucket":"Residents (customers)","ideas":["Tax burden and disruption versus civic pride and jobs","Legacy use of venues and transit after the games"]},{"bucket":"The city itself","ideas":["Budget exposure and debt capacity","Staff and political bandwidth for a seven-year program"]},{"bucket":"Competing bidders","ideas":["Other cities' incentive packages set the price of winning","A losing bid still costs the planning budget"]},{"bucket":"Collaborators","ideas":["State government and transit authority funding","Sponsors, universities with venues, hospitality industry"]}],"priority":"Residents and the city's own budget first — if the fiscal case doesn't survive those two, the rest is moot."},{"prompt":"Cardinal Precision is a 400-person maker of machined aerospace components in Wichita. Margins have slipped as volumes fell 12% after a major program was delayed, and the plant is running at 60% utilization. The COO asks: what options does the company have to bring down cost per unit?","lens":"fixvar","why":"Fixed vs Variable — with volume down, the problem is fixed-cost absorption, and this lens surfaces it immediately.","model":[{"bucket":"Fixed costs","ideas":["Consolidate three shifts to two while the program is delayed","Idle or sell surplus machining centers","Renegotiate facility lease or sublease unused floor space"]},{"bucket":"Variable costs","ideas":["Titanium and alloy procurement: consortium buying with other Wichita suppliers","Scrap and rework reduction on high-value parts","Overtime elimination as volume falls"]},{"bucket":"Volume itself","ideas":["Fill idle capacity with contract machining for adjacent industries","Pull forward work from the delayed program's other suppliers"]}],"priority":"Fixed-cost absorption is the issue, so I'd start with shift consolidation and filling capacity — variable costs per unit haven't changed, the denominator has."},{"prompt":"The Riverside County DMV runs 14 offices and average wait time has climbed from 35 to 80 minutes since a federal ID deadline was announced, with no new budget. The commissioner asks: how could the agency cut wait times without hiring?","lens":"ppt","why":"People, Process, Technology — the standard operations lens, and it maps directly onto what a budget-constrained agency can change.","model":[{"bucket":"People","ideas":["Cross-train clerks so any window can handle any transaction","Re-time shifts to the Monday and lunch-hour peaks","Floor greeters to pre-check documents before the queue"]},{"bucket":"Process","ideas":["Appointment-only for the long federal-ID transactions","Triage simple renewals to an express lane","Document checklist mailed with the notice so applicants arrive ready"]},{"bucket":"Technology","ideas":["Push renewals and address changes online or to kiosks","Text-ahead queueing so people don't wait in the building","Share load across offices with real-time wait displays"]}],"priority":"Process first — appointments for the long federal-ID transactions protect the express flow, and it costs nothing."},{"prompt":"Northvale Software sells scheduling software to mid-size retailers and wants to add a labor-forecasting module its customers keep asking for. Engineering says it would take 14 months to build; two specialist vendors have offered partnerships. The CPO asks: what should we consider in deciding whether to build it ourselves or partner?","lens":"makebuy","why":"Make vs Buy — speed, control, cost, how core the capability is, and dependency risk.","model":[{"bucket":"Speed to market","ideas":["14 months in-house versus a partner integration in one quarter","Competitors already bundling forecasting"]},{"bucket":"Control and core-ness","ideas":["Forecasting is becoming the product's center of gravity — hard to outsource long-term","Data ownership and roadmap control"]},{"bucket":"Economics","ideas":["Build cost and opportunity cost of 14 months of engineering","Revenue share with a partner versus full margin"]},{"bucket":"Risk","ideas":["Partner acquired by a competitor","In-house build slips as most do"]}],"priority":"I'd lean partner now, build later: speed matters most this year, and a partnership with a buy-out option keeps the long-term control."},{"prompt":"Little Oak Foods, a $45M maker of organic baby food sold in 2,800 grocery stores, is considering a toddler snack line — pouches and puffs for ages one to three. The founder asks: before we run the numbers, what would you want to think through for a launch like this?","lens":"4p","why":"4 Ps — Product, Price, Place, Promotion — is the natural lens for a product-launch brainstorm.","model":[{"bucket":"Product","ideas":["Differentiation from the two big toddler-snack brands (organic, no added sugar)","Range: how many SKUs the shelf will take"]},{"bucket":"Price","ideas":["Premium versus mainstream pouches; willingness to pay as children age out of baby food","Cannibalization of the existing baby-food pouches"]},{"bucket":"Place","ideas":["Shelf location: baby aisle versus snack aisle","Leverage existing 2,800-store distribution versus new buyers at each chain"]},{"bucket":"Promotion","ideas":["Convert existing baby-food parents as children age out","Sampling and in-aisle trial"]}],"priority":"Place first — whether the buyer who stocks baby food also controls the toddler-snack shelf decides if the existing distribution is an advantage or not."},{"prompt":"Allegheny Bancorp, a regional bank with 60 branches in Pennsylvania, wants to launch a premium checking tier with concierge service and fee waivers. The head of retail asks: which customer segments should we consider targeting, and why?","lens":"seg","why":"Segmentation as the lens — customer type, geography, channel, life stage — then pick the segment with the highest value and lowest cannibalization.","model":[{"bucket":"By balance and product depth","ideas":["Mass-affluent households with $100K–$1M in deposits and investments","Customers holding a mortgage plus deposits (stickiest)"]},{"bucket":"By life stage","ideas":["Pre-retirees consolidating accounts","Young professionals with rising income — long lifetime value"]},{"bucket":"By channel behavior","ideas":["Branch-heavy customers who value in-person service","Digital-first customers who want fee waivers, not concierge"]}],"priority":"Mass-affluent, branch-heavy households first — they value the service, carry the balances, and aren't already getting the perks for free."},{"prompt":"Our client is a county arts council deciding whether to build a 1,200-seat performing-arts center downtown, funded by a bond and a hotel tax. The council chair asks: how would you think about whether this is a good idea for the county?","lens":"fdv","why":"Feasibility, Desirability, Viability — a 'should they' question with a non-profit goal fits this lens cleanly.","model":[{"bucket":"Desirability","ideas":["Resident demand: current attendance at touring shows in neighboring counties","Programming pipeline — will acts route here?"]},{"bucket":"Feasibility","ideas":["Site, parking, transit downtown","Operating partner with venue-management experience"]},{"bucket":"Viability","ideas":["Operating deficit most venues run and who covers it","Hotel-tax sensitivity to tourism cycles","Alternative uses of the bond capacity"]}],"priority":"Viability first — most civic venues run operating deficits, so the question is whether the county has decided to subsidize culture, not whether people will come."},{"prompt":"We're assessing whether a Midwest electric utility should invest in data-center colocation on land next to its substations. Before we look at the client's fit, the partner asks: how attractive is the data-center colocation industry itself?","lens":"porter","why":"Porter's Five Forces — this is the one case where the question is literally industry attractiveness.","model":[{"bucket":"Rivalry","ideas":["Hyperscalers building their own versus third-party colo","Price per kW trends"]},{"bucket":"Threat of entry","ideas":["Capital intensity and power availability as the real barrier","Utilities and REITs entering"]},{"bucket":"Substitutes","ideas":["Cloud and edge reducing demand for traditional colo","Enterprises repatriating from cloud back to colo"]},{"bucket":"Buyer and supplier power","ideas":["A few hyperscale tenants with enormous leverage","Power and chips as constrained inputs — the utility's own advantage"]}],"priority":"Supplier power on electricity is the hinge — the utility controls the scarcest input, which makes an otherwise crowded industry attractive for this client specifically."},{"prompt":"Copperline Hardware, a 90-store regional chain in the Carolinas, just saw a national discounter open across from a third of its stores. Same-store sales in those locations are down 9%. The CEO asks: what could the chain do in response?","lens":"shortlong","why":"Short-term vs Long-term — a competitive response needs both a defensive move now and a repositioning later.","model":[{"bucket":"Short-term","ideas":["Price-match on the 200 most-compared items, not the whole store","Service moves the discounter can't copy: key cutting, repair, contractor desk","Local promotions timed to the discounter's grand-opening window"]},{"bucket":"Long-term","ideas":["Assortment toward pro contractors and specialty categories","Private label at a lower price point","Store format: smaller footprint, higher service density"]}],"priority":"Short-term first on the 200 compared items — a blanket price match would give away margin in categories the discounter doesn't even carry."},{"prompt":"Vantrell Industrial Supply distributes fasteners and MRO products to 3,000 manufacturers in the Great Lakes region. Revenue has been flat at $300M for three years and the new CEO wants $450M in four years. What are the ways to get there?","lens":"orginorg","why":"Organic vs Inorganic — a big gap over a short horizon almost always needs both, and the lens keeps you from forgetting M&A.","model":[{"bucket":"Organic","ideas":["Wallet share: average account gives Vantrell 30% of its spend","New logos in under-covered territories","Private label and value-added services (vending, inventory management)"]},{"bucket":"Inorganic","ideas":["Tuck-in local distributors (several for sale)","Adjacent-category acquisition (safety, packaging)"]},{"bucket":"Screen","ideas":["Working capital to fund growth","Integration capacity for more than one deal a year"]}],"priority":"Wallet share first — 3,000 accounts at 30% share is a $700M pool already in the door; M&A fills what's left."},{"prompt":"Galveston Valve Works, a $250M maker of industrial valves in Houston, has seen revenue flat for two years while operating margin fell from 14% to 9%. We're about to get the P&L. Before we do, what are the possible reasons margin has fallen?","lens":"revcost","why":"Revenue vs Cost — the simplest profitability lens: price, volume, mix on one side; input, conversion, overhead on the other.","model":[{"bucket":"Revenue side","ideas":["Mix shift toward lower-margin commodity valves","Price concessions to hold volume against imports","Flat volume with no price increase against inflation"]},{"bucket":"Cost side","ideas":["Steel and castings inflation without pass-through","Overtime and rework as skilled machinists retire","Overhead growth: new ERP, added sales offices"]}],"priority":"Mix and pass-through first — flat revenue with falling margin in an inflationary period points to price not keeping up, before anything operational."},{"prompt":"Southgate Grocers, a 150-store supermarket chain in the Southeast, has watched a national delivery service launch same-day grocery in its markets. The CEO wants to know how shoppers' behavior might change and what the chain should do. First: how might this change what customers do?","lens":"journey","why":"Customer journey — where in awareness, choice, purchase and repeat does a delivery entrant change behavior?","model":[{"bucket":"Store choice","ideas":["Convenience shoppers switch for fill-in trips","Price-sensitive shoppers stay; delivery adds fees"]},{"bucket":"Basket and frequency","ideas":["Fewer, larger in-store trips; impulse categories drop","Center-store staples move online first; fresh stays in store"]},{"bucket":"Loyalty","ideas":["Delivery service owns the customer relationship and the data","Private-label exposure falls when shoppers don't walk the aisle"]}],"priority":"Impulse and fresh are the key — if fill-in trips leave, the high-margin categories go with them, so that's where I'd model the risk first."},{"prompt":"Our client, Verano Senior Living, operates 28 assisted-living communities in Arizona and Nevada at 88% occupancy. A new operator is opening three communities nearby with lower monthly rates. The CEO asks: what second-order effects should we think about if we cut our rates to match?","lens":"shortlong","why":"Short-term vs Long-term is the fastest way to surface second-order effects — what happens next quarter and what happens in three years.","model":[{"bucket":"Short-term effects","ideas":["Existing residents request the lower rate — repricing the whole base, not just new move-ins","Margin compresses while occupancy barely moves (residents rarely switch)","Staff wage pressure from the new operator hiring locally"]},{"bucket":"Long-term effects","ideas":["Brand repositioned as the discount option in a premium market","Capital for refurbishment dries up, accelerating decline","Competitor may be using a temporary promotional rate to fill up"]}],"priority":"The first-order risk is repricing the installed base — residents don't move, so a rate cut buys almost no occupancy and gives away margin on 88% of the beds."},{"prompt":"Sunrise Dental Partners is a PE-owned group of 60 dental practices in Texas. Same-practice revenue growth has stalled at 2%, and the fund needs 20% total growth in two years before exit. The operating partner asks: what levers could lift revenue in the existing practices?","lens":"volprice","why":"Volume vs Price — practice revenue is chairs × hours × patients per hour × revenue per visit, so split volume and revenue-per-visit.","model":[{"bucket":"Volume","ideas":["Hygiene recall rate — patients overdue for cleanings","Extend hours into evenings and Saturdays","New-patient acquisition via local marketing and insurance networks"]},{"bucket":"Revenue per visit","ideas":["Treatment-plan acceptance rate (presentation and financing)","Add specialty services in-house: implants, clear aligners","Payer mix and fee-schedule renegotiation"]}],"priority":"Treatment-plan acceptance first — it's pure revenue per visit on patients already in the chair, and the spread between practices is usually huge."},{"prompt":"The Stateline Transit Authority runs buses across a two-state metro. Ridership is still 25% below pre-pandemic levels while costs are up. The board asks: what could the authority do to bring riders back?","lens":"intext","why":"Internal vs External — what the authority can change about its own service versus the external conditions shaping demand.","model":[{"bucket":"Internal levers","ideas":["Frequency on the core routes (ridership follows frequency)","Reliability and real-time arrival information","Fare products: fare capping, employer passes, free transfers"]},{"bucket":"External levers","ideas":["Partnerships with employers and universities for pass programs","Land-use and parking policy with the cities","Marketing to remote workers for non-commute trips"]}],"priority":"Frequency on core routes first — it's the single strongest driver of ridership, and the rest of the network can be trimmed to fund it."},{"prompt":"A Southeast Asian ride-hailing platform our client invests in has grown riders 40% but is still unprofitable, with driver incentives the largest cost. The investor asks: what are the ways the company could improve unit economics without stalling growth?","lens":"revcost","why":"Revenue vs Cost per ride — unit economics is take-rate on one side and driver and acquisition cost on the other.","model":[{"bucket":"Revenue per ride","ideas":["Take rate: dynamic pricing and service fees","Premium tiers and scheduled rides","Advertising and financial services on the rider base"]},{"bucket":"Cost per ride","ideas":["Driver incentives: shift from blanket bonuses to targeted peak-hour incentives","Rider promotions concentrated on first rides, not repeat","Utilization: batching and routing to raise rides per driver-hour"]}],"priority":"Targeted driver incentives first — they're the largest line and the most poorly aimed, so the money can be redirected without cutting supply where it matters."},{"prompt":"Marlow Publishing, a 70-year-old regional magazine group in Chicago, has seen print advertising fall 15% a year. Digital subscriptions are growing but small. The owner asks: what options does the business have over the next five years?","lens":"shortlong","why":"Short-term vs Long-term — a structural decline needs cash actions now and a repositioned business later.","model":[{"bucket":"Short-term","ideas":["Print cadence and page-count reduction to protect margin","Events and sponsored content using the brand's local audience","Subscription pricing and bundling print with digital"]},{"bucket":"Long-term","ideas":["Shift to a membership model around local coverage","Licensing content and archives","Sell or merge titles with a larger group"]}],"priority":"Events first — they monetize the local audience the brand already owns and buy time for the membership transition."}],"lenses":[{"id":"intext","name":"Internal vs External","when":"Universal fallback; BCG's recommended on-the-spot structure"},{"id":"shortlong","name":"Short-term vs Long-term","when":"Universal fallback; when timing matters"},{"id":"revcost","name":"Revenue vs Cost","when":"Any 'how to improve profit' brainstorm"},{"id":"supdem","name":"Supply side vs Demand side","when":"Shortages, capacity, pricing pressure"},{"id":"valuechain","name":"Value chain","when":"Cost or risk questions about a company's operations (DoorDash example)"},{"id":"4c","name":"Stakeholders / 4 Cs","when":"Industry or company questions: Customer, Company, Competitors, Collaborators"},{"id":"journey","name":"Customer journey","when":"Experience, conversion, churn questions"},{"id":"ansoff","name":"Ansoff (products × markets)","when":"Growth / revenue ideas"},{"id":"volprice","name":"Volume vs Price","when":"Revenue ideas: more customers, more per customer vs raise, re-tier, reduce discounting"},{"id":"orginorg","name":"Organic vs Inorganic","when":"Growth — build / buy / partner"},{"id":"fixvar","name":"Fixed vs Variable","when":"Cost ideas (then direct vs indirect)"},{"id":"ppt","name":"People, Process, Technology","when":"Operations / efficiency ideas"},{"id":"makebuy","name":"Make vs Buy","when":"In-house vs outsource questions"},{"id":"4p","name":"4 Ps","when":"Marketing / product launch ideas"},{"id":"seg","name":"Segmentation","when":"Second cut: customer type, geography, channel, occasion"},{"id":"fdv","name":"Feasibility, Desirability, Viability","when":"'Should they' / risk brainstorms"},{"id":"mefr","name":"Market, Execution, Financial, Regulatory","when":"Risk brainstorms"},{"id":"porter","name":"Porter's Five Forces","when":"Only when the question is literally industry attractiveness"}],"math":[{"q":"10% discount factor, year 1","a":"0.91","d":["0.83","0.95","0.90"]},{"q":"10% discount factor, year 2","a":"0.83","d":["0.91","0.75","0.80"]},{"q":"10% discount factor, year 3","a":"0.75","d":["0.83","0.68","0.72"]},{"q":"10% discount factor, year 5","a":"0.62","d":["0.68","0.75","0.55"]},{"q":"Annuity factor, 10%, 5 years","a":"3.79","d":["4.33","3.17","5.00"]},{"q":"Annuity factor, 10%, 3 years","a":"2.49","d":["2.74","2.17","3.00"]},{"q":"Annuity factor, 10%, 10 years","a":"6.14","d":["7.72","5.00","8.50"]},{"q":"Annuity factor, 20%, 5 years","a":"2.99","d":["3.79","2.49","4.00"]},{"q":"Perpetuity multiple at 10%","a":"10×","d":["8.3×","12.5×","5×"]},{"q":"Perpetuity multiple at 8%","a":"12.5×","d":["10×","8×","15×"]},{"q":"Perpetuity multiple at 12%","a":"8.3×","d":["12×","10×","6.7×"]},{"q":"Perpetuity multiple at 20%","a":"5×","d":["6.7×","8.3×","4×"]},{"q":"Rule of 72: growth rate to double in 5 years","a":"≈15%","d":["≈20%","≈12%","≈10%"]},{"q":"Rule of 72: growth rate to double in 4 years","a":"≈18%","d":["≈15%","≈25%","≈12%"]},{"q":"Rule of 114: growth rate to triple in 5 years","a":"≈25%","d":["≈15%","≈20%","≈33%"]},{"q":"2× money in 5 years ≈ what IRR?","a":"≈15%","d":["≈20%","≈25%","≈10%"]},{"q":"2.5× money in 5 years ≈ what IRR?","a":"≈20%","d":["≈15%","≈25%","≈30%"]},{"q":"3× money in 5 years ≈ what IRR?","a":"≈25%","d":["≈20%","≈30%","≈15%"]},{"q":"2× money in 3 years ≈ what IRR?","a":"≈26%","d":["≈15%","≈33%","≈20%"]},{"q":"Typical PE hurdle rate","a":"20–25%","d":["8–12%","30–50%","3–7%"]},{"q":"Typical corporate WACC","a":"8–12%","d":["20–25%","3–7%","15–18%"]},{"q":"Typical government / nonprofit discount rate","a":"3–7%","d":["8–12%","10–15%","0–2%"]},{"q":"U.S. population (sizing anchor)","a":"~340M","d":["~300M","~380M","~250M"]},{"q":"U.S. households (sizing anchor)","a":"~130M","d":["~100M","~160M","~85M"]},{"q":"U.S. GDP (sizing anchor)","a":"~$30T","d":["~$20T","~$40T","~$15T"]},{"q":"U.S. median household income","a":"~$80K","d":["~$60K","~$100K","~$50K"]},{"q":"Breakeven volume loss for a 10% price increase at 40% contribution margin","a":"≈20%","d":["≈10%","≈25%","≈40%"]},{"q":"Pay $100M, receive $30M/yr for 5 yrs at 10%: NPV","a":"≈+$14M","d":["≈+$50M","≈−$10M","≈+$30M"]},{"q":"Same deal at a 20% PE hurdle: NPV","a":"≈−$10M","d":["≈+$14M","≈+$5M","≈−$30M"]},{"q":"IRR of $100M → $30M/yr × 5 years","a":"≈15%","d":["≈10%","≈20%","≈30%"]},{"q":"EV = $50M EBITDA × 8×; 60% debt. Entry equity?","a":"$160M","d":["$240M","$400M","$200M"]},{"q":"Terminal value is typically what share of total value?","a":"60–80%","d":["20–30%","40–50%","90%+"]}],"coach":[{"front":"Gap: never names the case type","back":"\"This is a profitability case\" — three words, first thing out of your mouth. \"Growth case, PE-owned, two-year horizon\" — eight words. Dock a point if missing."},{"front":"Gap: hypothesis is a list of options, not a bet","back":"A hypothesis picks a direction you then test: \"Given a 5% market and no wholesale, I expect the biggest gap-closers to be new channels.\" Listing four things to pursue is a to-do list."},{"front":"Gap: hypothesis not sized against the gap","back":"Before you say a hypothesis, multiply each lever by its share of revenue. If the biggest can't cover half the gap, it isn't the hypothesis. PE-owned + two-year horizon → M&A is almost always primary."},{"front":"Gap: didn't size the gap first","back":"Say the gap number. 3% for five years gets ~$465M; gap to $800M ≈ $335M. It forces the conversation toward big levers."},{"front":"Gap: arithmetic on 'double'","back":"Rule of 72: 72 ÷ 5 ≈ 15%/yr. 'Double' attaches to the number (revenue, profit), not the growth rate, unless they say so. Restate the goal as a number and let them correct you."},{"front":"Gap: generic buckets ('could be a car wash')","back":"Rename to the industry's own metric: payer mix and acuity mix instead of 'price'; 'who is winning at 15% growth and how — wholesale? international?' instead of 'competitors and share'."},{"front":"Gap: profitability frame bolted onto a growth case","back":"Price × Quantity is the core-business bucket, not the framework. Use Core · New reach · New products · Inorganic, and prioritize out loud."},{"front":"Gap: market bucket doing two jobs","back":"\"Take share, increase revenue, cut costs and hit $50M\" inside one bucket is the whole case, not a bucket. Keep market to competitive pricing, entrants, churn."},{"front":"Gap: cost split","back":"At a gym labor is mostly fixed. More useful than fixed/variable: \"which cost lines moved, and is it all 85 gyms or a subset?\" — the per-unit lens cracks the case."},{"front":"Gap: stating an investment lean before the math","back":"Never state a lean without a one-line comparison of annual benefit to upfront cost. ~$30M/yr on $105M in → payback under 4 years → lean yes."},{"front":"Gap: risks mixed into the lean","back":"Distinguish risks (old plant, workforce, overruns) from reasons to lean yes; they are different buckets."},{"front":"Gap: saying 'I'm blanking'","back":"Don't say it. Say \"and the third is supply-side capacity\" even half a beat late. Interviewers hear the pause, not the recovery."},{"front":"Gap: process bucket scope (ED)","back":"Process is triage, registration, bed assignment, provider pickup. Check-out and payment happen after the clock stops — leave them out."},{"front":"Gap: odd click-down for the industry","back":"Swap 'online presence' for the numbers you were handed: utilization 70%, clinic spread $2.2M vs $5.5M. \"Those were given to you for a reason.\""},{"front":"Gap: growth math stated loosely","back":"State growth math explicitly against the market growth rate to justify inorganic options."},{"front":"Rubric item 1","back":"It answers the question that was asked — top of the tree is the client's objective in their units."},{"front":"Rubric item 2","back":"Two to four buckets, MECE at the top level. No 'costs' and 'operations' side by side."},{"front":"Rubric item 3","back":"It smells like the industry — first sub-branch under each bucket only applies to this business."},{"front":"Rubric item 4","back":"Each bucket goes one level down — two or three sub-branches, driver named."},{"front":"Rubric item 5","back":"It names the trap — one sentence that shows where the case is going."},{"front":"Rubric item 6","back":"It ends with a hypothesis and a first move. You pick the bucket; you don't wait to be told."},{"front":"Rubric scoring","back":"One point per item, 0–6. 4 is a pass, 5 a clean first round, 6 MBB-ready."},{"front":"BGOT clarifying questions","back":"Business/Background (how they make money, what changed) · Goal (quantified, with timeline — most important) · Operations/Other (scope, company-specific vs industry-wide) · Timeline."},{"front":"MCA time budget","back":"90 seconds to read and clarify → ~2 minutes silence to build → present in under 90 seconds; click-down: 60 seconds think, then talk. Brainstorm: 20–30 seconds, 2–4 headers, 2–3 ideas each, finish with a priority."},{"front":"Tailoring in 60 seconds","back":"Rename buckets as client questions · swap one click-down per bucket for the industry's own metric · say the trap · pick the starting bucket and state the hypothesis."},{"front":"MECE self-check","back":"\"Could any driver fit in two of my buckets?\" (not mutually exclusive) · \"What's missing?\" (not collectively exhaustive)."},{"front":"BCG: structure","back":"90 seconds, 3–4 buckets, customized to the real-world problem but MECE; over-explain the why of each bucket; weak = canned market/competitors/risk; strong = why did this happen → market after → what to do and how to evaluate."},{"front":"BCG: exhibits","back":"Talk through everything out loud; eyeball insights first, then state the approach, calculate only what's needed, end with the so-what for the client."},{"front":"BCG: brainstorming","back":"Answer on the spot — no 90-second pause. Very simple structure (internal vs external), specific and actionable ideas, bring your own experience, second-order implications. ~3 ideas and they move on."},{"front":"Strategic buyer vs PE buyer — first sentence","back":"Strategic: \"Is the target worth more to us than to anyone else, net of integration?\" PE: \"Can we hit ~20–25% IRR given entry price, leverage, improvements and exit?\" Say which one out loud."},{"front":"Decision rule for discounting in the room","back":"No rate given → sum the years (payback). Short horizon with rate → year-by-year with 0.91 / 0.83 / 0.75. Long horizon or going business → divide by the rate."},{"front":"Three value-creation levers in PE","back":"EBITDA growth · multiple expansion (not bankable) · deleveraging. Always name which one drives returns."}],"scen":[{"id":"s-a1","type":"profit","title":"Multi-unit consumer business: profit down, revenue flat","buckets":[{"name":"Revenue per unit","subs":["Traffic × conversion × ticket","Mix","Same-store vs new units"]},{"name":"Unit cost","subs":["COGS","Labor hours × rate","Occupancy"]},{"name":"Footprint","subs":["Unit count and maturity","Cannibalization between units"]},{"name":"External","subs":["Input inflation, wage laws","Competitor openings"]}],"trap":"Averages hide unit and daypart variance.","hyp":"Mature units are healthy; new-unit ramp and rising labor/rent explain the drop."},{"id":"s-a2","type":"profit","title":"Healthcare provider margin squeeze","buckets":[{"name":"Volume & case mix","subs":["Inpatient vs outpatient vs ED","Elective vs emergent","Length of stay"]},{"name":"Reimbursement","subs":["Payer mix","Contracted rates","Denials"]},{"name":"Cost to serve","subs":[" :"profit","title":"Insurance / lending profit down","buckets":[{"name":"Underwriting","subs":["Premium vs frequency × severity","New cohort vs legacy book"]},{"name":"Expense","subs":["Acquisition","Admin","Claims handling"]},{"name":"Investment / funding","subs":["Yield on float","Cost of funds"]},{"name":"Mix","subs":["Line, geography, channel","Risk selection"]}],"trap":"Combined ratio; bad-risk growth looks good for two years.","hyp":"The new channel's book is mispriced for its risk; growth bought bad risk."},{"id":"s-a7","type":"compete","title":"Losing share to a competitor or entrant","buckets":[{"name":"What changed","subs":["Competitor's move and why","Scale and durability"]},{"name":"Where we're losing","subs":["Segment, channel, geography","Price vs volume vs mix"]},{"name":"Why","subs":["Purchase criteria vs our position","Switching costs"]},{"name":"Response options with economics","subs":["Match, differentiate, lock in, counter-move","Do nothing"]}],"trap":"Matching on price when the loss is non-price.","hyp":"The loss is concentrated in one segment and is about service/convenience, so the response should be targeted."},{"id":"s-a8","type":"profit","title":"Professional services / staffing margin","buckets":[{"name":"Revenue","subs":["Heads × utilization × realized rate"]},{"name":"Delivery cost","subs":["Cost rate","Bench","Pyramid"]},{"name":"Mix","subs":["Client, service line","T&M vs fixed fee"]},{"name":"Pipeline & pricing","subs":["Win rate","Rate card discipline"]}],"trap":"Fixed-fee hour creep.","hyp":"Realized rate and utilization slipped as fixed-fee work grew; the pyramid is too senior."},{"id":"s-b1","type":"growth","title":"Mature brand must grow (2× in 5 years)","buckets":[{"name":"Core","subs":["Penetration, frequency","Price","Share"]},{"name":"Adjacent","subs":["Products, channels","Geographies, segments"]},{"name":"Inorganic","subs":["Tuck-ins","Partnerships"]},{"name":"Screen","subs":["Capabilities, capital","Cannibalization, timing"]}],"trap":"Revenue target hit by destroying margin.","hyp":"Core adds a few points; most of the gap comes from new reach, with M&A as backstop."},{"id":"s-b2","type":"growth","title":"B2B distributor growth","buckets":[{"name":"Customers","subs":["New logos","Wallet share in existing accounts"]},{"name":"Products","subs":["SKU breadth","Private label"]},{"name":"Services","subs":["Value-added: vending, inventory management"]},{"name":"Geography / footprint","subs":["New territories","Tuck-in distributors"]}],"trap":"Working capital is the constraint.","hyp":"Wallet share in existing accounts is the largest, cheapest pool."},{"id":"s-b3","type":"pricing","title":"Pricing decision","buckets":[{"name":"Customer value & WTP","subs":["Elasticity","Switching costs"]},{"name":"Competitive position","subs":["Competitor prices","Likely response"]},{"name":"Economics","subs":["Breakeven volume loss = Δp ÷ (new p − VC)","Cost to serve"]},{"name":"Execution","subs":["Model, channel","Timing"]}],"trap":"Run breakeven volume math first.","hyp":"Elasticity in the core segment is below the breakeven loss, so a targeted increase holds."},{"id":"s-b4","type":"launch","title":"New product launch","buckets":[{"name":"Customer & market","subs":["Need, segment, size","WTP"]},{"name":"Product & competition","subs":["Differentiation","Response"]},{"name":"Capabilities & GTM","subs":["Build / partner","Channels"]},{"name":"Financials","subs":["Ramp, cost, investment","Breakeven","Cannibalization"]}],"trap":"Count incremental only.","hyp":"Launch is worth it only where it reaches a new segment rather than cannibalizing the core."},{"id":"s-b5","type":"growth","title":"Channel strategy / go direct","buckets":[{"name":"Customer","subs":["Who buys where, by segment and category"]},{"name":"Channel economics","subs":["Margin captured vs costs inherited","Incremental vs cannibalized"]},{"name":"Channel conflict","subs":["Retailer reaction, concentration","Segmentation of assortment"]},{"name":"Capabilities & investment","subs":["E-commerce, CRM, logistics","Build vs partner"]}],"trap":"Distributor margin isn't free.","hyp":"A phased direct build adds growth without losing top retailers; an aggressive shift loses more than it gains."},{"id":"s-b6","type":"sales","title":"Retention / churn","buckets":[{"name":"Who churns","subs":["Segment, tenure, cohort"]},{"name":"Why","subs":["Engagement","Price / value","Service"]},{"name":"Value at stake","subs":["LTV","Retain vs acquire cost"]},{"name":"Levers","subs":["Onboarding","Contract / pricing","Engagement"]}],"trap":"Retain only profitable customers.","hyp":"Churn is an early-engagement problem concentrated in the first 90 days."},{"id":"s-b7","type":"growth","title":"Digital / tech growth play","buckets":[{"name":"Customer demand","subs":["Who wants the digital option, how much"]},{"name":"Revenue impact","subs":["Incremental vs cannibalized"]},{"name":"Cost & ops","subs":["Build / partner / buy","Fulfillment"]},{"name":"Risks","subs":["Channel conflict","Execution"]}],"trap":"Channel shift ≠ growth.","hyp":"Most digital revenue is shifted, not new; growth depends on reaching new customers."},{"id":"s-c1","type":"entry","title":"Geographic market entry","buckets":[{"name":"Market","subs":["Size, growth","Regulation"]},{"name":"Competition","subs":["Incumbents, share","Response"]},{"name":"Client fit","subs":["What travels vs what doesn't","Supply chain, brand"]},{"name":"Entry economics & mode","subs":["Build / buy / partner / franchise","Unit economics, payback"]}],"trap":"Big market ≠ attainable share.","hyp":"Attractive but crowded; entry works only via the right mode if unit economics hold."},{"id":"s-c2","type":"ma","title":"Strategic acquisition (saved framework)","buckets":[{"name":"Market","subs":["Other deals, comparables","How acquirers have fared"]},{"name":"Target financials / value","subs":["Revenue = price × quantity","Costs fixed, variable → value"]},{"name":"Fit & capabilities","subs":["Portfolio mix","Expertise","Other opportunities"]},{"name":"Deal","subs":["Synergies, cannibalization","Risks: customer, competitor, regulatory, funding","Exit options"]}],"trap":"Synergies are the case.","hyp":"The premium is justified only if cost synergies are bankable; revenue synergies are upside."},{"id":"s-c3","type":"pe","title":"PE due diligence / LBO","buckets":[{"name":"Market attractiveness","subs":["Growth, fragmentation","Multiples"]},{"name":"Company standalone","subs":["Revenue quality","Margin, cash","Management"]},{"name":"Value-creation plan","subs":["EBITDA growth","Add-ons","Operations"]},{"name":"Deal & exit","subs":["Entry multiple, leverage","Exit routes"]}],"trap":"Name which of EBITDA growth / multiple / debt paydown drives returns.","hyp":"Returns come from EBITDA growth via add-ons; hold the multiple flat."},{"id":"s-c4","type":"invest","title":"Build vs buy vs partner","buckets":[{"name":"Strategic need","subs":["Speed, control","Is it core?"]},{"name":"Economics","subs":["NPV","Time to value"]},{"name":"Risk","subs":["Execution","Dependency"]},{"name":"Capabilities & culture","subs":["Can we run it?","Integration"]}],"trap":"Build underestimates time; buy underestimates integration.","hyp":"Partner wins on speed unless the capability is core, in which case buy."},{"id":"s-c5","type":"invest","title":"Divest a business line","buckets":[{"name":"Standalone performance","subs":["Profit after allocated costs","Trajectory"]},{"name":"Interdependence","subs":["Shared costs","Shared customers"]},{"name":"Value","subs":["Sale vs retained value","Tax"]},{"name":"Execution","subs":["Stranded costs","Buyer universe"]}],"trap":"Stranded overhead.","hyp":"The line is worth more to a buyer, but only if stranded overhead can be removed."},{"id":"s-c6","type":"invest","title":"Major capital investment","buckets":[{"name":"Demand","subs":["Can we fill it?","Growth vs capacity headroom"]},{"name":"Economics","subs":["Capex, opex","NPV / payback"]},{"name":"Alternatives","subs":["Outsource, retrofit, shift"]},{"name":"Risks","subs":["Overruns","Demand concentration"]}],"trap":"Compare to the best alternative, not do-nothing.","hyp":"Annual savings on the upfront cost pay back in under N years, so yes — subject to execution."},{"id":"s-c7","type":"invest","title":"Vertical integration","buckets":[{"name":"Economics","subs":["Margin captured vs cost to operate"]},{"name":"Control","subs":["Supply, quality","IP"]},{"name":"Capabilities","subs":["Can we run the new step?"]},{"name":"Risks","subs":["Flexibility","Supplier / customer reactions","Antitrust"]}],"trap":"You buy a business you don't know how to run.","hyp":"Margin captured is real but control is the actual reason; the risk is operating competence."},{"id":"s-c8","type":"newbiz","title":"Launch a new business / startup","buckets":[{"name":"Market & customer","subs":["Pain, size","Alternatives"]},{"name":"Business model / unit economics","subs":["Price, CAC, LTV","Margin"]},{"name":"Operations & team","subs":["Capabilities","Hiring"]},{"name":"Investment case","subs":["Runway","Milestones"]}],"trap":"Unit economics must work before scale.","hyp":"Viable only if CAC payback works at the planned price before scaling."},{"id":"s-d1","type":"ops","title":"Throughput / wait time","buckets":[{"name":"Demand","subs":["Volume, arrival pattern","Mix"]},{"name":"Capacity","subs":["Staff × hours × productivity"]},{"name":"Process","subs":["Bottleneck","Rework"]},{"name":"Levers","subs":["Triage, scheduling","Self-service"]}],"trap":"Fix the bottleneck only.","hyp":"A mix-driven demand spike is hitting a fixed bottleneck; channel shift plus re-timing staff is the fix."},{"id":"s-d2","type":"cost","title":"Cost-reduction mandate","buckets":[{"name":"Baseline","subs":["Category","Fixed / variable","Addressable"]},{"name":"Benchmarks","subs":["Peers","Internal spread"]},{"name":"Levers","subs":["Demand, price","Productivity, structure"]},{"name":"Impact & risk","subs":["Run-rate vs function confetti(n=120,col){const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=col?[col,'#F5B81C','#fff']:['#2457F5','#12A86A','#8A4DFF','#F2742B','#F5B81C'];const P=[];for(let i=0;i<n;i++)P.push({x:innerWidth/2,y:innerHeight/2.5,vx:(Math.random()-.5)*14,vy:-Math.random()*14-3,r:Math.random()*6+3,c:rnd(cols),a:Math.random()*6});let f=0;(function step(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore();});if(++f<90)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height);})();}

function keysOf(s){const w=norm(s.replace(/\(.*?\)/g,' ')).filter(x=>x.length>=3&&!STOP.has(x));const u=[];w.forEach(x=>{const st=x.slice(0,5);if(!u.some(y=>y.slice(0,5)===st))u.push(x);});return u.slice(0,4);}
const SYN={price:['pricing','prices'],volume:['quantity','units','customers'],mix:['mixture'],fixed:['fixed'],variable:['variable'],competitor:['competition','competitors','rival','rivals'],demand:['demand'],regulation:['regulatory','regulator','rules','law','laws','policy'],synerg:['synergy','synergies'],breakeven:['break','payback'],cannibal:['cannibalization','cannibalisation'],bottleneck:['bottleneck','constraint'],capab:['capabilities','capability'],channel:['channels'],geograph:['geographies','geography','geos','regions','countries','markets'],segment:['segments','segmentation'],integrat:['integration'],invest:['investment','capex','upfront'],alternat:['alternatives','alternative','options'],stakeh:['stakeholders'],timeline:['timing','time'],benchmark:['benchmarks','peers'],elastic:['elasticity','sensitivity'],switching:['switching','lock'],differenti:['differentiation','differentiate'],runrate:['run-rate','runrate','recurring'],downside:['downside','risk','risks'],productiv:['productivity','efficiency'],procure:['procurement','suppliers','negotiate','renegotiate']};
function hitKey(key,userWords){const st=key.slice(0,5);if(userWords.some(w=>w.startsWith(st)||st.startsWith(w.slice(0,5))&&w.length>=4))return true;for(const k in SYN){if(key.startsWith(k)||k.startsWith(key.slice(0,5))){if(SYN[k].some(s=>userWords.some(w=>w.startsWith(s.slice(0,5)))))return true;}}return false;}
function matchText(expected,text){const uw=norm(text);const ks=keysOf(expected);if(!ks.length)return{hit:false,ks:[]};const hits=ks.map(k=>hitKey(k,uw));const need=Math.max(1,Math.ceil(ks.length/2));return{hit:hits.filter(Boolean).length>=need,ks,hits};}
