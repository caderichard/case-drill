at has happened to utilization and realization: are staff billing enough hours, and is the firm collecting its standard rates?","a":"Utilization is roughly flat; realization against standard rates has dropped noticeably because of write-offs on fixed-fee projects."},{"q":"Are peer firms seeing the same margin squeeze, or is this specific to Marlowe Dunn?","a":"Peers report fee pressure in commercial office work, but most have held margins near 10-12%; the firm is an outlier."},{"q":"How much of the record backlog was won on fees the firm would consider thin?","a":"A large share of the healthcare backlog was bid aggressively to win multi-year hospital programs; leadership knows some of it is priced below historical fee-to-cost."}],"buckets":[{"name":"Fee revenue per staff hour","subs":["Chargeable utilization by level (principal, project architect, junior)","Realization: collected fee vs standard rate, write-offs on fixed-fee jobs","Scope creep and uncompensated redesign on fixed-fee contracts"]},{"name":"Project & sector mix","subs":["Fee-to-cost margin by sector (healthcare, higher ed, commercial)","Fixed-fee vs hourly share and change-order discipline","Pass-through consultant fees (engineering) at zero margin"]},{"name":"Cost of the practice","subs":["Compensation and leverage ratio (staff per partner)","Overhead: three-office rent, BIM and software licenses","Business development and proposal cost per win"]},{"name":"Quality of the backlog","subs":["Fee-to-estimated-hours at bid for the $140M backlog","Which contracts can be renegotiated, rescoped or staffed differently","Pipeline pricing discipline going forward"]}],"generic":"Profitability","tailored":"Revenue became fee per staff hour (utilization times realization) because a professional firm sells time; cost is dominated by salaries that are fixed in the short run, so leverage ratio matters more than hourly cost; a backlog-quality bucket was added because future margin is already locked in by what was bid.","hyp":"The nine-point margin drop comes mainly from realization: fixed-fee healthcare projects bid too low and then written off, compounded by 20% more staff than the fee base supports. Repricing the backlog where contracts allow and freezing hiring recovers most of it.","trap":"Treating the record backlog as good news. If the $140 million was bid at thin fees, it locks in two more years of low margin, so the backlog is the problem, not the cushion.","start":"Fee revenue per staff hour","startWhy":"Headcount up 20% with margin down nine points while utilization is flat points straight at realization; size the write-offs first."},{"id":"profit-n4","type":"profit","diff":3,"title":"Dealer Reserve","client":"Pelican State Auto Finance","industry":"Financial services / auto lending","prompt":"Pelican State Auto Finance, based in Baton Rouge, Louisiana, is an indirect auto lender that buys near-prime and subprime loans from about 900 franchised and independent dealers across the Gulf South. It holds $2.4 billion in receivables, employs 650 people in origination, servicing and collections, and funds itself through warehouse lines and asset-backed securitizations. A private equity firm acquired it in 2022 and pushed originations up 20% a year. Return on assets has fallen from 2.5% to 0.4% over two years while the portfolio grew, and the PE owner now says the company must get back to a 2% ROA within 18 months or they will have to rethink the exit. They have asked you to figure out what is going wrong and how to fix it.","questions":[{"q":"How does the lender make money: what is the spread between loan yield and funding, and what does it pay dealers?","a":"It earns the loan APR less the cost of funds, less a dealer participation paid upfront on each loan; credit losses come out of that spread."},{"q":"Is the goal ROA of 2% on the current $2.4 billion book, and does the owner accept shrinking originations to get there?","a":"2% ROA within 18 months; the owner would accept slower growth but not a book that shrinks materially."},{"q":"How have credit losses trended, and do they look different by origination year?","a":"Annualized net charge-offs have risen from about 5% to 8% of the book, and the loans originated in the last two years are performing much worse than older vintages."},{"q":"Is this an industry-wide problem with subprime auto, or specific to Pelican State?","a":"Used-car values have fallen for everyone, hurting recoveries, but Pelican State loosened terms, longer loans and higher loan-to-value, faster than peers during the growth push."},{"q":"Has the dealer participation or dealer mix changed as the company chased volume?","a":"Yes; participation paid to dealers went up and more volume now comes from independent lots with weaker paper."}],"buckets":[{"name":"Yield on the book","subs":["APR by credit tier and term","Dealer participation paid per loan (upfront cost of volume)","Ancillary income: GAP, warranties, late fees"]},{"name":"Credit losses by vintage","subs":["Net charge-offs by origination quarter, not portfolio average","LTV, loan term and down payment at origination","Repossession recovery rates vs used-car price index"]},{"name":"Cost of funds & leverage","subs":["Warehouse line spread and advance rates","ABS execution and credit enhancement required","Equity leverage and interest-rate exposure"]},{"name":"Operating cost per account","subs":["Servicing and collections staffing per 1,000 accounts","Dealer acquisition and underwriting cost per funded loan","Technology and compliance"]}],"generic":"Profitability","tailored":"For a lender, revenue is yield net of what it pays dealers, and the dominant cost is credit losses, which lag originations by 12-24 months; the cost bucket was therefore reframed around vintage losses and funding cost rather than operating expense.","hyp":"ROA fell 2.1 points, roughly $50 million on a $2.4 billion book; charge-offs rising from 5% to 8% is about $70 million, so the recent vintages alone more than explain the gap. Tightening LTV and term on new originations and cutting participation to weak-paper dealers is the fix, not operating cost.","trap":"Trusting the portfolio average. Because the book grew 20% a year, the blended loss rate is diluted by new unseasoned loans; cut losses by origination vintage or you will understate how bad the recent paper is.","start":"Credit losses by vintage","startWhy":"A three-point rise in charge-offs on $2.4 billion covers the entire ROA gap on its own, so confirm the vintage story before looking at yield or expenses."},{"id":"profit-n5","type":"profit","diff":4,"title":"Direct to Doorstep","client":"Maison Verhaegen","industry":"Consumer / premium confectionery","prompt":"Maison Verhaegen is a family-owned premium chocolate maker founded in Ghent, Belgium, in 1890. It has about 1,100 employees, one factory in Ghent, and revenue of roughly EUR 180 million from 40 of its own boutiques across Belgium, France and the Netherlands, wholesale to department stores and airport duty-free, and a direct-to-consumer e-commerce channel launched three years ago that now contributes 18% of revenue. Over those three years total revenue has grown 12%, but operating profit has fallen from EUR 22 million to EUR 14 million. The family board is proud of the digital push and does not want to retreat from it. They have asked you to explain why profit fell while sales grew and how to get back above EUR 22 million within two years.","questions":[{"q":"What is the contribution margin per kilogram by channel: boutiques, wholesale and e-commerce?","a":"Boutiques are the richest channel by far; wholesale is solid but lower; e-commerce, after cold-chain shipping, packaging and promotions, is roughly break-even or slightly negative at the contribution line."},{"q":"Is the goal EUR 22 million of operating profit regardless of revenue mix, and is exiting e-commerce truly off the table?","a":"EUR 22 million or better within two years; the board wants e-commerce kept but is open to changing how it is run and priced."},{"q":"How much of the e-commerce volume is incremental versus customers who used to buy in boutiques or department stores?","a":"Internal data suggests a large share of online buyers live within a short distance of a boutique and were previously frequent in-store customers; two department-store partners have also cut shelf space citing the brand's own online promotions."},{"q":"What happened to cocoa and other input costs over the period, and did competitors face the same?","a":"Cocoa prices spiked for the whole industry; most premium peers passed it through with price increases, while Verhaegen held prices online to drive adoption."},{"q":"How has boutique traffic and the fixed cost base changed?","a":"Boutique footfall is down modestly, but rents and staffing are unchanged, and the Ghent factory is running below its planned utilization."}],"buckets":[{"name":"Channel margin ladder","subs":["Contribution per kg: boutique vs duty-free/wholesale vs e-commerce","Online promo depth, free-shipping threshold and returns","Price pass-through of cocoa cost by channel"]},{"name":"Cannibalization vs incremental demand","subs":["Share of online buyers who were boutique or department-store customers","Boutique footfall decline in cities with high online penetration","Wholesale partners delisting or cutting space in response"]},{"name":"Cost to serve the online order","subs":["Cold-chain pick, pack and ship cost per order and seasonal peaks","Paid-media acquisition cost vs repeat rate","Gift packaging and breakage"]},{"name":"Fixed base & factory","subs":["Boutique rents and staffing vs traffic","Ghent factory utilization and cocoa hedging","Central overhead added for digital"]}],"generic":"Profitability (channel mix / cannibalization variant)","tailored":"A plain revenue-versus-cost tree would show revenue up and cost up and miss the point; the structure was rebuilt around channel contribution and incrementality, because the EUR 8 million profit gap comes from moving high-margin boutique sales into a break-even online channel while fixed boutique costs stayed.","hyp":"Roughly half of the EUR 32 million online revenue is cannibalized from boutiques; losing a 35% boutique margin on EUR 15 million is about EUR 5 million, and the online channel's own negative contribution adds a few million more, which together explain the EUR 8 million decline. Repricing online, raising the free-shipping threshold and restricting online promotions to markets without a boutique restores profit without exiting digital.","trap":"Bolting a cost-cutting frame onto a growth story and recommending cutting digital marketing. The question is incrementality per channel: 12% revenue growth that moves sales from a 35% margin channel into a break-even one destroys profit even with no cost problem.","start":"Channel margin ladder","startWhy":"Profit fell EUR 8 million while revenue rose, so the margin per euro changed; lay out contribution by channel first and the cannibalization question falls out of it."},{"id":"cost-n1","type":"cost","diff":1,"title":"Box Plant","client":"Tallgrass Packaging","industry":"Industrial / corrugated packaging","prompt":"Tallgrass Packaging is an independent corrugated box manufacturer headquartered in Hutchinson, Kansas, with two converting plants serving food processors, distribution centers and agricultural shippers within a 300-mile radius. It generates about $210 million in revenue with 620 employees and buys its containerboard from the large integrated paper companies, which also compete with it for customers. Margins have compressed as the integrated players have undercut it on price. The CEO has asked you to find $19 million of annual cost savings, about 10% of the $190 million cost base, within 18 months, without losing customers or degrading on-time delivery.","questions":[{"q":"How does the business make money and what are the main cost categories?","a":"It converts purchased containerboard into boxes; paper is well over half of total cost, with plant labor, energy, freight and overhead making up the rest."},{"q":"Is the target $19 million of recurring annual savings in 18 months, and does the CEO accept one-time restructuring cost to get there?","a":"Yes, recurring; a reasonable one-time cost with payback inside two years is acceptable."},{"q":"How do the two plants compare on cost per thousand square feet produced, and how are they utilized?","a":"The smaller plant runs materially higher conversion cost per unit and is under 60% utilized; the larger plant is near 80%."},{"q":"Is the cost pressure specific to Tallgrass, or are all independents facing it?","a":"All independents face the integrated players' pricing, but Tallgrass's waste and changeover metrics lag the independent benchmark."},{"q":"How is containerboard purchased, and is pricing indexed or negotiated?","a":"Mostly under annual contracts indexed to a published price with little volume leverage; the company has never consolidated its three suppliers."}],"buckets":[{"name":"Containerboard & materials","subs":["Containerboard purchase price vs index and supplier consolidation","Trim waste and yield on the corrugator","Starch, ink and adhesive consumption"]},{"name":"Plant conversion cost","subs":["Corrugator uptime and changeover time","Crew size per shift and overtime vs volume","Energy: steam and natural gas per MSF"]},{"name":"Freight & delivery","subs":["Private fleet vs common carrier cost per load","Customer density and delivery radius","Backhaul and trailer utilization"]},{"name":"Overhead & two-plant structure","subs":["Duplicated admin, scheduling and maintenance across plants","Sales commissions and customer service","Consolidation of volume into the larger plant"]}],"generic":"Cost reduction","tailored":"Variable cost became containerboard specifically, since it dominates and is bought from competitors; fixed cost was split into conversion and the two-plant structure, because the real lever is consolidating under-utilized capacity rather than trimming each plant.","hyp":"Paper is about 55% of cost, so a 5% improvement from supplier consolidation and waste yield is worth roughly $5 million; the rest of the $19 million comes from consolidating volume into the larger plant and cutting a shift at the smaller one.","trap":"Treating plant labor as variable. Crew sizes are fixed per shift on a corrugator, so savings come from removing shifts or consolidating plants, not from trimming hours proportionally to volume.","start":"Containerboard & materials","startWhy":"At over half of cost, a few points on paper price and yield is the largest single pool of savings and can be sized quickly."},{"id":"cost-n2","type":"cost","diff":2,"title":"Administrative Weight","client":"Whitcombe College","industry":"Education / private higher education","prompt":"Whitcombe College is a private liberal-arts college in Lancaster County, Pennsylvania, with about 1,900 undergraduates, 220 faculty and 480 non-faculty staff, an operating budget of $110 million and an endowment of $280 million. Enrollment has fallen 12% over five years as the regional pool of high school graduates shrinks, and the college now runs a structural deficit of about $9 million a year that it has covered by drawing more from the endowment than its policy allows. The board of trustees has asked you to find $9 million of recurring savings over three years without cutting the academic programs and student experience that drive enrollment, and without touching the tenure system.","questions":[{"q":"How does the college fund itself, and how much of revenue is net tuition after financial aid?","a":"Net tuition and room and board are the large majority of revenue, with the endowment draw and gifts covering the rest; the tuition discount rate has climbed to above 55%."},{"q":"Is the goal $9 million of recurring savings over three years, and is enrollment assumed flat?","a":"Yes, recurring savings; the board assumes enrollment stays roughly flat and does not want savings that depend on growth."},{"q":"How has staff headcount changed relative to students, and in which functions?","a":"Non-faculty staff grew about 25% over the period while students fell 12%, concentrated in student services, advancement, IT and compliance roles."},{"q":"Are peer colleges in the region facing the same pressure, and have any shared services?","a":"Most peers face the same demographic decline; a few have joined consortia for back-office functions, and the college has not."},{"q":"How many academic sections are under-enrolled, and what is the adjunct versus tenured mix?","a":"Roughly a fifth of sections run below ten students, mostly in a handful of low-enrollment majors; about 30% of teaching is done by adjuncts."}],"buckets":[{"name":"Student services & administrative staff","subs":["Staff-to-student ratio by function vs peers","Shared services with a consortium for HR, IT, finance","Athletics: 22 varsity teams and coaching staff"]},{"name":"Academic delivery","subs":["Under-enrolled sections and low-enrollment majors","Teaching loads, course releases and adjunct mix","Program consolidation without closing departments"]},{"name":"Facilities & auxiliaries","subs":["Space utilization and buildings to mothball","Dining and housing contracts and occupancy","Energy and deferred maintenance"]},{"name":"Financial aid discount","subs":["Discount rate by incoming class and yield","Merit aid to students who would enroll anyway","Net tuition revenue per student"]}],"generic":"Cost reduction","tailored":"Cost buckets follow how a college actually spends: staff by function, academic delivery, facilities. The financial-aid discount was added as a cost bucket because unfunded aid is the college's largest and least visible expense, and faculty cost was treated as fixed because tenure removes headcount as a lever.","hyp":"Staff grew 25% while students fell 12%, so the biggest pool is administrative and student-services headcount, probably $5-6 million; consolidating under-enrolled sections and trimming merit aid that does not change enrollment decisions closes the rest.","trap":"Treating tenured faculty as variable headcount, or cutting admissions and marketing spend. The first is not available and the second attacks the revenue side the board said to protect.","start":"Student services & administrative staff","startWhy":"The divergence between staff growth and student decline is the clearest signal in the case and the largest controllable pool; size it first."},{"id":"cost-n3","type":"cost","diff":2,"title":"Turndown Service","client":"Saltmarsh Hospitality Group","industry":"Hospitality / select-service hotels","prompt":"Saltmarsh Hospitality Group, based in Charleston, South Carolina, owns and operates 38 select-service and extended-stay hotels under major brand flags across the Carolinas and Georgia. It has about 4,600 rooms, 1,900 employees and $240 million in revenue. Over three years, RevPAR has been flat while hourly wages have risen sharply, and gross operating profit margin has fallen from 42% to 35%. The brand owners enforce minimum service standards and guest-satisfaction thresholds, and falling below them can put a flag at risk. The CEO has asked you to recover five points of GOP margin, roughly $12 million, within two years without dropping guest scores below brand standards.","questions":[{"q":"How does the group make money and what are the big cost lines at the property level?","a":"Room revenue is about 90% of the total; the largest costs are rooms labor, especially housekeeping and front desk, then utilities, brand fees and online travel agency commissions."},{"q":"Is the target five points of GOP margin, about $12 million, within two years, and is selling hotels off the table?","a":"Yes to the target; portfolio sales are not part of this engagement."},{"q":"How has housekeeping productivity changed, and do guests still get daily cleaning by default?","a":"Minutes per occupied room have crept up, and most properties still clean every room every day even though the brands now allow opt-out or every-other-day in extended-stay."},{"q":"Are peer owners facing the same margin squeeze?","a":"Wage pressure is industry-wide, but comparable owners run GOP margins in the high 30s, so Saltmarsh has fallen behind on labor and procurement."},{"q":"How much of distribution comes through OTAs versus direct and brand channels?","a":"OTA share has drifted up, which raises commission cost per booking; the group has no central revenue-management team."}],"buckets":[{"name":"Rooms labor","subs":["Housekeeping minutes per occupied room and daily-clean default","Front-desk staffing to the arrival curve and night audit","Contract vs employee labor and overtime"]},{"name":"Property operating costs","subs":["Utilities per occupied room","Brand-mandated amenities, breakfast and supplies","Repairs and maintenance cadence"]},{"name":"Procurement & distribution cost","subs":["Linen, OS&E and food group purchasing across 38 hotels","OTA commissions vs direct booking share","Brand and franchise fees"]},{"name":"Above-property overhead","subs":["Regional GM span and cluster management","Centralized revenue management and accounting","Corporate office headcount"]}],"generic":"Cost reduction","tailored":"The cost tree was built from the hotel P&L: rooms labor first because it is the largest and most controllable, and distribution cost treated as cost (commissions) rather than revenue; brand standards were added as a hard constraint on every lever.","hyp":"Housekeeping is the largest pool: moving extended-stay properties to opt-out cleaning and staffing housekeeping to occupancy rather than fixed rosters recovers two to three points; group procurement and OTA shift deliver the rest.","trap":"Treating all rooms labor as variable. A 24-hour front desk and night audit are fixed per hotel regardless of occupancy, so the variable lever is housekeeping minutes per occupied room, not headcount at the desk.","start":"Rooms labor","startWhy":"Wages drove the seven-point decline and housekeeping is the one labor pool that scales with occupied rooms; size it first."},{"id":"cost-n4","type":"cost","diff":3,"title":"Cloud Bill","client":"Tessellate Analytics","industry":"TMT / B2B software","prompt":"Tessellate Analytics is a venture-backed B2B software company in Austin, Texas, that sells a cloud data-analytics platform to mid-market retailers and logistics companies. It has about $95 million of annual recurring revenue, 520 employees and is growing roughly 30% a year. Over the last two years its gross margin has fallen from 74% to 61% because cloud hosting costs on its public-cloud provider have grown faster than revenue, and customers run increasingly heavy queries against ever-larger datasets. The board wants gross margin back to 72% within four quarters without slowing growth or breaching customer uptime and performance commitments. The CEO has asked you where the cost should come out.","questions":[{"q":"What is in cost of revenue, and how large is hosting relative to the rest?","a":"Hosting is the biggest piece, around $28 million, followed by customer support and onboarding staff and some third-party data licenses."},{"q":"Is the goal 72% gross margin within four quarters on a growing revenue base, and is a price increase acceptable to the board?","a":"Yes to the target; pricing changes are acceptable as long as churn does not rise meaningfully."},{"q":"How is consumption distributed across customers, and do contracts charge for usage?","a":"Very skewed: a small group of large accounts drives about half of compute, and most contracts are flat per-seat with no usage caps."},{"q":"Is this margin compression typical for data-platform peers, or specific to Tessellate?","a":"Peers with usage-based pricing hold margins in the low 70s; Tessellate's seat-based pricing leaves it exposed as data volumes grow."},{"q":"How much of the cloud spend is on-demand versus committed, and how much capacity sits idle?","a":"Most is on-demand with little reserved commitment, and engineering estimates a meaningful share of clusters sit idle outside business hours."}],"buckets":[{"name":"Customer-driven consumption","subs":["Compute per customer vs contract value (negative-margin accounts)","Seat-based vs usage-based pricing and overage terms","Default data retention and query limits in the product"]},{"name":"Compute & storage architecture","subs":["Idle cluster time and autoscaling","Storage tiering of cold data","Query engine efficiency per terabyte scanned"]},{"name":"Commercial terms with the cloud provider","subs":["Reserved and committed-use discounts vs on-demand","Egress fees and region placement","Multi-year enterprise agreement"]},{"name":"Other cost of revenue","subs":["Support and onboarding headcount per customer","Third-party data licenses","Professional services delivery"]}],"generic":"Cost reduction","tailored":"Variable cost became cloud consumption, which is driven by customer behavior as much as engineering; a commercial bucket for pricing and contract terms was placed first because the biggest lever is making heavy users pay, not making compute cheaper.","hyp":"The thirteen-point gap is about $12 million on $95 million; roughly 10% of customers consuming half of a $28 million hosting bill on flat contracts is the core problem. Usage-based terms or caps on that tail plus committed-use discounts recover eight to ten points; architecture cleanup covers the rest.","trap":"Treating this as an engineering cost-cut and sending the whole target to infrastructure. Average gross margin hides accounts with negative margin; the lever is repricing consumption, and cutting support headcount would slow the growth the board protected.","start":"Customer-driven consumption","startWhy":"If a tail of accounts consumes half the compute without paying for it, no infrastructure optimization fixes the unit economics; prove or disprove that first."},{"id":"cost-n5","type":"cost","diff":4,"title":"Mandatory Post","client":"Merrimack Valley Regional Jail Authority","industry":"Public sector / corrections","prompt":"The Merrimack Valley Regional Jail Authority runs a 1,100-bed pretrial and short-sentence jail on behalf of four counties on the New Hampshire-Massachusetts border. Average daily population has fallen from about 1,050 to 820 over five years as bail reform and diversion programs took hold, but the budget has grown to $78 million, 85% of it personnel for 410 correctional officers and support staff. Overtime alone is $11 million a year because every security post must be filled around the clock and 60 officer positions are vacant. The four county executives have told the authority to cut $8 million, about 10%, over two fiscal years while meeting state staffing and safety standards and court-ordered medical care. The jail superintendent has asked you how to do it.","questions":[{"q":"How is the jail funded and how is staffing determined day to day?","a":"The counties fund it by formula; staffing is driven by a post plan that lists every security post that must be filled on each shift, regardless of how many officers are on payroll."},{"q":"Is the target $8 million of recurring reduction over two fiscal years, and what constraints are non-negotiable?","a":"Yes; state minimum staffing ratios, the medical consent decree and inmate safety are fixed constraints, and the union contract governs schedules."},{"q":"How many housing units are open, and could the lower population be consolidated into fewer units?","a":"Ten housing units are open; several run well below capacity, and classification rules, not bed count, have kept them open."},{"q":"Are other regional jails in New England seeing the same population decline and overtime pattern?","a":"Yes, population is down nearly everywhere; some jails have closed units and a few have taken in federal or other-county detainees for a per-diem to fill empty beds."},{"q":"What are the largest non-personnel contracts?","a":"The inmate medical and pharmacy contract and the food-service contract; the medical contract is priced on the old population level."}],"buckets":[{"name":"Post plan & housing configuration","subs":["Mandated posts per open housing unit","Consolidating 820 inmates into fewer units within classification rules","Non-security posts that could be civilianized"]},{"name":"Overtime & scheduling","subs":["Vacancies (60 of 410) driving mandatory overtime at 1.5x","Sick and FMLA leave rates and shift pattern (8 vs 12 hours)","Relief factor used to size the roster"]},{"name":"Non-personnel contracts","subs":["Medical and pharmacy contract repriced to 820 average daily population","Food service cost per inmate-day","Court transport replaced by video arraignment"]},{"name":"Revenue offsets","subs":["Per-diem boarding of federal or other-county detainees in empty beds","State reimbursement for state-sentenced inmates","Fund balance and capital charges"]}],"generic":"Cost reduction (public-sector variant)","tailored":"Labor in a jail is fixed by the post plan, not by headcount or population, so the structure starts from posts and housing units rather than FTEs; a revenue-offset bucket was added because the counties' real goal is their net contribution, not the gross budget, and safety and legal mandates sit over every lever as constraints.","hyp":"Closing two of ten housing units removes roughly 40 mandated posts, worth about $6 million including the overtime they generate; repricing the medical contract to the actual population covers most of the remaining $2 million.","trap":"Cutting officer headcount to hit the number. With mandatory posts, fewer officers means more overtime at time-and-a-half, not less cost; the only way to cut labor is to close posts. Also forgetting the goal is counties' budgets plus safety and legal compliance, not profit.","start":"Post plan & housing configuration","startWhy":"Every dollar of labor flows from the number of posts, so you must know how many posts a smaller footprint needs before overtime or headcount means anything."},{"id":"compete-n1","type":"compete","diff":1,"title":"Unlimited Wash","client":"Sunburst Car Wash","industry":"Consumer services / car wash","prompt":"Sunburst Car Wash is a family-owned chain of 22 express tunnel car washes across the Phoenix metro area, founded in 1998, with about $48 million in revenue and 300 employees. It sells mostly single washes at $12 to $25 with a small membership program. Over the last 18 months a private-equity-backed national chain has opened nine sites in the same suburbs, selling unlimited-wash memberships at $20 a month and advertising heavily. Sunburst's wash volume is down 11% at the sites that overlap with the new entrant and flat elsewhere. The owner has asked you how he should respond and how to protect revenue over the next twelve months.","questions":[{"q":"How does Sunburst make money: single washes versus memberships, and what is the cost of an incremental wash?","a":"About 80% of revenue is single retail washes; the incremental cost of a wash is low, mostly chemicals, water and a little labor, since tunnels are staffed regardless of volume."},{"q":"What is the goal: hold total revenue, hold volume, or protect profit over twelve months?","a":"Protect revenue and profit; the owner would accept lower price per wash if total site profit holds."},{"q":"How many of the 22 sites actually overlap with the entrant's nine, and how busy are the tunnels?","a":"Nine or ten sites sit within a few miles of a new competitor; across the network tunnels run at under half their theoretical capacity."},{"q":"Is this entrant doing the same thing in other cities, and are they sustainable at $20?","a":"Yes, it is a national roll-up playbook; the membership price is thin but works for them at high volume and frequency."},{"q":"What do customers who left say, and how often does a typical Sunburst customer wash?","a":"Departing customers cite the membership value; the average Sunburst customer washes roughly once a month, while members at the competitor wash three or more times."}],"buckets":[{"name":"Customer & wash occasion","subs":["Retail single-wash vs member customers and wash frequency","Trade-area overlap: which sites actually lost volume","Price sensitivity by wash package"]},{"name":"Entrant's model & staying power","subs":["Membership economics at $20/month and site pipeline","Promotional intensity and funding horizon","Service quality and throughput at their sites"]},{"name":"Our economics & capacity","subs":["Tunnel utilization and marginal cost per wash","Fixed site cost and breakeven washes per day","Membership program design and churn"]},{"name":"Response options","subs":["Launch or reprice membership at overlapping sites only","Differentiate on interior cleaning, detail and speed","Do nothing at non-overlap sites; consider sale to a consolidator"]}],"generic":"Competitive response","tailored":"The customer bucket was framed around wash occasion and frequency, because membership changes how often people wash, not just what they pay; own capacity was added because a membership response only works if tunnels have spare throughput, which they do.","hyp":"With tunnels under 50% utilized and marginal cost per wash low, a $20 membership at the ten overlapping sites wins back frequent washers profitably; the other twelve sites should keep retail pricing.","trap":"Matching the membership price across all 22 sites when only ten face the entrant, which gives away margin at sites that are not under attack.","start":"Customer & wash occasion","startWhy":"Which customers left, at which sites, and how often they wash determines whether membership is the right weapon and where to aim it."},{"id":"compete-n2","type":"compete","diff":2,"title":"Empty Units","client":"Lockhaven Self Storage","industry":"Real estate / self-storage","prompt":"Lockhaven Self Storage is a privately held operator of 34 self-storage facilities in the Dallas-Fort Worth metroplex, with about 24,000 units, 2.1 million rentable square feet, 110 employees and $38 million in revenue. Occupancy has slid from 92% to 84% over two years as three public REITs and several developers delivered roughly 15% new supply in Lockhaven's submarkets, with new facilities offering one-dollar first-month deals and steep web rates to lease up. The CEO reports to a family office that cares about net operating income and asset value. She has asked you how Lockhaven should respond to hold occupancy and NOI over the next 18 months.","questions":[{"q":"How does a storage facility make money, and how does pricing work for new versus existing tenants?","a":"Rent per occupied square foot plus tenant insurance and fees; new customers get a discounted web rate while existing tenants receive regular rate increases, and most tenants stay well over a year."},{"q":"Is the goal occupancy, NOI, or asset value, and over what horizon?","a":"NOI over 18 months, since valuation follows NOI; the owner would trade a few points of occupancy for higher revenue per square foot."},{"q":"Is the occupancy loss spread evenly across the 34 facilities, or concentrated where new supply opened?","a":"Concentrated: around ten facilities within three miles of a new competitor account for most of the decline; the rest are stable."},{"q":"Is this a national self-storage oversupply or specific to DFW?","a":"DFW is among the most overbuilt metros; competitors in lease-up typically price aggressively for 18-24 months and then raise rates."},{"q":"How much does Lockhaven spend on search advertising and aggregator listings, and how does its web ranking compare?","a":"It spends less than the REITs per facility and ranks below them on search in several submarkets."}],"buckets":[{"name":"Submarket supply & demand","subs":["New deliveries within three miles of each facility and their lease-up stage","Household moves and housing turnover driving storage demand","Facilities exposed vs stable"]},{"name":"Rate management","subs":["Web rate for new tenants vs in-place rent for existing tenants","Existing-customer rate increase cadence and move-out response","Unit-size mix and climate-controlled premium"]},{"name":"Customer acquisition & retention","subs":["Search and aggregator spend and ranking by submarket","Length of stay and churn by tenant type","Tenant insurance and ancillary attach"]},{"name":"Response options","subs":["Targeted web-rate cuts and promotions at exposed facilities only","Raise in-place rents at stable facilities to fund the defense","Defer development, convert units, or sell exposed assets to a consolidator"]}],"generic":"Competitive response","tailored":"The market bucket was split into submarket supply (self-storage competes within a three-mile trade area) and rate management (storage uniquely prices new and existing tenants differently), so neither bucket does two jobs; the response bucket reflects that lease-up competitors are temporary.","hyp":"The eight-point occupancy loss sits in about ten exposed facilities; cutting web rates there for 18 months while continuing in-place rent increases on the roughly 80% of tenants who do not move holds NOI, because existing tenants are sticky and the competitors will raise rates once leased up.","trap":"Cutting rates across all 24,000 units to defend a few hundred vacancies, or putting supply and pricing in one market bucket so the analysis never separates where the problem is from how to price against it.","start":"Submarket supply & demand","startWhy":"If the loss is concentrated in ten facilities, the response is surgical; confirm the geography before touching pricing."},{"id":"compete-n3","type":"compete","diff":2,"title":"Fixed Wireless","client":"Shoreline Broadband","industry":"TMT / regional internet service provider","prompt":"Shoreline Broadband is a regional cable and fiber internet provider serving about 95,000 subscribers across 40 towns on the midcoast of Maine. Formerly a cooperative, it is now privately owned, has 280 employees and about $110 million in revenue, with average revenue per subscriber of $85 a month. In the past year the national mobile carriers launched 5G fixed wireless home internet across much of its footprint at a flat $50 a month with no contract and no installation, and Shoreline has lost about 6,000 subscribers, more than 6% of its base. The CEO has asked you for a response plan within 90 days that stops the churn and protects ARPU.","questions":[{"q":"How does Shoreline make money and what does an incremental subscriber cost to serve?","a":"Almost entirely monthly internet subscriptions, with a small TV and phone bundle; the network is largely fixed cost, so each lost subscriber is nearly all margin."},{"q":"What is the goal: stop subscriber loss, protect ARPU, or protect total margin, and over what horizon?","a":"Protect total contribution over the next two years; the CEO would accept a lower ARPU on some customers if total margin holds."},{"q":"Who is churning: which speed tiers, usage levels and geographies?","a":"Churn is concentrated in the entry speed tier, among low-data users, and in the more rural edges of the footprint where the old coaxial plant is weakest."},{"q":"Is fixed wireless taking share from cable operators everywhere, or is Shoreline unusually exposed?","a":"It is a national pattern for low-usage households, but Shoreline's footprint has fewer competing wired options, so the carriers targeted it early."},{"q":"What limits the fixed wireless offer: capacity, speed consistency or coverage?","a":"Each cell tower can serve only so many homes before speeds degrade, so the carriers cap sign-ups by area and cannot take the whole base."}],"buckets":[{"name":"Who is churning","subs":["Entry-tier, low-usage households vs heavy streamers","Seasonal homes and rural coaxial-edge customers","Lifetime value of the lost segment"]},{"name":"Fixed wireless constraints","subs":["Capacity per cell and sign-up caps by town","Speed consistency at peak and in summer tourist season","Pricing sustainability for the carriers"]},{"name":"Our product & price architecture","subs":["Entry speed tier priced near $50 for the at-risk segment","Contract, install fee and promo structure","Fiber upgrade footprint and mobile bundle via MVNO"]},{"name":"Response economics","subs":["Margin cost of a lower entry tier across the base vs value of churn saved","Fencing the offer to avoid trading down loyal customers","Which segments to let go"]}],"generic":"Competitive response","tailored":"The customer bucket was defined by churn segment, since fixed wireless attacks a specific low-usage household; a competitor-constraints bucket was added because cell capacity limits how much of the base is actually addressable, which changes how much defense is needed.","hyp":"Churn is concentrated in low-usage entry-tier homes; a fenced $50 entry tier for that segment, plus faster fiber upgrades at the rural edges, saves more contribution than it costs, while the carriers' capacity caps mean the heavy-usage core is not at risk.","trap":"Cutting price for the whole base. Dropping $85 ARPU on 95,000 subscribers to save 6,000 destroys far more margin than the churn did; the answer must be fenced to the at-risk segment.","start":"Who is churning","startWhy":"The segment that left defines both how much is at risk and which product change would hold them; everything else follows from it."},{"id":"compete-n4","type":"compete","diff":3,"title":"Partner Exodus","client":"Greaves Whitlock CPAs","industry":"Professional services / accounting","prompt":"Greaves Whitlock is a regional accounting firm headquartered in Minneapolis with 42 equity partners, 480 staff and about $120 million in revenue from tax, audit and advisory work for privately held companies across the upper Midwest. In the last year a private-equity-backed national accounting platform has entered the Twin Cities, acquired two local firms, and approached several Greaves Whitlock partners with upfront buyouts and equity in the platform. Two partners have already left, taking clients worth about $9 million in annual fees, and the firm's managing partner believes more offers are coming. He has asked you how the firm should respond, and he is not sure whether this is a fight for clients, a fight for talent, or a question of whether the firm itself needs capital.","questions":[{"q":"How does the partnership make money and how are partners paid and retired?","a":"Partners share the profit pool after staff costs; retiring partners are paid out their capital plus a deferred-compensation stream funded from future profits, which is currently unfunded."},{"q":"What is the goal: retain partners and clients, protect per-partner income, or preserve independence, and over what horizon?","a":"Keep the firm viable and independent if possible over the next five years, but the managing partner would consider outside capital if that is the only way to retain partners."},{"q":"How many partners are within five years of retirement, and how much revenue do they control?","a":"Roughly eight, and together they control about $30 million of fees; several have told the managing partner the PE buyout is more attractive than the firm's retirement payout."},{"q":"Is this PE roll-up pattern happening to other regional firms, and how does the platform run its acquired firms?","a":"It is happening across the country; the platforms pay partners upfront, shift work offshore and into technology, and plan to exit in five to seven years."},{"q":"How dependent are the clients on individual partners versus the firm?","a":"Highly partner-dependent in tax and advisory; audit clients are stickier because of firm-level quality control and rotation rules."}],"buckets":[{"name":"Where the firm is exposed","subs":["Partners near retirement with unfunded payouts and the fees they control","Client stickiness by service line (tax and advisory vs audit)","Service lines where the platform can outspend on technology and offshore"]},{"name":"The platform's model & economics","subs":["Upfront buyout plus equity vs the firm's deferred payout","Offshoring and technology leverage on cost per engagement","Exit timeline and what happens to partners after"]},{"name":"Our proposition to partners & clients","subs":["Partner compensation, buy-in and retirement funding reform","Capacity to invest in technology and offshore delivery","Independence, culture and client relationships as retention value"]},{"name":"Strategic options","subs":["Stand alone with compensation and retirement reform","Merge with a peer regional firm","Take minority capital or sell to a platform on the firm's own terms"]}],"generic":"Competitive response","tailored":"The competitor here is bidding for partners, not clients, so the customer bucket became partner exposure and the competitor bucket became the buyout economics; a strategic-options bucket was added because the response may be to change the firm's own capital structure rather than to fight.","hyp":"The real vulnerability is the eight partners near retirement controlling $30 million of fees with an unfunded payout; this is a talent-and-capital fight, and the response is to fund retirements and technology, probably with outside capital, rather than to compete for clients on price or service.","trap":"Treating it as a client-competition case and building a pricing and service response, or comparing the PE offer at headline revenue multiples rather than what a partner actually nets after tax versus the firm's deferred payout.","start":"Where the firm is exposed","startWhy":"Until you know which partners and fees are at risk and why the buyout beats the firm's own payout, you cannot tell whether this is a retention problem or a capital problem."},{"id":"compete-n5","type":"compete","diff":4,"title":"Deep Water","client":"Port of Calder Bay","industry":"Public sector / seaport authority","prompt":"The Port of Calder Bay is a public port authority in Washington State governed by five elected commissioners. It handles about 1.1 million TEU of containers a year through two terminals leased to private operators, supports roughly 1,900 direct longshore jobs and earns about $140 million in lease and fee revenue, with a small property-tax levy on the county. A rival port 120 miles down the coast completed a $900 million terminal automation program and a channel-deepening project two years ago, and two of the three shipping alliances have since moved their largest services there, cutting Calder Bay's volume 14%. The commission's mandate is regional jobs, trade volume and the county tax base, not profit, and the longshore labor agreement sharply limits automation. The commissioners have asked you how the port should respond.","questions":[{"q":"How does the authority make money, and how do the terminals and the longshore workforce fit in?","a":"The port earns terminal leases, wharfage and dockage fees and rail and property income; the terminal operators run the cranes and the longshore union supplies labor under a coast-wide agreement."},{"q":"What is the goal: recover the lost 14% of TEU, protect jobs, protect authority revenue, or something else, and over what horizon?","a":"The commission weighs jobs and regional economic output first, then volume and revenue; they are thinking in five to ten year terms, not quarters."},{"q":"Why did the alliances move: vessel size and draft, terminal productivity, rail connections, or price?","a":"Mainly the ability to work larger ships faster with a deeper channel and faster cranes; Calder Bay's rail dwell times were also cited."},{"q":"Is container volume shifting to a few mega-ports nationally, or is this a Calder Bay-specific loss?","a":"It is a national consolidation trend toward ports that can handle the largest ships; smaller ports that have done well pivoted to specialized cargo."},{"q":"What does the port control itself versus what depends on the federal government or the union?","a":"It controls tariffs, lease terms, marketing and land use; channel dredging requires federal funding and approval, and automation requires union agreement."}],"buckets":[{"name":"Why the cargo moved","subs":["Alliance network decisions and vessel size vs channel depth","Terminal productivity: container moves per crane-hour","Inland rail connectivity and container dwell time"]},{"name":"What the port controls","subs":["Tariffs, lease incentives and marketing to carriers","Rail and gate operations with partners","Dredging (federal) and automation (union) as constrained levers"]},{"name":"Response options","subs":["Head-on: seek federal dredging and negotiated semi-automation","Niche: agricultural exports, autos, breakbulk and transload","Partner with the rival or diversify into real estate and cruise"]},{"name":"Jobs & public value","subs":["Longshore jobs per thousand tons by cargo type","County tax base and levy exposure","Environmental permitting and community acceptance"]}],"generic":"Competitive response (public-sector variant)","tailored":"A competitive-response frame was kept but the objective function was rewritten to jobs and regional output, which changes which responses win; a control bucket was added because federal and union constraints remove the obvious moves, and the competitor is really the carrier alliances' network choices, not just the rival port.","hyp":"The largest alliance services are lost for a decade; the response that best serves the mandate is a niche strategy in agricultural exports, autos and breakbulk, which carry more longshore hours per ton than containers, combined with fixing rail dwell to hold the remaining alliance.","trap":"Defining the goal as port revenue and recommending automation to win back containers, which would destroy the jobs the commission exists to protect; or leaving the market as one bucket so carrier decisions and port capability are never separated.","start":"Why the cargo moved","startWhy":"Whether the loss came from channel depth, crane speed or rail tells you which of it is recoverable within the port's constraints and which is gone."},{"id":"turnaround-n1","type":"turnaround","diff":1,"title":"Last Aisle","client":"Tumbleweed Toys","industry":"Consumer / specialty retail","prompt":"Tumbleweed Toys is a regional toy and game retailer headquartered in Tulsa, Oklahoma, with 45 stores across Oklahoma, Texas, Arkansas and Missouri, about $190 million in revenue and 1,400 employees. Founded in 1979, it built its reputation on knowledgeable staff and a broad range, but it has lost money for three straight years, including a $12 million loss last year, as mass merchants and online retailers took share. Inventory is high, several vendors have tightened credit terms, and the company is likely to breach its bank covenants within nine months. The lender and the board have jointly hired you to stabilize the business and lay out a path back to profitability within 18 months.","questions":[{"q":"How does the business make money and how seasonal is it?","a":"Product margin on toys and games sold in stores, with a tiny online presence; roughly 40% of annual sales and most of the profit come in the eight weeks before Christmas."},{"q":"What is the goal and the hard deadline: avoid the covenant breach, return to profit in 18 months, or both?","a":"Both; avoiding the covenant breach in nine months is the immediate test, and the lender wants a credible plan to profitability in 18 months."},{"q":"How much cash and borrowing capacity does the company have, and how does inventory compare with sales?","a":"Liquidity is tight, with only a few months of runway before the holiday inventory build, and inventory is turning noticeably slower than two years ago."},{"q":"Are all 45 stores losing money, or is it concentrated?","a":"Concentrated: around a quarter of stores lose money at the four-wall level, mainly in small Texas and Arkansas markets; the Tulsa and Oklahoma City stores remain profitable."},{"q":"Is this an industry-wide decline for specialty toy retail, or specific to Tumbleweed?","a":"Specialty toy retail is under pressure everywhere, but a few regional chains have survived by shrinking to their best markets and leaning into games, collectibles and events."}],"buckets":[{"name":"Cash & covenant runway","subs":["Weeks of liquidity before the holiday inventory build","Inventory as trapped cash: clearance of slow stock","Vendor terms, credit insurance and lender waiver"]},{"name":"Store portfolio","subs":["Four-wall profit by store and lease expiry dates","Which 10-12 stores to close or renegotiate","Store labor hours vs sales by location"]},{"name":"Merchandise & margin","subs":["Inventory turns and markdown rate by category","Mix shift to games, collectibles and exclusives","Vendor terms and private-label margin"]},{"name":"Overhead & operating model","subs":["Corporate headquarters and distribution-center cost sized to 45 stores","E-commerce and loyalty as low-cost growth","Management team capability"]}],"generic":"Turnaround (stabilize, fix, grow)","tailored":"The standard stop-the-bleeding bucket became cash and covenant runway, because the nine-month covenant date and the holiday inventory build define the sequence; the fix phase was split into store portfolio and merchandise since retail turnarounds live or die on four-wall economics.","hyp":"Closing the quarter of stores that lose money at the four-wall level and liquidating slow inventory before the holiday build fixes liquidity and removes most of the $12 million loss; growth ideas wait until the covenant is secure.","trap":"Starting with strategy and growth, such as e-commerce or new formats, when the company may not survive nine months; in a turnaround, liquidity comes first and everything else is sequenced behind it.","start":"Cash & covenant runway","startWhy":"A covenant breach in nine months with a holiday inventory build in between means the first question is whether the company can fund the season at all."},{"id":"turnaround-n2","type":"turnaround","diff":2,"title":"Bed Count","client":"Larkspur Behavioral Health","industry":"Healthcare / behavioral health provider","prompt":"Larkspur Behavioral Health is a private nonprofit provider in Tucson, Arizona, operating two inpatient psychiatric hospitals with 180 licensed beds and eight outpatient clinics across southern Arizona. It has about $150 million in revenue and 1,300 employees, and roughly 60% of revenue comes from the state's Medicaid managed-care plans. Its operating loss has widened to $14 million, days cash on hand has fallen to about 45, and a shortage of psychiatric nurses has forced it to close 30 beds and rely heavily on agency staff. The board, which includes county officials and community leaders, has asked you for a turnaround plan that reaches breakeven within two years without abandoning the safety-net mission.","questions":[{"q":"How does Larkspur get paid, and how do Medicaid managed-care rates compare with its cost per patient day?","a":"Mostly per-diem rates from Medicaid managed-care plans, with some commercial and county crisis contracts; the Medicaid per diem has not kept pace with labor cost, and denials and slow payment have grown."},{"q":"Is the goal breakeven within two years on the operating line, and what defines the mission that cannot be cut?","a":"Breakeven within two years; the board will not exit crisis services or stop serving Medicaid patients, but is open to closing or merging specific clinics."},{"q":"What has closing 30 beds done to revenue and cost, and how much of nursing is agency?","a":"Revenue fell with the beds while most unit costs stayed; agency nurses now cover a large share of shifts at roughly double the hourly cost of employed staff."},{"q":"Are other behavioral health providers in Arizona in the same position, or is Larkspur an outlier?","a":"Staffing shortages are statewide, but peers that invested in recruiting and negotiated rate increases with the managed-care plans have stayed near breakeven."},{"q":"How do the eight outpatient clinics perform individually?","a":"A few are solidly positive, several are small losses, and two are significant losses with low volumes."}],"buckets":[{"name":"Liquidity & payer cash","subs":["Days cash and line of credit availability","Accounts receivable, denials and payment lag by managed-care plan","Timing of county and grant payments"]},{"name":"Inpatient capacity & staffing","subs":["Staffed beds vs 180 licensed and revenue lost per closed bed","Agency vs employed psychiatric RN and tech cost and recruiting pipeline","Length of stay, readmissions and throughput"]},{"name":"Rates & payer position","subs":["Medicaid managed-care per-diem negotiation and state supplemental funding","Commercial and county crisis contract mix","Value-based or quality incentive payments"]},{"name":"Service portfolio","subs":["Clinic-level margin and which to merge or close","Crisis, intensive outpatient and partial-hospitalization lines to grow","Mission services that need subsidy and how to fund them"]}],"generic":"Turnaround (stabilize, fix, grow)","tailored":"Stop-the-bleeding became payer cash collection since a provider's liquidity lever is receivables, not vendor stretching; the core fix is reopening staffed beds, because in a hospital the capacity you can staff is the revenue, and the mission sits as a constraint on portfolio decisions.","hyp":"The 30 closed beds represent roughly $20 million of lost annual revenue against largely fixed cost, which is more than the $14 million loss; reopening them with employed staff through a recruiting investment and a Medicaid rate renegotiation closes the gap, with clinic consolidation as the secondary lever.","trap":"Cutting clinical staff to cut cost. Here staffing is what has been lost, and every bed that stays closed loses more revenue than the labor would cost; treating labor as a cost to cut rather than the revenue enabler misreads the case. Also treating the Medicaid rate as fixed when peers have renegotiated it.","start":"Liquidity & payer cash","startWhy":"With 45 days of cash, the first job is to confirm the organization survives long enough to execute; collecting receivables and fixing denials is the fastest cash available."},{"id":"turnaround-n3","type":"turnaround","diff":2,"title":"Dry Dock","client":"Gulfport Marine Works","industry":"Industrial / ship repair","prompt":"Gulfport Marine Works is a third-generation family-owned ship repair and conversion yard on the Mississippi Gulf Coast, with two floating drydocks, about 700 employees and $160 million in revenue. Roughly half of its work is repair and maintenance of Navy and Military Sealift Command vessels, a third is commercial offshore supply vessels and tugs, and the rest is barges and ferries. After cost overruns on three large fixed-price government contracts, the yard has lost money for two years, including $18 million last year, and its surety has cut the bonding capacity it needs to bid new government work. The owner has asked you for a 24-month plan to return the yard to profitability and restore its ability to bid.","questions":[{"q":"How does the yard make money, and how do government and commercial contracts differ in pricing and risk?","a":"It bills labor, materials and drydock days; government work is mostly fixed-price with strict specifications and change-order processes, while commercial work is more often time-and-materials with faster payment."},{"q":"What is the goal and sequence: profitability within 24 months, restored bonding, or both, and is the family willing to shrink the yard?","a":"Both, and bonding comes first since it is the license to bid; the owner would accept a smaller, profitable yard."},{"q":"How are the two drydocks utilized, and how is the yard's labor productivity?","a":"Dock utilization is reasonably high; the losses are concentrated in a few contracts where estimated hours were badly exceeded and rework was high."},{"q":"Are other Gulf Coast yards struggling with government fixed-price work, or is this specific to Gulfport?","a":"Fixed-price Navy repair is difficult for everyone, but competitors with disciplined estimating and strong change-order management have stayed profitable."},{"q":"What is the skilled-labor market like on the Gulf Coast?","a":"Very tight; welders, pipefitters and electricians are hard to hire and competitors poach them, so laid-off craft workers rarely come back."}],"buckets":[{"name":"Cash & bonding capacity","subs":["Cash runway and progress-billing collection on current contracts","Surety requirements to restore bonding line","Claims and change orders owed on the overrun contracts"]},{"name":"Contract portfolio & bidding","subs":["Loss-making fixed-price jobs to complete, renegotiate or exit","Estimating accuracy and bid-to-actual hours by job type","Mix of government fixed-price vs commercial time-and-materials"]},{"name":"Yard execution","subs":["Drydock scheduling and days per job","Rework rate and first-time quality by trade","Own craft labor vs subcontractors"]},{"name":"Cost structure","subs":["Indirect overhead rate charged to government contracts","Craft wage rates vs area and retention","Material procurement and inventory"]}],"generic":"Turnaround (stabilize, fix, grow)","tailored":"Stabilize became cash plus bonding, because without the surety the yard cannot bid, which is a constraint peculiar to contractors; the fix phase was centered on bid discipline and contract portfolio rather than operations, since dock utilization is already fine.","hyp":"Three fixed-price contracts explain roughly $25 million of losses over two years, more than the total; finishing them with claims recovered, exiting that work type, and rebuilding estimating returns the yard to profit without shrinking the workforce.","trap":"Laying off craft labor to cut cost. In a tight Gulf Coast labor market the workers will not come back, future jobs will overrun again, and the problem was never utilization or headcount; it was how the work was bid.","start":"Cash & bonding capacity","startWhy":"Bonding is the license to operate in half the business, and the surety's conditions will dictate what the plan must deliver first."},{"id":"turnaround-n4","type":"turnaround","diff":3,"title":"Bog Down","client":"Marshfield Cranberry Cooperative","industry":"Agriculture / grower cooperative","prompt":"Marshfield Cranberry Cooperative is a grower-owned marketing cooperative in central Wisconsin with 210 member growers, two processing plants, about 900 employees and $420 million in revenue from branded and private-label juice, juice concentrate and sweetened dried cranberries. It handles about 2.8 million barrels of fruit a year. After three years of industry oversupply, finished-goods inventory stands at roughly 18 months of sales, payments to growers have been cut 40%, the cooperative lost $30 million last year, and about 60 growers are threatening to leave for a rival handler. Lenders are tightening the revolving credit line. The board of growers has asked you to save the cooperative, and they disagree among themselves about whether that means higher grower payments, keeping every member, or simply staying solvent.","questions":[{"q":"How does the cooperative make money and how does the grower payment work?","a":"It processes and sells members' fruit and pays growers from what is left after costs; the payment is the owners' return, so a cut hurts members directly, but it is also the cooperative's biggest cash outflow."},{"q":"What is the actual goal: solvency, grower payment per barrel, or member retention, and what is the lender's timeline?","a":"The lenders want inventory and losses down within 18 months; the board has not agreed on a single goal, which is part of why they hired you."},{"q":"How much fruit do members deliver relative to what the cooperative can sell at reasonable prices, and does it have the power to limit deliveries?","a":"Deliveries run well above what the market absorbs; the bylaws allow the board to regulate volume accepted, which it has avoided doing."},{"q":"Is the oversupply an industry problem or specific to Marshfield?","a":"Industry-wide: North American cranberry acreage expanded faster than demand, though branded sweetened dried cranberries and ingredient sales still earn decent margins while concentrate sells near cost."},{"q":"How are the two processing plants utilized and what does each cost per barrel?","a":"Both run below capacity and the older plant has a much higher cost per barrel; consolidating has been politically difficult because of local jobs."}],"buckets":[{"name":"Liquidity & inventory","subs":["Months of inventory and the cash tied up in it","Revolver covenants and lender requirements","Grower payment schedule as a cash lever"]},{"name":"Supply regulation","subs":["Delivery volume vs sellable volume and a quota or acceptance cap","Buying out or retiring acreage of exiting growers","Member retention terms"]},{"name":"Demand & product mix","subs":["Branded and ingredient sweetened dried cranberries vs commodity concentrate","Export markets and tariff exposure","Private-label contracts and pricing"]},{"name":"Processing footprint","subs":["Cost per barrel by plant and consolidation into one plant","Drying and sweetened-dried capacity","Labor and energy per barrel"]}],"generic":"Turnaround (stabilize, fix, grow)","tailored":"In a cooperative the owners are also the suppliers, so the stabilize phase includes supply regulation, a lever a normal company does not have, and grower payments are both the profit measure and the main cost; the ambiguous goal must be resolved to solvency first because the lenders set the clock.","hyp":"The cooperative is structurally oversupplied, and no sales effort moves 18 months of inventory in time; the plan is to cap accepted deliveries at roughly 80% of current volume, consolidate into the lower-cost plant, and accept a smaller membership, which raises the payment per barrel for those who stay even as total payments fall.","trap":"Trying to grow demand to absorb the glut, or cutting grower payments further as if they were an ordinary cost; cut too deep and growers leave, taking volume and the plants' economics with them. Also using the average payment per barrel when branded and commodity products contribute very differently.","start":"Liquidity & inventory","startWhy":"Eighteen months of inventory and a tightening revolver define how long the cooperative has; the inventory number sets the size of the supply cut needed."},{"id":"turnaround-n5","type":"turnaround","diff":4,"title":"Last Bell","client":"Saint Columba Diocesan Schools","industry":"Nonprofit / K-12 education","prompt":"Saint Columba Diocesan Schools is the network of 34 Catholic elementary schools and five high schools run by a diocese in western New York, around Buffalo. Enrollment has fallen from about 15,000 students ten years ago to 9,800 today, the combined operating budget is about $115 million with 1,100 teachers and staff, and the schools depend on $14 million a year in parish subsidies plus a diocesan contribution that covered a $9 million deficit last year and cannot continue at that level. The bishop and a lay board have asked you for a plan that keeps Catholic education viable in the region for the long term. They are explicit that the goal is mission: keeping seats accessible to families, especially low-income families in the city, and they would rather run fewer, stronger schools than slowly starve all of them.","questions":[{"q":"How are the schools funded: tuition, parish subsidies, diocesan support, state programs and philanthropy?","a":"Tuition covers roughly two-thirds of cost on average; parish subsidies, a scholarship fund, state reimbursements for textbooks, transportation and special services, and the diocese cover the rest, with wide variation by school."},{"q":"What is the quantified goal: eliminate the $9 million deficit, and over what horizon, and what does the mission constraint rule out?","a":"Eliminate the structural deficit within three years; closing the city schools that serve low-income families is not acceptable even though they lose the most money."},{"q":"How does enrollment compare with breakeven school by school?","a":"A school needs roughly 220 students to cover its costs; about a third of the elementary schools are below 150 and several are below 100."},{"q":"Are Catholic school systems elsewhere facing the same decline, and what has worked?","a":"Yes, nationally; dioceses that consolidated into regional academies, centralized back-office functions and raised scholarship endowments have stabilized, while those that closed schools one at a time kept losing families."},{"q":"When a school closes, where do its students go?","a":"Experience elsewhere suggests most transfer to a nearby Catholic school if one is within a reasonable drive and transportation is offered; without that, many go to public or charter schools."}],"buckets":[{"name":"School-by-school viability","subs":["Enrollment vs the 220-student breakeven and cost per pupil","Building condition and deferred maintenance","Local demand and competing public and charter options"]},{"name":"Network consolidation","subs":["Merging sub-150 schools into regional academies within driving distance","Transportation and retention of transferring students","Communities where seats must be kept for mission reasons"]},{"name":"Revenue & affordability","subs":["Tuition vs cost gap and the scholarship endowment","State reimbursements claimed vs available","Parish subsidy formula and major donors"]},{"name":"Operating model","subs":["Shared HR, finance and IT across schools","Teacher compensation and class size norms","Central office and governance"]}],"generic":"Turnaround (portfolio consolidation variant)","tailored":"There is no cash crisis bucket because the diocese is the lender; stop-the-bleeding became a school-portfolio decision, and the objective was rewritten from profit to mission reach plus solvency, which means the schools that lose the most money are the ones the plan must protect.","hyp":"Consolidating about ten sub-150-student schools into regional academies saves on the order of $12 million while retaining most students through transportation, which covers the $9 million deficit and funds scholarships in the city schools; one-by-one closures would lose families and worsen the decline.","trap":"Treating it as a profit case and closing the lowest-margin schools, which are the low-income city schools the mission exists for; and relying on the network's average cost per pupil, which hides how far the 100-student schools are from breakeven.","start":"School-by-school viability","startWhy":"The portfolio decision drives everything else, and it needs enrollment against breakeven for each of the 39 schools before any revenue or overhead work makes sense."},{"id":"ops-n1","type":"ops","diff":1,"title":"Bay Time","client":"Tenpenny Auto Service","industry":"Consumer services / automotive service","prompt":"Tenpenny Auto Service is a 28-location quick-lube and light-repair chain in the Columbus, Ohio, area with about $55 million in revenue and 420 technicians and service advisors. It promises customers an oil change in 20 minutes, but average wait time, from pulling in to driving out, has grown to 42 minutes, online reviews have slipped, and visit volume is down 5% this year. Locations typically have four bays and offer oil changes, tire rotation, brakes and other light repairs on a walk-in basis. The CEO has asked you how to get the wait back to 20 minutes within six months without adding bays or opening new locations.","questions":[{"q":"How does a location make money and what does the service mix look like?","a":"Oil changes are about 70% of visits but a smaller share of revenue; brakes and tires take two to four times as long per bay and carry higher tickets."},{"q":"Is the goal average wait of 20 minutes, or 20 minutes for oil changes specifically, and is customer volume expected to recover?","a":"Twenty minutes for the oil-change promise is what matters; the CEO expects volume to come back if the promise is kept."},{"q":"When are the waits worst, and how do arrivals vary by hour and day?","a":"Saturdays and weekday evenings are far worse than the average; midweek mornings are quiet with idle bays."},{"q":"Are competitors seeing similar wait times, or is this specific to Tenpenny?","a":"National quick-lube chains that run dedicated oil-change lanes hold waits near 15 to 20 minutes; Tenpenny added repair services to its bays a few years ago."},{"q":"Do all bays and technicians handle all services, and are parts on hand?","a":"Yes, any bay takes any job in arrival order, and brake or tire parts often have to be fetched from a supplier mid-job."}],"buckets":[{"name":"Demand","subs":["Arrivals by hour and day: Saturday and evening peaks","Service mix: oil change vs brakes and tires (bay-time intensity)","Walk-in vs appointment share"]},{"name":"Process","subs":["Steps and minutes per oil change including inspection and upsell","Parts fetching and bay idle time mid-repair","Check-in and payment handoffs"]},{"name":"Capacity","subs":["Bays and technicians staffed by hour vs arrivals","Bay turn time and technician skill mix","Idle midweek capacity"]},{"name":"Levers","subs":["Dedicated oil-change lane so repairs do not block it","Staff and schedule repairs to off-peak, appointments for brakes and tires","Pre-staged parts and standardized work"]}],"generic":"Operations / throughput (wait time)","tailored":"The acuity-mix equivalent is service mix: a brake job in a first-come-first-served bay blocks three oil changes behind it, so demand was split by bay-time intensity and the levers focus on separating the fast lane from repairs.","hyp":"Long repair jobs occupying bays at Saturday and evening peaks are what push oil-change waits to 42 minutes; a dedicated oil-change lane plus scheduling repairs into quiet hours restores the 20-minute promise without new bays.","trap":"Adding technicians when the binding constraint is bays at peak hours, or trusting the 42-minute average, which hides 75-minute Saturday waits and idle Tuesday mornings.","start":"Demand","startWhy":"The wait is a peak-hour, mixed-service problem, so you need the arrival pattern and service mix before you can say which resource is actually the bottleneck."},{"id":"ops-n2","type":"ops","diff":2,"title":"Harvest Line","client":"Red River Valley Grain Terminal","industry":"Agriculture / grain handling","prompt":"Red River Valley Grain Terminal is a farmer-owned cooperative elevator near Grand Forks, North Dakota, with 12 million bushels of storage, about 800 member farmers, 60 employees and roughly $320 million of grain handled each year, mainly corn, soybeans and spring wheat. During the five-week fall harvest, trucks wait an average of two and a half hours to unload against a 30-minute target, and last season about 8% of members' harvest deliveries went to a rival elevator 20 miles away. The general manager has asked you how to cut the peak-season wait to 45 minutes by next harvest, with a capital budget of no more than $3 million.","questions":[{"q":"How does the elevator make money and how does the unloading process work?","a":"It earns a margin on grain bought and resold plus storage and drying fees; a truck is probed and graded, weighed in, dumped into a pit, then weighed out and settled."},{"q":"Is the goal a 45-minute average, or 45 minutes on the worst days, and does the GM want to recover the lost 8% of deliveries?","a":"Forty-five minutes on peak days, because that is when farmers divert; recovering the lost volume is the point."},{"q":"How do arrivals and the commodity mix vary across the harvest?","a":"Most of the problem is on about twelve peak corn days; soybeans and wheat flow through with little delay."},{"q":"Is the wait problem common to elevators in the region, or specific to this one?","a":"Peak-day lines are common, but the rival invested in a second dump pit and a larger dryer and now advertises short waits."},{"q":"Where does the time actually go: at the probe, the pit, or waiting for the dryer?","a":"Wet corn has to be dried before it goes into storage, and on peak days the dryer cannot keep up, so the pit backs up even though the pit itself can dump trucks faster."}],"buckets":[{"name":"Demand","subs":["Truck arrivals by hour on peak corn days","Commodity and moisture mix: wet corn needs drying, soybeans do not","Member field locations and harvest timing"]},{"name":"Process","subs":["Probe, grade and scale-in time per truck","Dump pit cycle and leg conveyance to bins","Scale-out and settlement paperwork"]},{"name":"Capacity","subs":["Dryer bushels per hour at harvest moisture","Pit and leg bushels per hour","Wet-holding and bin space by commodity"]},{"name":"Levers","subs":["Wet-holding capacity or dryer upgrade within $3 million","Segregate dry soybeans and pre-dried corn to a fast lane","Appointments or field-moisture scheduling with members"]}],"generic":"Operations / throughput (bottleneck)","tailored":"The acuity-mix equivalent is commodity and moisture: wet corn consumes dryer capacity while dry beans do not, so the demand bucket was split by moisture and the capacity bucket separated dryer from pit, because they bind on different days.","hyp":"The dryer, not the pit, is the bottleneck on the twelve peak corn days; adding wet-holding capacity so trucks can dump ahead of drying, plus a fast lane for soybeans, gets peak waits under 45 minutes within the $3 million budget.","trap":"Fixing a non-bottleneck step, such as a faster probe or a second scale, when the dryer is the constraint; or averaging over the whole harvest when the problem lives in twelve days.","start":"Demand","startWhy":"The twelve peak corn days and their moisture levels define the load the system must handle; without that you cannot tell which capacity binds."},{"id":"ops-n3","type":"ops","diff":2,"title":"Docket Backlog","client":"Carroway County Superior Court","industry":"Public sector / courts","prompt":"Carroway County Superior Court serves a fast-growing suburban county outside Atlanta, Georgia, with 14 judges, about 38,000 new filings a year across criminal, civil and family cases, and a clerk's office of 110 staff. The pending caseload has grown 60% since 2020, and the median time to resolve a felony case is now about 420 days against a state standard of 180. Pretrial detainees waiting for trial are a growing share of the county jail population, and the sheriff and public defender have both complained publicly. The legislature will not fund new judgeships. The chief judge has asked you for a plan to bring felony disposition time to 180 days within two years using the resources the court already has.","questions":[{"q":"How does a felony case move through the court, and who controls each step?","a":"Arraignment, discovery exchange, pretrial motions, plea negotiations and trial; the court sets the calendar, but the district attorney and defense control readiness, and most cases end in a plea rather than trial."},{"q":"Is the goal median felony time to 180 days, and are civil and family cases allowed to slow down to get there?","a":"Felony time is the priority because of jail impact, but the chief judge does not want civil backlogs to grow materially."},{"q":"How many times is a typical felony case continued, and why?","a":"Around six continuances on average, mostly because discovery is incomplete or counsel is not ready, and the court grants nearly all of them."},{"q":"Are other Georgia courts seeing the same backlog, or is Carroway County wors
