l plus launch investment","NPV vs. the do-nothing (harvest) alternative"]}],"generic":"New product launch","tailored":"Customer bucket split into patients, physicians, and payers (pharma has three customers); competition is the generic entry itself; financials compared to harvesting the current drug.","hyp":"The reformulation is worth launching only if payers will cover it, which requires an adherence claim; without that, the $200M is better spent elsewhere.","trap":"Assuming the clinical benefit sells itself. Payers, not patients, decide; a convenience-only benefit rarely survives a generic at 10% of the price.","start":"Customer & market","startWhy":"Payer coverage is the gate; if formularies will not cover weekly dosing at a premium, no financial scenario works."},{"id":"launch-5","type":"launch","diff":3,"title":"Smart Meter","client":"Lakeshore Energy","industry":"Energy / utility","prompt":"Lakeshore is a regulated electric utility serving 2 million customers. It wants to launch a home energy management service (smart thermostat, app, demand-response rewards) as an unregulated subsidiary. Evaluate the launch.","questions":[{"q":"What is the objective?","a":"Create non-regulated earnings and reduce peak demand to defer a $500M plant investment."},{"q":"Who are the competitors?","a":"Big-tech thermostat makers and several startups; customers already own devices in 15% of homes."},{"q":"What can Lakeshore offer uniquely?","a":"Bill integration, rebates, and demand-response payments; trusted brand but weak at consumer software."},{"q":"What are the economics?","a":"$8/month subscription target; device subsidy $100; peak reduction worth $150 per enrolled home per year."}],"buckets":[{"name":"Customer & market","subs":["Segments: device owners vs. new adopters","Willingness to pay and enrollment barriers","Trust in the utility vs. tech brands"]},{"name":"Product & competition","subs":["Partner with device makers vs. own device","Differentiation: bill integration, rewards","Competitors' ability to bundle demand response"]},{"name":"Capabilities & GTM","subs":["Consumer software and support capability","Regulatory separation of the subsidiary","Marketing through bills and rebates"]},{"name":"Financials","subs":["Subscription + demand-response value per home","Subsidy, software, support cost per home","Deferred plant investment value; breakeven enrollment"]}],"generic":"New product launch","tailored":"Financials include the system benefit (deferred $500M plant) alongside subscription revenue, a utility-only twist; regulatory separation added to capabilities.","hyp":"The launch pays through peak reduction value, not subscription fees; partnering with device makers rather than building a device is the faster route.","trap":"Scoring the business on subscription revenue only. The demand-response value per home is larger than the fee and belongs in the case.","start":"Financials","startWhy":"Value per enrolled home ($8/month fee vs. $150/year system benefit) sets what Lakeshore can afford to spend on acquisition and partners."},{"id":"ma-1","type":"ma","diff":1,"title":"Two Kitchens","client":"Cedar & Salt Restaurant Group","industry":"Consumer / restaurants","prompt":"Cedar & Salt owns eight upscale-casual restaurants in Seattle. The owner of a four-restaurant group in Portland is retiring and has offered to sell for $12M. Cedar & Salt wants to know whether to buy.","questions":[{"q":"Why acquire rather than open in Portland?","a":"Speed and existing teams; Cedar & Salt has never opened outside Seattle."},{"q":"What do the target's financials look like?","a":"$20M revenue, $2M EBITDA, flat for three years; leases have 5+ years."},{"q":"What synergies are expected?","a":"Purchasing, shared back office, menu cross-pollination; maybe $500K."},{"q":"How would it be financed?","a":"$4M cash plus bank debt; owner wants to keep control."}],"buckets":[{"name":"Market","subs":["Portland upscale-casual demand and trend","Comparable restaurant deal multiples","Competitor moves in Portland"]},{"name":"Target standalone","subs":["Revenue: covers × check × days; trend by unit","Costs: food, labor, occupancy; lease terms","Management depth after the owner leaves"]},{"name":"Fit & capabilities","subs":["Brand fit and menu consistency","Cedar & Salt's ability to run a second city","Key chef and manager retention"]},{"name":"Deal","subs":["Price: $12M = 6x EBITDA vs. comps","Synergies ($500K) and integration cost","Risks: owner departure, debt load, cannibalization (none)"]}],"generic":"M&A / PE acquisition","tailored":"Target's revenue built from restaurant drivers (covers × check); fit bucket focuses on chef retention and running a second city; deal bucket tests 6x against comps.","hyp":"The deal is sound at ~6x if the retiring owner's role can be replaced; the risk is operational, not financial.","trap":"Valuing the target on synergies. $500K of synergies on $2M EBITDA is nice but the price must work on standalone numbers.","start":"Target standalone","startWhy":"Flat revenue and an owner-dependent business decide whether $2M EBITDA survives the handover; that comes before synergies or price."},{"id":"ma-2","type":"ma","diff":2,"title":"Shop Floor","client":"Trident Automation","industry":"Industrial / automation","prompt":"Trident makes robotic welding cells for automotive suppliers. It is considering acquiring Brightline Vision, a 120-person machine-vision software company, for $90M. Trident's CEO wants a recommendation.","questions":[{"q":"What is the strategic rationale?","a":"Customers want vision-guided cells; Trident currently licenses vision from a competitor."},{"q":"Brightline's financials?","a":"$30M revenue, 70% gross margin, $5M EBITDA, growing 20%; half of revenue is from non-automotive customers."},{"q":"How does $90M compare?","a":"3x revenue, 18x EBITDA; recent software comps at 4-6x revenue."},{"q":"Integration considerations?","a":"Software engineers may leave a hardware owner; Brightline's other customers include Trident competitors."}],"buckets":[{"name":"Market","subs":["Demand for vision-guided welding","Software comps and multiples","Competitor response if Trident owns a supplier"]},{"name":"Target standalone value","subs":["Revenue growth by segment (auto vs. other)","Margin structure and R&D needs","Customer concentration and churn"]},{"name":"Fit & capabilities","subs":["Technology fit with Trident's cells","Retention of engineers; cultural fit","Ability to keep selling to Trident's competitors"]},{"name":"Deal","subs":["Synergies: bundled sales, licensing cost saved","Dis-synergies: lost competitor customers","Price, structure (earn-out), risks, alternatives (partner/license)"]}],"generic":"M&A / PE acquisition","tailored":"Added dis-synergies (competitors leaving Brightline) and the alternative of a licensing partnership; fit bucket emphasizes engineer retention for a software target.","hyp":"The deal creates value only if vision-guided cells drive Trident's own share gains; if half of Brightline's revenue walks away, 3x revenue is too much.","trap":"Counting synergies without dis-synergies. Owning a supplier that sells to your competitors often shrinks the target.","start":"Deal","startWhy":"Lost competitor revenue could wipe out the synergies; sizing both sides tells you whether to pursue a deal or a long-term license."},{"id":"ma-3","type":"pe","diff":2,"title":"Roll Call","client":"Brookhaven Capital","industry":"Private equity / veterinary services","prompt":"Brookhaven, a mid-market PE fund, is considering buying Paws & Claws, a 25-clinic veterinary group in the Carolinas, for $140M as a platform for a roll-up. Should the fund proceed?","questions":[{"q":"What are the target's financials?","a":"$100M revenue, $14M EBITDA; same-clinic growth 6%; vet turnover 20%."},{"q":"What is the roll-up thesis?","a":"Buy single clinics at 6-8x EBITDA, add to platform at 10x; targeted exit at 12x in five years."},{"q":"How does the market look?","a":"Pet spending growing 7%; three large consolidators active; multiples for single clinics rising."},{"q":"What is the financing?","a":"50% debt at 9%; fund wants 2.5x MOIC."}],"buckets":[{"name":"Market attractiveness","subs":["Pet care spend growth and resilience","Consolidation stage and competitor roll-ups","Single-clinic acquisition multiples trend"]},{"name":"Company standalone","subs":["Revenue quality: visits × revenue per visit, same-clinic growth","Margin, cash conversion, capex","Vet retention and management team"]},{"name":"Value creation plan","subs":["Roll-up: pipeline, pace, integration capability","Operating levers: pricing, procurement, scheduling","Multiple arbitrage (6-8x in, 12x out)"]},{"name":"Deal & exit","subs":["Entry at 10x; leverage at 9% and coverage","Returns bridge: EBITDA growth vs. multiple vs. debt paydown","Exit routes and buyer universe; risks (vet labor, rate rises)"]}],"generic":"M&A / PE acquisition (PE diligence variant)","tailored":"PE version: value creation plan and returns bridge replace generic 'synergies'; vet turnover enters as the key operating risk; multiple arbitrage called out explicitly.","hyp":"Returns depend mostly on multiple arbitrage from the roll-up; the deal clears 2.5x only if the fund can buy 40+ clinics at sub-8x while rivals bid.","trap":"Not naming the return driver. Say whether MOIC comes from EBITDA growth, multiple expansion, or debt paydown; here it is arbitrage, which is the most fragile.","start":"Value creation plan","startWhy":"The roll-up pace and acquisition multiples drive the return bridge; if arbitrage is shrinking, the standalone business cannot carry a 10x entry."},{"id":"ma-4","type":"ma","diff":3,"title":"Cross-Border","client":"Meridian Logistics","industry":"Logistics / freight forwarding","prompt":"Meridian, a U.S. freight forwarder, is evaluating a merger of equals with Delta Linea, a Mexican customs-brokerage and forwarding firm, to capture nearshoring flows. The CEO wants to know whether the combination makes sense and what to watch.","questions":[{"q":"What is the strategic logic?","a":"Nearshoring is shifting volumes to U.S.–Mexico lanes; neither firm can serve both sides alone."},{"q":"Financials of each?","a":"Meridian: $600M revenue, $40M EBITDA. Delta Linea: $300M revenue, $30M EBITDA, higher margin from customs brokerage."},{"q":"What synergies?","a":"Cross-selling across 1,500 shared potential clients; shared IT; some overhead."},{"q":"Deal considerations?","a":"Stock-for-stock; governance and leadership split unresolved; currency and regulatory approvals in both countries."}],"buckets":[{"name":"Market","subs":["Nearshoring volume growth on U.S.–Mexico lanes","Competitors assembling cross-border networks","Trade-policy and tariff risk"]},{"name":"Standalone value of each","subs":["Revenue by lane and service; customer overlap","Margin structure (brokerage vs. forwarding)","Exposure to peso and trade cycles"]},{"name":"Fit & capabilities","subs":["Network complementarity vs. overlap","Leadership, culture, governance of a merger of equals","Systems integration"]},{"name":"Deal","subs":["Exchange ratio and relative valuation","Synergies: cross-sell, IT, overhead; integration cost","Risks: regulatory approvals, customer defection, currency; alternatives (alliance, JV)"]}],"generic":"M&A / PE acquisition","tailored":"'Target' became both parties with relative valuation; governance of a merger of equals is a fit item; alliance/JV added as the alternative; currency and trade policy as risks.","hyp":"The combination has real strategic logic, but a merger of equals with unresolved governance is riskier than a commercial alliance that tests cross-selling first.","trap":"Treating a merger of equals like an acquisition. The exchange ratio and who runs the company decide whether synergies ever get executed.","start":"Fit & capabilities","startWhy":"If governance and integration cannot be settled, the deal fails regardless of synergies; test fit before valuing them."},{"id":"ma-5","type":"pe","diff":3,"title":"Carve-Out","client":"Stonebridge Partners","industry":"Private equity / industrial carve-out","prompt":"Stonebridge is bidding for the specialty-coatings division being carved out of a large chemicals conglomerate. Asking price is $800M. The division has never operated standalone. Stonebridge asks how to evaluate the deal.","questions":[{"q":"Division financials?","a":"$700M revenue, $110M EBITDA as reported; 'allocated' corporate costs of $25M may not reflect standalone needs."},{"q":"Why is the parent selling?","a":"Non-core; parent is focused on commodity chemicals; the division has been under-invested."},{"q":"What is the market?","a":"Specialty coatings growing 4%; fragmented; pricing power moderate."},{"q":"What is entangled with the parent?","a":"Shared plants, IT, procurement contracts, and 30% of raw materials bought from the parent."}],"buckets":[{"name":"Market attractiveness","subs":["Growth, cyclicality, pricing power","Competitive fragmentation and consolidation potential","Raw-material cost exposure"]},{"name":"Standalone business","subs":["True standalone cost base vs. allocations","Revenue quality by customer and product","Capex catch-up from under-investment"]},{"name":"Value creation plan","subs":["Operational fixes the parent neglected","Pricing and mix improvement","Add-on acquisitions in a fragmented market"]},{"name":"Deal & separation","subs":["Price vs. true EBITDA; TSA costs and stranded costs","Separation: plants, IT, supply agreements with parent","Exit routes; risks (dis-synergies, key-customer loss)"]}],"generic":"M&A / PE acquisition (PE diligence variant)","tailored":"Separation risk is its own theme inside the deal bucket (TSAs, stranded costs, parent supply agreements); standalone cost base is questioned rather than accepted.","hyp":"Reported EBITDA overstates standalone profit; the deal works only if Stonebridge underwrites a lower EBITDA plus a credible operational upside from the parent's neglect.","trap":"Accepting carve-out financials at face value. Allocated costs, shared plants, and parent supply contracts mean the real EBITDA is unknown until you rebuild it.","start":"Standalone business","startWhy":"Everything prices off true standalone EBITDA; rebuilding the cost base before anything else protects against overpaying."},{"id":"pricing-1","type":"pricing","diff":1,"title":"Day Pass","client":"Blue Ridge Adventure Park","industry":"Consumer / leisure","prompt":"Blue Ridge runs a zipline and ropes-course park in North Carolina. Admission is $45 and has not changed in six years. Attendance is 150,000 a year, mostly at capacity on summer weekends. The owner asks whether to raise prices and by how much.","questions":[{"q":"What does the demand pattern look like?","a":"Weekends sell out June–August; weekdays and shoulder seasons run at 40% capacity."},{"q":"What do competitors charge?","a":"Similar parks charge $55–$65; the nearest is 90 minutes away."},{"q":"What is the cost structure?","a":"Mostly fixed (staff, insurance, maintenance); variable cost per guest ~$5."},{"q":"Who are the customers?","a":"Families and youth groups; groups are 30% of attendance and get a 20% discount."}],"buckets":[{"name":"Customer value & willingness to pay","subs":["Price vs. perceived value and alternatives","Elasticity by segment (families vs. groups)","Sell-out days = unmet demand at current price"]},{"name":"Competitive position","subs":["$45 vs. $55–$65 benchmark","Differentiation and distance to competitors","Risk of new entrants"]},{"name":"Economics","subs":["Breakeven volume loss for a given increase (variable cost $5)","Capacity constraint on peak days","Group discount structure"]},{"name":"Execution","subs":["Peak/off-peak (dynamic) pricing","Rollout timing and communication","Monitor attendance and mix after change"]}],"generic":"Pricing","tailored":"Economics bucket is almost pure breakeven math because costs are fixed; execution bucket emphasizes peak/off-peak pricing because the demand pattern is so uneven.","hyp":"Raise peak-weekend prices toward $60 and hold or discount off-peak; with $40 contribution per guest, even meaningful attendance loss on sold-out days increases profit.","trap":"Pricing uniformly. Sold-out weekends and 40% weekdays call for different prices, not one new number.","start":"Economics","startWhy":"With a $40 contribution per guest, the breakeven volume loss is tiny; that math shows how much pricing room exists before you even look at competitors."},{"id":"pricing-2","type":"pricing","diff":2,"title":"Per Seat","client":"Ledgerly","industry":"Technology / SMB software","prompt":"Ledgerly sells bookkeeping software to small businesses at $30 per user per month. A competitor just launched a flat $99 per company plan. Ledgerly's CEO wants to decide whether to change pricing.","questions":[{"q":"What does Ledgerly's customer base look like?","a":"40,000 companies; average 2.5 users; 20% have 5+ users and generate 45% of revenue."},{"q":"How do customers perceive value?","a":"Larger customers love multi-user controls; small ones see Ledgerly as expensive vs. the flat plan."},{"q":"What is the cost structure?","a":"Gross margin 80%; cost per additional user negligible."},{"q":"Churn and competitive dynamics?","a":"Churn rising among 1-2 user customers; competitor is well-funded."}],"buckets":[{"name":"Customer value & segments","subs":["Value drivers by segment (controls vs. simplicity)","Willingness to pay for 1-2 user vs. 5+ user firms","Churn risk by segment"]},{"name":"Competitive position","subs":["Flat $99 vs. $30/user crossover at ~3.3 users","Feature and brand differentiation","Likely competitor next moves"]},{"name":"Economics","subs":["Revenue impact of alternative structures by segment","Breakeven: churn avoided vs. revenue given up","Margin (80%) means volume matters more than price"]},{"name":"Execution","subs":["Tiered model: flat small-business tier + per-seat pro","Grandfathering and migration","Pilot, test, and monitor churn"]}],"generic":"Pricing","tailored":"Competitive bucket includes the crossover-user math; economics compares pricing structures (not just levels) by segment; execution proposes tiering.","hyp":"Keep per-seat for larger customers and add a flat small-business tier; matching $99 for everyone would give up 45% of revenue to protect customers who are not leaving.","trap":"Matching the competitor across the board. The threat is concentrated in 1-2 user firms; the big accounts are not price-sensitive to the flat plan.","start":"Customer value & segments","startWhy":"The flat plan hits only one segment; separating who is at risk from who is not frames every pricing option."},{"id":"pricing-3","type":"pricing","diff":2,"title":"Rate Card","client":"Pinecone Senior Care","industry":"Healthcare / assisted living","prompt":"Pinecone runs 15 assisted-living communities in Arizona at 88% occupancy. Costs have risen 12% over two years while rates rose 4%. The CEO wants to know how much to raise rates for current and new residents.","questions":[{"q":"How are rates set today?","a":"Base rent plus care-level fees; one annual increase; new residents get move-in specials."},{"q":"What does competition look like?","a":"Local competitors are at 90-92% occupancy and raised rates 8% last year."},{"q":"How price-sensitive are residents?","a":"Moving is hard for residents; adult children compare prices at move-in but rarely move parents for price."},{"q":"Any regulatory or contractual limits?","a":"Contracts allow annual increases with 60 days' notice; no caps."}],"buckets":[{"name":"Customer value & sensitivity","subs":["Current residents: high switching cost, low elasticity","Prospects: compare at move-in; elasticity higher","Care-level pricing vs. actual care delivered"]},{"name":"Competitive position","subs":["Rate benchmarks and recent increases (8%)","Occupancy gap (88% vs. 90-92%)","Differentiation: quality, amenities, staffing"]},{"name":"Economics","subs":["Breakeven move-outs for each increase","Cost recovery needed (12% vs. 4%)","Impact of specials on new-resident rates"]},{"name":"Execution","subs":["Differentiated increases: existing vs. new, by care level","Communication to families; timing","Reduce move-in specials; monitor occupancy"]}],"generic":"Pricing","tailored":"Customer bucket split into current residents (low elasticity) vs. prospects (higher); execution covers family communication and move-in specials, specific to senior living.","hyp":"Raise existing-resident rates 7-8% (in line with competitors and cost) and trim move-in specials; existing residents will not leave and the occupancy gap is a sales issue, not a price issue.","trap":"Assuming the occupancy gap means Pinecone is overpriced. Competitors are fuller and more expensive; the gap is likely marketing or product.","start":"Customer value & sensitivity","startWhy":"The two customer groups have completely different elasticities; recognizing that opens a larger increase than a blended analysis would allow."},{"id":"pricing-4","type":"pricing","diff":3,"title":"Surcharge","client":"Ironvale Steel Fabrication","industry":"Industrial / fabrication","prompt":"Ironvale fabricates structural steel for commercial construction under fixed-price contracts. Steel input prices rose 35% in nine months, and Ironvale is losing money on its backlog. Leadership asks how to price going forward and what to do about the backlog.","questions":[{"q":"How are contracts priced today?","a":"Fixed price at bid; 6-12 month delivery; no escalation clauses."},{"q":"What do competitors do?","a":"Mixed: some added steel surcharges or index-linked clauses; others still bid fixed and are also losing money."},{"q":"How price-sensitive are customers?","a":"General contractors bid competitively, but reliability and on-time delivery matter; switching mid-project is costly."},{"q":"What is the backlog exposure?","a":"$80M backlog; estimated $6M loss at current steel prices."}],"buckets":[{"name":"Customer value & sensitivity","subs":["What GCs value: reliability, schedule, price","Tolerance for index-linked pricing","Segments: public vs. private projects"]},{"name":"Competitive position","subs":["Surcharge adoption among competitors","Risk of losing bids if alone in surcharging","Ironvale's reliability as leverage"]},{"name":"Economics","subs":["Margin by contract structure under price scenarios","Breakeven and win-rate trade-off","Hedging/forward buying of steel"]},{"name":"Execution","subs":["New contracts: index clauses, shorter validity, surcharges","Backlog: renegotiate, share pain, or absorb","Procurement and bid-process changes"]}],"generic":"Pricing","tailored":"Execution split into new contracts vs. backlog since the question has two parts; economics includes hedging as a pricing-adjacent lever; contract structure replaces price level as the main decision.","hyp":"Move all new bids to index-linked pricing (competitors are already doing it) and renegotiate the largest backlog contracts using reliability as leverage; absorb the rest.","trap":"Treating this as a price-level question. The issue is risk allocation in contract structure; a higher fixed price just bets again on steel.","start":"Execution","startWhy":"The backlog loss is happening now; triaging which contracts can be renegotiated is urgent, and the new-contract structure decision follows directly."},{"id":"pricing-5","type":"pricing","diff":3,"title":"Bundle","client":"Northstar Streaming","industry":"Media / streaming","prompt":"Northstar is a mid-size streaming service with 12M subscribers at $11.99/month. Growth has stalled and churn is 5% monthly. Management is weighing a cheaper ad-supported tier at $5.99. Should they launch it and at what price?","questions":[{"q":"What is the objective?","a":"Grow total revenue and reduce churn without cannibalizing the ad-free base too much."},{"q":"What do we know about subscribers?","a":"30% of churners cite price; 20% of current subscribers say they would switch to a cheaper tier."},{"q":"What would ad revenue be?","a":"About $4 per ad-tier subscriber per month at current ad fill rates."},{"q":"What have competitors done?","a":"Most large services launched ad tiers at $6-8 and reported net revenue gains."}],"buckets":[{"name":"Customer value & segments","subs":["Price-sensitive churners vs. loyal ad-free base","Switch-down intent (20%) vs. new sign-ups","Ad tolerance by segment"]},{"name":"Competitive position","subs":["Ad-tier price points ($6-8) and outcomes","Content differentiation and bundling","Advertiser demand for Northstar's audience"]},{"name":"Economics","subs":["Per-subscriber revenue: $5.99 + $4 ads vs. $11.99","Breakeven: new/retained subs needed to offset switch-downs","Ad sales cost and tech investment"]},{"name":"Execution","subs":["Price and feature gap to limit switching (resolution, downloads)","Launch sequencing and messaging","Monitor mix shift and ad fill"]}],"generic":"Pricing","tailored":"Economics compares total revenue per subscriber across tiers including ad revenue; execution centers on feature-gapping to control cannibalization, a streaming-specific lever.","hyp":"Launch at $6.99-7.99 with a deliberate feature gap; the ad tier adds net revenue if switch-downs stay under ~15% and churn falls as price-sensitive subscribers get a landing spot.","trap":"Counting only the switch-down loss. Each switch-down costs ~$2 with ads, not $6; the retained churners and new sign-ups usually outweigh it.","start":"Economics","startWhy":"The per-subscriber math ($9.99 effective vs. $11.99) tells you how many switch-downs you can absorb; that number drives the price and feature-gap decisions."},{"id":"cost-1","type":"cost","diff":1,"title":"Back Office","client":"Hillcrest Community College District","industry":"Public sector / education","prompt":"Hillcrest, a three-campus community college district, faces a $9M budget shortfall next year on a $150M budget. The chancellor wants a plan to close the gap without hurting enrollment or instruction.","questions":[{"q":"What is the cost base?","a":"65% personnel (half faculty), 15% facilities, 10% IT and admin services, 10% other."},{"q":"What is driving the shortfall?","a":"State funding flat, enrollment down 4%, and a 5% salary settlement."},{"q":"Any constraints?","a":"Faculty contracts protect tenured positions; the board will not raise tuition this year."},{"q":"Have cuts been tried before?","a":"Across-the-board 3% cuts two years ago; departments restored spending since."}],"buckets":[{"name":"Baseline","subs":["Cost by category and campus; fixed vs. variable","Addressable vs. protected (tenure, contracts)","Cost per student by program"]},{"name":"Benchmarks","subs":["Admin and facilities cost per student vs. peer districts","Course-section fill rates and class sizes","Shared-services models at other districts"]},{"name":"Levers","subs":["Demand: consolidate low-enrollment sections, campus footprint","Price/procurement: contracts, energy, software","Productivity/structure: shared services across campuses, attrition"]},{"name":"Impact & risk","subs":["Run-rate vs. one-time savings; timing vs. deadline","Enrollment and instruction risk by lever","Sequencing and stakeholder management"]}],"generic":"Cost reduction","tailored":"Baseline distinguishes addressable from contract-protected cost; levers are framed around sections, campuses, and shared services; risk measured against enrollment, the district's revenue driver.","hyp":"The $9M comes mostly from consolidating low-fill sections and sharing back-office services across campuses, not from across-the-board cuts, which already failed.","trap":"Across-the-board cuts. They hit the revenue engine (instruction and enrollment services) as hard as the overhead and creep back.","start":"Baseline","startWhy":"With 65% personnel and protected faculty, you must know what is actually addressable before any lever is realistic."},{"id":"cost-2","type":"cost","diff":2,"title":"Line Speed","client":"Tanglewood Furniture","industry":"Manufacturing / furniture","prompt":"Tanglewood manufactures upholstered furniture in two Mississippi plants. A large retail customer has demanded a 10% price cut or it will move the business overseas. Tanglewood needs to cut unit cost by 10% within 12 months to keep the account profitably.","questions":[{"q":"What is the cost per unit?","a":"Materials 50% (fabric, foam, frames), direct labor 25%, overhead 15%, freight 10%."},{"q":"How does Tanglewood compare?","a":"Labor productivity is below peers; scrap on fabric is 12% vs. 7% benchmark."},{"q":"How important is this customer?","a":"35% of revenue; losing it would strand capacity in one plant."},{"q":"What investments are feasible?","a":"Owner will fund up to $4M; automation of cutting is one option."}],"buckets":[{"name":"Baseline","subs":["Unit cost by element and by plant","Fixed vs. variable; absorption at lower volume","Cost specific to this customer's SKUs"]},{"name":"Benchmarks","subs":["Scrap (12% vs. 7%), labor hours per unit","Material prices vs. market","Freight cost per unit vs. peers"]},{"name":"Levers","subs":["Materials: fabric yield, foam specs, supplier renegotiation","Labor: line balancing, automation of cutting ($4M)","Overhead/structure: consolidate plants, freight routing"]},{"name":"Impact & risk","subs":["Savings by lever vs. 10% target and timing","Quality and delivery risk to the key account","Investment payback; what if the customer leaves anyway"]}],"generic":"Cost reduction","tailored":"Baseline built as unit cost by element (materials/labor/overhead/freight); benchmarks given concrete gaps (scrap, hours); risk includes stranded capacity if the customer leaves.","hyp":"Closing the scrap gap and automating cutting delivers most of the 10%; plant consolidation is the fallback if the account is lost.","trap":"Cutting fixed overhead first. A 35% customer leaving would gut absorption; the plan must work in both keep-and-lose scenarios.","start":"Benchmarks","startWhy":"A 5-point scrap gap on 50% material cost is already 2.5% of unit cost; the benchmark gaps size the quick wins immediately."},{"id":"cost-3","type":"cost","diff":2,"title":"Claims Desk","client":"Harborview Health Plan","industry":"Healthcare / insurer","prompt":"Harborview is a regional health insurer with 600,000 members. Administrative cost is 14% of premium, versus 10% for peers. The CFO wants a plan to reach 11% within two years without degrading member service.","questions":[{"q":"What is in administrative cost?","a":"Claims processing 30%, customer service 20%, IT 20%, sales/broker commissions 15%, corporate 15%."},{"q":"Where are the biggest gaps vs. peers?","a":"Claims auto-adjudication is 65% vs. 85% at peers; call volume per member is double."},{"q":"Any ongoing programs?","a":"A core-system replacement is mid-way; completes in 18 months."},{"q":"Constraints?","a":"Regulatory service standards; union call-center staff."}],"buckets":[{"name":"Baseline","subs":["Cost by function and per member","Fixed vs. variable with membership","What is addressable vs. regulated/contracted"]},{"name":"Benchmarks","subs":["Auto-adjudication 65% vs. 85%","Calls per member 2x peers; cost per call","IT spend per member; commission rates"]},{"name":"Levers","subs":["Demand: cut call drivers (claim errors, confusing EOBs)","Productivity: automation, system replacement benefits","Structure: outsourcing, vendor renegotiation, spans"]},{"name":"Impact & risk","subs":["Savings timeline vs. system go-live","Member service and regulatory risk","One-time costs and union considerations"]}],"generic":"Cost reduction","tailored":"Levers lean on demand reduction (why members call) and automation tied to the system replacement; regulated service standards made explicit in risk.","hyp":"Reaching 11% is possible: most of the gap is in claims and service, where automation and fixing root causes of calls can deliver without cutting service levels.","trap":"Cutting service headcount before reducing call drivers. Fewer agents with the same call volume degrades service and triggers regulatory issues.","start":"Benchmarks","startWhy":"Two benchmark gaps (auto-adjudication, calls per member) account for most of the 4-point difference; they tell you where to look first."},{"id":"cost-4","type":"cost","diff":3,"title":"Fleet Review","client":"Metro Capital Police Department","industry":"Public sector / law enforcement","prompt":"A city police department with a $900M budget has been asked by the mayor to find $60M in savings over three years without reducing sworn officers on patrol. The chief wants a plan.","questions":[{"q":"What is the budget composition?","a":"80% personnel (sworn and civilian), 8% overtime, 6% fleet and facilities, 6% technology and other."},{"q":"Where is spending unusual?","a":"Overtime is $70M and rising; sworn officers do many administrative and desk roles; fleet is older than peers."},{"q":"What is off the table?","a":"Patrol headcount and a union contract that fixes base pay for two years."},{"q":"Prior efforts?","a":"Hiring freezes on civilians, which pushed more admin work to sworn officers at higher cost."}],"buckets":[{"name":"Baseline","subs":["Spend by category and by bureau","Addressable: overtime, civilian roles, fleet, tech, contracts","Cost per hour sworn vs. civilian"]},{"name":"Benchmarks","subs":["Overtime as % of payroll vs. peer cities","Civilianization ratio vs. peers","Fleet age and maintenance cost per vehicle"]},{"name":"Levers","subs":["Demand: overtime drivers (court time, events, staffing gaps)","Productivity: civilianize admin roles, scheduling","Structure/procurement: fleet replacement cycle, contracts, facilities"]},{"name":"Impact & risk","subs":["Savings phasing over 3 years; one-time costs","Public safety and response-time risk","Union and political feasibility"]}],"generic":"Cost reduction","tailored":"Levers emphasize civilianization and overtime drivers, the two public-safety-specific sources; patrol headcount excluded from baseline as non-addressable.","hyp":"Overtime control and civilianizing admin roles can deliver the $60M; the prior civilian freeze made costs worse and should be reversed.","trap":"Cutting civilians to protect sworn staff. It moves work to the most expensive labor and raises overtime; the fix is the opposite.","start":"Levers","startWhy":"The overtime line ($70M) and the civilianization gap are visible and large; starting there shows a credible path without touching patrol."},{"id":"cost-5","type":"cost","diff":3,"title":"Overhead","client":"Cobalt Mining Services","industry":"Industrial / mining services","prompt":"Cobalt provides drilling and blasting services to mines in Nevada and Arizona. Commodity prices fell and clients are cutting contracts. Revenue will drop 25% next year. The CEO must reduce cost by 20% while staying ready for the next upcycle.","questions":[{"q":"What is the cost base?","a":"Labor 40%, equipment (depreciation, leases, maintenance) 30%, consumables (explosives, bits) 20%, overhead 10%."},{"q":"Which costs are variable?","a":"Consumables fully; labor partly (crews can be furloughed, but skilled drillers are hard to rehire); equipment mostly fixed."},{"q":"What is the demand outlook?","a":"Trough likely 18-24 months; clients expect a rebound but timing is uncertain."},{"q":"Benchmarks?","a":"Competitors use more contract labor and lease rather than own equipment."}],"buckets":[{"name":"Baseline","subs":["Cost by category; fixed vs. variable","Cost that falls automatically with volume (consumables)","Addressable fixed cost: equipment, overhead, labor"]},{"name":"Benchmarks","subs":["Labor flexibility models (contract vs. employed)","Equipment ownership vs. leasing","Overhead per revenue dollar"]},{"name":"Levers","subs":["Capacity: idle, sell, or sublease equipment","Labor: furlough tiers, retain core drillers, variable pay","Procurement and overhead cuts"]},{"name":"Impact & risk","subs":["Savings vs. 20% target and timing","Ability to re-scale when the cycle turns","Customer service and safety risk"]}],"generic":"Cost reduction","tailored":"Fixed vs. variable split drives everything because the trigger is a volume drop; levers emphasize flexibility (lease, contract labor) so costs can scale back up.","hyp":"Consumables fall automatically; the remaining 20% comes from idling or subleasing equipment and tiered labor furloughs that keep core drillers.","trap":"Cutting the skilled workforce you cannot rehire. Losing drillers saves cash now and forfeits the upcycle; structure cuts to preserve them.","start":"Baseline","startWhy":"Separating what falls with volume from what must be actively cut tells you how big the real gap is before choosing painful levers."},{"id":"compete-1","type":"compete","diff":1,"title":"Discount Aisle","client":"Hearthstone Hardware","industry":"Retail / hardware","prompt":"Hearthstone operates 20 neighborhood hardware stores in Minnesota. A national big-box chain opened three stores nearby last year, and Hearthstone's sales fell 8%. The owner wants to know how to respond.","questions":[{"q":"Where did sales fall?","a":"Mostly in the six stores within 10 miles of a big box; the other 14 are flat."},{"q":"Which categories fell?","a":"Lumber, large tools, and appliances; paint, fasteners, and repair parts held up."},{"q":"Who are Hearthstone's customers?","a":"Homeowners doing small repairs and local contractors; valued for advice and convenience."},{"q":"What are the economics?","a":"Gross margin 38%; big box is 10-15% cheaper on big-ticket items."}],"buckets":[{"name":"What changed","subs":["Big-box entry: location, pricing, assortment","Which stores and categories are affected","Customer behavior shift"]},{"name":"Where we are losing","subs":["By store (6 nearby vs. 14), category, customer type","Big-ticket vs. repair/convenience categories"]},{"name":"Why we are losing","subs":["Price gap on big-ticket items","Assortment breadth vs. convenience and advice","Customer purchase criteria by segment"]},{"name":"Response options","subs":["Reposition: double down on repair, advice, contractors","Price selectively on visible items; exit big-ticket","Economics of each option: margin, investment, risk"]}],"generic":"Competitive response","tailored":"'Where' split by store distance and category, which the facts make sharp; response options framed around retreating from big-ticket rather than matching big-box prices.","hyp":"Hearthstone should concede big-ticket categories and reposition the six affected stores around repair, advice, and contractors, where big box does not win.","trap":"Matching on price. Big box has structural cost advantages; a price war on lumber loses margin everywhere to defend sales you cannot keep.","start":"Where we are losing","startWhy":"Loss is concentrated in 6 stores and 3 categories; defining that precisely keeps the response targeted instead of company-wide."},{"id":"compete-2","type":"compete","diff":2,"title":"Free Shipping","client":"Alder & Finch","industry":"E-commerce / home goods","prompt":"Alder & Finch sells mid-priced home décor online. A larger competitor just launched free two-day shipping on all orders and a loyalty program. Alder & Finch's conversion rate dropped 15% in two months. What should they do?","questions":[{"q":"What is Alder & Finch's shipping policy?","a":"Free over $75; otherwise $8.99; average order $65; shipping cost per order $9."},{"q":"Who are the customers?","a":"Design-conscious 30-50 year-olds; repeat purchase is 35%; they value curation."},{"q":"What are the margins?","a":"Gross margin 50%; contribution margin after shipping and marketing 12%."},{"q":"How is the competitor funded?","a":"Well-capitalized; using shipping as a loss leader to gain share."}],"buckets":[{"name":"What changed","subs":["Competitor move: free shipping, loyalty","Timing and scale of the conversion drop","Any other factors (seasonality, ads)"]},{"name":"Where we are losing","subs":["By order size (under vs. over $75)","New vs. repeat customers","Product categories and traffic sources"]},{"name":"Why","subs":["Purchase criteria: shipping cost vs. curation vs. price","Cart abandonment at shipping step","Loyalty program pull on repeat buyers"]},{"name":"Response options","subs":["Lower free-shipping threshold or flat fee; economics","Membership/loyalty of our own","Non-price: curation, exclusives, service; funding plan"]}],"generic":"Competitive response","tailored":"'Where' is split by order size because the $75 threshold is the pressure point; response economics tie to a 12% contribution margin that limits how much shipping can be subsidized.","hyp":"Lowering the threshold to $50 and adding a small loyalty perk recovers most of the conversion loss at a cost the margin can bear; full free shipping would wipe out contribution.","trap":"Matching a loss leader funded by someone else's balance sheet. The response must fit a 12% margin, not the competitor's war chest.","start":"Where we are losing","startWhy":"If the conversion drop is concentrated below $75, a threshold change is cheap and targeted; if it is everywhere, the problem is loyalty, not shipping."},{"id":"compete-3","type":"compete","diff":2,"title":"New Clinic","client":"Lakeside Orthopedics","industry":"Healthcare / physician group","prompt":"Lakeside is a 40-physician orthopedic group in a mid-size city. The regional hospital system just opened its own orthopedic institute and started hiring surgeons and redirecting referrals. Lakeside's new-patient volume is down 20%. How should Lakeside respond?","questions":[{"q":"How do patients reach Lakeside?","a":"50% primary-care referrals (many now hospital-employed), 30% self-referral, 20% ER and employer programs."},{"q":"What does the hospital's institute offer?","a":"Integrated imaging, surgery, rehab; aggressive marketing; recruited two Lakeside surgeons."},{"q":"What are Lakeside's strengths?","a":"Shorter wait times, better outcomes data, lower cost per episode; owns an ambulatory surgery center."},{"q":"Financial position?","a":"Profitable but surgeon compensation is under pressure; some partners are considering joining the hospital."}],"buckets":[{"name":"What changed","subs":["Hospital vertical integration and referral capture","Surgeon recruitment from Lakeside","Marketing and patient perception"]},{"name":"Where we are losing","subs":["Referral channel (hospital-employed PCPs) vs. self-referral","Service lines (joints, spine, sports)","Payer segments"]},{"name":"Why","subs":["Referral control, not quality","Convenience of integrated model","Surgeon retention and morale"]},{"name":"Response options","subs":["Direct-to-patient and employer channels using outcomes and cost data","Partnerships: payers, other hospitals, independent PCPs","Affiliation or merger options; surgeon retention economics"]}],"generic":"Competitive response","tailored":"'Where' is organized by referral channel because the competitor's weapon is referral control; response includes payer and employer channels that bypass hospital-employed PCPs.","hyp":"Lakeside cannot win back hospital-employed referrals; it should redirect to payer, employer, and direct channels where its cost and outcome advantage is a selling point, while locking in surgeons.","trap":"Fighting for the lost referral channel. When a competitor owns the channel, compete in the channels it does not own.","start":"Why","startWhy":"Confirming the loss is referral control rather than quality tells you which responses have any chance; it also frames the surgeon retention conversation."},{"id":"compete-4","type":"compete","diff":3,"title":"Price Cut","client":"Falcon Air Freight","industry":"Logistics / air cargo","prompt":"Falcon operates air-cargo routes between the U.S. and Latin America. A large integrated carrier announced 20% lower rates on Falcon's two most profitable lanes. Falcon's CEO asks whether and how to respond.","questions":[{"q":"How important are the two lanes?","a":"40% of revenue and 60% of profit; Falcon has 35% share on them."},{"q":"Who are the customers?","a":"Freight forwarders (price-driven) and perishables shippers (reliability-driven, 50% of lane volume)."},{"q":"What is the competitor's position?","a":"Entering with spare capacity from a fleet renewal; can sustain low rates for a while; weaker on perishables handling."},{"q":"What is Falcon's cost position?","a":"Older aircraft, higher fuel burn; cost per kg about 10% above the competitor."}],"buckets":[{"name":"What changed","subs":["Competitor's rate cut: scope, duration, motive (fill capacity)","Capacity dynamics on the lanes","Customer reactions so far"]},{"name":"Where we are losing","subs":["By customer type (forwarders vs. perishables)","By lane and direction","Volume vs. yield impact"]},{"name":"Why","subs":["Price sensitivity of forwarders","Reliability and cold-chain value to perishables","Our 10% cost disadvantage"]},{"name":"Response options","subs":["Selective matching for forwarders; hold rates on perishables","Capacity: adjust frequency, right-size aircraft","Cost reduction, alliances, or exit a lane; economics and signaling"]}],"generic":"Competitive response","tailored":"'Where' and 'why' split by customer type since half the volume values reliability; response adds capacity and alliance moves, which are the levers in a capacity-driven industry.","hyp":"Hold rates for perishables, match selectively for forwarders, and trim frequency; a full price match loses more profit than the volume it saves given the cost gap.","trap":"Responding to a capacity-driven price cut as if it were permanent. The competitor is filling new aircraft; signaling restraint while protecting the reliability segment avoids a war.","start":"Where we are losing","startWhy":"If perishables customers are staying, the exposure is only the forwarder half; that halves the problem and changes the response."},{"id":"compete-5","type":"compete","diff":3,"title":"Disruptor","client":"Beacon Wealth Advisors","industry":"Financial services / wealth management","prompt":"Beacon manages $8B for 6,000 clients with a traditional advisor model charging 1% of assets. Low-cost robo-advisors and a national firm offering 0.4% hybrid advice are winning younger clients and some of Beacon's smaller accounts. Beacon's CEO asks how to respond.","questions":[{"q":"What is the client base?","a":"Average account $1.3M; 40% of clients under $500K generate 10% of revenue; average client age 61."},{"q":"Who is leaving?","a":"Mostly under-$500K accounts and heirs of deceased clients."},{"q":"What is Beacon's cost structure?","a":"Advisor compensation 45% of revenue; service cost similar for small and large accounts."},{"q":"What capabilities exist?","a":"Strong planning and tax advice; outdated digital experience."}],"buckets":[{"name":"What changed","subs":["Entry of robo and 0.4% hybrid models","Generational transfer of assets","Client expectations on digital"]},{"name":"Where we are losing","subs":["Small accounts (<$500K) and heirs","Age cohorts; new-client acquisition","Service tiers and geographies"]},{"name":"Why","subs":["Fee vs. perceived value for simple needs","Digital experience gap","Relationship transfer to heirs failing"]},{"name":"Response options","subs":["Tiered offering: digital/hybrid tier for small accounts and heirs","Defend core: planning, tax, complex needs at 1%","Build vs. partner for digital; economics and cannibalization"]}],"generic":"Competitive response","tailored":"'Where' highlights the small-account/heir segment that drives 10% of revenue; response is a tiered model to defend the core rather than a fee cut across $8B.","hyp":"Beacon should launch a hybrid lower-fee tier for small accounts and heirs and keep 1% for complex clients; cutting fees across the book would sacrifice far more than the revenue at risk.","trap":"Cutting the headline fee for everyone. The revenue at risk is 10%; a fee cut on the other 90% is a self-inflicted wound.","start":"Where we are losing","startWhy":"Quantifying that losses sit in a 10%-of-revenue segment immediately rules out a book-wide response and points to tiering."},{"id":"invest-1","type":"invest","diff":1,"title":"Second Oven","client":"Golden Wheat Bakery","industry":"Consumer / food manufacturing","prompt":"Golden Wheat supplies bread to 300 grocery stores and restaurants in Ohio. Its single bakery runs near capacity. Management is deciding whether to invest $6M in a second production line. Should they?","questions":[{"q":"What is current demand and capacity?","a":"Running at 92% capacity; turning away about $3M of annual orders; demand growing 8%."},{"q":"What are the economics of the new line?","a":"Adds 60% capacity; incremental contribution margin 30%; $6M capex plus $500K annual fixed cost."},{"q":"What alternatives exist?","a":"Co-packing with another bakery at lower margin; night shift on the existing line (limited)."},{"q":"Any risks?","a":"Largest customer (25% of sales) is re-bidding its contract next year."}],"buckets":[{"name":"Demand","subs":["Unmet orders ($3M) and growth (8%)","Customer concentration and contract risk","Mix and margin of the incremental demand"]},{"name":"Economics","subs":["Incremental revenue × 30% margin − $500K fixed","Capex $6M; payback, NPV","Utilization ramp of the new line"]},{"name":"Alternatives","subs":["Co-packing: lower margin, no capex","Night shift / line efficiency improvements","Phased or smaller investment"]},{"name":"Risks","subs":["Loss of the 25% customer","Demand slowdown; stranded capacity","Execution: construction, hiring"]}],"generic":"Investment / go-no-go","tailored":"Demand bucket names the turned-away orders and contract risk; alternatives include co-packing, a bakery-specific option; economics kept to incremental contribution.","hyp":"The line pays back within ~3 years on current unmet demand alone, but the decision should wait for or be conditioned on the 25% customer's contract renewal.","trap":"Comparing to do-nothing. The real comparison is to the best alternative (co-packing or a night shift), not to standing still.","start":"Economics","startWhy":"If the payback on existing unmet demand is already attractive, the discussion becomes about risk timing; if not, no amount of growth story helps."},{"id":"invest-2","type":"invest","diff":2,"title":"Warehouse Robots","client":"Crestline Grocery Distribution","industry":"Logistics / grocery distribution","prompt":"Crestline runs five distribution centers serving 400 supermarkets. Leadership is considering a $45M investment to automate picking in its largest DC. The CFO asks whether it is worth it.","questions":[{"q":"What is the current operation?","a":"800 pickers; labor cost $40M a year at that DC; turnover 60%; error rate 1.5%."},{"q":"What does automation deliver?","a":"Cuts picking labor 50%, errors to 0.3%, throughput up 25%; 18-month install."},{"q":"Alternatives?","a":"Incremental tech (voice picking, better layouts) at $5M for ~15% labor savings; outsourcing."},{"q":"Risks?","a":"Vendor newness, disruption during install, union negotiations."}],"buckets":[{"name":"Demand & need","subs":["Volume growth and throughput constraints","Labor availability and turnover (60%)","Service and accuracy requirements"]},{"name":"Economics","subs":["Labor savings $20M/yr, error-cost savings","Capex $45M, maintenance, software; NPV and payback","Throughput value if DC is a bottleneck"]},{"name":"Alternatives","subs":["$5M incremental tech for 15% savings","Outsourcing or partial automation","Phasing: pilot one zone first"]},{"name":"Risks","subs":["Installation disruption to store service","Technology and vendor risk","Union response; stranded investment if volumes shift"]}],"generic":"Investment / go-no-go","tailored":"Demand framed as labor scarcity and throughput, not sales; alternatives include a cheaper partial option so the case compares against it; risks include service disruption to stores.","hyp":"Automation pays back in ~2.5 years on labor alone and solves a turnover problem that cheaper options do not; a phased install limits disruption risk.","trap":"Evaluating against do-nothing. The $5M alternative captures a chunk of the savings; the question is the incremental return of the extra $40M.","start":"Economics","startWhy":"$20M of annual labor savings against $45M is a strong headline; confirming it (and the incremental return over the $5M option) focuses the rest of the discussion on risk."},{"id":"invest-3","type":"invest","diff":2,"title":"Upgrade","client":"Harbor City Water Authority","industry":"Public sector / utilities","prompt":"Harbor City's water authority must decide whether to spend $220M to replace an aging treatment plant now or spend $60M on repairs that extend its life ten years. The board wants a recommendation.","questions":[{"q":"What is the condition of the plant?","a":"50 years old; failure risk rising; meets current standards but not expected 2032 regulations."},{"q":"How would it be funded?","a":"Municipal bonds; rate increases of 12% for replacement vs. 4% for repairs."},{"q":"What is demand doing?","a":"Population flat; per-capita use declining; capacity is not the issue."},{"q":"What are the risks of each path?","a":"Repair: regulatory non-compliance in 2032, failure risk. Replace: construction risk, rate-payer pushback."}],"buckets":[{"name":"Need","subs":["Service reliability and failure risk now","Regulatory compliance timeline (2032)","Capacity (not a driver here)"]},{"name":"Economics (lifecycle)","subs":["NPV of replace-now vs. repair-then-replace","Operating cost differences (energy, chemicals)","Rate impact (12% vs. 4%) and affordability"]},{"name":"Alternatives","subs":["Repair now, replace in 10 years","Phased replacement; regional sharing with neighbors","Design for smaller capacity given demand trend"]},{"name":"Risks & stakeholders","subs":["Failure and public-health risk under repair path","Construction and cost-overrun risk","Rate-payer and political acceptance"]}],"generic":"Investment / go-no-go","tailored":"Economics framed as lifecycle NPV with affordability (rate impact) rather than profit; need bucket led by reliability and regulation since the authority is not profit-seeking.","hyp":"Repair-then-replace defers cost but likely costs more over the lifecycle once 2032 compliance is included; a right-sized replacement designed for falling demand is the better value.","trap":"Replacing like-for-like. Demand is falling; a smaller plant could cut the $220M and the rate increase considerably.","start":"Alternatives","startWhy":"The two options presented are not the only ones; a right-sized or phased plant may dominate both, and that reshapes the economics."},{"id":"invest-4","type":"invest","diff":3,"title":"In-House","client":"Juniper Apparel","industry":"Consumer / apparel","prompt":"Juniper, a $500M apparel brand, outsources all e-commerce fulfillment to a 3PL. Leadership is weighing a $40M investment to build its own fulfillment center. Make a recommendation.","questions":[{"q":"What does the 3PL cost?","a":"$28M a year; costs rise with volume; service issues during peak season."},{"q":"What would in-house cost?","a":"$40M capex plus $18M annual operating cost at current volume; 2-year build."},{"q":"What are the strategic drivers?","a":"Faster delivery, control over customer experience, and returns handling."},{"q":"What is the growth outlook?","a":"E-commerce growing 15%; the 3PL contract renews in 18 months."}],"buckets":[{"name":"Strategic need","subs":["Is fulfillment core to the customer experience?","Speed and control vs. flexibility","Peak-season performance requirements"]},{"name":"Economics","subs":["$28M (rising) vs. $18M + capex; NPV over 7-10 years","Volume sensitivity and breakeven volume","Returns-handling cost savings"]},{"name":"Alternatives","subs":["Renegotiate or switch 3PL at renewal","Hybrid: in-house core, 3PL for peak","Partner or lease an automated facility"]},{"name":"Risks","subs":["Execution: build, hiring, systems","Fixed-cost exposure if volume disappoints","Transition during peak season"]}],"generic":"Investment / go-no-go (build vs. buy variant)","tailored":"Build-vs-buy framing: strategic need leads because the decision is about control; alternatives include renegotiation at the 18-month renewal and a hybrid model.","hyp":"In-house saves ~$10M a year at current volume and more with growth, but a hybrid (own core, 3PL for peak) likely captures most of the savings with less fixed-cost risk.","trap":"Underestimating build time and fixed-cost risk. A 2-year build and $18M fixed cost turn a volume dip into a loss; the 3PL is at least variable.","start":"Economics","startWhy":"The 10-year NPV with volume sensitivity settles whether control is worth paying for; strategic benefits matter only if the numbers are close."},{"id":"invest-5","type":"invest","diff":3,"title":"Spin-Off","client":"Westfall Media Holdings","industry":"Media / diversified","prompt":"Westfall owns a declining newspaper group and a growing events business. The board is considering divesting the newspaper group, which still generates $30M of cash but is shrinking 8% a year. Should they sell, and what should they consider?","questions":[{"q":"What would the newspapers fetch?","a":"Indicative offers at 3x cash flow, ~$90M; buyers are consolidators."},{"q":"How are the businesses connected?","a":"Shared printing, HR, finance, and offices; events business uses newspaper brands for marketing."},{"q":"What would Westfall do with the proceeds?","a":"Invest in events (growing 12%, 20% margin) and pay down debt."},{"q":"What are the stranded costs?","a":"About $8M of shared overhead would remain after a sale."}],"buckets":[{"name":"Standalone performance","subs":["Newspaper cash flow trajectory (−8%/yr)","Events growth and capital needs","Value of each inside vs. outside Westfall"]},{"name":"Interdependence","subs":["Shared services and stranded costs ($8M)","Brand and marketing links to events","Customer and advertiser overlap"]},{"name":"Value & economics","subs":["$90M now vs. NPV of a declining $30M stream","Tax and transaction costs","Use of proceeds: events investment, debt"]},{"name":"Execution & risks","subs":["Buyer universe and deal certainty","Transition services; employee and community reaction","Alternatives: harvest, partial sale, JV"]}],"generic":"Investment / go-no-go (divestiture variant)","tailored":"Divest version: interdependence and stranded costs are their own bucket; value compares sale proceeds with the NPV of a declining stream; use of proceeds is explicit.","hyp":"Selling at 3x likely beats holding a stream shrinking 8% a year, but only if stranded costs are cut and the proceeds earn more in events; the brand link needs a licensing arrangement.","trap":"Forgetting stranded costs. $8M of remaining overhead cuts the effective sale value substantially; a divestiture plan must cut it, not just reallocate it.","start":"Value & economics","startWhy":"$90M today vs. the NPV of a declining stream is the core comparison; it frames whether interdependence and stranded costs change the answer."},{"id":"public-1","type":"ops","diff":1,"title":"Line Out the Door","client":"Fairview County DMV","industry":"Public sector / services","prompt":"Fairview County's DMV has average wait times of 95 minutes, triple the state target. The county executive wants wait times under 30 minutes within a year without increasing the budget.","questions":[{"q":"What is the demand pattern?","a":"3,000 visits a day across four offices; peaks Mondays and lunch hours; 40% of visits are renewals that could be done online."},{"q":"What is the capacity?","a":"80 clerks; average transaction 12 minutes; 15% of clerk time lost to system downtime and lookups."},{"q":"Where is the bottleneck?","a":"Initial check-in and document verification; many customers arrive with incomplete documents and come back."},{"q":"What is off limits?","a":"Headcount and budget are fixed; union rules limit schedule changes."}],"buckets":[{"name":"Demand","subs":["Volume by transaction type and time of day","Avoidable visits: online renewals (40%), repeat visits","Appointment vs. walk-in mix"]},{"name":"Capacity","subs":["Clerks × hours × productivity","Lost time: downtime, lookups (15%)","Skill mix and cross-training"]},{"name":"Process","subs":["Bottleneck at check-in/verification","Transaction time by type; rework from incomplete documents","Queue design and triage"]},{"name":"Levers","subs":["Shift demand online and to appointments","Pre-check documents; express lanes","Fix the bottleneck; staff to peaks within union rules"]}],"generic":"Operations / public sector (throughput)","tailored":"Throughput structure (demand / capacity / process / levers); demand bucket names avoidable visits because 40% could be online; levers constrained by fixed budget and union rules.","hyp":"Wait times fall under 30 minutes by removing avoidable visits (online renewals, document pre-check) and fixing the check-in bottleneck; no new clerks needed.","trap":"Adding capacity to a process with avoidable demand. Removing 40% of visits and the rework beats any staffing change you cannot afford anyway.","start":"Demand","startWhy":"Avoidable visits are the largest and cheapest lever; quantifying them tells you how much of the problem disappears before touching process."},{"id":"public-2","type":"public","diff":2,"title":"Enrollment Gap","client":"State Department of Health — Childcare Subsidy Program","industry":"Public sector / social services","prompt":"A state childcare subsidy program has funding to serve 60,000 families but only 38,000 are enrolled, and a legislative audit criticized the gap. The program director wants to understand why and how to close it.","questions":[{"q":"Who is eligible and how many?","a":"About 120,000 eligible families; awareness surveys suggest only half know about the program."},{"q":"What is the application process?","a":"Paper or online; 40% of applications are rejected for missing documents; approval takes 6 weeks."},{"q":"What about supply?","a":"In rural counties, few licensed providers accept the subsidy because rates are below market."},{"q":"What outcomes matter?","a":"Parent employment and child development; the audit measured enrollment only."}],"buckets":[{"name":"Objective & metrics","subs":["Outcomes (employment, child development) vs. outputs (enrollment)","Target population definition and priorities"]},{"name":"Target population funnel","subs":["Eligible (120K) → aware (~60K) → applied → approved → enrolled (38K)","Drop-off reasons at each stage (documents, time, stigma)"]},{"name":"Delivery","subs":["Application process and document burden","Provider supply and acceptance (rural rates)","Caseworker capacity and approval time"]},{"name":"Resources & constraints","subs":["Budget for outreach vs. rate increases","Legislative and federal rules","Trade-offs: more families vs. higher rates"]}],"generic":"Operations / public sector (program outcomes)","tailored":"Built the funnel from the actual numbers (120K → 60K aware → 38K enrolled); delivery includes provider supply since subsidies are useless where no provider accepts them.","hyp":"The gap is mostly awareness and application friction (40% rejected on documents); fixing those closes most of it, but rural supply needs rate changes.","trap":"Measuring enrollment alone. The goal is outcomes under a fixed budget; a rate increase that reaches rural families may serve fewer families better.","start":"Target population funnel","startWhy":"Mapping where the 82,000 missing families fall out of the funnel pinpoints which stage to fix; the numbers already hint at awareness and documents."},{"id":"public-3","type":"public","diff":2,"title":"Donor Base","client":"Riverside Food Bank","industry":"Nonprofit / food security","prompt":"Riverside Food Bank serves 200,000 people a year across three counties. Demand is up 30% since 2023, but a major corporate donor (25% of funding) is ending its grant next year. The executive director asks how to secure the organization's future.","questions":[{"q":"What does the funding mix look like?","a":"Corporate 40% (one donor is 25%), individuals 30%, government 20%, foundations 10%."},{"q":"What is the cost structure?","a":"Food purchasing 50%, logistics and warehouse 30%, staff and overhead 20%; food donations in kind are declining."},{"q":"How is impact measured?","a":"Meals distributed; cost per meal is $0.90, in line with peers."},{"q":"What capacity exists?","a":"Warehouse near capacity; volunteer base strong; two-person development team."}],"buckets":[{"name":"Mission impact","subs":["Meals and people served; cost per meal","Prioritization if resources fall short","Program mix (pantries, schools, mobile)"]},{"name":"Funding mix & concentration","subs":["Replace 25% donor: diversify corporate base","Grow individual giving and government programs","Earned revenue options (e.g., agency fees)"]},{"name":"Cost structure","subs":["Food sourcing: donated vs. purchased; rescue partnerships","Logistics efficiency and warehouse capacity","Overhead and development investment"]},{"name":"Capacity & governance","subs":["Development team size (two people)","Board fundraising role","Partnerships and mergers with neighboring banks"]}],"generic":"Operations / public sector (nonprofit sustainability)","tailored":"Funding bucket leads with the concentration risk; cost bucket treats food sourcing (donated vs. purchased) as the main lever; governance includes the board's fundraising role.","hyp":"Riverside should diversify funding (more mid-size corporate and individual donors) while shifting food sourcing back toward donations and rescue partnerships to cut purchase cost.","trap":"Cutting overhead first. A two-person development team is the constraint on replacing the donor; cutting it to save money makes the gap permanent.","start":"Funding mix & concentration","startWhy":"The 25% loss has a date; sizing what can realistically be replaced in 12 months determines whether cost cuts or service prioritization are also needed."},{"id":"public-4","type":"ops","diff":3,"title":"Call Volume","client":"Oakdale 911 Communications Center","industry":"Public sector / emergency services","prompt":"Oakdale's 911 center answers 900,000 calls a year. Average answer time has risen to 25 seconds against a 10-second standard, and dispatcher turnover is 35%. The city manager wants answer times fixed within 18 months.","questions":[{"q":"What is driving call volume?","a":"Volume up 10%; 30% of calls are non-emergency (noise, parking, information)."},{"q":"What is the staffing picture?","a":"120 authorized positions, 95 filled; 6-month training; mandatory overtime common."},{"q":"How does the process work?","a":"One dispatcher takes the call and dispatches; call handling time up due to new protocols."},{"q":"What is the budget situation?","a":"Modest increase possible; new CAD system funded for next year."}],"buckets":[{"name":"Demand","subs":["Call volume by type and time","Non-emergency calls (30%) divertible to 311/online","Repeat and misrouted calls"]},{"name":"Capacity","subs":["Positions filled (95 of 120) × hours × availability","Training pipeline and turnover (35%)","Overtime burnout cycle"]},{"name":"Process","subs":["Call-taker vs. dispatcher split","Protocol time and CAD system efficiency","Queue routing and overflow"]},{"name":"Levers","subs":["Divert non-emergency to 311","Retention and recruiting: pay, schedules, wellness","Separate call-taking from dispatch; CAD rollout"]}],"generic":"Operations / public sector (throughput)","tailored":"Capacity bucket centers on the vacancy and turnover cycle (burnout → overtime → turnover), which is the dominant constraint in dispatch centers; demand bucket names 311 diversion.","hyp":"Answer times recover through 311 diversion and breaking the turnover cycle; adding positions on paper does nothing while 25 remain unfilled.","trap":"Solving with authorized headcount. The constraint is filled seats and burnout; retention is the capacity lever.","start":"Capacity","startWhy":"25 vacant positions and 35% turnover explain most of the gap; understanding the burnout loop tells you whether demand diversion alone can buy enough relief."},{"id":"public-5","type":"public","diff":3,"title":"Housing Pipeline","client":"City of Alder Grove Housing Office","industry":"Public sector / housing","prompt":"Alder Grove set a goal of 5,000 new affordable housing units in five years; after two years only 900 are built or under way. The mayor asks why the program is behind and how to catch up.","questions":[{"q":"How does the pipeline work?","a":"Developers apply → city approves subsidy → zoning/permits → financing closes → construction. Average 30 months from application to start."},{"q":"Where are projects stuck?","a":"Half of approved projects are waiting on permits or neighborhood appeals; a quarter cannot close financing due to higher rates."},{"q":"What resources exist?","a":"$300M subsidy fund, 60% uncommitted; small housing staff; permitting is a separate department."},{"q":"What does success mean?","a":"Units occupied by eligible residents, not just approvals."}],"buckets":[{"name":"Objective & metrics","subs":["Units occupied vs. approved vs. started","Unit mix and affordability levels targeted","Interim milestones to track"]},{"name":"Pipeline funnel","subs":["Applications → approvals → permits → financing → construction → occupancy","Time and drop-off at each stage (permits, appeals, financing)"]},{"name":"Delivery","subs":["Permitting department throughput and appeals process","Financing gap tools (gap loans, rate buy-downs)","Developer capacity and land availability"]},{"name":"Resources & constraints","subs":["$300M fund deployment and subsidy per unit","Staff capacity; cross-department coordination","Legal/zoning constraints; political trade-offs"]}],"generic":"Operations / public sector (program outcomes)","tailored":"Funnel built on the real pipeline stages with the stated bottlenecks (permits, appeals, financing); resources emphasize that money is not the constraint (60% uncommitted).","hyp":"The program is behind because of permitting and financing bottlenecks, not funding; redirecting subsidy toward financing gaps and fast-tracking permits can recover most of the shortfall.","trap":"Measuring approvals as progress. Approved units stuck in permits for 30 months are not housing; manage the funnel to occupancy.","start":"Pipeline funnel","startWhy":"Half the projects are stuck at one stage; quantifying time and drop-off per stage shows exactly where intervention recovers the most units."},{"id":"profit-n1","type":"profit","diff":1,"title":"Thin Snow","client":"Timber Hollow Mountain Resort","industry":"Hospitality / ski resort","prompt":"Timber Hollow is a family-owned ski resort in central Vermont with 1,200 skiable acres, nine lifts, a 140-room base lodge and about 380,000 skier visits a season. Revenue is roughly $62 million, split between lift tickets and passes, lodging, food and beverage, rentals and ski school. Over the last three seasons, skier visits have been flat but EBITDA margin has fallen from 24% to 14%. The owner, a second-generation operator, has joined a multi-resort pass product to stay relevant and has also invested in more snowmaking. She has asked you to explain what is driving the margin decline and how to get back to a 24% margin within two seasons.","questions":[{"q":"How does the resort make money across its lines, and which is largest?","a":"Lift access (tickets plus passes) is a little over half of revenue; lodging, food and beverage, rentals and ski school make up the rest and have roughly held their share."},{"q":"Is the goal strictly margin, or also absolute EBITDA, and is a sale or recapitalization on the table?","a":"Margin back to 24% on a similar revenue base; the family intends to keep the resort and is not looking to sell."},{"q":"Within flat skier visits, has the mix between day tickets and season or multi-resort passes shifted?","a":"Yes, materially: pass-holder visits are now the majority of visits, and day-ticket visits have fallen sharply since joining the multi-resort pass."},{"q":"Are competing New England resorts seeing the same margin squeeze, or is this specific to Timber Hollow?","a":"Peers on the same pass have seen yield pressure too, but most have held margins closer to 20% through cost and ancillary pricing."},{"q":"How have snowmaking costs and days open changed?","a":"Days open slipped from about 135 to 120 over the period, and snowmaking energy spend is up roughly 40% as the resort makes more snow in warmer shoulder months."}],"buckets":[{"name":"Skier visits & ticket mix","subs":["Day-ticket vs season-pass vs multi-resort pass visits","Weekend vs midweek and holiday peaking","Destination (lodging) vs drive-up day visitors"]},{"name":"Revenue per skier visit","subs":["Lift yield per visit by ticket type (pass revenue share per visit)","Ancillary attach: rentals, lessons, F&B spend per visit","Lodging ADR and occupancy on peak vs off-peak nights"]},{"name":"Cost of running the mountain","subs":["Snowmaking energy and water per acre-foot of snow","Seasonal labor (lifts, patrol, F&B) and J-1 housing","Lift maintenance, insurance and grooming fleet"]},{"name":"Season length & weather exposure","subs":["Days open and early/late season breakeven per day","Snowfall variance and the cost of guaranteeing terrain","Fixed cost per operating day"]}],"generic":"Profitability","tailored":"Price became revenue per skier visit, because a multi-resort pass pays the resort a fixed share per visit regardless of what the skier would have paid at the window; cost split into snowmaking, seasonal labor and lift/fixed, and a season-length bucket was added because every lost operating day removes revenue but not fixed cost.","hyp":"The ten-point margin drop is mostly a yield problem: the shift from day tickets to pass visits cut lift revenue per visit, and snowmaking energy rose on top. Ancillary pricing and midweek pass restrictions, not cutting staff, is where the recovery starts.","trap":"Blaming the weather. Days open fell about 11%, but visits are flat, so the margin collapse sits in revenue per visit and snowmaking cost, not in lost volume.","start":"Revenue per skier visit","startWhy":"Flat visits with a ten-point margin fall means the mix of what each skier pays moved; size the pass-vs-day-ticket yield gap before anything else."},{"id":"profit-n2","type":"profit","diff":2,"title":"Hull Split","client":"Murray Basin Almond Growers Cooperative","industry":"Agriculture / tree nuts","prompt":"Murray Basin is a grower-owned almond cooperative along the Murray River in Victoria and New South Wales, Australia. It has 140 member growers farming about 28,000 hectares, runs two hulling and shelling plants, and markets roughly 90,000 tonnes of kernel a year to India, Europe and China, with revenue near A$650 million. Over three seasons the payout per kilogram paid to growers has fallen about 30% even though delivered volume is up 15% as young orchards matured. The cooperative is a price-taker: world almond prices are set largely by the California crop. The board, elected by the growers, has asked you to explain the fall in payout and to find a way to return it to the five-year average within two seasons.","questions":[{"q":"How does the cooperative make money and how is the payout to growers determined?","a":"The co-op sells kernel and by-products, deducts processing, freight and marketing costs and overhead, and distributes the remainder per kilogram delivered; it is not supposed to retain profit."},{"q":"What is the quantified goal: payout per kilogram back to the five-year average, and over what horizon?","a":"Yes, payout per kilogram back to the five-year average within two seasons; the board would also accept a credible path if the world price does not recover."},{"q":"How much of the payout decline is explained by the world almond price itself?","a":"Directionally, the benchmark world price fell around 20% over the same period, so a meaningful share of the drop is not explained by price alone."},{"q":"Have grower-level costs, especially water, changed?","a":"Temporary water allocation prices roughly doubled in the dry years, and water is now the single largest grower input cost."},{"q":"Has the variety and grade mix of what the co-op sells changed as the new orchards matured?","a":"Yes; the newer plantings skew toward pollinator varieties and smaller sizes, which sell at a discount to Nonpareil, and reject and insect-damage rates rose."}],"buckets":[{"name":"Crop volume & orchard yield","subs":["Kernel kg per hectare by orchard age cohort","Water allocation volume and temporary water price per ML","Pollination, pest and reject rates"]},{"name":"Price realization per kg","subs":["World benchmark price and global inventory overhang","Variety and size-grade mix (Nonpareil vs pollinators) and reject discounts","Forward-contract timing and AUD/USD hedging"]},{"name":"Processing & marketing cost per kg","subs":["Hulling/shelling plant utilization and labor per tonne","Hull and shell by-product sales to dairy feed","Freight to port, container rates and marketing overhead"]},{"name":"Grower economics at the farm gate","subs":["Water cost per kg of kernel","Orchard replanting and tree-age profile","Harvest labor and energy"]}],"generic":"Profitability","tailored":"Price became price realization for a price-taker: the co-op cannot set the world price but it controls grade mix, contract timing and FX; cost split into co-op processing cost versus grower farm-gate cost because the profit metric is payout per kilogram, not margin.","hyp":"World price explains about two-thirds of the 30% payout fall; the remaining third is self-inflicted through a lower-value variety and grade mix and poorly timed forward sales, which the co-op can fix within two seasons while water cost stays outside its control.","trap":"Stopping at the price-taker point. A candidate who says the world price fell and there is nothing to do misses that a 20% price drop does not explain a 30% payout drop, and that grade mix, hedging and by-product value are controllable.","start":"Price realization per kg","startWhy":"Decompose the 30% payout fall into world price versus realized price versus cost first; the gap between the benchmark and what the co-op actually received is the controllable part."},{"id":"profit-n3","type":"profit","diff":2,"title":"Billable Hours","client":"Marlowe Dunn Architects","industry":"Professional services / architecture","prompt":"Marlowe Dunn is a 60-year-old architecture and interiors firm headquartered in Chicago with offices in Denver and Nashville. It has about 320 staff, fee revenue of $78 million, and works mainly on healthcare, higher-education and commercial office projects. Backlog is at a record $140 million, yet net margin has fallen from 14% to 5% over three years while headcount grew 20%. Fees are a mix of fixed-fee and hourly contracts. The managing partner, under pressure from the other 18 equity partners whose distributions have shrunk, has asked you to diagnose the margin decline and lay out a plan to return to 14% within two years.","questions":[{"q":"How does the firm earn fees: fixed-fee versus hourly, and how have margins differed between them?","a":"About 70% of fees are fixed-fee today, up from half three years ago; fixed-fee jobs have been running over budget while hourly work is still healthy."},{"q":"Is the target 14% net margin on the current revenue base, and does the partnership accept slowing growth to get there?","a":"Yes, 14% within two years; partners would rather grow slower than keep taking low-fee work."},{"q":"Wh
