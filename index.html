sidy program has funding to serve 60,000 families but only 38,000 are enrolled, and a legislative audit criticized the gap. The program director wants to understand why and how to close it.", "questions": [{"q": "Who is eligible and how many?", "a": "About 120,000 eligible families; awareness surveys suggest only half know about the program."}, {"q": "What is the application process?", "a": "Paper or online; 40% of applications are rejected for missing documents; approval takes 6 weeks."}, {"q": "What about supply?", "a": "In rural counties, few licensed providers accept the subsidy because rates are below market."}, {"q": "What outcomes matter?", "a": "Parent employment and child development; the audit measured enrollment only."}], "buckets": [{"name": "Objective & metrics", "subs": ["Outcomes (employment, child development) vs. outputs (enrollment)", "Target population definition and priorities"]}, {"name": "Target population funnel", "subs": ["Eligible (120K) → aware (~60K) → applied → approved → enrolled (38K)", "Drop-off reasons at each stage (documents, time, stigma)"]}, {"name": "Delivery", "subs": ["Application process and document burden", "Provider supply and acceptance (rural rates)", "Caseworker capacity and approval time"]}, {"name": "Resources & constraints", "subs": ["Budget for outreach vs. rate increases", "Legislative and federal rules", "Trade-offs: more families vs. higher rates"]}], "generic": "Operations / public sector (program outcomes)", "tailored": "Built the funnel from the actual numbers (120K → 60K aware → 38K enrolled); delivery includes provider supply since subsidies are useless where no provider accepts them.", "hyp": "The gap is mostly awareness and application friction (40% rejected on documents); fixing those closes most of it, but rural supply needs rate changes.", "trap": "Measuring enrollment alone. The goal is outcomes under a fixed budget; a rate increase that reaches rural families may serve fewer families better.", "start": "Target population funnel", "startWhy": "Mapping where the 82,000 missing families fall out of the funnel pinpoints which stage to fix; the numbers already hint at awareness and documents."}, {"id": "public-3", "type": "public", "diff": 2, "title": "Donor Base", "client": "Riverside Food Bank", "industry": "Nonprofit / food security", "prompt": "Riverside Food Bank serves 200,000 people a year across three counties. Demand is up 30% since 2023, but a major corporate donor (25% of funding) is ending its grant next year. The executive director asks how to secure the organization's future.", "questions": [{"q": "What does the funding mix look like?", "a": "Corporate 40% (one donor is 25%), individuals 30%, government 20%, foundations 10%."}, {"q": "What is the cost structure?", "a": "Food purchasing 50%, logistics and warehouse 30%, staff and overhead 20%; food donations in kind are declining."}, {"q": "How is impact measured?", "a": "Meals distributed; cost per meal is $0.90, in line with peers."}, {"q": "What capacity exists?", "a": "Warehouse near capacity; volunteer base strong; two-person development team."}], "buckets": [{"name": "Mission impact", "subs": ["Meals and people served; cost per meal", "Prioritization if resources fall short", "Program mix (pantries, schools, mobile)"]}, {"name": "Funding mix & concentration", "subs": ["Replace 25% donor: diversify corporate base", "Grow individual giving and government programs", "Earned revenue options (e.g., agency fees)"]}, {"name": "Cost structure", "subs": ["Food sourcing: donated vs. purchased; rescue partnerships", "Logistics efficiency and warehouse capacity", "Overhead and development investment"]}, {"name": "Capacity & governance", "subs": ["Development team size (two people)", "Board fundraising role", "Partnerships and mergers with neighboring banks"]}], "generic": "Operations / public sector (nonprofit sustainability)", "tailored": "Funding bucket leads with the concentration risk; cost bucket treats food sourcing (donated vs. purchased) as the main lever; governance includes the board's fundraising role.", "hyp": "Riverside should diversify funding (more mid-size corporate and individual donors) while shifting food sourcing back toward donations and rescue partnerships to cut purchase cost.", "trap": "Cutting overhead first. A two-person development team is the constraint on replacing the donor; cutting it to save money makes the gap permanent.", "start": "Funding mix & concentration", "startWhy": "The 25% loss has a date; sizing what can realistically be replaced in 12 months determines whether cost cuts or service prioritization are also needed."}, {"id": "public-4", "type": "ops", "diff": 3, "title": "Call Volume", "client": "Oakdale 911 Communications Center", "industry": "Public sector / emergency services", "prompt": "Oakdale's 911 center answers 900,000 calls a year. Average answer time has risen to 25 seconds against a 10-second standard, and dispatcher turnover is 35%. The city manager wants answer times fixed within 18 months.", "questions": [{"q": "What is driving call volume?", "a": "Volume up 10%; 30% of calls are non-emergency (noise, parking, information)."}, {"q": "What is the staffing picture?", "a": "120 authorized positions, 95 filled; 6-month training; mandatory overtime common."}, {"q": "How does the process work?", "a": "One dispatcher takes the call and dispatches; call handling time up due to new protocols."}, {"q": "What is the budget situation?", "a": "Modest increase possible; new CAD system funded for next year."}], "buckets": [{"name": "Demand", "subs": ["Call volume by type and time", "Non-emergency calls (30%) divertible to 311/online", "Repeat and misrouted calls"]}, {"name": "Capacity", "subs": ["Positions filled (95 of 120) × hours × availability", "Training pipeline and turnover (35%)", "Overtime burnout cycle"]}, {"name": "Process", "subs": ["Call-taker vs. dispatcher split", "Protocol time and CAD system efficiency", "Queue routing and overflow"]}, {"name": "Levers", "subs": ["Divert non-emergency to 311", "Retention and recruiting: pay, schedules, wellness", "Separate call-taking from dispatch; CAD rollout"]}], "generic": "Operations / public sector (throughput)", "tailored": "Capacity bucket centers on the vacancy and turnover cycle (burnout → overtime → turnover), which is the dominant constraint in dispatch centers; demand bucket names 311 diversion.", "hyp": "Answer times recover through 311 diversion and breaking the turnover cycle; adding positions on paper does nothing while 25 remain unfilled.", "trap": "Solving with authorized headcount. The constraint is filled seats and burnout; retention is the capacity lever.", "start": "Capacity", "startWhy": "25 vacant positions and 35% turnover explain most of the gap; understanding the burnout loop tells you whether demand diversion alone can buy enough relief."}, {"id": "public-5", "type": "public", "diff": 3, "title": "Housing Pipeline", "client": "City of Alder Grove Housing Office", "industry": "Public sector / housing", "prompt": "Alder Grove set a goal of 5,000 new affordable housing units in five years; after two years only 900 are built or under way. The mayor asks why the program is behind and how to catch up.", "questions": [{"q": "How does the pipeline work?", "a": "Developers apply → city approves subsidy → zoning/permits → financing closes → construction. Average 30 months from application to start."}, {"q": "Where are projects stuck?", "a": "Half of approved projects are waiting on permits or neighborhood appeals; a quarter cannot close financing due to higher rates."}, {"q": "What resources exist?", "a": "$300M subsidy fund, 60% uncommitted; small housing staff; permitting is a separate department."}, {"q": "What does success mean?", "a": "Units occupied by eligible residents, not just approvals."}], "buckets": [{"name": "Objective & metrics", "subs": ["Units occupied vs. approved vs. started", "Unit mix and affordability levels targeted", "Interim milestones to track"]}, {"name": "Pipeline funnel", "subs": ["Applications → approvals → permits → financing → construction → occupancy", "Time and drop-off at each stage (permits, appeals, financing)"]}, {"name": "Delivery", "subs": ["Permitting department throughput and appeals process", "Financing gap tools (gap loans, rate buy-downs)", "Developer capacity and land availability"]}, {"name": "Resources & constraints", "subs": ["$300M fund deployment and subsidy per unit", "Staff capacity; cross-department coordination", "Legal/zoning constraints; political trade-offs"]}], "generic": "Operations / public sector (program outcomes)", "tailored": "Funnel built on the real pipeline stages with the stated bottlenecks (permits, appeals, financing); resources emphasize that money is not the constraint (60% uncommitted).", "hyp": "The program is behind because of permitting and financing bottlenecks, not funding; redirecting subsidy toward financing gaps and fast-tracking permits can recover most of the shortfall.", "trap": "Measuring approvals as progress. Approved units stuck in permits for 30 months are not housing; manage the funnel to occupancy.", "start": "Pipeline funnel", "startWhy": "Half the projects are stuck at one stage; quantifying time and drop-off per stage shows exactly where intervention recovers the most units."}], "lenses": [{"id": "intext", "name": "Internal vs External", "when": "Universal fallback; BCG's recommended on-the-spot structure"}, {"id": "shortlong", "name": "Short-term vs Long-term", "when": "Universal fallback; when timing matters"}, {"id": "revcost", "name": "Revenue vs Cost", "when": "Any 'how to improve profit' brainstorm"}, {"id": "supdem", "name": "Supply side vs Demand side", "when": "Shortages, capacity, pricing pressure"}, {"id": "valuechain", "name": "Value chain", "when": "Cost or risk questions about a company's operations (DoorDash example)"}, {"id": "4c", "name": "Stakeholders / 4 Cs", "when": "Industry or company questions: Customer, Company, Competitors, Collaborators"}, {"id": "journey", "name": "Customer journey", "when": "Experience, conversion, churn questions"}, {"id": "ansoff", "name": "Ansoff (products × markets)", "when": "Growth / revenue ideas"}, {"id": "volprice", "name": "Volume vs Price", "when": "Revenue ideas: more customers, more per customer vs raise, re-tier, reduce discounting"}, {"id": "orginorg", "name": "Organic vs Inorganic", "when": "Growth — build / buy / partner"}, {"id": "fixvar", "name": "Fixed vs Variable", "when": "Cost ideas (then direct vs indirect)"}, {"id": "ppt", "name": "People, Process, Technology", "when": "Operations / efficiency ideas"}, {"id": "makebuy", "name": "Make vs Buy", "when": "In-house vs outsource questions"}, {"id": "4p", "name": "4 Ps", "when": "Marketing / product launch ideas"}, {"id": "seg", "name": "Segmentation", "when": "Second cut: customer type, geography, channel, occasion"}, {"id": "fdv", "name": "Feasibility, Desirability, Viability", "when": "'Should they' / risk brainstorms"}, {"id": "mefr", "name": "Market, Execution, Financial, Regulatory", "when": "Risk brainstorms"}, {"id": "porter", "name": "Porter's Five Forces", "when": "Only when the question is literally industry attractiveness"}], "brain": [{"prompt": "A food-delivery platform wants ideas to reduce costs. What are some?", "lens": "valuechain", "why": "Walk the chain: partnering with restaurants → prepping/packing → delivering → supporting customers → running the business, with a cost lever in each."}, {"prompt": "What factors might explain why our gym's churn jumped this year?", "lens": "intext", "why": "Internal (onboarding, class schedule, price, equipment) vs external (new budget gym, economy, seasonality) — simple and MECE on the spot."}, {"prompt": "What are ways a regional bakery chain could increase revenue?", "lens": "volprice", "why": "Volume (more customers: new sites, marketing; more per customer: frequency, basket) vs Price (raise, reduce discounting, re-tier)."}, {"prompt": "What risks should the client consider before building the $105M plant?", "lens": "mefr", "why": "Market (demand falls short), Execution (overruns, workforce), Financial (capital tied up), Regulatory (permits) — then prioritize."}, {"prompt": "Why might the hospital ED's wait times have risen while visit volume is flat?", "lens": "supdem", "why": "Demand side (acuity mix, boarding) vs supply side (nurse vacancies, bed capacity) — then name the bottleneck."}, {"prompt": "How could the apparel brand grow beyond its core stores?", "lens": "ansoff", "why": "Existing/new products × existing/new markets gives four cells: penetration, new geographies/wholesale, new categories, diversification."}, {"prompt": "What could be driving the drop in online conversion for the retailer?", "lens": "journey", "why": "Awareness → consideration → purchase → use → repeat: pinpoint the stage where the funnel leaks."}, {"prompt": "Who would be affected if the city bid for the Olympics?", "lens": "4c", "why": "Stakeholders: residents/customers, the city itself, competing cities, collaborators (sponsors, federations) — each with gains and costs."}, {"prompt": "What options does the manufacturer have to lower its cost per unit?", "lens": "fixvar", "why": "Fixed (footprint, overhead absorption) vs variable (input price, yield, labor hours) — then direct vs indirect."}, {"prompt": "How should the DMV cut processing time without new budget?", "lens": "ppt", "why": "People (cross-training, scheduling to peaks), Process (triage, appointments), Technology (online renewals, kiosks)."}, {"prompt": "Should the software firm develop the new module in-house or partner?", "lens": "makebuy", "why": "Make vs buy: speed, control, cost, core-ness, dependency risk."}, {"prompt": "What would you consider before launching the toddler snack line?", "lens": "4p", "why": "Product (differentiation), Price (WTP, cannibalization), Place (channels), Promotion (how to win trial)."}, {"prompt": "Which customers should the bank target with the premium tier?", "lens": "seg", "why": "Segment by customer type, geography, channel, occasion — then pick the segment with highest WTP and lowest cannibalization."}, {"prompt": "Is building the new venue a good idea for the city?", "lens": "fdv", "why": "Feasibility (can we build it), Desirability (do residents and visitors want it), Viability (does it pay for itself)."}, {"prompt": "How attractive is the data-center colocation industry?", "lens": "porter", "why": "The question is literally industry attractiveness — rivalry, entry barriers, substitutes, buyer and supplier power."}, {"prompt": "What levers could the retailer pull to respond to the discounter?", "lens": "shortlong", "why": "Short-term (promotions, price-match on key items, service) vs long-term (assortment, private label, store format)."}, {"prompt": "How could the distributor grow to $450M?", "lens": "orginorg", "why": "Organic (wallet share, new logos, private label) vs inorganic (tuck-in distributors) — and the screen for each."}, {"prompt": "What could explain the manufacturer's margin decline?", "lens": "revcost", "why": "Revenue (price, volume, mix) vs Cost (input, conversion, overhead) — then name which line moved."}], "math": [{"q": "10% discount factor, year 1", "a": "0.91", "d": ["0.83", "0.95", "0.90"]}, {"q": "10% discount factor, year 2", "a": "0.83", "d": ["0.91", "0.75", "0.80"]}, {"q": "10% discount factor, year 3", "a": "0.75", "d": ["0.83", "0.68", "0.72"]}, {"q": "10% discount factor, year 5", "a": "0.62", "d": ["0.68", "0.75", "0.55"]}, {"q": "Annuity factor, 10%, 5 years", "a": "3.79", "d": ["4.33", "3.17", "5.00"]}, {"q": "Annuity factor, 10%, 3 years", "a": "2.49", "d": ["2.74", "2.17", "3.00"]}, {"q": "Annuity factor, 10%, 10 years", "a": "6.14", "d": ["7.72", "5.00", "8.50"]}, {"q": "Annuity factor, 20%, 5 years", "a": "2.99", "d": ["3.79", "2.49", "4.00"]}, {"q": "Perpetuity multiple at 10%", "a": const store = {
  get(k,d){ try{ const v=localStorage.getItem('cfd.'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('cfd.'+k, JSON.stringify(v)); }catch(e){} }
};
let SRS = store.get('srs',{});      // key -> {iv, due, n}
let STATS = store.get('stats',{});  // mode -> type -> {r,w}
let LOG = store.get('log',[]);      // structure self-grades
let FILTER = new Set(store.get('filter', D.types.map(t=>t.id)));
let streak = 0;

const T = Object.fromEntries(D.types.map(t=>[t.id,t]));
const tname = id => T[id] ? T[id].name : id;
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuf = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inF = id => FILTER.has(id);

// ---------- unified structures ----------
function structures(){
  const out=[];
  D.types.filter(t=>inF(t.id)).forEach(t=>out.push({src:'type',type:t.id,label:t.name+' (generic)',buckets:t.buckets,trap:t.trap,hyp:t.hyp,key:'t:'+t.id}));
  D.scen.filter(s=>inF(s.type)).forEach(s=>out.push({src:'scen',type:s.type,label:s.title,buckets:s.buckets,trap:s.trap,hyp:s.hyp,key:'s:'+s.id}));
  D.cases.filter(c=>inF(c.type)).forEach(c=>out.push({src:'case',type:c.type,label:c.title+' — '+c.client,ctx:c.prompt,buckets:c.buckets,trap:c.trap,hyp:c.hyp,key:'c:'+c.id}));
  return out;
}
function allStructures(){ const f=FILTER; FILTER=new Set(D.types.map(t=>t.id)); const s=structures(); FILTER=f; return s; }
const GENERIC = new Set(['external','risks','risk','market','economics','financials','financial','screen','competition','levers','capabilities','execution','mix','customer','customers','costs','cost','revenue','demand','process','capacity','operations','alternatives']);
const STOP = new Set(['and','the','per','vs','for','with','our','new','of','to','a','in','on','is','are','what','where','why','who','how','can','we']);
const words = s => s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>=4 && !STOP.has(w));
function overlaps(a, names){ const wa=words(a); return names.some(n=>{ const wn=words(n); return wa.some(w=>wn.some(x=>x.startsWith(w.slice(0,5))||w.startsWith(x.slice(0,5)))) }); }
function norm(s){ return s.toLowerCase().replace(/[^a-z]/g,''); }

// ---------- question generators ----------
function qType(){
  const pool=[];
  D.cases.filter(c=>inF(c.type)).forEach(c=>pool.push({type:c.type,stem:c.prompt,ctx:c.client+' · '+c.industry,explain:c.generic}));
  D.scen.filter(s=>inF(s.type)).forEach(s=>pool.push({type:s.type,stem:s.title,ctx:'Scenario archetype',explain:null}));
  D.types.filter(t=>inF(t.id)).forEach(t=>t.triggers.forEach(tr=>pool.push({type:t.id,stem:'“'+tr+'”',ctx:'Interviewer prompt',explain:t.defn})));
  if(!pool.length) return null;
  const p=rnd(pool); const t=T[p.type];
  let others=D.types.filter(x=>x.id!==t.id);
  const same=shuf(others.filter(x=>x.fam===t.fam)); const rest=shuf(others.filter(x=>x.fam!==t.fam));
  const dis=same.concat(rest).slice(0,3);
  const opts=shuf([t,...dis]).map(x=>({text:x.name,ok:x.id===t.id}));
  return {mode:'type',type:t.id,title:'Name the case type',ctx:p.ctx,q:p.stem,opts,
    explain:`<b>${esc(t.name)}</b>${p.explain?esc(p.explain)+'<br>':''}<span class="small">Say it first: “This is a ${esc(t.name.toLowerCase())} case.” Buckets: ${t.buckets.map(b=>esc(b.name)).join(' · ')}.</span>`};
}
function qOdd(){
  const S=structures().filter(s=>s.buckets.length>=3); if(!S.length) return null;
  const all=allStructures();
  for(let tries=0;tries<40;tries++){
    const s=rnd(S); const real=shuf(s.buckets).slice(0,3); const names=real.map(b=>b.name);
    const cands=[]; all.filter(o=>o.type!==s.type).forEach(o=>o.buckets.forEach(b=>{ if(!GENERIC.has(norm(b.name)) && !overlaps(b.name,names) && b.name.length<40) cands.push({b,o}); }));
    if(!cands.length) continue;
    const x=rnd(cands);
    const opts=shuf([...real.map(b=>({text:b.name,ok:false})),{text:x.b.name,ok:true}]);
    return {mode:'odd',type:s.type,title:'Which bucket doesn’t belong?',ctx:(s.src==='case'?'Case: ':s.src==='scen'?'Scenario: ':'')+s.label,q:'Three of these are buckets in the '+(s.src==='type'?'generic ':'')+tname(s.type).toLowerCase()+' structure. One is an intruder.',opts,
      explain:`<b>“${esc(x.b.name)}” is from ${esc(x.o.label)} (${esc(tname(x.o.type))}).</b>The real structure: ${s.buckets.map(b=>esc(b.name)).join(' · ')}.`};
  }
  return null;
}
function qMissing(){
  const S=structures().filter(s=>s.buckets.length>=3); if(!S.length) return null;
  const all=allStructures();
  for(let tries=0;tries<40;tries++){
    const s=rnd(S); const idx=Math.floor(Math.random()*s.buckets.length); const miss=s.buckets[idx]; const shown=s.buckets.filter((_,i)=>i!==idx);
    const names=s.buckets.map(b=>b.name);
    const cands=[]; all.filter(o=>o.type!==s.type).forEach(o=>o.buckets.forEach(b=>{ if(!overlaps(b.name,names) && b.name.length<40) cands.push(b.name); }));
    const uniq=[...new Set(cands)]; if(uniq.length<3) continue;
    // avoid two distractors overlapping each other
    const dis=[]; for(const c of shuf(uniq)){ if(!overlaps(c,dis)) dis.push(c); if(dis.length===3) break; }
    if(dis.length<3) continue;
    const opts=shuf([{text:miss.name,ok:true},...dis.map(d=>({text:d,ok:false}))]);
    return {mode:'missing',type:s.type,title:'Fill the missing bucket',ctx:(s.src==='case'?'Case: ':s.src==='scen'?'Scenario: ':'')+s.label,
      q:'Buckets so far: '+shown.map(b=>'“'+b.name+'”').join(', ')+'. What’s the missing one?',opts,
      explain:`<b>${esc(miss.name)}</b>${miss.subs&&miss.subs.length?'Click-downs: '+miss.subs.map(esc).join(' · ')+'.':''}${miss.why?'<br><span class="small">Why: '+esc(miss.why)+'</span>':''}`};
  }
  return null;
}
function qClick(){
  const S=structures().filter(s=>s.buckets.filter(b=>b.subs&&b.subs.length).length>=2); if(!S.length) return null;
  for(let tries=0;tries<40;tries++){
    const s=rnd(S); const bks=s.buckets.filter(b=>b.subs&&b.subs.length); const b=rnd(bks); const sub=rnd(b.subs);
    let others=[]; bks.filter(x=>x!==b).forEach(x=>others.push(...x.subs.map(t=>({t,from:x.name}))));
    others=others.filter(o=>!overlaps(o.t,[sub,b.name]));
    if(others.length<3){ // supplement from same-type structures
      structures().filter(o=>o.type===s.type&&o!==s).forEach(o=>o.buckets.forEach(x=>x.subs&&x.subs.forEach(t=>{ if(!overlaps(t,[sub,b.name])) others.push({t,from:x.name+' ('+o.label+')'}); })));
    }
    if(others.length<3) continue;
    const dis=shuf(others).slice(0,3);
    const opts=shuf([{text:sub,ok:true},...dis.map(d=>({text:d.t,ok:false,from:d.from}))]);
    return {mode:'click',type:s.type,title:'Click-down match',ctx:(s.src==='case'?'Case: ':s.src==='scen'?'Scenario: ':'')+s.label,
      q:'Which click-down sits under the “'+b.name+'” bucket?',opts,
      explain:`<b>${esc(sub)}</b>Under “${esc(b.name)}”. ${dis.map(d=>'“'+esc(d.t)+'” → '+esc(d.from)).join('; ')}.`};
  }
  return null;
}
function qTrap(){
  const S=structures().filter(s=>s.trap); if(S.length<4) return null;
  const s=rnd(S); const all=allStructures().filter(o=>o.type!==s.type&&o.trap&&o.trap!==s.trap);
  const seen=new Set([s.trap]); const dis=[]; for(const o of shuf(all)){ if(!seen.has(o.trap)){seen.add(o.trap);dis.push(o.trap);} if(dis.length===3)break; }
  if(dis.length<3) return null;
  const opts=shuf([{text:s.trap,ok:true},...dis.map(d=>({text:d,ok:false}))]);
  return {mode:'trap',type:s.type,title:'Name the trap',ctx:(s.src==='case'?'Case: ':s.src==='scen'?'Scenario: ':'')+s.label,q:s.ctx?s.ctx:'Which trap does this '+tname(s.type).toLowerCase()+' structure need to call out?',opts,
    explain:`<b>The trap</b>${esc(s.trap)}<br><span class="small">Hypothesis starter: ${esc(s.hyp)}</span>`};
}
function qLens(){
  const b=rnd(D.brain); const L=Object.fromEntries(D.lenses.map(l=>[l.id,l]));
  const dis=shuf(D.lenses.filter(l=>l.id!==b.lens)).slice(0,3);

}
function qMath(){

const GEN={type:qType,odd:qOdd,missing:qMissing,click:qClick,trap:qTrap,lens:qLens,math:qMath};

function answer(i){
  if(answered) return; answered=true; nQ++;
  const ok=cur.opts[i].ok; if(ok){nR++;streak++;} else streak=0;
  document.querySelectorAll('.opt').forEach((b,j)=>{ if(cur.opts[j].ok) b.classList.add('ok'); else if(j===i) b.classList.add('bad'); else b.classList.add('dim'); });
  const tkey=cur.type||'general'; STATS[cur.mode]=STATS[cur.mode]||{}; const s=STATS[cur.mode][tkey]=STATS[cur.mode][tkey]||{r:0,w:0}; ok?s.r++:s.w++; store.set('stats',STATS);
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'':'bad'}">${ok?'':'<b>Not quite.</b>'}${cur.explain}</div><button class="btn" id="nx">Next</button>`;
  document.getElementById('nx').onclick=nextMCQ;
  document.querySelector('.streak').textContent=streak?'🔥 '+streak:'';
  document.querySelector('.top span').innerHTML=`Q <b>${nQ}</b> · ${nR}/${nQ} right`;
}

// ---------- flashcards ----------
const DECKS=[
 {id:'types',ic:'🧭',name:'Case-type frameworks',desc:'All 18 types: generic buckets, click-downs, trap, hypothesis, formula',typed:true},
 {id:'scen',ic:'🗂️',name:'30 scenario cards',desc:'Scenario archetype → tailored MECE buckets, trap, hypothesis',typed:true},
 {id:'cases',ic:'🏢',name:'50 tailored cases',desc:'Client prompt → clarifying Qs → tailored tree, trap, start bucket',typed:true},
 {id:'coach',ic:'🎯',name:'Coaching fixes & rubric',desc:'Your repeated gaps and the exact fix, the six-item rubric, BGOT, BCG notes'},
 {id:'lens',ic:'🧠',name:'Brainstorm lenses',desc:'When to reach for each lens'},
 {id:'math',ic:'🔢',name:'Numbers to have cold',desc:'Discount and annuity factors, Rule of 72, IRR, anchors'},
];
function deckCards(id){
  switch(id){
    case 'types': return D.types.filter(t=>inF(t.id)).map(t=>({key:'f:t:'+t.id,type:t.id,front:`<span class="tag navy">${esc(FAMILIESHORT(t.fam))}</span><div class="front" style="margin-top:8px">${esc(t.name)}</div><div class="ctx" style="margin-top:6px">${esc(t.defn)}</div><div class="small" style="margin-top:8px">e.g. “${esc(t.triggers[0])}”</div>`,back:bucketsHTML(t.buckets)+`<div class="kv"><b>Trap</b>${esc(t.trap)}<b>Hypothesis starter</b>${esc(t.hyp)}<b>Start with</b>${esc(t.start)}<b>Formula / number</b>${esc(t.formula)}</div>`}));
    case 'scen': return D.scen.filter(s=>inF(s.type)).map(s=>({key:'f:s:'+s.id,type:s.type,front:`<span class="tag">${esc(tname(s.type))}</span><div class="front" style="margin-top:8px">${esc(s.title)}</div><div class="small" style="margin-top:8px">Name 3–4 MECE buckets with one click-down each, the trap, and a hypothesis.</div>`,back:bucketsHTML(s.buckets)+`<div class="kv"><b>Trap</b>${esc(s.trap)}<b>Hypothesis</b>${esc(s.hyp)}</div>`}));
    case 'cases': return D.cases.filter(c=>inF(c.type)).map(c=>({key:'f:c:'+c.id,type:c.type,front:`<span class="tag">${esc(tname(c.type))}</span> <span class="tag gold">${'●'.repeat(c.diff)}${'○'.repeat(3-c.diff)}</span><div class="front" style="margin-top:8px">${esc(c.title)} — ${esc(c.client)}</div><div class="prompt">${esc(c.prompt)}</div><div class="qs"><details><summary>Clarifying questions (${c.questions.length})</summary>${c.questions.map(q=>`<p><b>${esc(q.q)}</b><br>${esc(q.a)}</p>`).join('')}</details></div>`,back:bucketsHTML(c.buckets)+`<div class="kv"><b>Generic → tailored</b>${esc(c.generic)}. ${esc(c.tailored)}<b>Hypothesis</b>${esc(c.hyp)}<b>Trap</b>${esc(c.trap)}<b>Start with</b>${esc(c.start)} — ${esc(c.startWhy)}</div>`}));
    case 'coach': return D.coach.map((c,i)=>({key:'f:k:'+i,type:null,front:`<div class="front">${esc(c.front)}</div>`,back:`<div class="kv" style="font-size:16px">${esc(c.back)}</div>`}));
    case 'lens': return D.lenses.map(l=>({key:'f:l:'+l.id,type:null,front:`<div class="ctx">Which lens?</div><div class="front">${esc(l.when)}</div>`,back:`<div class="kv" style="font-size:18px;font-weight:600">${esc(l.name)}</div>`}));
    case 'math': return D.math.map((m,i)=>({key:'f:m:'+i,type:null,front:`<div class="front">${esc(m.q)}</div>`,back:`<div class="kv" style="font-size:24px;font-weight:700">${esc(m.a)}</div>`}));
  }
}
function FAMILIESHORT(f){ return D.families[f]; }
function bucketsHTML(bs){ return bs.map(b=>`<div class="bucket"><b>${esc(b.name)}</b>${b.why?`<div class="why">${esc(b.why)}</div>`:''}${b.subs&&b.subs.length?`<ul>${b.subs.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}</div>`).join(''); }
const now=()=>Date.now(); const DAY=86400000;
function dueCount(id){ return deckCards(id).filter(c=>{const r=SRS[c.key]; return !r||r.due<=now();}).length; }
let fq=[], fcur=null, flipped=false, fdeck=null, fdone=0;
function startFlash(id){
  fdeck=id; const cards=deckCards(id);
  const due=cards.filter(c=>SRS[c.key]&&SRS[c.key].due<=now()), fresh=cards.filter(c=>!SRS[c.key]), later=cards.filter(c=>SRS[c.key]&&SRS[c.key].due>now());
  fq=shuf(due).concat(shuf(fresh)).concat(shuf(later)); fdone=0; nextFlash();
}
function nextFlash(){
  if(!fq.length){ render(`<div class="card center">Deck finished. Nice.</div><button class="btn" onclick="go('decks')">Back to decks</button>`); return; }
  fcur=fq[0]; flipped=false; const d=DECKS.find(x=>x.id===fdeck); setTitle(d.name,true);
  render(`<div class="top"><span><b>${fq.length}</b> left · ${fdone} done</span><span class="small">${SRS[fcur.key]?'review':'new'}</span></div>
  <div class="card flash" id="fc">${fcur.front}<div class="hint">tap to reveal</div></div><div id="srs"></div>`);
  document.getElementById('fc').onclick=flip;
}
function flip(){
  if(flipped) return; flipped=true;
  document.getElementById('fc').innerHTML=fcur.front+'<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">'+fcur.back;
  document.getElementById('srs').innerHTML=`<div class="srs"><button class="ag" data-g="0">Again<small>now</small></button><button class="hd" data-g="1">Hard<small>1d</small></button><button class="gd" data-g="2">Good<small>${ivLabel(2)}</small></button><button class="ez" data-g="3">Easy<small>${ivLabel(3)}</small></button></div>`;
  document.querySelectorAll('.srs button').forEach(b=>b.onclick=()=>grade(+b.dataset.g));
  window.scrollTo({top:0,behavior:'smooth'});
}
function nextIv(g){ const r=SRS[fcur.key]||{iv:0}; if(g===0) return 0; if(g===1) return 1; if(g===2) return Math.max(3,Math.round((r.iv||1)*2.5)); return Math.max(7,Math.round((r.iv||1)*4)); }
function ivLabel(g){ const d=nextIv(g); return d>=1?d+'d':'now'; }
function grade(g){
  const iv=nextIv(g); SRS[fcur.key]={iv,due:now()+(iv?iv*DAY:0),n:((SRS[fcur.key]||{}).n||0)+1}; store.set('srs',SRS);
  fq.shift(); fdone++; if(g===0) fq.splice(Math.min(3,fq.length),0,fcur); nextFlash();
}

// ---------- 90-second structure ----------
let tInt=null, tLeft=90, scur=null, sgrade=null;
function startStruct(){
  const pool=D.cases.filter(c=>inF(c.type)); if(!pool.length){render('<div class="card center">Widen the filter.</div>');return;}
  scur=rnd(pool); sgrade=null; tLeft=90; clearInterval(tInt); setTitle('90-second structure',true);
  render(`<div class="card"><span class="tag gold">${esc(scur.industry)}</span><div class="q" style="margin-top:8px">${esc(scur.client)}</div><div class="prompt">${esc(scur.prompt)}</div>
  <div class="qs"><details><summary>Clarifying answers (ask first, then peek)</summary>${scur.questions.map(q=>`<p><b>${esc(q.q)}</b><br>${esc(q.a)}</p>`).join('')}</details></div></div>
  <div class="card" style="margin-top:10px"><div class="timer" id="tm">1:30</div><div class="bar"><i id="bar" style="width:100%"></i></div>
  <div class="small" style="text-align:center">Name the type → size the gap → hypothesis (a bet) → 3–4 MECE buckets tailored to the industry → one click-down each → where you'd start.</div>
  <div class="row"><button class="btn" id="startT">Start 90s</button><button class="btn ghost" id="rev">Reveal</button></div></div>
  <div id="model"></div>`);
  document.getElementById('startT').onclick=()=>{ clearInterval(tInt); tInt=setInterval(tick,1000); document.getElementById('startT').textContent='Running…'; };
  document.getElementById('rev').onclick=reveal;
}
function tick(){ tLeft--; const m=document.getElementById('tm'); if(!m){clearInterval(tInt);return;} m.textContent=Math.floor(tLeft/60)+':'+String(tLeft%60).padStart(2,'0'); document.getElementById('bar').style.width=(tLeft/90*100)+'%'; if(tLeft<=15)m.classList.add('warn'); if(tLeft<=0){clearInterval(tInt); m.textContent='Time — talk'; try{navigator.vibrate&&navigator.vibrate(200)}catch(e){} } }
function reveal(){
  clearInterval(tInt); const c=scur;
  document.getElementById('model').innerHTML=`<div class="card" style="margin-top:10px"><span class="tag">${esc(tname(c.type))}</span><div class="kv"><b>Model opening</b>“This is a ${esc(tname(c.type).toLowerCase())} case. ${esc(c.hyp)}”</div>${bucketsHTML(c.buckets)}<div class="kv"><b>Why these buckets</b>${esc(c.tailored)}<b>Trap</b>${esc(c.trap)}<b>Start with</b>${esc(c.start)} — ${esc(c.startWhy)}</div>
  <div class="kv"><b>Self-grade (0–6 rubric)</b><div class="small">1 answers the question · 2 MECE 2–4 buckets · 3 smells like the industry · 4 one level down · 5 names the trap · 6 hypothesis + first move</div></div>
  <div class="grade">${[0,1,2,3,4,5,6].map(n=>`<button data-g="${n}">${n}</button>`).join('')}</div><button class="btn" id="nextS">Next case</button></div>`;
  document.querySelectorAll('.grade button').forEach(b=>b.onclick=()=>{sgrade=+b.dataset.g; document.querySelectorAll('.grade button').forEach(x=>x.classList.toggle('on',+x.dataset.g===sgrade));});
  document.getElementById('nextS').onclick=()=>{ if(sgrade!==null){ LOG.push({t:now(),id:c.id,type:c.type,g:sgrade}); store.set('log',LOG);} startStruct(); };
  document.getElementById('model').scrollIntoView({behavior:'smooth'});
}

// ---------- screens ----------
function setTitle(t,back){ document.getElementById('title').textContent=t; document.getElementById('back').classList.toggle('hide',!back); }
function render(h){ document.getElementById('main').innerHTML=h; window.scrollTo(0,0); }
function filterLabel(){ const n=FILTER.size; return n===D.types.length?'All types':n===1?T[[...FILTER][0]].short:n+' types'; }
function home(){
  setTitle('Case Framework Drill',false); clearInterval(tInt);
  const due=DECKS.reduce((a,d)=>a+dueCount(d.id),0);
  const modes=[
   ['struct','⏱️','90-second structure','Prompt → timer → model tree → self-grade 0–6'],
   ['odd','🧩','Odd bucket out','Three real buckets, one intruder'],
   ['missing','🕳️','Missing bucket','Fill the gap in a structure'],
   ['click','🔗','Click-down match','Which sub-branch sits under this bucket?'],
   ['type','🏷️','Name the case type','Prompt or scenario → which of the 18 types?'],
   ['trap','⚠️','Name the trap','Pick the trap this structure must call out'],
   ['lens','🧠','Pick the lens','Brainstorm prompt → simple structure, on the spot'],
   ['math','🔢','Numbers cold','Factors, Rule of 72, IRR, anchors'],
  ];
  render(`<button class="card mode" style="width:100%;margin-bottom:10px;min-height:0;flex-direction:row;align-items:center;gap:12px" onclick="go('decks')"><span class="ic">🃏</span><span style="flex:1"><b>Flashcards</b><br><small>Spaced repetition across six decks</small></span>${due?`<span class="pill" style="position:static">${due} due</span>`:''}</button>
  <button class="card mode" style="width:100%;margin-bottom:10px;min-height:0;flex-direction:row;align-items:center;gap:12px" onclick="startMCQ('mix')"><span class="ic">🎲</span><span style="flex:1"><b>Mixed quiz</b><br><small>Every question type, shuffled</small></span></button>
  <div class="grid">${modes.map(m=>`<button class="card mode" onclick="${m[0]==='struct'?'startStruct()':`startMCQ('${m[0]}')`}"><span class="ic">${m[1]}</span><b>${m[2]}</b><small>${m[3]}</small></button>`).join('')}</div>
  <p class="small" style="text-align:center;margin-top:16px">Filter: <b>${esc(filterLabel())}</b> — tap the pill at the top to change.</p>`);
}
function decks(){
  setTitle('Decks',false); clearInterval(tInt);
  render(DECKS.map(d=>{const n=deckCards(d.id).length, due=dueCount(d.id); return `<button class="card deck" onclick="startFlash('${d.id}')"><span class="ic">${d.ic}</span><span><b>${d.name}</b><small>${d.desc}${d.typed?' · follows filter':''}</small></span><span class="due ${due?'':'z'}">${due?due+' due':n+' cards'}</span></button>`;}).join('')+
  `<p class="small" style="text-align:center">Again = see it again this session · Hard = tomorrow · Good ≈ 2.5× · Easy ≈ 4× the last interval. Progress is saved on this device.</p>`);
}
function library(){
  setTitle('Library',false); clearInterval(tInt);
  let h='';
  for(const f of ['A','B','C']){ h+=`<h2>${esc(D.families[f])}</h2>`; D.types.filter(t=>t.fam===f).forEach(t=>{ h+=`<details class="card" style="margin-bottom:8px"><summary style="font-weight:650;cursor:pointer">${esc(t.name)}</summary><div class="ctx" style="margin-top:6px">${esc(t.defn)}</div>${bucketsHTML(t.buckets)}<div class="kv"><b>Trap</b>${esc(t.trap)}<b>Hypothesis starter</b>${esc(t.hyp)}<b>Start with</b>${esc(t.start)}<b>Formula / number</b>${esc(t.formula)}<b>Trigger phrases</b>${t.triggers.map(x=>'“'+esc(x)+'”').join(' · ')}</div>
     <h2>Scenario cards of this type</h2>${D.scen.filter(s=>s.type===t.id).map(s=>`<details style="margin:6px 0"><summary>${esc(s.title)}</summary>${bucketsHTML(s.buckets)}<div class="kv"><b>Trap</b>${esc(s.trap)}<b>Hypothesis</b>${esc(s.hyp)}</div></details>`).join('')||'<div class="small">—</div>'}
     <h2>Tailored cases of this type</h2>${D.cases.filter(c=>c.type===t.id).map(c=>`<details style="margin:6px 0"><summary>${esc(c.title)} — ${esc(c.client)}</summary><div class="prompt">${esc(c.prompt)}</div>${bucketsHTML(c.buckets)}<div class="kv"><b>Tailoring</b>${esc(c.tailored)}<b>Hypothesis</b>${esc(c.hyp)}<b>Trap</b>${esc(c.trap)}<b>Start</b>${esc(c.start)}</div></details>`).join('')||'<div class="small">—</div>'}</details>`; }); }
  h+=`<h2>Brainstorm lenses</h2><div class="card">${D.lenses.map(l=>`<div class="stat"><span><b>${esc(l.name)}</b><br><span class="small">${esc(l.when)}</span></span></div>`).join('')}</div>`;
  render(h);
}
function stats(){
  setTitle('Stats',false); clearInterval(tInt);
  const modeName={type:'Name the type',odd:'Odd bucket out',missing:'Missing bucket',click:'Click-down match',trap:'Name the trap',lens:'Pick the lens',math:'Numbers cold'};
  let tot={r:0,w:0}; const byType={};
  Object.entries(STATS).forEach(([m,o])=>Object.entries(o).forEach(([t,s])=>{tot.r+=s.r;tot.w+=s.w; byType[t]=byType[t]||{r:0,w:0}; byType[t].r+=s.r; byType[t].w+=s.w;}));
  const pct=s=>s.r+s.w?Math.round(100*s.r/(s.r+s.w))+'%':'—';
  const weak=Object.entries(byType).filter(([t,s])=>s.r+s.w>=4).sort((a,b)=>(a[1].r/(a[1].r+a[1].w))-(b[1].r/(b[1].r+b[1].w))).slice(0,3);
  const recent=LOG.slice(-10).reverse();
  const avg=LOG.length?(LOG.reduce((a,x)=>a+x.g,0)/LOG.length).toFixed(1):'—';
  render(`<div class="card"><div class="stat"><span>Quiz accuracy overall</span><span class="n">${pct(tot)} <span class="small">(${tot.r+tot.w})</span></span></div>
  ${Object.entries(STATS).map(([m,o])=>{const s=Object.values(o).reduce((a,x)=>({r:a.r+x.r,w:a.w+x.w}),{r:0,w:0});return `<div class="stat"><span>${modeName[m]||m}</span><span class="n">${pct(s)}</span></div>`;}).join('')}</div>
  <h2>Weakest case types</h2><div class="card">${weak.length?weak.map(([t,s])=>`<div class="stat"><span>${esc(tname(t))}</span><span class="n">${pct(s)}</span></div>`).join(''):'<div class="small">Answer a few more questions and this fills in.</div>'}</div>
  <h2>By case type</h2><div class="card">${D.types.map(t=>{const s=byType[t.id];return `<div class="stat"><span>${esc(t.name)}</span><span class="n">${s?pct(s):'—'}</span></div>`;}).join('')}</div>
  <h2>90-second structures · avg ${avg}/6</h2><div class="card">${recent.length?recent.map(x=>{const c=D.cases.find(c=>c.id===x.id);return `<div class="stat"><span>${c?esc(c.title+' — '+c.client):x.id}<br><span class="small">${esc(tname(x.type))} · ${new Date(x.t).toLocaleDateString()}</span></span><span class="n">${x.g}/6</span></div>`;}).join(''):'<div class="small">No structures graded yet.</div>'}</div>
  <h2>Flashcards</h2><div class="card">${DECKS.map(d=>`<div class="stat"><span>${d.name}</span><span class="n">${dueCount(d.id)} due</span></div>`).join('')}</div>
  <h2>On your phone</h2><div class="card small">Open this link in Safari or Chrome on your phone → Share → <b>Add to Home Screen</b>. It then launches full-screen like an app, works offline once loaded, and keeps progress on the device.<br><br><button class="btn ghost" onclick="if(confirm('Reset all progress on this device?')){localStorage.clear();location.reload();}">Reset progress</button></div>`);
}
// ---------- filter sheet ----------
function openFilter(){
  const sh=document.getElementById('sheet'), bg=document.getElementById('sheetBg');
  const draw=()=>{ sh.innerHTML=`<h3>Case types to drill</h3><div class="chips"><button class="chip" id="all">All</button><button class="chip" id="none">None</button></div>`+['A','B','C'].map(f=>`<div class="fam">${esc(D.families[f])}</div><div class="chips">${D.types.filter(t=>t.fam===f).map(t=>`<button class="chip ${inF(t.id)?'on':''}" data-t="${t.id}">${esc(t.short)}</button>`).join('')}</div>`).join('')+`<button class="btn" id="done">Done</button>`;
    sh.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const id=b.dataset.t; inF(id)?FILTER.delete(id):FILTER.add(id); draw();});
    sh.querySelector('#all').onclick=()=>{FILTER=new Set(D.types.map(t=>t.id));draw();};
    sh.querySelector('#none').onclick=()=>{FILTER=new Set();draw();};
    sh.querySelector('#done').onclick=close; };
  const close=()=>{ if(!FILTER.size) FILTER=new Set(D.types.map(t=>t.id)); store.set('filter',[...FILTER]); sh.style.display='none'; bg.style.display='none'; document.getElementById('filtBtn').textContent=filterLabel(); go(view.tab); };
  draw(); sh.style.display='block'; bg.style.display='block'; bg.onclick=close;
}
// ---------- nav ----------
function go(tab){ view.tab=tab; document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab)); ({home,decks,library,stats})[tab](); }
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
document.getElementById('back').onclick=()=>go(view.tab);
document.getElementById('filtBtn').onclick=openFilter;
document.getElementById('filtBtn').textContent=filterLabel();
go('home');
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
</script>
