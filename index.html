ce contracts, time and materials, or a mix — and how long are contracts?","a":"Mostly multi-year fixed-fee contracts per turbine with some time-and-materials for major component repairs; contracts run three to five years."},{"q":"What return and hold does Westhollow target, and what debt load would it put on the business?","a":"At least 2.5 times equity over five years, with leverage around four times EBITDA given the contracted revenue."},{"q":"How does Aeris's cost per turbine compare to the manufacturers' service arms, and where does the difference come from?","a":"Aeris is about 20% cheaper, mainly from technician utilization and cheaper spare parts sourcing."},{"q":"How fast is the out-of-warranty fleet growing, and are the manufacturers fighting back on price?","a":"The out-of-warranty fleet grows steadily each year; manufacturers have started offering discounted extended service to hold share."},{"q":"How dependent is Aeris on technician labor availability, and what is turnover?","a":"Technicians are the constraint; turnover is about 20% a year and training a new technician takes several months."}],"buckets":[{"name":"Independent wind O&M market","subs":["Turbines rolling off warranty per year in Aeris's regions","Manufacturer response: discounted extended service","Repowering and retirement of old turbines shrinking the serviceable base"]},{"name":"Aeris standalone","subs":["Contracted revenue coverage and renewal rates","Technician utilization, turnover, and training pipeline","Margin by contract type: fixed-fee vs major component repair"]},{"name":"Value-creation plan","subs":["Win share of newly out-of-warranty turbines in existing regions","Spare parts: sourcing, refurbishment, and inventory as a margin lever","Expand into blade repair and major component exchange"]},{"name":"Deal and exit","subs":["Entry at about 11x EBITDA with four times leverage on contracted cash flow","Exit to a strategic (manufacturer or utility) or infrastructure fund","Return bridge: EBITDA growth vs multiple vs deleveraging"]}],"generic":"PE due diligence / LBO","tailored":"Market bucket is the warranty roll-off curve, not total installed wind capacity, because only out-of-warranty turbines are addressable; standalone bucket centers on technicians as the capacity constraint since labor, not demand, limits growth.","hyp":"Proceed: returns will come primarily from EBITDA growth as turbines age out of warranty and Aeris wins share with a 20% cost advantage, supported by deleveraging from contracted cash flows; the plan is capped by technician hiring, so the diligence priority is the training pipeline.","trap":"Sizing the market as 9 gigawatts of installed wind capacity in the region. Only out-of-warranty turbines are addressable, and the manufacturers are now discounting to keep them, so attainable share is a fraction of the headline fleet.","start":"Independent wind O&M market","startWhy":"The investment thesis rests on the warranty roll-off wave; if manufacturers' discounted extended service captures it, the EBITDA growth story disappears."},{"id":"pe-n4","type":"pe","diff":3,"title":"Shift Change","client":"Tamarind Street Capital","industry":"Hospitality / select-service hotels","prompt":"Tamarind Street Capital is a New York private equity fund with $4B under management that invests in real estate-heavy operating businesses. It is considering acquiring the Larkspur Inn portfolio, 48 select-service hotels across the Sun Belt operated under a franchised national brand, with 5,800 rooms, $290M in revenue, and $82M of EBITDA. The seller, a family office, wants $950M. Occupancy has recovered to 68% but average daily rates have plateaued, labor costs are up 20% over three years, and the brand's franchise agreement requires a property improvement program on half the hotels within four years. Tamarind's deal team wants a recommendation on whether to buy, what the value-creation plan is, and which lever drives returns in a five-year hold.","questions":[{"q":"How does a select-service hotel make money, and what does the franchise fee structure take?","a":"Room revenue with minimal food and beverage; the brand takes roughly 10% of room revenue in fees and requires brand standards."},{"q":"What return and hold does Tamarind target, and would it separate the real estate from operations?","a":"Two and a half times equity over five years; it is considering a sale-leaseback or splitting the portfolio into property company and operating company at exit."},{"q":"How much does the required property improvement program cost, and does it lift rates?","a":"Roughly $100M across the 24 hotels; renovated hotels in the brand typically see a rate lift, though it fades after a few years."},{"q":"Is the labor increase industry-wide, and how have operators responded?","a":"Industry-wide; operators have cut housekeeping frequency and consolidated management across clusters of hotels."},{"q":"What is the variance across the 48 hotels in occupancy and margin?","a":"Wide: a dozen hotels run above 75% occupancy with strong margins, while about ten are below 60% in markets with new supply."}],"buckets":[{"name":"Sun Belt select-service market","subs":["New hotel supply by market and its effect on the ten weak hotels","Rate growth plateau vs corporate and leisure demand trends","Labor cost inflation and brand standard requirements"]},{"name":"Larkspur standalone","subs":["EBITDA by hotel: a dozen strong, ten weak, rest average","$100M property improvement obligation treated as part of the entry price","Franchise fee drag and renewal terms"]},{"name":"Value-creation plan","subs":["Cluster management: shared general managers and sales across nearby hotels","Renovation-driven rate lift on the 24 program hotels","Prune: sell the ten weak hotels in oversupplied markets"]},{"name":"Deal and exit","subs":["Effective entry price is $950M plus $100M program, about 13x EBITDA","Exit route: portfolio sale vs property/operating company split vs sale-leaseback","Return bridge: EBITDA growth vs multiple vs deleveraging, with real estate as a financing lever"]}],"generic":"PE due diligence / LBO","tailored":"The required renovation program is added to the entry price rather than treated as a value-creation investment, and the standalone bucket splits the portfolio into strong, average, and weak hotels because pruning the weak ten is a lever.","hyp":"Proceed at a lower price: the effective entry is about 13x once the $100M program is included, so returns cannot rely on multiple expansion; they must come from EBITDA growth through cluster management and pruning weak hotels, with the real estate used as a financing lever to boost equity returns rather than as a source of value.","trap":"Treating the $950M as the entry price and the renovation as optional upside. The franchise agreement makes the $100M mandatory, so the true entry multiple is higher than it looks and the rate lift from renovation is partly just defending the franchise.","start":"Larkspur standalone","startWhy":"Establishing the true entry price (including the mandatory program) and the hotel-by-hotel spread reveals whether there is enough EBITDA growth to earn 2.5x without multiple expansion."},{"id":"pe-n5","type":"pe","diff":4,"title":"Clipped Wings","client":"Arundel Infrastructure Fund","industry":"Transportation / regional airports","prompt":"Arundel Infrastructure Fund is a Toronto-based infrastructure private equity fund with CAD 6B under management, investing in transport and utilities. It is evaluating the acquisition of a 40-year concession to operate Castlebay Regional Airport, a publicly owned airport in a mid-sized Canadian city handling 2.8 million passengers a year with CAD 95M in revenue and CAD 38M of EBITDA, split between aeronautical charges to airlines and non-aeronautical revenue from parking, retail, and land leases. The city wants CAD 700M upfront and will cap aeronautical charge increases at inflation. One low-cost carrier accounts for 45% of passengers and has publicly complained about fees. Arundel's investment committee wants to know whether to bid, what the value-creation plan would be, and what drives returns in a concession that cannot be sold the way a company can.","questions":[{"q":"How does the airport make money, and what is the split between aeronautical and non-aeronautical revenue?","a":"About 55% aeronautical (landing and passenger fees, capped at inflation) and 45% non-aeronautical (parking, retail concessions, car rental, and land leases), which is uncapped."},{"q":"What return does Arundel target for a long-dated infrastructure asset, and how does it think about exit?","a":"A low-teens equity return over a long hold; exit is a sale of the concession stake to another infrastructure investor or pension fund, typically after seven to ten years."},{"q":"What capital spending does the concession require, and who bears it?","a":"A terminal expansion of about CAD 150M in the first decade falls on the concessionaire."},{"q":"How exposed is the airport to the dominant low-cost carrier, and is its threat to cut capacity real?","a":"It has moved aircraft between cities before; losing a third of its flights would hit both aeronautical and parking revenue."},{"q":"Is there a growth story for passengers or non-aeronautical spend?","a":"The region's population grows about 2% a year; non-aeronautical spend per passenger is well below comparable airports."}],"buckets":[{"name":"Regional air traffic and airline dynamics","subs":["Passenger growth from regional population and route development","Low-cost carrier concentration: 45% of passengers and credible exit threat","Competing airports within driving distance"]},{"name":"Castlebay standalone","subs":["Aeronautical revenue capped at inflation: predictable but growthless per passenger","Non-aeronautical spend per passenger vs comparable airports","CAD 150M terminal expansion obligation and timing"]},{"name":"Value-creation plan","subs":["Lift non-aeronautical spend per passenger: parking pricing, retail mix, land development","Route development incentives to diversify away from the dominant carrier","Operating cost and procurement efficiency within regulatory limits"]},{"name":"Deal and exit","subs":["CAD 700M upfront at about 18x EBITDA plus CAD 150M capex: high leverage on regulated cash flows","Exit: concession stake sale to pension or infrastructure fund at a lower required return","Return bridge: EBITDA growth from non-aero vs multiple (yield compression) vs deleveraging"]}],"generic":"PE due diligence / LBO (infrastructure concession variant)","tailored":"Standalone revenue is split by regulatory treatment (capped aeronautical vs uncapped non-aeronautical) because the cap determines where growth can come from, and exit is framed as a stake sale to a lower-return buyer rather than a trade sale, which changes what 'multiple expansion' means.","hyp":"Bid, but below CAD 700M: with aeronautical charges capped, returns must be driven by EBITDA growth in non-aeronautical revenue per passenger plus steady deleveraging from regulated cash flows; yield compression at exit to a pension buyer is plausible but cannot be underwritten, and carrier concentration is the risk that caps leverage.","trap":"Treating the airport like a company whose EBITDA can be grown across the board and sold at a higher multiple. More than half of revenue is capped at inflation, the terminal capex is mandatory, and the 'exit' is a stake sale whose price depends on interest rates, not on operational improvement.","start":"Castlebay standalone","startWhy":"Separating capped aeronautical from uncapped non-aeronautical revenue shows how much of EBITDA can actually grow, which is the whole basis for a return above the regulated yield."},{"id":"sizing-n1","type":"sizing","diff":1,"title":"Plug Count","client":"Ridgecrest Charging Co.","industry":"Energy / EV charging infrastructure","prompt":"Ridgecrest Charging Co. operates about 1,200 public Level 2 and DC fast-charging ports across Texas, mostly at grocery stores, highway plazas and apartment complexes. Revenue is roughly $38 million with 90 employees; the company earns a per-kWh fee from drivers and shares a slice of that with the site host. Austin's city council just passed a resolution to 'ensure charging access for every neighborhood by 2030', and Ridgecrest's board has approved a plan to add 400 new fast-charging ports in the Austin metro over the next four years. Before committing the capital, the CEO wants an outside view: how many public DC fast-charging ports will the Austin metro actually need in 2030, and is 400 the right number for Ridgecrest to build?","questions":[{"q":"How does Ridgecrest make money per port, and does it matter whether the port is Level 2 or DC fast for this question?","a":"DC fast is where the money and the question are; a fast port earns roughly five times what a Level 2 port does. Treat the ask as fast-charging ports only."},{"q":"What geography and year should I size: the city of Austin or the five-county metro, and 2030 or today?","a":"The five-county metro, about 2.3 million residents, in 2030."},{"q":"What share of the Austin fast-charging market does Ridgecrest hold today?","a":"Around a quarter of existing fast ports in the metro, which is roughly 300 ports today."},{"q":"Is the council resolution tied to any funding or mandate, or is it aspirational?","a":"Aspirational so far. There is no subsidy attached and no requirement on operators."},{"q":"Do you have a view on what share of EV drivers rely on public fast charging versus charging at home?","a":"Most single-family homeowners charge at home. Apartment dwellers and rideshare drivers are the heavy public users; you should make an assumption and state it."}],"buckets":[{"name":"Approach & unit of measure","subs":["Ports needed = daily fast-charging sessions ÷ sessions one port can serve per day","Sessions per port per day = operating hours ÷ ~30-minute session × target utilization","Metro-wide need first, then Ridgecrest's share"]},{"name":"Who actually plugs in publicly","subs":["Single-family EV owners (home charging, rare public use)","Apartment and condo EV drivers with no home charger","Rideshare, fleet and through-traffic on I-35"]},{"name":"Drivers of session volume","subs":["Vehicles in metro (~2.3M people, ~0.8 vehicles per person) × EV share in 2030","Public-reliant share × charges per week per driver","kWh per session and dwell time set port throughput"]},{"name":"Sanity check","subs":["Compare to today's ~1,200 metro fast ports and EV-per-port ratios in California","Does 400 ports imply a plausible share for Ridgecrest?"]}],"generic":"Market sizing (demand-driven, capacity conversion)","tailored":"The unit is not 'EVs' but 'public fast-charging sessions per day', so a usage-segment bucket (who charges publicly) sits between population and ports; the sanity check compares to the existing port base rather than to a dollar market.","hyp":"About 1.8M vehicles × 15% EV share in 2030 ≈ 270k EVs; ~30% rely on public fast charging ≈ 80k drivers × 1.5 sessions a week ≈ 17k sessions a day; at ~12 sessions per port per day that is ~1,400 ports metro-wide. Ridgecrest's 400 new ports on top of 300 would be ~50% of the 2030 base, double its current share. Bet: the metro need is real but 400 overbuilds unless Ridgecrest believes it can double share; 200 to 250 is the defensible number.","trap":"Sizing ports off the total EV parc. Roughly 70% of EV owners charge at home and almost never use a public fast charger; skipping the public-reliant filter inflates the answer three-fold.","start":"Approach & unit of measure","startWhy":"Agreeing the equation (sessions per day ÷ sessions per port) up front keeps the segments and drivers from drifting into an EV-sales estimate that does not answer the ports question."},{"id":"sizing-n2","type":"sizing","diff":2,"title":"Uniform Season","client":"Textilera Dos Ríos","industry":"Consumer / apparel (school uniforms)","prompt":"Textilera Dos Ríos is a Monterrey-based manufacturer of school uniforms with about 650 employees and revenue of MXN 900 million. It sells through direct contracts with private schools in northern Mexico and through two regional department-store chains in the back-to-school window, when it does 70% of its annual sales. The founder's daughter took over as CEO last year and wants to take the brand national, with a stated goal of 10% of the Mexican school uniform market within five years. She has asked you to size the Mexican school uniform market in pesos per year, tell her what share Textilera holds today, and give a view on whether 10% in five years is a realistic ambition.","questions":[{"q":"What is included in 'school uniform': daily uniform only, or sports kit and shoes as well?","a":"Daily uniforms and sports kit, not shoes. Textilera makes both."},{"q":"Are we sizing manufacturer revenue or retail spending by families?","a":"Size it at retail prices paid by families, then we can discuss the manufacturer's take."},{"q":"Roughly how many children are in school in Mexico, and is uniform wear mandatory?","a":"About 25 million in primary and secondary. Nearly all public and private schools require uniforms, though enforcement is loose in some rural areas."},{"q":"How different are prices between the public-school and private-school segments?","a":"Very. A public-school daily set is a few hundred pesos; a private-school set with embroidered logo can be two to three times that."},{"q":"Is part of the market served informally, by local seamstresses or hand-me-downs, that a national manufacturer could not reach?","a":"Yes, a meaningful share of public-school uniforms are sewn locally or passed down. Make an assumption and state it."}],"buckets":[{"name":"Approach & unit of measure","subs":["Market MXN = students in uniform × sets bought per year × retail price per set","Size public and private separately, then add","Convert to manufacturer value at ~55% of retail to compare to Textilera's MXN 900M"]},{"name":"Student segments","subs":["Public primary and secondary (~88% of 25M students)","Private schools (~12%, higher price, logo-specific)","Informal and hand-me-down share that no manufacturer sells into"]},{"name":"Purchase drivers","subs":["Sets per child per year (growth, wear, 2 daily + 1 sports)","Price per set by segment (public ~MXN 350, private ~MXN 900)","Back-to-school concentration and government uniform voucher programs"]},{"name":"Sanity check","subs":["Implied spend per child per year vs. household income","Textilera's implied share today and the growth rate 10% would require"]}],"generic":"Market sizing (population-based consumer market)","tailored":"Split the population by public versus private because price differs 2.5x and the informal segment is unattainable; added a retail-to-manufacturer conversion so the client's own revenue can be compared to the market.","hyp":"25M students × ~2.5 sets a year × a blended ~MXN 420 retail ≈ MXN 26B at retail, roughly MXN 14B at manufacturer value; Textilera at MXN 900M is ~6% of manufacturer value. Reaching 10% means ~MXN 1.5B in five years, an ~11% CAGR in a market growing with a flat student population. Bet: achievable only by winning private-school contracts nationally, not by chasing the informal public segment.","trap":"Using one blended price and one blended population. Public and private differ 2.5x on price, and a quarter of public uniforms are sewn locally; treating the whole MXN 26B as attainable makes 10% look easy when the reachable pool is closer to half that.","start":"Approach & unit of measure","startWhy":"Fixing retail versus manufacturer value first prevents the classic error of comparing a retail market to the client's wholesale revenue."},{"id":"sizing-n3","type":"sizing","diff":2,"title":"Rubber Miles","client":"Fenwick Tire & Retread","industry":"Industrial / commercial truck tires","prompt":"Fenwick Tire & Retread is an Akron, Ohio company that retreads heavy-truck tires at four plants in the Midwest and sells them to trucking fleets through its own service centers. Revenue is about $210 million, roughly one million retreads a year, with 700 employees. Retreads cost fleets about half the price of a new premium tire, but low-cost imported new tires have narrowed that gap and Fenwick's volumes have been flat for three years. The CEO is building a five-year plan and wants a fact base: how many Class 8 truck tire replacements happen in the US each year, how many of those are retreads versus new, and what that implies about Fenwick's share and room to grow.","questions":[{"q":"Which tires are in scope: tractor positions only, or trailer tires too?","a":"Both. Trailers carry eight tires each and are a large retread market."},{"q":"Roughly how many Class 8 tractors and trailers operate in the US?","a":"About 3.5 million Class 8 tractors and about 6 million trailers in active service."},{"q":"Does tire life differ by position or by type of fleet?","a":"Yes. Steer tires are replaced most often and rarely retreaded; drive and trailer tires wear slower and are retreaded two or three times. Long-haul tractors run two to three times the miles of regional or vocational trucks."},{"q":"How does the retread share differ between large fleets and owner-operators?","a":"Large fleets retread heavily, often 60% or more of their drive and trailer positions. Owner-operators mostly buy new."},{"q":"Is the one million units Fenwick sells all retreads, or does it also sell new tires?","a":"Roughly one million retreads; new-tire resale is small and you can ignore it."}],"buckets":[{"name":"Approach & unit of measure","subs":["Replacements per year = tire positions in service ÷ average tire life in years","Tire life in years = miles per tire ÷ miles driven per year, by position","Then apply retread share to get the retread pool"]},{"name":"Tire positions in service","subs":["Tractors: 3.5M × 10 positions, split steer vs. drive","Trailers: 6M × 8 positions, low annual miles","Long-haul vs. regional/vocational duty cycle"]},{"name":"Wear and replacement drivers","subs":["Annual miles (long-haul ~100k, regional ~40k) and miles per casing life","Trailer tires age out before they wear out","Retread share by position and fleet size"]},{"name":"Sanity check","subs":["Compare to reported annual US truck-tire shipments","Fenwick's 1M units as a share of the retread pool"]}],"generic":"Market sizing (installed base ÷ replacement cycle)","tailored":"Replaced the population-times-penetration template with an installed-base-over-life equation, and split by tire position because steer, drive and trailer tires have different lives and different retread eligibility.","hyp":"35M tractor positions plus 48M trailer positions ≈ 83M tires in service; a blended life of ~2.5 years gives ~33M replacements a year. If ~40% are retreads, the retread pool is ~13M units and Fenwick's 1M is ~8%. Bet: Fenwick's growth ceiling is retread share erosion, not market size; the plan should target large regional fleets where retread share is highest.","trap":"Applying long-haul mileage to every tire. Trailer tires and vocational trucks turn over on age, not miles, so a single average life either doubles or halves the answer depending on which segment it is borrowed from.","start":"Approach & unit of measure","startWhy":"This is an installed-base divided by life equation, not population times penetration; getting the equation right first decides which segments and drivers matter."},{"id":"sizing-n4","type":"sizing","diff":3,"title":"Drive-Off","client":"Veranda Credit Union","industry":"Financial services / consumer auto lending","prompt":"Veranda Credit Union is a $4.2 billion-asset credit union headquartered in Phoenix with 310,000 members and 38 branches. Like most credit unions it lives on net interest margin, and auto loans are about 35% of its loan book, roughly $900 million of originations a year, most of them through dealer finance desks. Over the past 18 months the automakers' captive lenders have flooded dealers with subsidized low-rate offers and Veranda's dealer originations fell 20%. The CEO has set a target to add $400 million of annual auto originations within three years and has asked you to size the metro Phoenix auto lending market and tell her how much of it Veranda can realistically go after.","questions":[{"q":"Should I size annual originations, meaning new loans written each year, rather than balances outstanding?","a":"Yes, annual originations. The target is $400 million of new loans a year, not balances."},{"q":"What geography: the Phoenix metro only, or Veranda's full field of membership?","a":"Metro Phoenix, about 5 million people. Membership is open to anyone who lives or works there."},{"q":"Which segments does Veranda compete in today: new versus used, dealer versus direct, refinancing?","a":"Mostly dealer-arranged loans, two-thirds used vehicles. Direct-to-member lending and refinancing are small, and Veranda does not do subprime."},{"q":"How much of the new-vehicle financing is captured by the captives at the moment?","a":"In new-car prime, captives are winning roughly 70% of financed deals right now. Used cars and independent dealers are much more open."},{"q":"Roughly how many vehicles change hands in the metro each year, and what share are financed?","a":"Make an assumption from population and vehicle turnover. Around 85% of dealer sales are financed; private-party sales are financed far less often."}],"buckets":[{"name":"Approach & unit of measure","subs":["Originations $ = vehicles financed per year × average amount financed","Annual flow, not balances outstanding","Add refinancing of existing loans as a separate flow"]},{"name":"Transaction segments","subs":["New vehicles at franchise dealers (captive-dominated prime)","Used vehicles at franchise vs. independent dealers","Private-party sales and refinancing"]},{"name":"Volume and ticket drivers","subs":["~3.5M vehicles in metro × ~8% annual turnover ≈ 280k transactions","Financed share by channel and average amount (new ~$38k, used ~$26k)","Prime vs. non-prime share Veranda will underwrite"]},{"name":"Attainable share & sanity check","subs":["Veranda's current $900M as a share of the total pool","Share needed in the contestable segments to add $400M","Compare to the largest credit-union auto lenders' metro shares"]}],"generic":"Market sizing (transaction-based flow) with attainable-share overlay","tailored":"Added an explicit 'attainable share' bucket because the ask is not the market but how much of it is contestable once captive-dominated new prime is excluded; separated flow (originations) from stock (balances) in the equation itself.","hyp":"~280k transactions × ~80% financed × ~$30k blended ≈ $6.7B of annual originations plus ~$1B of refinancing. Veranda's $900M is ~12%. Adding $400M means ~17% overall, but new-car prime (~$2.5B) is effectively closed, so Veranda needs ~25% of the ~$5B used-and-refi pool. Bet: the target is reachable only by building a direct refinance offer to members and signing independent used-car dealers; chasing captives in new prime is wasted effort.","trap":"Sizing new-car sales only, or quoting balances outstanding (~3x annual flow) as the market. Either produces a number that makes $400M look trivial or impossible; the real test is share of the contestable pool.","start":"Approach & unit of measure","startWhy":"The interviewer has laid a flow-versus-stock trap; stating that we size annual originations, not balances, before any numbers is the move that earns credibility."},{"id":"sizing-n5","type":"sizing","diff":4,"title":"Almond Milk Run","client":"Sol Abierto Agro","industry":"Agriculture / tree nuts and plant-based beverages","prompt":"Sol Abierto Agro farms 3,800 hectares of almonds in Andalusia, Spain, producing about 8,000 tonnes of shelled almonds a year with 220 permanent employees and seasonal pickers. Revenue is around €48 million, almost all from selling bulk almonds to Italian confectioners and commodity traders. Almond prices have fallen 30% in three years as Californian supply surged, and the family board is considering a €35 million almond-beverage plant near Seville, with 60 million litres of annual capacity, to sell private-label almond milk to European grocers and 'capture the value of our own crop'. The CEO wants you to size European almond-milk demand in litres and in almond tonnage, and tell him whether the plant would run full and whether it solves the almond-price problem.","questions":[{"q":"Is the objective to find a home for Sol Abierto's own almonds, or to build a profitable beverage business, or both?","a":"The board says both. Your job is partly to show whether those two goals are actually the same."},{"q":"What geography and channel: all of the EU, retail only, and private label only?","a":"EU retail. The plant's business case assumes private-label contracts with grocers; branded is not in scope."},{"q":"How much almond goes into a litre of almond milk?","a":"Typically 2 to 6% by weight; private label sits at the low end, call it 3%."},{"q":"What share of plant-based milk in Europe is almond versus oat and soy, and is that shifting?","a":"Oat has overtaken almond in most northern markets. Almond is roughly a quarter of plant-based milk in Europe and losing share."},{"q":"What is the current almond price per tonne, and what would Sol Abierto need to break even on the crop?","a":"About €6,000 a tonne today versus roughly €7,500 needed. Keep those two numbers in mind for the so-what."}],"buckets":[{"name":"Approach & unit of measure","subs":["Litres = EU households × plant-milk buying share × litres per buying household × almond share","Tonnes of almonds = litres × almond content per litre","Then compare both to plant capacity (60M L) and to the client's 8,000 t crop"]},{"name":"Demand segments","subs":["Plant-milk type: oat vs. soy vs. almond (almond losing share)","Private label vs. branded in retail","Retail vs. foodservice (out of scope but check it is small)"]},{"name":"Consumption drivers","subs":["~450M people, ~195M households, ~15% buy plant milk","Litres per buying household per year (~40)","Almond content 3% → ~30 g of almonds per litre"]},{"name":"Sanity check & so-what","subs":["Plant at full capacity as a share of EU private-label almond milk","Tonnes absorbed vs. 8,000 t crop and the €1,500/t price gap"]}],"generic":"Market sizing embedded in an investment go/no-go","tailored":"Two sizings run in parallel (litres for the plant, tonnes for the crop) because the board has conflated two goals; the sanity-check bucket is where the case is decided, not the market total.","hyp":"195M households × 15% × 40 L ≈ 1.2B L of plant milk; almond ~25% ≈ 300M L; private label ~40% ≈ 120M L. A 60M L plant would need half of EU private-label almond milk to run full. And 60M L × 30 g ≈ 1,800 t of almonds, under a quarter of the crop, so the plant barely touches the almond-price problem. Bet: do not build; a 15 to 20M L plant or a co-manufacturing deal is the right size, and the crop problem needs a different answer.","trap":"Sizing the whole EU almond-milk market and treating it as attainable, and assuming the plant 'absorbs our crop' when almond milk is 97% water. Big market and a flattering litre number hide that the tonnage so-what is tiny.","start":"Approach & unit of measure","startWhy":"Writing two equations side by side (litres and tonnes) signals immediately that the plant and the crop are different problems, which is the insight the board is missing."},{"id":"industry-n1","type":"industry","diff":1,"title":"Locked Units","client":"Stowaway Self Storage","industry":"Real estate / self-storage","prompt":"Stowaway Self Storage is a third-generation family business operating 22 self-storage facilities with 14,000 units across Georgia and Alabama. Revenue is about $31 million from monthly unit rents, tenant insurance and late fees, with 60 employees. Occupancy has slipped from 94% to 86% over two years as national REITs opened new facilities nearby and cut street rates with algorithmic pricing. The family has just received an unsolicited offer from a REIT for the whole portfolio. Before responding, the chairman wants your view on whether self-storage in the Southeast is still an attractive industry, where the money is made, and what that means for a regional operator like Stowaway: keep building, hold, or sell.","questions":[{"q":"How do self-storage operators make money beyond unit rent, and how much does that matter?","a":"Tenant insurance, admin fees and late fees add 8 to 10% to revenue at high margin. REITs are better at it than independents."},{"q":"Is the occupancy decline specific to Stowaway's markets or industry-wide in the Southeast?","a":"Southeast occupancy is down overall, but Stowaway's facilities have fallen about three points more than the market."},{"q":"What does the new-supply pipeline look like in Stowaway's trade areas?","a":"Heavy. Several metros in Georgia have added more than 10% to storage square footage in three years, though deliveries are now slowing."},{"q":"How do REITs compete: price, marketing, technology?","a":"All three. Dynamic pricing with low move-in rates and later increases, dominant paid-search spend, and self-service rentals."},{"q":"What is the family's objective: maximize value, keep the business, or generate income?","a":"They are split. Two branches want liquidity; the chairman wants to keep operating if the industry still works."}],"buckets":[{"name":"Demand drivers & the storage cycle","subs":["Household moves, downsizing and 'life events' per capita in Sunbelt metros","Rent per square foot trend and length of stay","Small-business and e-commerce inventory demand"]},{"name":"Supply & competitive intensity","subs":["New square footage delivered within 3 miles of each site","REIT dynamic pricing and paid-search share","Consolidation: REIT share of units and third-party management"]},{"name":"Profit pool by operator type","subs":["NOI margin REIT vs. regional vs. single-site owner","Ancillary income (insurance, fees) capture","Cost of capital and cap rates paid for portfolios"]},{"name":"Stowaway's position & options","subs":["3-point occupancy gap vs. market: pricing, marketing or asset quality","Sell now vs. hold vs. hand to a REIT third-party management platform","Build pipeline vs. local oversupply"]}],"generic":"Industry analysis (Porter's forces / profit pool)","tailored":"Reframed the five forces as a demand cycle plus a local supply pipeline because storage is a three-mile-radius real estate market, and made the client's position its own bucket so the analysis ends in a decision.","hyp":"The industry is structurally attractive (sticky tenants, low operating cost) but cyclically oversupplied in Georgia; the profit pool has shifted to scaled operators with pricing and marketing engines. Bet: Stowaway's extra 3-point occupancy gap is a scale problem it cannot fix alone, so selling or moving to third-party management beats building.","trap":"Judging attractiveness at the national or regional level. Self-storage demand and supply are hyper-local; a healthy Southeast average can hide a trade area with 15% new supply that will not recover for five years.","start":"Supply & competitive intensity","startWhy":"The occupancy drop coincides with new REIT supply and pricing, so the supply picture tells us fastest whether this is a cycle to wait out or a structural shift."},{"id":"industry-n2","type":"industry","diff":2,"title":"Mid-Roll","client":"Brightmoor Audio","industry":"Media / podcast networks and audio advertising","prompt":"Brightmoor Audio is a Los Angeles podcast network with 45 shows and about 60 million monthly downloads. Revenue is roughly $28 million with 70 employees; about 70% comes from advertising, split between host-read ads sold by its own sales team and dynamically inserted ads sold programmatically, with the rest from paid subscriptions and live shows. Roughly half its shows are owned outright and half are revenue-share deals with independent hosts. Over the past year average CPMs fell 15% as Spotify and YouTube pushed video podcasts and programmatic inventory, and two top hosts left for platform-exclusive deals. The founder is preparing a Series B and has asked you whether podcasting is an attractive industry to be in, where the profit pools actually sit, and how Brightmoor should position itself.","questions":[{"q":"How different are the economics of host-read ads on owned shows versus programmatic ads on revenue-share shows?","a":"Night and day. Host-read on an owned show can clear 50% gross margin; programmatic on a revenue-share show is close to breakeven after the host's cut."},{"q":"Is total listening still growing, or is the CPM decline a sign of shrinking demand?","a":"Listening hours are still growing in the high single digits. Supply of ad inventory is growing faster, which is what pressures CPMs."},{"q":"Who are the advertisers and are they shifting?","a":"Historically direct-to-consumer brands with promo codes. Larger brand advertisers are arriving but want programmatic scale and video."},{"q":"How much leverage do the platforms have over distribution and monetization?","a":"Growing. Spotify and YouTube control discovery and increasingly sell the ads themselves; Apple remains open RSS."},{"q":"What does the Series B need to believe: growth, margin, or defensibility?","a":"Investors want a path to 25% EBITDA margins; today Brightmoor is roughly breakeven."}],"buckets":[{"name":"Audience & advertiser demand","subs":["Listening hours growth and the shift to video podcasts","Advertiser mix: DTC promo-code buyers vs. brand budgets","Ad load tolerance and CPM by format (host-read vs. inserted)"]},{"name":"Value chain & where margin sticks","subs":["Talent and owned IP vs. networks vs. hosting/ad-tech vs. platforms","Platform exclusives pulling top shows out of the open ecosystem","Subscription and live revenue as non-ad pools"]},{"name":"Competitive dynamics & bargaining power","subs":["Hosts walk with their audience; network lock-in is weak","Programmatic commoditizing inventory and squeezing networks","Scale thresholds for a direct sales team to be worth it"]},{"name":"Brightmoor's position & options","subs":["Owned-IP vs. rev-share mix and margin by show","Direct ad sales capability vs. relying on platform ad marketplaces","Where to invest the Series B: more shows, video, subscriptions"]}],"generic":"Industry analysis (value chain and profit pools)","tailored":"Put talent and platforms at the two ends of the value chain as the parties with bargaining power, because the network in the middle is the squeezed layer; the industry question becomes 'which layer is Brightmoor really in'.","hyp":"Podcasting is attractive in aggregate but the profit pool is migrating to platforms and star talent, leaving rev-share networks selling programmatic near zero margin. Bet: Brightmoor's path to 25% margins is to shrink to owned-IP shows with host-read direct sales and subscriptions, not to add rev-share shows for download volume.","trap":"Analyzing 'podcasting' as one industry with one margin. Averaging a 50%-margin owned show with a breakeven rev-share show says the business is fine; the segment view says half of it should be exited.","start":"Value chain & where margin sticks","startWhy":"The founder's question is where profit pools sit, and the chain view immediately shows that networks are the layer losing power to talent above and platforms below."},{"id":"industry-n3","type":"industry","diff":2,"title":"Cage-Free Count","client":"Hollowell Farms","industry":"Agriculture / egg production","prompt":"Hollowell Farms is a family-owned Iowa egg producer with about 9 million laying hens, revenue of roughly $310 million in a normal year, and 400 employees. It sells shell eggs to grocery chains, about 60% under annual cost-plus contracts and 40% on the spot market, where prices tripled during the last avian-flu outbreak and then collapsed. Ten states have cage-free mandates taking effect between 2026 and 2030 and Hollowell's biggest retail customers have said they will buy only cage-free by 2028; converting a house costs about $40 per hen, so a full conversion is roughly $360 million. The CEO wants your view on how attractive the US egg industry will be over the next five to seven years, where the profit will sit, and what that implies for Hollowell's conversion decision.","questions":[{"q":"What has driven profitability in the industry over the past five years: structural margins or flu-driven price spikes?","a":"Mostly spikes. In a normal year producer margins are in the low single digits; in a flu year, survivors with birds made 30% or more."},{"q":"How concentrated is production, and are the big players converting to cage-free?","a":"The top five producers hold about half of the national flock. The largest have converted roughly 40% already and are still building."},{"q":"What does feed represent in the cost structure?","a":"Around 60% of cost. Corn and soybean prices move producer margins more than anything except flu."},{"q":"Is the cage-free retail premium holding?","a":"It is narrowing. Retailers pay roughly 30 to 40 cents a dozen more today than for conventional, down from about 60 cents, and expect it to shrink further as supply grows."},{"q":"How does Hollowell's contract mix compare to peers?","a":"More spot-exposed than the large players, who run 75% or more under contract."}],"buckets":[{"name":"Demand & price formation","subs":["Retail vs. foodservice vs. breaker (liquid egg) channels","Contract cost-plus vs. spot pricing and who bears flu volatility","Cage-free premium per dozen and its erosion as supply converts"]},{"name":"Supply structure & cost curve","subs":["Feed at ~60% of cost: corn/soy exposure and hedging","Flock concentration and biosecurity as a competitive advantage","Conversion capex per hen and the timing of state mandates"]},{"name":"Profit pools along the chain","subs":["Genetics/pullet suppliers, producers, packers-marketers, retailers","Who captures the spike-year windfall and who eats the trough","Does cage-free shift margin to producers or to retailers?"]},{"name":"Hollowell's position","subs":["Spot exposure vs. contract cover","Cage-free share of flock vs. customer deadlines","Capital capacity for $360M and conversion sequencing"]}],"generic":"Industry analysis (commodity industry attractiveness)","tailored":"Replaced generic 'buyer power' with price formation (contract vs. spot) because that mechanism decides who wins the volatility, and added a conversion-timing lens because the mandate wave reshapes the cost curve.","hyp":"The egg industry remains a low-margin commodity business with occasional windfalls, but cage-free creates a three-to-five-year window where converted producers with retail contracts earn above-normal margins before the premium erodes. Bet: convert the 60% of the flock tied to contracted retailers first, lock multi-year cage-free contracts, and leave spot-market houses unconverted.","trap":"Reading the last flu year's 30% margins as industry attractiveness. Those are windfalls to survivors, not structural returns, and a plan that depends on them will not pay back $360 million.","start":"Demand & price formation","startWhy":"Whether cage-free premiums hold and whether contracts shield volatility decides the entire payback on the conversion; everything else is secondary."},{"id":"industry-n4","type":"industry","diff":3,"title":"For the Record","client":"Prosser Legal Reporting","industry":"Professional services / court reporting and litigation support","prompt":"Prosser Legal Reporting is a Dallas-based court reporting agency with about 180 affiliated stenographers, most of them contractors, 35 staff and revenue of roughly $42 million. It earns a per-page transcript fee plus appearance and video fees; about 45% of revenue is depositions, 30% is contracted court work, and 25% is realtime reporting for trials and arbitrations, where the transcript scrolls live for attorneys. A private equity firm bought Prosser in 2022 on a four-to-five-year hold. Two things are happening at once: AI transcription vendors are pitching law firms at 60% below Prosser's deposition rates, and certified stenographers are retiring faster than they are trained, with the average age now 55. The managing partner asks whether this industry is still attractive and whether Prosser should invest in a digital and AI offering or harvest the business for the remaining hold.","questions":[{"q":"Which segments require a certified stenographer by rule, and where is a digital or AI transcript legally acceptable?","a":"Rules vary by state. Texas courts still largely require certified reporters; many deposition venues accept digitally recorded transcripts certified by a notary-level reporter. Realtime for trials is effectively steno-only."},{"q":"How are prices moving in each segment?","a":"Deposition page rates are flat to falling under AI pressure. Realtime and trial rates are up roughly 20% in two years because there are not enough qualified reporters."},{"q":"Who actually pays for depositions, and how price-sensitive are they?","a":"Insurers and corporate legal departments pay most deposition bills and are pushing hard on cost. Trial teams are far less sensitive."},{"q":"How dependent is Prosser on its contractor stenographers, and are they leaving?","a":"Highly. Turnover is manageable, but the agency has had to turn down about 10% of realtime requests this year for lack of reporters."},{"q":"What does the PE owner need at exit?","a":"A business a strategic or the next sponsor will pay a growth multiple for. A shrinking deposition shop will trade at a harvest multiple."}],"buckets":[{"name":"Demand & substitution by segment","subs":["Depositions: admissibility rules and insurer price pressure favor digital/AI","Court contracts: budget-driven, rules protect steno for now","Realtime/trial: hard to automate, scarce supply, rising rates"]},{"name":"Supply & cost structure","subs":["Stenographer scarcity (avg age 55) lifting contractor rates","Digital reporter plus AI transcript cost per page vs. steno","Agency take rate and platform/scheduling costs"]},{"name":"Profit pools along the chain","subs":["Agencies vs. scheduling platforms vs. AI transcription vendors","Insurers and corporate legal pushing margin out of the deposition pool","Where the realtime premium accrues: reporter or agency"]},{"name":"Prosser's position & strategic options","subs":["Mix shift toward realtime and complex litigation","Build digital/AI capability vs. white-label a vendor","Harvest depositions vs. defend them on price"]}],"generic":"Industry analysis (technology disruption and attractiveness by segment)","tailored":"Segmented the industry by legal rule and automatability instead of by customer type, because the same service is commoditizing in one segment and becoming scarcer in another; the owner's exit horizon shapes the options bucket.","hyp":"The industry is bifurcating: routine deposition transcripts lose value to AI, while realtime and trial reporting get scarcer and pricier. Bet: Prosser should convert depositions to a lower-cost digital-plus-AI model to defend volume, and redeploy its stenographers to realtime where it is already turning away 10% of demand; that mix shift is what earns a growth multiple at exit.","trap":"Declaring 'the industry is in decline' from the deposition segment alone. A quarter of revenue is getting more valuable, not less, and averaging the segments hides it; also assuming state admissibility rules are static when they are the main variable.","start":"Demand & substitution by segment","startWhy":"The attractiveness answer flips by segment depending on legal rules and automatability, so segmenting demand first prevents a single, wrong verdict for the whole business."},{"id":"industry-n5","type":"industry","diff":4,"title":"Offshore Bets","client":"Sabine Pass Fabricators","industry":"Energy / offshore wind supply chain","prompt":"Sabine Pass Fabricators is a steel fabrication yard in Port Arthur, Texas with about 900 employees and $380 million of revenue, historically 80% from offshore oil and gas platforms. In 2023 it pivoted and now earns about 40% of revenue fabricating monopile transition pieces and jacket foundations for US East Coast offshore wind projects. Its private equity owner is in year four of the hold and has to decide between approving a $120 million second yard dedicated to wind, holding the current hybrid business, or selling. Several wind projects were cancelled or repriced last year when developers could not make their power purchase agreements work, while state targets still call for about 30 gigawatts by 2030. The owner asks you to assess whether the US offshore wind supply industry is attractive and what Sabine should do.","questions":[{"q":"How much of the 30 gigawatt target is financed and under construction versus announced?","a":"Roughly 5 gigawatts have reached final investment decision. The rest is in permitting or being re-bid at higher prices."},{"q":"Who else can fabricate foundations for US projects, and what does the Jones Act and domestic content mean for Sabine?","a":"European yards have scale and track record but face shipping costs and buyers' domestic-content incentives. Three other Gulf yards are also chasing wind work."},{"q":"Where in the offshore wind chain have margins been highest: developers, turbine OEMs, foundations, vessels?","a":"Installation vessels and turbine OEMs have had pricing power. Foundation fabricators have run thin margins and absorbed steel-price swings."},{"q":"What is Sabine's backlog and how firm is it?","a":"About 14 months, but a third of the wind backlog is tied to one project awaiting a renegotiated power contract."},{"q":"What is the owner's timeline and return expectation?","a":"Exit within 18 to 24 months. A second yard would not be fully operational before then."}],"buckets":[{"name":"Demand pipeline & policy certainty","subs":["Financed GW vs. announced GW and PPA repricing","Federal permitting, tax credits and domestic-content rules","Jones Act and port constraints that shape where foundations are built"]},{"name":"Supply side & competitive intensity","subs":["European fabricators' scale vs. US yards' content advantage","Gulf yards switching capacity between oil & gas and wind","Steel price pass-through in fabrication contracts"]},{"name":"Profit pools along the chain","subs":["Developers, turbine OEMs, foundation fabricators, vessels, ports","Where pricing power sits when projects are delayed","Fabricator margins through the 2023-2025 cancellations"]},{"name":"Sabine's position & the owner's options","subs":["Backlog quality and single-project concentration","Oil & gas work as a hedge for yard utilization","Second yard vs. hold hybrid vs. sell to a strategic seeking US content"]}],"generic":"Industry analysis + investment go/no-go (hold/exit variant)","tailored":"Added a policy and pipeline bucket because demand here is political, not economic, and made the last bucket an owner decision; this is an exit-timing case dressed as an industry question.","hyp":"US offshore wind is attractive over a decade but the bankable pipeline has slipped three to five years, and the profit pool sits with OEMs and vessel owners, not fabricators. Bet: do not build the second yard, which cannot generate returns inside the hold; keep the hybrid yard utilized with oil and gas work and sell to a European fabricator that needs a US-content footprint.","trap":"Judging attractiveness on announced gigawatt targets. Only a sixth of the 30 GW is financed; a big pipeline is not a bankable backlog, and a fabricator that builds capacity for announced projects carries the delay risk alone.","start":"Demand pipeline & policy certainty","startWhy":"Every other bucket depends on whether the projects actually get built, so separating financed from announced demand is the first and most decisive cut."},{"id":"newbiz-n1","type":"newbiz","diff":1,"title":"Driveway Shine","client":"Lustre Mobile Detailing","industry":"Consumer services / automotive care","prompt":"Two friends in Denver, one a former dealership detailer and one a sales rep, want to start Lustre Mobile Detailing, a van-based service that washes and details cars in customers' driveways and office parking lots. They have $120,000 in combined savings, one equipped van on order, and a plan to reach five vans and $1.2 million of annual revenue within three years. Services would be priced from $150 for an exterior detail to $300 for a full interior and exterior package. Denver has plenty of fixed-site car washes and a handful of other mobile operators. They have asked you whether this is a viable business, what it takes to hit their target, and how they should launch.","questions":[{"q":"Who is the target customer: households, or fleets and dealerships?","a":"They are thinking households in affluent suburbs first, but they have a dealership contact who might give them lot work."},{"q":"How many details can one van realistically complete in a day, including drive time?","a":"A full detail takes two to three hours plus travel. Four a day is a strong day; the founders assume six."},{"q":"What does a van cost to equip and run?","a":"About $45,000 equipped. Labor, chemicals, water and fuel run roughly 40% of revenue at good utilization."},{"q":"How seasonal is demand in Denver?","a":"Winter is slow; three or four months run at half capacity unless they have indoor fleet work."},{"q":"How do other mobile detailers in Denver acquire customers?","a":"Mostly Google and neighborhood apps, with repeat customers on a monthly or quarterly schedule making up the base."}],"buckets":[{"name":"Customer & demand","subs":["Suburban households: frequency and willingness to pay for convenience over a $25 wash","Fleet, dealership and office-park contracts for base load","Seasonality and the winter gap"]},{"name":"Competition & differentiation","subs":["Fixed-site washes and other mobile operators' pricing","Convenience, quality, subscription plans as the edge","Reviews and local search visibility"]},{"name":"Unit economics per van","subs":["Details per van-day after drive time and weather","Average ticket × utilization vs. detailer wage and consumables","Van capex and payback"]},{"name":"Launch & scale path","subs":["First-van proof: book rate and repeat rate in two zip codes","Hiring and training detailers for vans two to five","Licensing, insurance and water-disposal rules"]}],"generic":"Starting a new business (founder venture)","tailored":"Replaced the generic 'operations' bucket with per-van unit economics because the whole plan is a multiple of one van's day; added seasonality since Denver winters cut capacity for a third of the year.","hyp":"A van doing four details a day at a $200 average ticket earns ~$800 a day, about $190k a year after seasonality; five vans is ~$950k, short of the $1.2M target. Bet: viable as a business, but the target needs fleet or dealership contracts to fill winter and lift utilization, not just suburban households.","trap":"Treating an eight-hour day as eight billable hours. Drive time between driveways, weather and no-shows cut utilization to roughly half, so a six-detail-a-day plan is really three or four.","start":"Unit economics per van","startWhy":"If one van cannot clear a profit at realistic utilization, the demand and marketing questions do not matter; the van-day math is the whole business."},{"id":"newbiz-n2","type":"newbiz","diff":2,"title":"Hot Work","client":"Bevel Trades Institute","industry":"Education / for-profit vocational training","prompt":"Two former pipeline welders and a community-college administrator want to open Bevel Trades Institute, a for-profit welding school in Houston. The plan is a 16-week program with 24 welding booths, tuition of $18,000, and a target of 300 graduates a year by year three. They have a letter of interest from an industrial landlord and need about $2.5 million for build-out and equipment. Gulf Coast LNG and petrochemical contractors say they cannot find enough certified welders, and the nearest community college program has a waitlist. The founders have asked you whether there is a real business here and what they must get right to launch.","questions":[{"q":"How will students pay $18,000, and can the school access federal financial aid at launch?","a":"Not at launch. Federal Title IV eligibility requires accreditation, which typically takes two years of operating history. Early students would pay cash, use private loans, or be sponsored by employers or workforce grants."},{"q":"How many students can 24 booths serve, and does the program run in shifts?","a":"One student per booth per session. The founders plan a day cohort; evening and weekend shifts are possible but not in the plan."},{"q":"What do employers actually require from a graduate?","a":"Specific certifications (structural and pipe tests) and, ideally, a school they trust. Several contractors have said they would interview every graduate."},{"q":"What is the licensing path for a career school in Texas?","a":"State workforce commission licensing takes six to nine months before the first class can enroll."},{"q":"What do comparable welding programs charge and what are their completion and placement rates?","a":"Private programs charge $15,000 to $25,000. Good ones complete about 80% of enrollees and place 85% of those within six months."}],"buckets":[{"name":"Student demand & who pays","subs":["Cash, private loan, employer-sponsored or workforce-grant students before accreditation","Local pipeline: community-college waitlist, career changers, veterans","Completion and placement rates as the enrollment engine"]},{"name":"Employer pull & placement","subs":["LNG and petrochem contractor hiring forecasts along the Gulf Coast","Certifications employers test for and pass rates","Sponsored-cohort agreements that guarantee seats"]},{"name":"Regulatory & accreditation path","subs":["State license timeline before first enrollment","Accreditation and Title IV eligibility by year three","Instructor credential requirements"]},{"name":"Economics & booth capacity","subs":["24 booths × cohorts per year × shifts = graduate capacity","Instructor ratio, steel, gas and consumables per student","Payback on $2.5M at achievable enrollment"]}],"generic":"Starting a new business (founder venture, regulated service)","tailored":"Added a regulatory and accreditation bucket as its own pillar because it dictates who can pay and when; capacity is counted in booths and shifts because graduates per year is a physical constraint, not a marketing one.","hyp":"24 booths on three day cohorts a year yields ~72 graduates; 300 needs two to three shifts and more booths. With $18,000 tuition and roughly $9,000 of cost per student, 200 graduates covers the $2.5M build-out in about three years. Bet: the business works, but the launch plan must lead with employer-sponsored cohorts, because retail students cannot access federal aid until accreditation.","trap":"Assuming students can finance tuition with federal aid from day one. The accreditation lag means the first two years are cash-and-sponsor only, which caps demand and cash flow unless employers fund seats.","start":"Student demand & who pays","startWhy":"Employer demand is clearly there; the uncertain variable is whether students can pay before accreditation, which decides the launch model and the first two years of cash."},{"id":"newbiz-n3","type":"newbiz","diff":2,"title":"Pedal Cover","client":"Nordlys Forsikring","industry":"Financial services / property & casualty insurance","prompt":"Nordlys Forsikring is a Norwegian property and casualty insurer based in Oslo with about NOK 9 billion of annual premiums, 1,400 employees, and a book dominated by auto and home policies. Electric bike sales in Norway have roughly doubled in four years and e-bike theft claims under home contents policies have become one of the fastest-growing claim lines. The CEO wants to launch a stand-alone e-bike insurance product sold at the point of sale through bike retailers, embedded in the checkout, with a goal of NOK 150 million of premiums in force within three years. She has asked you whether Nordlys should launch, how to design it, and whether to build the distribution technology itself or partner with an insurtech platform.","questions":[{"q":"How many e-bikes are sold in Norway each year, and at what average price?","a":"Roughly 100,000 a year at an average price around NOK 30,000."},{"q":"What attach rate do embedded insurance products achieve at a bike retailer checkout?","a":"Comparable products in Europe see 20 to 40% depending on how the retailer is incentivized."},{"q":"Is e-bike theft already covered by Nordlys's home contents policies, and would the new product replace that cover?","a":"Yes, up to a limit, with a high deductible. About half of e-bike theft losses today are paid under home policies. A stand-alone product would partly shift that."},{"q":"What loss ratio and premium does the underwriting team expect?","a":"About NOK 1,500 a year per bike at a 65% loss ratio, assuming an approved lock is required."},{"q":"Does Nordlys have the technology to embed a product in a retailer's checkout?","a":"No. Building would take 12 to 18 months; two insurtech platforms could have it live with major retailers in about four months for a share of premium."}],"buckets":[{"name":"Market & point-of-sale distribution","subs":["E-bike sales per year × attach rate at checkout","Retailer partnerships, commissions and training","Direct and app distribution for bikes already owned"]},{"name":"Product & risk design","subs":["Theft frequency and battery/fire exposure","Approved-lock and registration requirements to control loss ratio","Premium per bike vs. claims severity"]},{"name":"Build vs. partner","subs":["Own embedded tech (12-18 months) vs. insurtech platform (4 months, revenue share)","Underwrite on Nordlys's balance sheet either way","Data ownership and ability to cross-sell"]},{"name":"Economics & cannibalization","subs":["New premium flow vs. premium in force over three years","Claims shifted out of home contents (a cost already borne)","Acquisition cost at point of sale vs. direct"]}],"generic":"Starting a new business (corporate venture) with build-vs-partner","tailored":"Cannibalization sits inside the economics bucket because half of these losses already run through home policies, so the 'new' premium is partly a transfer; build-versus-partner is its own bucket because speed to retailer shelves decides the three-year target.","hyp":"100,000 e-bikes × 30% attach × NOK 1,500 ≈ NOK 45 million of new premium a year; with renewals and lapses, premium in force reaches roughly NOK 110 to 120 million by year three, short of NOK 150 million unless attach hits 40% or existing owners are added. Bet: launch, partner with an insurtech to be live before next spring's selling season, and credit the product with the theft claims it removes from home policies.","trap":"Counting annual new-premium flow as premium in force, or ignoring that half the theft losses are already on Nordlys's books. The first overstates the target gap; the second understates the product's real value.","start":"Market & point-of-sale distribution","startWhy":"The whole case hinges on units sold times attach rate; if that product cannot get near NOK 150 million, the design and build questions are moot."},{"id":"newbiz-n4","type":"newbiz","diff":3,"title":"Cold Chain, Short Hops","client":"Frío Directo","industry":"Logistics / cold-chain last-mile distribution","prompt":"Frío Directo is a Mexico City startup founded by a former logistics manager at a large bakery company and a restaurateur. Their idea is a network of small refrigerated micro-hubs in dense neighborhoods, with electric cargo trikes delivering fresh produce, dairy and meat daily to independent restaurants and fondas that today send someone to the Central de Abasto wholesale market at 4 a.m. They estimate 8,000 such restaurants in their first four boroughs and have raised MXN 30 million of seed capital. A typical restaurant spends about MXN 2,500 a day on perishables. The founders have asked you whether the business can work, what the numbers must look like, and how they should sequence the launch.","questions":[{"q":"What margin does Frío Directo make on the goods, and does the restaurant pay a delivery fee?","a":"They plan to sell at roughly Central de Abasto prices plus 15%, which covers the owner's saved trip and time. No separate delivery fee."},{"q":"How many stops can one trike make in a shift, and what does a trike and driver cost per day?","a":"They assume 25 stops in a morning shift. A driver, trike lease and hub share cost about MXN 4,000 per trike-day regardless of how many stops are made."},{"q":"How do these restaurants buy today and what do they value?","a":"The owner or a cook goes to the market three to six times a week. They value freshness, credit, and not losing two hours each morning."},{"q":"Who else is serving this segment?","a":"Traditional wholesalers deliver to larger restaurants with credit terms. Grocery delivery apps serve households. Nobody targets small fondas with daily cold delivery."},{"q":"Where do they source: Central de Abasto or direct from producers?","a":"Central de Abasto at first. Direct sourcing could add margin later but needs volume and cold storage."}],"buckets":[{"name":"Restaurant demand & basket economics","subs":["Daily basket (~MXN 2,500) and order frequency per fonda","Willingness to pay a 15% markup vs. owner's time and transport","Credit terms and payment collection risk"]},{"name":"Route density & hub operations","subs":["Stops per trike per shift and fixed cost per trike-day","Hub capex, cold-chain compliance and spoilage rates","Order cut-off, picking and loading before dawn"]},{"name":"Sourcing & gross margin","subs":["Buying at Central de Abasto vs. direct from producers","Shrink and spoilage eating gross margin","Volume thresholds for direct sourcing"]},{"name":"Competition & defensibility","subs":["Wholesalers with credit relationships to larger restaurants","Apps moving down-market into B2B","Density as the moat: being first in a neighborhood"]}],"generic":"Starting a new business (founder venture, distribution)","tailored":"Route density replaces the generic operations bucket because the fixed cost is per trike-shift, not per order; the economics must be built from stops per route, not margin per basket.","hyp":"At 25 stops × MXN 2,500 × 15% gross margin a trike earns ~MXN 9,400 a day against ~MXN 4,000 of fixed trike-day cost: profitable. At 12 stops it earns ~MXN 4,500 and barely covers the trike before spoilage and hub overhead. Bet: the business works only above roughly 15 to 18 stops per route, so launch in two dense neighborhoods and prove 20-plus stops before opening a second hub.","trap":"Modeling driver, trike and hub cost as a variable cost per order. They are fixed per shift, so a healthy 15% margin per basket says nothing about viability; the number that decides the case is stops per route.","start":"Route density & hub operations","startWhy":"Demand for the service is plausible; whether a trike can hit 20 stops in a morning is the single assumption the whole model depends on."},{"id":"newbiz-n5","type":"newbiz","diff":4,"title":"Brand on the Hoof","client":"Flint Hills Ranchers Cooperative","industry":"Agriculture / beef (cooperative launching a consumer brand)","prompt":"Flint Hills Ranchers Cooperative is a Kansas cattle cooperative with 340 member ranches that collectively market about 120,000 head a year, roughly $280 million of revenue, almost all sold to two large meatpackers. Members have watched the spread between cattle prices and retail beef prices widen for five years and feel they are capturing none of it. The board has voted to explore launching a regenerative, grass-finished branded beef line sold direct to consumers online and through regional grocers, with a goal of $40 million of brand revenue within four years. The cooperative's stated mission is to keep member ranches viable and raise returns per head, not to maximize profit of the brand itself. The general manager has asked whether this venture makes sense, what model it should take, and what could go wrong.","questions":[{"q":"What is the cooperative's objective for this venture: brand profit, higher prices paid to members, or both?","a":"Higher returns per head for members. The brand only matters if it pays ranchers more than the packers do, after its own costs."},{"q":"Does the cooperative have access to processing, or would it need to build or contract a plant?","a":"No plant. Regional processors with USDA inspection are booked out a year; the two big packers will not toll-process a competing brand. A small plant would cost about $25 million."},{"q":"What premium do regenerative or grass-finished brands earn, and on which cuts?","a":"Steaks and roasts can earn 40 to 60% over commodity. Ground beef and trim, which are roughly 60% of a carcass by weight, earn far less of a premium."},{"q":"How would the two packers react, and how dependent are members on them?","a":"Members sell 95% of their cattle to those packers. The packers could tighten terms, though a brand moving 5% of volume is unlikely to provoke much."},{"q":"How many members can meet regenerative certification standards today?","a":"Perhaps a quarter of the ranches, and grass finishing requires a different production cycle than most members run."}],"buckets":[{"name":"Consumer demand & price premium","subs":["Regenerative/grass-finished premium by cut and channel (DTC boxes vs. regional grocery)","Repeat rate and customer acquisition cost in DTC frozen beef","Regional grocery shelf access and slotting"]},{"name":"Processing & whole-carcass utilization","subs":["Toll-processing access vs. $25M own plant","Premium cuts vs. 60% ground and trim at near-commodity prices","Cold storage, logistics and shrink for a frozen DTC program"]},{"name":"Member economics & channel conflict","subs":["Premium per head flowing back to ranchers after brand costs","Which members qualify and how to allocate the program","Packer relationship risk at 5% of volume"]},{"name":"Model, capital & governance","subs":["Co-pack and regional retail pilot vs. own plant","Brand-building spend and cooperative patience for losses","Decision rights between the board and member ranches"]}],"generic":"Starting a new business (corporate venture) + forward integration","tailored":"Replaced the venture's profit goal with returns per head to members, and added whole-carcass utilization as a bucket because beef brands fail on the ground-beef side of the animal, not the steak side.","hyp":"$40 million at roughly $5,000 of retail value per carcass is about 8,000 head, under 7% of cooperative volume, so scale is not the problem. The economics are: premium cuts can pay ranchers $300 or more per head extra, but only if the ground beef is sold near its cost and processing is secured without a $25 million plant. Bet: launch as a 2,000-head co-packed pilot into regional grocers, not a DTC-first brand, and set the per-head premium members receive as the success metric.","trap":"Pricing the venture on ribeye margins. Sixty percent of the carcass sells as ground beef at close to commodity prices, and without processing capacity the brand cannot exist at all; both are missed if the frame is a consumer-brand launch rather than a whole-animal supply chain.","start":"Processing & whole-carcass utilization","startWhy":"Consumer demand for premium beef is proven; whether the cooperative can process the animal and sell all of it at a blended premium is the gating question for both feasibility and member returns."},{"id":"public-n1","type":"public","diff":1,"title":"Quiet Stacks","client":"Larkin County Library System","industry":"Public sector / public libraries","prompt":"Larkin County Library System runs 11 branches serving about 240,000 residents in a largely rural Oregon county, with a $19 million budget funded mostly by a dedicated property-tax levy that voters must renew in two years, and 160 staff. In-person visits are down 35% from 2019 and physical checkouts are down 25%, while e-book and audiobook lending has roughly doubled. County commissioners worry voters will not renew the levy for 'empty buildings', and they have asked the new library director to come back with a plan to restore the system's community impact and make the case for renewal. The director has asked you to help her think it through.","questions":[{"q":"How do the commissioners and the library define success: visits, checkouts, cardholders, or something else?","a":"Historically door counts and circulation. Nobody has agreed on what impact means, which is part of the problem."},{"q":"Which groups have stopped coming: children and families, seniors, teens, non-English speakers?","a":"Children's program attendance has held up. The drop is concentrated in working-age adults, who moved to e-books, and in two rural branches with cut hours."},{"q":"How have hours, staffing and programming changed since 2019?","a":"Hours are down about 15% systemwide, and most programming beyond story time was never restored after the pandemic."},{"q":"What do comparable library systems that renewed levies recently do differently?","a":"They reframed around active cardholders and program attendance, and positioned branches as community spaces: job help, passports, meeting rooms."},{"q":"How much of the budget is fixed in buildings and staff?","a":"About 70% is staff and roughly 20% is facilities. Materials and programs are the small flexible slice."}],"buckets":[{"name":"Objective & measures of impact","subs":["Active cardholders and programs attended vs. door counts and circulation","Digital lending counted as use, not loss","What the levy campaign needs residents to see"]},{"name":"Residents & reach funnel","subs":["Residents → cardholders → active users by age and branch","Working-age adults who went digital vs. rural users who lost hours","Non-users: awareness and barriers"]},{"name":"Services & delivery","subs":["Branch hours and the two rural branches with cuts","Programming beyond story time: job help, teens, seniors","Space use: meeting rooms, maker space, community services"]},{"name":"Resources & constraints","subs":["70% staff cost and union schedules","Levy politics and the two-year window","Facilities condition and partnership options"]}],"generic":"Public sector / nonprofit program performance","tailored":"The first bucket defines the goal because the system is being judged on the wrong metric; a population funnel replaces 'customers' because the mission is reach across all residents, including people who never visit.","hyp":"Usage did not collapse; it shifted channels and the metric did not follow. Active cardholders are likely close to flat once digital is counted. Bet: redefine success around active users and program attendance, restore hours at the two rural branches, and rebuild adult programming so that visible community use supports the levy.","trap":"Importing a profit frame: closing low-traffic branches to improve cost per visit. Branch presence is what rural voters renew a levy for, and the goal is impact and renewal, not efficiency.","start":"Objective & measures of impact","startWhy":"Until the library and commissioners agree what impact means, every number about visits points to the wrong fix."},{"id":"public-n2","type":"public","diff":2,"title":"Thirty Days Late","client":"Tri-County Workforce Board","industry":"Public sector / workforce development","prompt":"The Tri-County Workforce Board administers federally funded job-training programs across three Ohio counties with about 410,000 residents. It receives roughly $14 million a year in federal workforce funds, employs 55 staff, and contracts with 12 training providers ranging from a community college to private truck-driving and medical-assistant schools. Its headline federal measure, the share of participants employed in the second quarter after leaving the program, is 48% against a negotiated target of 62%; two more years below target puts funding at risk. Local employers in logistics, food manufacturing and healthcare say they cannot fill openings. The executive director has asked you to find out why outcomes are lagging and how to reach the target within 18 months.","questions":[{"q":"Which federal measures are binding: employment rate, median earnings, credential attainment, or all of them?","a":"Employment in the second quarter after exit is the one at risk. Credential attainment is actually above target."},{"q":"Where along the path from eligible resident to retained job do people drop out?","a":"Enrollment is strong and completion is about 75%. The gap opens between finishing training and getting a job, and in staying employed through the second quarter."},{"q":"How do the 12 providers compare on placement?","a":"Widely. The truck-driving and medical-assistant programs place over 80%; two IT and office-skills programs, about a quarter of slots, place under 30%."},{"q":"How are training slots allocated: by participant choice, by provider capacity, or by employer demand?","a":"Participant choice from an approved list. Employer demand data is not used in allocating slots."},{"q":"What are case manager caseloads and what happens after someone completes training?","a":"Around 110 participants per case manager. Post-completion job placement support is largely left to the providers."}],"buckets":[{"name":"Objective & binding measures","subs":["Second-quarter employment rate vs. credential and earnings measures","18-month timeline against the federal performance review","Which cohorts count toward the measure"]},{"name":"Participant funnel","subs":["Eligible → enrolled → completed → placed → retained through Q2","Leakage concentrated after completion","Barriers to retention: transport, childcare, shift work"]},{"name":"Delivery model & training mix","subs":["Provider placement rates (80%+ vs. under 30%)","Training mix vs. local openings in logistics, food manufacturing, healthcare","Case manager caseload and post-completion job support"]},{"name":"Resources & constraints","subs":["Federal rules on participant choice and provider eligibility","Contract terms with providers and ability to reallocate","Employer engagement staff and data"]}],"generic":"Public sector program performance (outcome gap)","tailored":"Replaced customers with a participant funnel and 'operations' with provider performance, because the lever is reallocating slots across contractors, not fixing an internal process; the goal is a federal outcome measure, not cost.","hyp":"The gap is at the completion-to-placement step, driven by a quarter of slots sitting in programs that place under 30% while employers in logistics and healthcare go unfilled. Bet: shifting those slots to high-placement programs and adding placement support would lift the blended rate from 48% to the low 60s within two cohorts.","trap":"Fixing the top of the funnel with more outreach and enrollment when the leak is at placement; and averaging provider performance, which hides that two providers account for most of the shortfall.","start":"Participant funnel","startWhy":"Locating where people fall out tells us whether this is a recruiting, training, or placement problem, and the clarifying answers already point to the back end."},{"id":"public-n3","type":"public","diff":2,"title":"One Big Check","client":"Compass Rose Yo
