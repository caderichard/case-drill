": "Fit & capabilities", "subs": ["Design/large-format edge vs. U.S. needs", "Distribution and sales force gap", "Brand building required"]}, {"name": "Entry mode & economics", "subs": ["Own distribution vs. acquire distributor vs. plant", "Landed cost per m² by mode", "Capex, breakeven, risk by mode"]}], "generic": "Market entry", "tailored": "Entry mode is the heart: import with own distribution vs. buy a distributor vs. build a plant, each with its own landed cost per m²; tariffs added under competition.", "hyp": "Direct distribution (or acquiring a distributor) captures most of the importer margin at low risk; a plant only pays if U.S. volume triples and tariffs persist.", "trap": "Jumping to the plant because it is the biggest decision. Sequence: prove demand with distribution first, then decide on manufacturing.", "start": "Entry mode & economics", "startWhy": "The three modes have wildly different capex and risk; landed cost per m² by mode frames which questions about the market even matter."}, {"id": "entry-3", "type": "entry", "diff": 2, "title": "Sunbelt", "client": "Keystone Home Health", "industry": "Healthcare / home health", "prompt": "Keystone provides Medicare-certified home health and hospice services in Pennsylvania and New Jersey. A PE owner wants to enter Florida, a large but competitive market. They ask whether and how to enter.", "questions": [{"q": "What is the regulatory situation?", "a": "Florida has no certificate-of-need for home health but licensing takes 12-18 months; Medicare rates are similar."}, {"q": "How does Keystone win at home?", "a": "Hospital referral relationships, clinical quality scores, nurse retention above peers."}, {"q": "What does the Florida market look like?", "a": "Fragmented: hundreds of small agencies plus three national chains; many small agencies are for sale."}, {"q": "What is the labor market?", "a": "Nurse shortages are acute in Florida; wages 10% higher than PA."}], "buckets": [{"name": "Market attractiveness", "subs": ["Senior population growth by county", "Reimbursement and regulatory timing", "Referral sources: hospitals, physician groups"]}, {"name": "Competition", "subs": ["National chains vs. fragmented locals", "Quality scores and referral share", "Consolidation trend and pricing of targets"]}, {"name": "Keystone fit", "subs": ["Transferable: clinical model, quality program", "Not transferable: referral relationships", "Nurse recruiting at Florida wages"]}, {"name": "Entry mode & economics", "subs": ["Acquire a platform agency vs. de novo license", "Roll-up of small agencies after platform", "Investment, margin, time to scale"]}], "generic": "Market entry", "tailored": "Regulatory timing (licensing) and referral relationships are the market-specific items; entry mode compares platform acquisition vs. de novo given a PE owner's timeline.", "hyp": "Enter by acquiring a mid-size platform agency with existing referrals, then roll up locals; de novo is too slow for a PE hold period.", "trap": "Assuming clinical quality travels. Referral relationships are local and are the real moat in home health.", "start": "Keystone fit", "startWhy": "Whether referrals and nurses can be secured decides mode; if they must be bought, the entry is really an M&A case."}, {"id": "entry-4", "type": "entry", "diff": 3, "title": "New Markets", "client": "Vireo Payments", "industry": "Technology / fintech", "prompt": "Vireo provides payment processing to 50,000 small restaurants in the U.S. Growth is slowing as the market saturates. Leadership is choosing between entering Canada, entering the U.K., or expanding into U.S. retail (non-restaurant) merchants. Which should they pick?", "questions": [{"q": "What is the goal and horizon?", "a": "Add $100M in net revenue within four years; IPO in five."}, {"q": "How does Vireo win?", "a": "Restaurant-specific features (tips, table management integration), fast onboarding; pricing is at market."}, {"q": "What do the three options look like?", "a": "Canada: similar market, 10% the size of U.S. U.K.: larger, different regulation and acquirer landscape. U.S. retail: large, but generic competitors dominate."}, {"q": "What capabilities exist?", "a": "U.S. bank and card-network relationships; no international licenses; product team is restaurant-focused."}], "buckets": [{"name": "Market attractiveness (each option)", "subs": ["Size, growth, and merchant count", "Take rate and revenue per merchant", "Regulatory and licensing effort"]}, {"name": "Competitive position", "subs": ["Incumbents and their restaurant depth", "Does Vireo's restaurant edge transfer?", "Pricing pressure"]}, {"name": "Vireo fit", "subs": ["Product transferability (tips, integrations)", "Licensing, banking, local sales needed", "Management bandwidth with IPO ahead"]}, {"name": "Economics & risk", "subs": ["Revenue reachable in 4 years per option", "Investment and breakeven", "Execution and regulatory risk; sequencing"]}], "generic": "Market entry", "tailored": "Same four buckets, applied as a scoring grid across three options; fit emphasizes whether the restaurant-specific edge transfers, which is the real differentiator.", "hyp": "Canada first: the restaurant edge transfers intact with modest regulatory lift; U.K. is a later wave; U.S. retail abandons the moat.", "trap": "Picking the biggest market. U.S. retail is largest but strips the one thing Vireo wins on; attainable revenue is what matters.", "start": "Vireo fit", "startWhy": "The restaurant-specific edge is the whole thesis; testing transferability across the three options filters the list fastest."}, {"id": "entry-5", "type": "entry", "diff": 3, "title": "Capital City", "client": "Ridgeway Transit Partners", "industry": "Public sector / transit contracting", "prompt": "Ridgeway operates outsourced bus services for 20 mid-size U.S. cities. A large state capital is tendering its entire bus network for the first time (a $200M-a-year contract). Ridgeway asks whether to bid, and how to position.", "questions": [{"q": "What does the contract involve?", "a": "Operate 400 buses, employ 1,200 unionized drivers, 7-year term, performance penalties for on-time service."}, {"q": "Who else is bidding?", "a": "Two global operators with larger contracts and lower cost of capital."}, {"q": "What are Ridgeway's strengths?", "a": "Best on-time performance and safety record in its segment; never run a network this large."}, {"q": "How is the bid scored?", "a": "60% price, 40% quality/technical."}], "buckets": [{"name": "Market/contract attractiveness", "subs": ["Revenue, margin potential, 7-year certainty", "Risk transfer: penalties, fuel, labor cost escalators", "Political and renewal dynamics"]}, {"name": "Competitive position", "subs": ["Global operators: scale and cost of capital", "Ridgeway's quality record vs. 60% price weight", "Likely competitor pricing"]}, {"name": "Ridgeway fit", "subs": ["Scaling from ~100 to 400 buses: management depth", "Union transition and labor relations", "Balance-sheet capacity for bonds and fleet"]}, {"name": "Bid economics & mode", "subs": ["Cost to bid and probability of winning", "Price-to-win vs. margin; bid as JV or alone", "Downside if won and underperformed"]}], "generic": "Market entry", "tailored": "'Market' is a single contract, so the bucket covers contract terms and risk transfer; mode becomes bid-alone vs. JV; fit focuses on scale jump and union transition.", "hyp": "Bid only as a JV with a partner that brings scale and capital; a solo bid either loses on price or wins a contract Ridgeway cannot deliver.", "trap": "Bidding to win rather than to make money. A 7-year contract won on a thin price with on-time penalties can sink the whole company.", "start": "Bid economics & mode", "startWhy": "With price at 60% of scoring, the price-to-win versus the margin Ridgeway needs settles whether any version of this bid is worth pursuing."}, {"id": "launch-1", "type": "launch", "diff": 1, "title": "Spoonful", "client": "Little Sprout Foods", "industry": "Consumer / baby food", "prompt": "Little Sprout sells organic baby-food pouches in 2,000 grocery stores. The team wants to launch a toddler snack line (puffs and bars). Should they, and how?", "questions": [{"q": "Why toddler snacks?", "a": "Parents age out of pouches at 12-15 months; the brand loses them. Toddler snacks is a growing category."}, {"q": "Who are the competitors?", "a": "Two large brands own ~60% of toddler snacks; private label is growing."}, {"q": "What capabilities exist?", "a": "Strong brand with parents; co-manufacturing for pouches; no dry-snack manufacturing."}, {"q": "What is the financial target?", "a": "Launch must reach $10M revenue and positive contribution in 3 years."}], "buckets": [{"name": "Customer & market", "subs": ["Category size, growth, and purchase drivers", "Does the pouch parent follow the brand into snacks?", "Price points and retail placement"]}, {"name": "Product & competition", "subs": ["Differentiation vs. two leaders and private label", "Product range: puffs first vs. full line", "Retailer willingness to add SKUs"]}, {"name": "Capabilities & go-to-market", "subs": ["Co-manufacturer sourcing for dry snacks", "Sales and shelf-space negotiation", "Marketing to existing customer base"]}, {"name": "Financials", "subs": ["Volume ramp, margin, co-man costs", "Launch investment, slotting fees, breakeven", "Cannibalization of pouches (minimal) and halo"]}], "generic": "New product launch", "tailored": "Customer bucket centers on the brand's own aging-out parents; capability bucket names co-manufacturing for a new format; financials include slotting fees, specific to grocery launches.", "hyp": "Launch a narrow line (puffs) marketed to existing pouch customers; the brand can earn a slot if the product is differentiated on ingredients.", "trap": "Counting all revenue as incremental. Here cannibalization is low, but slotting fees and trade spend can erase the first two years of margin.", "start": "Customer & market", "startWhy": "The launch thesis is brand follow-through from pouch to snack; if parents do not follow, nothing else matters."}, {"id": "launch-2", "type": "launch", "diff": 2, "title": "Premium Tier", "client": "Clearwater Bank", "industry": "Financial services / retail banking", "prompt": "Clearwater is a regional bank with 150 branches and 800,000 retail customers. Management wants to launch a premium checking and advisory bundle for mass-affluent customers ($250K–$1M in assets). Evaluate the idea.", "questions": [{"q": "How many customers qualify and what do they do today?", "a": "About 80,000 mass-affluent households; most hold deposits at Clearwater but invest elsewhere."}, {"q": "What would the bundle include?", "a": "Fee-waived accounts, dedicated banker, financial planning, discounted mortgage rates; $25/month or waived at $100K balances."}, {"q": "Who competes?", "a": "National banks' premium tiers and independent advisors; robo-advisors for the younger segment."}, {"q": "What capabilities are needed?", "a": "Need to hire or train 100 advisors; wealth platform exists but is underused."}], "buckets": [{"name": "Customer & market", "subs": ["Mass-affluent segment size and needs", "Current wallet: deposits here, investments elsewhere", "Willingness to consolidate; switching triggers"]}, {"name": "Product & competition", "subs": ["Bundle design vs. national banks' premium tiers", "Differentiation: local relationship, pricing", "Advisor vs. robo positioning"]}, {"name": "Capabilities & GTM", "subs": ["Advisor hiring and training (100 FTE)", "Branch staff referral model and incentives", "Platform and compliance readiness"]}, {"name": "Financials", "subs": ["Revenue: fees, AUM, mortgage, deposit margin", "Cost: advisors, fee waivers, marketing", "Cannibalization of existing fee income; NPV"]}], "generic": "New product launch", "tailored": "Revenue model expanded to the bank's many lines (fees, AUM, lending, deposits); cannibalization explicit because fee waivers hit existing income.", "hyp": "The bundle wins if it pulls investment assets in-house; fee income alone will not pay for 100 advisors.", "trap": "Measuring success by sign-ups. The bundle is a cost unless AUM and lending follow; set the metric as assets consolidated.", "start": "Financials", "startWhy": "The economics depend on AUM capture; sizing that against the advisor cost tells you if the product design is even in the right range."}, {"id": "launch-3", "type": "launch", "diff": 2, "title": "Loaner", "client": "Atlas Construction Equipment", "industry": "Industrial / equipment", "prompt": "Atlas manufactures mid-size excavators and loaders sold through dealers. Leadership wants to launch a subscription offering: customers pay monthly for equipment with maintenance and telematics included. Should they?", "questions": [{"q": "Why now?", "a": "Contractors face high interest rates and want flexibility; rental companies are taking share."}, {"q": "What would the economics be?", "a": "Machine costs Atlas $150K; subscription at $4,500/month, 36-month term; Atlas keeps residual value."}, {"q": "How would dealers react?", "a": "Dealers earn margin on sales and parts; subscription could bypass them."}, {"q": "What capabilities are needed?", "a": "Fleet financing, maintenance network, telematics (partially built), remarketing of used machines."}], "buckets": [{"name": "Customer & demand", "subs": ["Which contractors want subscriptions and why", "Price sensitivity vs. rental and purchase", "Utilization and contract length preferences"]}, {"name": "Offering & competition", "subs": ["Design: term, maintenance, telematics, swaps", "Rental companies and captive finance arms", "Differentiation on uptime and data"]}, {"name": "Capabilities & channel", "subs": ["Balance sheet / financing partner", "Maintenance delivery through dealers (dealer role and margin)", "Remarketing and residual-value management"]}, {"name": "Financials & risk", "subs": ["Lifetime economics per machine incl. residual", "Cannibalization of outright sales", "Residual value and credit risk; breakeven"]}], "generic": "New product launch", "tailored": "The 'product' is a business model, so capability bucket includes financing and remarketing; dealers appear as both channel and conflict; risk bucket adds residual and credit risk.", "hyp": "Subscription can win share from rental companies if dealers deliver maintenance and earn a cut; it should be launched through dealers, not around them.", "trap": "Modeling subscription like a sale. The profit lives in utilization, maintenance cost, and residual value over 36+ months, not in month one.", "start": "Financials & risk", "startWhy": "Residual value assumptions swing the lifetime economics more than anything else; if they do not work, demand is irrelevant."}, {"id": "launch-4", "type": "launch", "diff": 3, "title": "Generic Threat", "client": "Halcyon Pharma", "industry": "Healthcare / pharma", "prompt": "Halcyon's leading drug for a chronic respiratory condition loses patent protection in three years. R&D has a once-weekly reformulation ready for Phase III. Halcyon asks whether to launch the reformulation and how to position it against coming generics.", "questions": [{"q": "What is the current drug's economics?", "a": "$1.2B annual sales, 85% gross margin; generics typically take 80% of volume within a year."}, {"q": "What does the reformulation offer?", "a": "Weekly instead of daily dosing; same efficacy; likely new patent to 2040."}, {"q": "How do payers behave?", "a": "Payers push generics hard; will cover a new formulation only with proven adherence benefits or price concessions."}, {"q": "What does Phase III cost and when would it launch?", "a": "$200M; launch 12 months before patent expiry if on schedule."}], "buckets": [{"name": "Customer & market", "subs": ["Patients/physicians: value of weekly dosing (adherence)", "Payer coverage and formulary dynamics", "Share of patients likely to switch before generics"]}, {"name": "Product & competition", "subs": ["Clinical differentiation vs. daily generic", "Generic entrants' timing and pricing", "Other branded alternatives in class"]}, {"name": "Capabilities & GTM", "subs": ["Phase III execution and timing risk", "Sales force transition plan", "Pricing/contracting with payers"]}, {"name": "Financials", "subs": ["Revenue retained vs. generic erosion scenarios", "$200M trial plus launch investment", "NPV vs. the do-nothing (harvest) alternative"]}], "generic": "New product launch", "tailored": "Customer bucket split into patients, physicians, and payers (pharma has three customers); competition is the generic entry itself; financials compared to harvesting the current drug.", "hyp": "The reformulation is worth launching only if payers will cover it, which requires an adherence claim; without that, the $200M is better spent elsewhere.", "trap": "Assuming the clinical benefit sells itself. Payers, not patients, decide; a convenience-only benefit rarely survives a generic at 10% of the price.", "start": "Customer & market", "startWhy": "Payer coverage is the gate; if formularies will not cover weekly dosing at a premium, no financial scenario works."}, {"id": "launch-5", "type": "launch", "diff": 3, "title": "Smart Meter", "client": "Lakeshore Energy", "industry": "Energy / utility", "prompt": "Lakeshore is a regulated electric utility serving 2 million customers. It wants to launch a home energy management service (smart thermostat, app, demand-response rewards) as an unregulated subsidiary. Evaluate the launch.", "questions": [{"q": "What is the objective?", "a": "Create non-regulated earnings and reduce peak demand to defer a $500M plant investment."}, {"q": "Who are the competitors?", "a": "Big-tech thermostat makers and several startups; customers already own devices in 15% of homes."}, {"q": "What can Lakeshore offer uniquely?", "a": "Bill integration, rebates, and demand-response payments; trusted brand but weak at consumer software."}, {"q": "What are the economics?", "a": "$8/month subscription target; device subsidy $100; peak reduction worth $150 per enrolled home per year."}], "buckets": [{"name": "Customer & market", "subs": ["Segments: device owners vs. new adopters", "Willingness to pay and enrollment barriers", "Trust in the utility vs. tech brands"]}, {"name": "Product & competition", "subs": ["Partner with device makers vs. own device", "Differentiation: bill integration, rewards", "Competitors' ability to bundle demand response"]}, {"name": "Capabilities & GTM", "subs": ["Consumer software and support capability", "Regulatory separation of the subsidiary", "Marketing through bills and rebates"]}, {"name": "Financials", "subs": ["Subscription + demand-response value per home", "Subsidy, software, support cost per home", "Deferred plant investment value; breakeven enrollment"]}], "generic": "New product launch", "tailored": "Financials include the system benefit (deferred $500M plant) alongside subscription revenue, a utility-only twist; regulatory separation added to capabilities.", "hyp": "The launch pays through peak reduction value, not subscription fees; partnering with device makers rather than building a device is the faster route.", "trap": "Scoring the business on subscription revenue only. The demand-response value per home is larger than the fee and belongs in the case.", "start": "Financials", "startWhy": "Value per enrolled home ($8/month fee vs. $150/year system benefit) sets what Lakeshore can afford to spend on acquisition and partners."}, {"id": "ma-1", "type": "ma", "diff": 1, "title": "Two Kitchens", "client": "Cedar & Salt Restaurant Group", "industry": "Consumer / restaurants", "prompt": "Cedar & Salt owns eight upscale-casual restaurants in Seattle. The owner of a four-restaurant group in Portland is retiring and has offered to sell for $12M. Cedar & Salt wants to know whether to buy.", "questions": [{"q": "Why acquire rather than open in Portland?", "a": "Speed and existing teams; Cedar & Salt has never opened outside Seattle."}, {"q": "What do the target's financials look like?", "a": "$20M revenue, $2M EBITDA, flat for three years; leases have 5+ years."}, {"q": "What synergies are expected?", "a": "Purchasing, shared back office, menu cross-pollination; maybe $500K."}, {"q": "How would it be financed?", "a": "$4M cash plus bank debt; owner wants to keep control."}], "buckets": [{"name": "Market", "subs": ["Portland upscale-casual demand and trend", "Comparable restaurant deal multiples", "Competitor moves in Portland"]}, {"name": "Target standalone", "subs": ["Revenue: covers × check × days; trend by unit", "Costs: food, labor, occupancy; lease terms", "Management depth after the owner leaves"]}, {"name": "Fit & capabilities", "subs": ["Brand fit and menu consistency", "Cedar & Salt's ability to run a second city", "Key chef and manager retention"]}, {"name": "Deal", "subs": ["Price: $12M = 6x EBITDA vs. comps", "Synergies ($500K) and integration cost", "Risks: owner departure, debt load, cannibalization (none)"]}], "generic": "M&A / PE acquisition", "tailored": "Target's revenue built from restaurant drivers (covers × check); fit bucket focuses on chef retention and running a second city; deal bucket tests 6x against comps.", "hyp": "The deal is sound at ~6x if the retiring owner's role can be replaced; the risk is operational, not financial.", "trap": "Valuing the target on synergies. $500K of synergies on $2M EBITDA is nice but the price must work on standalone numbers.", "start": "Target standalone", "startWhy": "Flat revenue and an owner-dependent business decide whether $2M EBITDA survives the handover; that comes before synergies or price."}, {"id": "ma-2", "type": "ma", "diff": 2, "title": "Shop Floor", "client": "Trident Automation", "industry": "Industrial / automation", "prompt": "Trident makes robotic welding cells for automotive suppliers. It is considering acquiring Brightline Vision, a 120-person machine-vision software company, for $90M. Trident's CEO wants a recommendation.", "questions": [{"q": "What is the strategic rationale?", "a": "Customers want vision-guided cells; Trident currently licenses vision from a competitor."}, {"q": "Brightline's financials?", "a": "$30M revenue, 70% gross margin, $5M EBITDA, growing 20%; half of revenue is from non-automotive customers."}, {"q": "How does $90M compare?", "a": "3x revenue, 18x EBITDA; recent software comps at 4-6x revenue."}, {"q": "Integration considerations?", "a": "Software engineers may leave a hardware owner; Brightline's other customers include Trident competitors."}], "buckets": [{"name": "Market", "subs": ["Demand for vision-guided welding", "Software comps and multiples", "Competitor response if Trident owns a supplier"]}, {"name": "Target standalone value", "subs": ["Revenue growth by segment (auto vs. other)", "Margin structure and R&D needs", "Customer concentration and churn"]}, {"name": "Fit & capabilities", "subs": ["Technology fit with Trident's cells", "Retention of engineers; cultural fit", "Ability to keep selling to Trident's competitors"]}, {"name": "Deal", "subs": ["Synergies: bundled sales, licensing cost saved", "Dis-synergies: lost competitor customers", "Price, structure (earn-out), risks, alternatives (partner/license)"]}], "generic": "M&A / PE acquisition", "tailored": "Added dis-synergies (competitors leaving Brightline) and the alternative of a licensing partnership; fit bucket emphasizes engineer retention for a software target.", "hyp": "The deal creates value only if vision-guided cells drive Trident's own share gains; if half of Brightline's revenue walks away, 3x revenue is too much.", "trap": "Counting synergies without dis-synergies. Owning a supplier that sells to your competitors often shrinks the target.", "start": "Deal", "startWhy": "Lost competitor revenue could wipe out the synergies; sizing both sides tells you whether to pursue a deal or a long-term license."}, {"id": "ma-3", "type": "pe", "diff": 2, "title": "Roll Call", "client": "Brookhaven Capital", "industry": "Private equity / veterinary services", "prompt": "Brookhaven, a mid-market PE fund, is considering buying Paws & Claws, a 25-clinic veterinary group in the Carolinas, for $140M as a platform for a roll-up. Should the fund proceed?", "questions": [{"q": "What are the target's financials?", "a": "$100M revenue, $14M EBITDA; same-clinic growth 6%; vet turnover 20%."}, {"q": "What is the roll-up thesis?", "a": "Buy single clinics at 6-8x EBITDA, add to platform at 10x; targeted exit at 12x in five years."}, {"q": "How does the market look?", "a": "Pet spending growing 7%; three large consolidators active; multiples for single clinics rising."}, {"q": "What is the financing?", "a": "50% debt at 9%; fund wants 2.5x MOIC."}], "buckets": [{"name": "Market attractiveness", "subs": ["Pet care spend growth and resilience", "Consolidation stage and competitor roll-ups", "Single-clinic acquisition multiples trend"]}, {"name": "Company standalone", "subs": ["Revenue quality: visits × revenue per visit, same-clinic growth", "Margin, cash conversion, capex", "Vet retention and management team"]}, {"name": "Value creation plan", "subs": ["Roll-up: pipeline, pace, integration capability", "Operating levers: pricing, procurement, scheduling", "Multiple arbitrage (6-8x in, 12x out)"]}, {"name": "Deal & exit", "subs": ["Entry at 10x; leverage at 9% and coverage", "Returns bridge: EBITDA growth vs. multiple vs. debt paydown", "Exit routes and buyer universe; risks (vet labor, rate rises)"]}], "generic": "M&A / PE acquisition (PE diligence variant)", "tailored": "PE version: value creation plan and returns bridge replace generic 'synergies'; vet turnover enters as the key operating risk; multiple arbitrage called out explicitly.", "hyp": "Returns depend mostly on multiple arbitrage from the roll-up; the deal clears 2.5x only if the fund can buy 40+ clinics at sub-8x while rivals bid.", "trap": "Not naming the return driver. Say whether MOIC comes from EBITDA growth, multiple expansion, or debt paydown; here it is arbitrage, which is the most fragile.", "start": "Value creation plan", "startWhy": "The roll-up pace and acquisition multiples drive the return bridge; if arbitrage is shrinking, the standalone business cannot carry a 10x entry."}, {"id": "ma-4", "type": "ma", "diff": 3, "title": "Cross-Border", "client": "Meridian Logistics", "industry": "Logistics / freight forwarding", "prompt": "Meridian, a U.S. freight forwarder, is evaluating a merger of equals with Delta Linea, a Mexican customs-brokerage and forwarding firm, to capture nearshoring flows. The CEO wants to know whether the combination makes sense and what to watch.", "questions": [{"q": "What is the strategic logic?", "a": "Nearshoring is shifting volumes to U.S.–Mexico lanes; neither firm can serve both sides alone."}, {"q": "Financials of each?", "a": "Meridian: $600M revenue, $40M EBITDA. Delta Linea: $300M revenue, $30M EBITDA, higher margin from customs brokerage."}, {"q": "What synergies?", "a": "Cross-selling across 1,500 shared potential clients; shared IT; some overhead."}, {"q": "Deal considerations?", "a": "Stock-for-stock; governance and leadership split unresolved; currency and regulatory approvals in both countries."}], "buckets": [{"name": "Market", "subs": ["Nearshoring volume growth on U.S.–Mexico lanes", "Competitors assembling cross-border networks", "Trade-policy and tariff risk"]}, {"name": "Standalone value of each", "subs": ["Revenue by lane and service; customer overlap", "Margin structure (brokerage vs. forwarding)", "Exposure to peso and trade cycles"]}, {"name": "Fit & capabilities", "subs": ["Network complementarity vs. overlap", "Leadership, culture, governance of a merger of equals", "Systems integration"]}, {"name": "Deal", "subs": ["Exchange ratio and relative valuation", "Synergies: cross-sell, IT, overhead; integration cost", "Risks: regulatory approvals, customer defection, currency; alternatives (alliance, JV)"]}], "generic": "M&A / PE acquisition", "tailored": "'Target' became both parties with relative valuation; governance of a merger of equals is a fit item; alliance/JV added as the alternative; currency and trade policy as risks.", "hyp": "The combination has real strategic logic, but a merger of equals with unresolved governance is riskier than a commercial alliance that tests cross-selling first.", "trap": "Treating a merger of equals like an acquisition. The exchange ratio and who runs the company decide whether synergies ever get executed.", "start": "Fit & capabilities", "startWhy": "If governance and integration cannot be settled, the deal fails regardless of synergies; test fit before valuing them."}, {"id": "ma-5", "type": "pe", "diff": 3, "title": "Carve-Out", "client": "Stonebridge Partners", "industry": "Private equity / industrial carve-out", "prompt": "Stonebridge is bidding for the specialty-coatings division being carved out of a large chemicals conglomerate. Asking price is $800M. The division has never operated standalone. Stonebridge asks how to evaluate the deal.", "questions": [{"q": "Division financials?", "a": "$700M revenue, $110M EBITDA as reported; 'allocated' corporate costs of $25M may not reflect standalone needs."}, {"q": "Why is the parent selling?", "a": "Non-core; parent is focused on commodity chemicals; the division has been under-invested."}, {"q": "What is the market?", "a": "Specialty coatings growing 4%; fragmented; pricing power moderate."}, {"q": "What is entangled with the parent?", "a": "Shared plants, IT, procurement contracts, and 30% of raw materials bought from the parent."}], "buckets": [{"name": "Market attractiveness", "subs": ["Growth, cyclicality, pricing power", "Competitive fragmentation and consolidation potential", "Raw-material cost exposure"]}, {"name": "Standalone business", "subs": ["True standalone cost base vs. allocations", "Revenue quality by customer and product", "Capex catch-up from under-investment"]}, {"name": "Value creation plan", "subs": ["Operational fixes the parent neglected", "Pricing and mix improvement", "Add-on acquisitions in a fragmented market"]}, {"name": "Deal & separation", "subs": ["Price vs. true EBITDA; TSA costs and stranded costs", "Separation: plants, IT, supply agreements with parent", "Exit routes; risks (dis-synergies, key-customer loss)"]}], "generic": "M&A / PE acquisition (PE diligence variant)", "tailored": "Separation risk is its own theme inside the deal bucket (TSAs, stranded costs, parent supply agreements); standalone cost base is questioned rather than accepted.", "hyp": "Reported EBITDA overstates standalone profit; the deal works only if Stonebridge underwrites a lower EBITDA plus a credible operational upside from the parent's neglect.", "trap": "Accepting carve-out financials at face value. Allocated costs, shared plants, and parent supply contracts mean the real EBITDA is unknown until you rebuild it.", "start": "Standalone business", "startWhy": "Everything prices off true standalone EBITDA; rebuilding the cost base before anything else protects against overpaying."}, {"id": "pricing-1", "type": "pricing", "diff": 1, "title": "Day Pass", "client": "Blue Ridge Adventure Park", "industry": "Consumer / leisure", "prompt": "Blue Ridge runs a zipline and ropes-course park in North Carolina. Admission is $45 and has not changed in six years. Attendance is 150,000 a year, mostly at capacity on summer weekends. The owner asks whether to raise prices and by how much.", "questions": [{"q": "What does the demand pattern look like?", "a": "Weekends sell out June–August; weekdays and shoulder seasons run at 40% capacity."}, {"q": "What do competitors charge?", "a": "Similar parks charge $55–$65; the nearest is 90 minutes away."}, {"q": "What is the cost structure?", "a": "Mostly fixed (staff, insurance, maintenance); variable cost per guest ~$5."}, {"q": "Who are the customers?", "a": "Families and youth groups; groups are 30% of attendance and get a 20% discount."}], "buckets": [{"name": "Customer value & willingness to pay", "subs": ["Price vs. perceived value and alternatives", "Elasticity by segment (families vs. groups)", "Sell-out days = unmet demand at current price"]}, {"name": "Competitive position", "subs": ["$45 vs. $55–$65 benchmark", "Differentiation and distance to competitors", "Risk of new entrants"]}, {"name": "Economics", "subs": ["Breakeven volume loss for a given increase (variable cost $5)", "Capacity constraint on peak days", "Group discount structure"]}, {"name": "Execution", "subs": ["Peak/off-peak (dynamic) pricing", "Rollout timing and communication", "Monitor attendance and mix after change"]}], "generic": "Pricing", "tailored": "Economics bucket is almost pure breakeven math because costs are fixed; execution bucket emphasizes peak/off-peak pricing because the demand pattern is so uneven.", "hyp": "Raise peak-weekend prices toward $60 and hold or discount off-peak; with $40 contribution per guest, even meaningful attendance loss on sold-out days increases profit.", "trap": "Pricing uniformly. Sold-out weekends and 40% weekdays call for different prices, not one new number.", "start": "Economics", "startWhy": "With a $40 contribution per guest, the breakeven volume loss is tiny; that math shows how much pricing room exists before you even look at competitors."}, {"id": "pricing-2", "type": "pricing", "diff": 2, "title": "Per Seat", "client": "Ledgerly", "industry": "Technology / SMB software", "prompt": "Ledgerly sells bookkeeping software to small businesses at $30 per user per month. A competitor just launched a flat $99 per company plan. Ledgerly's CEO wants to decide whether to change pricing.", "questions": [{"q": "What does Ledgerly's customer base look like?", "a": "40,000 companies; average 2.5 users; 20% have 5+ users and generate 45% of revenue."}, {"q": "How do customers perceive value?", "a": "Larger customers love multi-user controls; small ones see Ledgerly as expensive vs. the flat plan."}, {"q": "What is the cost structure?", "a": "Gross margin 80%; cost per additional user negligible."}, {"q": "Churn and competitive dynamics?", "a": "Churn rising among 1-2 user customers; competitor is well-funded."}], "buckets": [{"name": "Customer value & segments", "subs": ["Value drivers by segment (controls vs. simplicity)", "Willingness to pay for 1-2 user vs. 5+ user firms", "Churn risk by segment"]}, {"name": "Competitive position", "subs": ["Flat $99 vs. $30/user crossover at ~3.3 users", "Feature and brand differentiation", "Likely competitor next moves"]}, {"name": "Economics", "subs": ["Revenue impact of alternative structures by segment", "Breakeven: churn avoided vs. revenue given up", "Margin (80%) means volume matters more than price"]}, {"name": "Execution", "subs": ["Tiered model: flat small-business tier + per-seat pro", "Grandfathering and migration", "Pilot, test, and monitor churn"]}], "generic": "Pricing", "tailored": "Competitive bucket includes the crossover-user math; economics compares pricing structures (not just levels) by segment; execution proposes tiering.", "hyp": "Keep per-seat for larger customers and add a flat small-business tier; matching $99 for everyone would give up 45% of revenue to protect customers who are not leaving.", "trap": "Matching the competitor across the board. The threat is concentrated in 1-2 user firms; the big accounts are not price-sensitive to the flat plan.", "start": "Customer value & segments", "startWhy": "The flat plan hits only one segment; separating who is at risk from who is not frames every pricing option."}, {"id": "pricing-3", "type": "pricing", "diff": 2, "title": "Rate Card", "client": "Pinecone Senior Care", "industry": "Healthcare / assisted living", "prompt": "Pinecone runs 15 assisted-living communities in Arizona at 88% occupancy. Costs have risen 12% over two years while rates rose 4%. The CEO wants to know how much to raise rates for current and new residents.", "questions": [{"q": "How are rates set today?", "a": "Base rent plus care-level fees; one annual increase; new residents get move-in specials."}, {"q": "What does competition look like?", "a": "Local competitors are at 90-92% occupancy and raised rates 8% last year."}, {"q": "How price-sensitive are residents?", "a": "Moving is hard for residents; adult children compare prices at move-in but rarely move parents for price."}, {"q": "Any regulatory or contractual limits?", "a": "Contracts allow annual increases with 60 days' notice; no caps."}], "buckets": [{"name": "Customer value & sensitivity", "subs": ["Current residents: high switching cost, low elasticity", "Prospects: compare at move-in; elasticity higher", "Care-level pricing vs. actual care delivered"]}, {"name": "Competitive position", "subs": ["Rate benchmarks and recent increases (8%)", "Occupancy gap (88% vs. 90-92%)", "Differentiation: quality, amenities, staffing"]}, {"name": "Economics", "subs": ["Breakeven move-outs for each increase", "Cost recovery needed (12% vs. 4%)", "Impact of specials on new-resident rates"]}, {"name": "Execution", "subs": ["Differentiated increases: existing vs. new, by care level", "Communication to families; timing", "Reduce move-in specials; monitor occupancy"]}], "generic": "Pricing", "tailored": "Customer bucket split into current residents (low elasticity) vs. prospects (higher); execution covers family communication and move-in specials, specific to senior living.", "hyp": "Raise existing-resident rates 7-8% (in line with competitors and cost) and trim move-in specials; existing residents will not leave and the occupancy gap is a sales issue, not a price issue.", "trap": "Assuming the occupancy gap means Pinecone is overpriced. Competitors are fuller and more expensive; the gap is likely marketing or product.", "start": "Customer value & sensitivity", "startWhy": "The two customer groups have completely different elasticities; recognizing that opens a larger increase than a blended analysis would allow."}, {"id": "pricing-4", "type": "pricing", "diff": 3, "title": "Surcharge", "client": "Ironvale Steel Fabrication", "industry": "Industrial / fabrication", "prompt": "Ironvale fabricates structural steel for commercial construction under fixed-price contracts. Steel input prices rose 35% in nine months, and Ironvale is losing money on its backlog. Leadership asks how to price going forward and what to do about the backlog.", "questions": [{"q": "How are contracts priced today?", "a": "Fixed price at bid; 6-12 month delivery; no escalation clauses."}, {"q": "What do competitors do?", "a": "Mixed: some added steel surcharges or index-linked clauses; others still bid fixed and are also losing money."}, {"q": "How price-sensitive are customers?", "a": "General contractors bid competitively, but reliability and on-time delivery matter; switching mid-project is costly."}, {"q": "What is the backlog exposure?", "a": "$80M backlog; estimated $6M loss at current steel prices."}], "buckets": [{"name": "Customer value & sensitivity", "subs": ["What GCs value: reliability, schedule, price", "Tolerance for index-linked pricing", "Segments: public vs. private projects"]}, {"name": "Competitive position", "subs": ["Surcharge adoption among competitors", "Risk of losing bids if alone in surcharging", "Ironvale's reliability as leverage"]}, {"name": "Economics", "subs": ["Margin by contract structure under price scenarios", "Breakeven and win-rate trade-off", "Hedging/forward buying of steel"]}, {"name": "Execution", "subs": ["New contracts: index clauses, shorter validity, surcharges", "Backlog: renegotiate, share pain, or absorb", "Procurement and bid-process changes"]}], "generic": "Pricing", "tailored": "Execution split into new contracts vs. backlog since the question has two parts; economics includes hedging as a pricing-adjacent lever; contract structure replaces price level as the main decision.", "hyp": "Move all new bids to index-linked pricing (competitors are already doing it) and renegotiate the largest backlog contracts using reliability as leverage; absorb the rest.", "trap": "Treating this as a price-level question. The issue is risk allocation in contract structure; a higher fixed price just bets again on steel.", "start": "Execution", "startWhy": "The backlog loss is happening now; triaging which contracts can be renegotiated is urgent, and the new-contract structure decision follows directly."}, {"id": "pricing-5", "type": "pricing", "diff": 3, "title": "Bundle", "client": "Northstar Streaming", "industry": "Media / streaming", "prompt": "Northstar is a mid-size streaming service with 12M subscribers at $11.99/month. Growth has stalled and churn is 5% monthly. Management is weighing a cheaper ad-supported tier at $5.99. Should they launch it and at what price?", "questions": [{"q": "What is the objective?", "a": "Grow total revenue and reduce churn without cannibalizing the ad-free base too much."}, {"q": "What do we know about subscribers?", "a": "30% of churners cite price; 20% of current subscribers say they would switch to a cheaper tier."}, {"q": "What would ad revenue be?", "a": "About $4 per ad-tier subscriber per month at current ad fill rates."}, {"q": "What have competitors done?", "a": "Most large services launched ad tiers at $6-8 and reported net revenue gains."}], "buckets": [{"name": "Customer value & segments", "subs": ["Price-sensitive churners vs. loyal ad-free base", "Switch-down intent (20%) vs. new sign-ups", "Ad tolerance by segment"]}, {"name": "Competitive position", "subs": ["Ad-tier price points ($6-8) and outcomes", "Content differentiation and bundling", "Advertiser demand for Northstar's audience"]}, {"name": "Economics", "subs": ["Per-subscriber revenue: $5.99 + $4 ads vs. $11.99", "Breakeven: new/retained subs needed to offset switch-downs", "Ad sales cost and tech investment"]}, {"name": "Execution", "subs": ["Price and feature gap to limit switching (resolution, downloads)", "Launch sequencing and messaging", "Monitor mix shift and ad fill"]}], "generic": "Pricing", "tailored": "Economics compares total revenue per subscriber across tiers including ad revenue; execution centers on feature-gapping to control cannibalization, a streaming-specific lever.", "hyp": "Launch at $6.99-7.99 with a deliberate feature gap; the ad tier adds net revenue if switch-downs stay under ~15% and churn falls as price-sensitive subscribers get a landing spot.", "trap": "Counting only the switch-down loss. Each switch-down costs ~$2 with ads, not $6; the retained churners and new sign-ups usually outweigh it.", "start": "Economics", "startWhy": "The per-subscriber math ($9.99 effective vs. $11.99) tells you how many switch-downs you can absorb; that number drives the price and feature-gap decisions."}, {"id": "cost-1", "type": "cost", "diff": 1, "title": "Back Office", "client": "Hillcrest Community College District", "industry": "Public sector / education", "prompt": "Hillcrest, a three-campus community college district, faces a $9M budget shortfall next year on a $150M budget. The chancellor wants a plan to close the gap without hurting enrollment or instruction.", "questions": [{"q": "What is the cost base?", "a": "65% personnel (half faculty), 15% facilities, 10% IT and admin services, 10% other."}, {"q": "What is driving the shortfall?", "a": "State funding flat, enrollment down 4%, and a 5% salary settlement."}, {"q": "Any constraints?", "a": "Faculty contracts protect tenured positions; the board will not raise tuition this year."}, {"q": "Have cuts been tried before?", "a": "Across-the-board 3% cuts two years ago; departments restored spending since."}], "buckets": [{"name": "Baseline", "subs": ["Cost by category and campus; fixed vs. variable", "Addressable vs. protected (tenure, contracts)", "Cost per student by program"]}, {"name": "Benchmarks", "subs": ["Admin and facilities cost per student vs. peer districts", "Course-section fill rates and class sizes", "Shared-services models at other districts"]}, {"name": "Levers", "subs": ["Demand: consolidate low-enrollment sections, campus footprint", "Price/procurement: contracts, energy, software", "Productivity/structure: shared services across campuses, attrition"]}, {"name": "Impact & risk", "subs": ["Run-rate vs. one-time savings; timing vs. deadline", "Enrollment and instruction risk by lever", "Sequencing and stakeholder management"]}], "generic": "Cost reduction", "tailored": "Baseline distinguishes addressable from contract-protected cost; levers are framed around sections, campuses, and shared services; risk measured against enrollment, the district's revenue driver.", "hyp": "The $9M comes mostly from consolidating low-fill sections and sharing back-office services across campuses, not from across-the-board cuts, which already failed.", "trap": "Across-the-board cuts. They hit the revenue engine (instruction and enrollment services) as hard as the overhead and creep back.", "start": "Baseline", "startWhy": "With 65% personnel and protected faculty, you must know what is actually addressable before any lever is realistic."}, {"id": "cost-2", "type": "cost", "diff": 2, "title": "Line Speed", "client": "Tanglewood Furniture", "industry": "Manufacturing / furniture", "prompt": "Tanglewood manufactures upholstered furniture in two Mississippi plants. A large retail customer has demanded a 10% price cut or it will move the business overseas. Tanglewood needs to cut unit cost by 10% within 12 months to keep the account profitably.", "questions": [{"q": "What is the cost per unit?", "a": "Materials 50% (fabric, foam, frames), direct labor 25%, overhead 15%, freight 10%."}, {"q": "How does Tanglewood compare?", "a": "Labor productivity is below peers; scrap on fabric is 12% vs. 7% benchmark."}, {"q": "How important is this customer?", "a": "35% of revenue; losing it would strand capacity in one plant."}, {"q": "What investments are feasible?", "a": "Owner will fund up to $4M; automation of cutting is one option."}], "buckets": [{"name": "Baseline", "subs": ["Unit cost by element and by plant", "Fixed vs. variable; absorption at lower volume", "Cost specific to this customer's SKUs"]}, {"name": "Benchmarks", "subs": ["Scrap (12% vs. 7%), labor hours per unit", "Material prices vs. market", "Freight cost per unit vs. peers"]}, {"name": "Levers", "subs": ["Materials: fabric yield, foam specs, supplier renegotiation", "Labor: line balancing, automation of cutting ($4M)", "Overhead/structure: consolidate plants, freight routing"]}, {"name": "Impact & risk", "subs": ["Savings by lever vs. 10% target and timing", "Quality and delivery risk to the key account", "Investment payback; what if the customer leaves anyway"]}], "generic": "Cost reduction", "tailored": "Baseline built as unit cost by element (materials/labor/overhead/freight); benchmarks given concrete gaps (scrap, hours); risk includes stranded capacity if the customer leaves.", "hyp": "Closing the scrap gap and automating cutting delivers most of the 10%; plant consolidation is the fallback if the account is lost.", "trap": "Cutting fixed overhead first. A 35% customer leaving would gut absorption; the plan must work in both keep-and-lose scenarios.", "start": "Benchmarks", "startWhy": "A 5-point scrap gap on 50% material cost is already 2.5% of unit cost; the benchmark gaps size the quick wins immediately."}, {"id": "cost-3", "type": "cost", "diff": 2, "title": "Claims Desk", "client": "Harborview Health Plan", "industry": "Healthcare / insurer", "prompt": "Harborview is a regional health insurer with 600,000 members. Administrative cost is 14% of premium, versus 10% for peers. The CFO wants a plan to reach 11% within two years without degrading member service.", "questions": [{"q": "What is in administrative cost?", "a": "Claims processing 30%, customer service 20%, IT 20%, sales/broker commissions 15%, corporate 15%."}, {"q": "Where are the biggest gaps vs. peers?", "a": "Claims auto-adjudication is 65% vs. 85% at peers; call volume per member is double."}, {"q": "Any ongoing programs?", "a": "A core-system replacement is mid-way; completes in 18 months."}, {"q": "Constraints?", "a": "Regulatory service standards; union call-center staff."}], "buckets": [{"name": "Baseline", "subs": ["Cost by function and per member", "Fixed vs. variable with membership", "What is addressable vs. regulated/contracted"]}, {"name": "Benchmarks", "subs": ["Auto-adjudication 65% vs. 85%", "Calls per member 2x peers; cost per call", "IT spend per member; commission rates"]}, {"name": "Levers", "subs": ["Demand: cut call drivers (claim errors, confusing EOBs)", "Productivity: automation, system replacement benefits", "Structure: outsourcing, vendor renegotiation, spans"]}, {"name": "Impact & risk", "subs": ["Savings timeline vs. system go-live", "Member service and regulatory risk", "One-time costs and union considerations"]}], "generic": "Cost reduction", "tailored": "Levers lean on demand reduction (why members call) and automation tied to the system replacement; regulated service standards made explicit in risk.", "hyp": "Reaching 11% is possible: most of the gap is in claims and service, where automation and fixing root causes of calls can deliver without cutting service levels.", "trap": "Cutting service headcount before reducing call drivers. Fewer agents with the same call volume degrades service and triggers regulatory issues.", "start": "Benchmarks", "startWhy": "Two benchmark gaps (auto-adjudication, calls per member) account for most of the 4-point difference; they tell you where to look first."}, {"id": "cost-4", "type": "cost", "diff": 3, "title": "Fleet Review", "client": "Metro Capital Police Department", "industry": "Public sector / law enforcement", "prompt": "A city police department with a $900M budget has been asked by the mayor to find $60M in savings over three years without reducing sworn officers on patrol. The chief wants a plan.", "questions": [{"q": "What is the budget composition?", "a": "80% personnel (sworn and civilian), 8% overtime, 6% fleet and facilities, 6% technology and other."}, {"q": "Where is spending unusual?", "a": "Overtime is $70M and rising; sworn officers do many administrative and desk roles; fleet is older than peers."}, {"q": "What is off the table?", "a": "Patrol headcount and a union contract that fixes base pay for two years."}, {"q": "Prior efforts?", "a": "Hiring freezes on civilians, which pushed more admin work to sworn officers at higher cost."}], "buckets": [{"name": "Baseline", "subs": ["Spend by category and by bureau", "Addressable: overtime, civilian roles, fleet, tech, contracts", "Cost per hour sworn vs. civilian"]}, {"name": "Benchmarks", "subs": ["Overtime as % of payroll vs. peer cities", "Civilianization ratio vs. peers", "Fleet age and maintenance cost per vehicle"]}, {"name": "Levers", "subs": ["Demand: overtime drivers (court time, events, staffing gaps)", "Productivity: civilianize admin roles, scheduling", "Structure/procurement: fleet replacement cycle, contracts, facilities"]}, {"name": "Impact & risk", "subs": ["Savings phasing over 3 years; one-time costs", "Public safety and response-time risk", "Union and political feasibility"]}], "generic": "Cost reduction", "tailored": "Levers emphasize civilianization and overtime drivers, the two public-safety-specific sources; patrol headcount excluded from baseline as non-addressable.", "hyp": "Overtime control and civilianizing admin roles can deliver the $60M; the prior civilian freeze made costs worse and should be reversed.", "trap": "Cutting civilians to protect sworn staff. It moves work to the most expensive labor and raises overtime; the fix is the opposite.", "start": "Levers", "startWhy": "The overtime line ($70M) and the civilianization gap are visible and large; starting there shows a credible path without touching patrol."}, {"id": "cost-5", "type": "cost", "diff": 3, "title": "Overhead", "client": "Cobalt Mining Services", "industry": "Industrial / mining services", "prompt": "Cobalt provides drilling and blasting services to mines in Nevada and Arizona. Commodity prices fell and clients are cutting contracts. Revenue will drop 25% next year. The CEO must reduce cost by 20% while staying ready for the next upcycle.", "questions": [{"q": "What is the cost base?", "a": "Labor 40%, equipment (depreciation, leases, maintenance) 30%, consumables (explosives, bits) 20%, overhead 10%."}, {"q": "Which costs are variable?", "a": "Consumables fully; labor partly (crews can be furloughed, but skilled drillers are hard to rehire); equipment mostly fixed."}, {"q": "What is the demand outlook?", "a": "Trough likely 18-24 months; clients expect a rebound but timing is uncertain."}, {"q": "Benchmarks?", "a": "Competitors use more contract labor and lease rather than own equipment."}], "buckets": [{"name": "Baseline", "subs": ["Cost by category; fixed vs. variable", "Cost that falls automatically with volume (consumables)", "Addressable fixed cost: equipment, overhead, labor"]}, {"name": "Benchmarks", "subs": ["Labor flexibility models (contract vs. employed)", "Equipment ownership vs. leasing", "Overhead per revenue dollar"]}, {"name": "Levers", "subs": ["Capacity: idle, sell, or sublease equipment", "Labor: furlough tiers, retain core drillers, variable pay", "Procurement and overhead cuts"]}, {"name": "Impact & risk", "subs": ["Savings vs. 20% target and timing", "Ability to re-scale when the cycle turns", "Customer service and safety risk"]}], "generic": "Cost reduction", "tailored": "Fixed vs. variable split drives everything because the trigger is a volume drop; levers emphasize flexibility (lease, contract labor) so costs can scale back up.", "hyp": "Consumables fall automatically; the remaining 20% comes from idling or subleasing equipment and tiered labor furloughs that keep core drillers.", "trap": "Cutting the skilled workforce you cannot rehire. Losing drillers saves cash now and forfeits the upcycle; structure cuts to preserve them.", "start": "Baseline", "startWhy": "Separating what falls with volume from what must be actively cut tells you how big the real gap is before choosing painful levers."}, {"id": "compete-1", "type": "compete", "diff": 1, "title": "Discount Aisle", "client": "Hearthstone Hardware", "industry": "Retail / hardware", "prompt": "Hearthstone operates 20 neighborhood hardware stores in Minnesota. A national big-box chain opened three stores nearby last year, and Hearthstone's sales fell 8%. The owner wants to know how to respond.", "questions": [{"q": "Where did sales fall?", "a": "Mostly in the six stores within 10 miles of a big box; the other 14 are flat."}, {"q": "Which categories fell?", "a": "Lumber, large tools, and appliances; paint, fasteners, and repair parts held up."}, {"q": "Who are Hearthstone's customers?", "a": "Homeowners doing small repairs and local contractors; valued for advice and convenience."}, {"q": "What are the economics?", "a": "Gross margin 38%; big box is 10-15% cheaper on big-ticket items."}], "buckets": [{"name": "What changed", "subs": ["Big-box entry: location, pricing, assortment", "Which stores and categories are affected", "Customer behavior shift"]}, {"name": "Where we are losing", "subs": ["By store (6 nearby vs. 14), category, customer type", "Big-ticket vs. repair/convenience categories"]}, {"name": "Why we are losing", "subs": ["Price gap on big-ticket items", "Assortment breadth vs. convenience and advice", "Customer purchase criteria by segment"]}, {"name": "Response options", "subs": ["Reposition: double down on repair, advice, contractors", "Price selectively on visible items; exit big-ticket", "Economics of each option: margin, investment, risk"]}], "generic": "Competitive response", "tailored": "'Where' split by store distance and category, which the facts make sharp; response options framed around retreating from big-ticket rather than matching big-box prices.", "hyp": "Hearthstone should concede big-ticket categories and reposition the six affected stores around repair, advice, and contractors, where big box does not win.", "trap": "Matching on price. Big box has structural cost advantages; a price war on lumber loses margin everywhere to defend sales you cannot keep.", "start": "Where we are losing", "startWhy": "Loss is concentrated in 6 stores and 3 categories; defining that precisely keeps the response targeted instead of company-wide."}, {"id": "compete-2", "type": "compete", "diff": 2, "title": "Free Shipping", "client": "Alder & Finch", "industry": "E-commerce / home goods", "prompt": "Alder & Finch sells mid-priced home décor online. A larger competitor just launched free two-day shipping on all orders and a loyalty program. Alder & Finch's conversion rate dropped 15% in two months. What should they do?", "questions": [{"q": "What is Alder & Finch's shipping policy?", "a": "Free over $75; otherwise $8.99; average order $65; shipping cost per order $9."}, {"q": "Who are the customers?", "a": "Design-conscious 30-50 year-olds; repeat purchase is 35%; they value curation."}, {"q": "What are the margins?", "a": "Gross margin 50%; contribution margin after shipping and marketing 12%."}, {"q": "How is the competitor funded?", "a": "Well-capitalized; using shipping as a loss leader to gain share."}], "buckets": [{"name": "What changed", "subs": ["Competitor move: free shipping, loyalty", "Timing and scale of the conversion drop", "Any other factors (seasonality, ads)"]}, {"name": "Where we are losing", "subs": ["By order size (under vs. over $75)", "New vs. repeat customers", "Product categories and traffic sources"]}, {"name": "Why", "subs": ["Purchase criteria: shipping cost vs. curation vs. price", "Cart abandonment at shipping step", "Loyalty program pull on repeat buyers"]}, {"name": "Response options", "subs": ["Lower free-shipping threshold or flat fee; economics", "Membership/loyalty of our own", "Non-price: curation, exclusives, service; funding plan"]}], "generic": "Competitive response", "tailored": "'Where' is split by order size because the $75 threshold is the pressure point; response economics tie to a 12% contribution margin that limits how much shipping can be subsidized.", "hyp": "Lowering the threshold to $50 and adding a small loyalty perk recovers most of the conversion loss at a cost the margin can bear; full free shipping would wipe out contribution.", "trap": "Matching a loss leader funded by someone else's balance sheet. The response must fit a 12% margin, not the competitor's war chest.", "start": "Where we are losing", "startWhy": "If the conversion drop is concentrated below $75, a threshold change is cheap and targeted; if it is everywhere, the problem is loyalty, not shipping."}, {"id": "compete-3", "type": "compete", "diff": 2, "title": "New Clinic", "client": "Lakeside Orthopedics", "industry": "Healthcare / physician group", "prompt": "Lakeside is a 40-physician orthopedic group in a mid-size city. The regional hospital system just opened its own orthopedic institute and started hiring surgeons and redirecting referrals. Lakeside's new-patient volume is down 20%. How should Lakeside respond?", "questions": [{"q": "How do patients reach Lakeside?", "a": "50% primary-care referrals (many now hospital-employed), 30% self-referral, 20% ER and employer programs."}, {"q": "What does the hospital's institute offer?", "a": "Integrated imaging, surgery, rehab; aggressive marketing; recruited two Lakeside surgeons."}, {"q": "What are Lakeside's strengths?", "a": "Shorter wait times, better outcomes data, lower cost per episode; owns an ambulatory surgery center."}, {"q": "Financial position?", "a": "Profitable but surgeon compensation is under pressure; some partners are considering joining the hospital."}], "buckets": [{"name": "What changed", "subs": ["Hospital vertical integration and referral capture", "Surgeon recruitment from Lakeside", "Marketing and patient perception"]}, {"name": "Where we are losing", "subs": ["Referral channel (hospital-employed PCPs) vs. self-referral", "Service lines (joints, spine, sports)", "Payer segments"]}, {"name": "Why", "subs": ["Referral control, not quality", "Convenience of integrated model", "Surgeon retention and morale"]}, {"name": "Response options", "subs": ["Direct-to-patient and employer channels using outcomes and cost data", "Partnerships: payers, other hospitals, independent PCPs", "Affiliation or merger options; surgeon retention economics"]}], "generic": "Competitive response", "tailored": "'Where' is organized by referral channel because the competitor's weapon is referral control; response includes payer and employer channels that bypass hospital-employed PCPs.", "hyp": "Lakeside cannot win back hospital-employed referrals; it should redirect to payer, employer, and direct channels where its cost and outcome advantage is a selling point, while locking in surgeons.", "trap": "Fighting for the lost referral channel. When a competitor owns the channel, compete in the channels it does not own.", "start": "Why", "startWhy": "Confirming the loss is referral control rather than quality tells you which responses have any chance; it also frames the surgeon retention conversation."}, {"id": "compete-4", "type": "compete", "diff": 3, "title": "Price Cut", "client": "Falcon Air Freight", "industry": "Logistics / air cargo", "prompt": "Falcon operates air-cargo routes between the U.S. and Latin America. A large integrated carrier announced 20% lower rates on Falcon's two most profitable lanes. Falcon's CEO asks whether and how to respond.", "questions": [{"q": "How important are the two lanes?", "a": "40% of revenue and 60% of profit; Falcon has 35% share on them."}, {"q": "Who are the customers?", "a": "Freight forwarders (price-driven) and perishables shippers (reliability-driven, 50% of lane volume)."}, {"q": "What is the competitor's position?", "a": "Entering with spare capacity from a fleet renewal; can sustain low rates for a while; weaker on perishables handling."}, {"q": "What is Falcon's cost position?", "a": "Older aircraft, higher fuel burn; cost per kg about 10% above the competitor."}], "buckets": [{"name": "What changed", "subs": ["Competitor's rate cut: scope, duration, motive (fill capacity)", "Capacity dynamics on the lanes", "Customer reactions so far"]}, {"name": "Where we are losing", "subs": ["By customer type (forwarders vs. perishables)", "By lane and direction", "Volume vs. yield impact"]}, {"name": "Why", "subs": ["Price sensitivity of forwarders", "Reliability and cold-chain value to perishables", "Our 10% cost disadvantage"]}, {"name": "Response options", "subs": ["Selective matching for forwarders; hold rates on perishables", "Capacity: adjust frequency, right-size aircraft", "Cost reduction, alliances, or exit a lane; economics and signaling"]}], "generic": "Competitive response", "tailored": "'Where' and 'why' split by customer type since half the volume values reliability; response adds capacity and alliance moves, which are the levers in a capacity-driven industry.", "hyp": "Hold rates for perishables, match selectively for forwarders, and trim frequency; a full price match loses more profit than the volume it saves given the cost gap.", "trap": "Responding to a capacity-driven price cut as if it were permanent. The competitor is filling new aircraft; signaling restraint while protecting the reliability segment avoids a war.", "start": "Where we are losing", "startWhy": "If perishables customers are staying, the exposure is only the forwarder half; that halves the problem and changes the response."}, {"id": "compete-5", "type": "compete", "diff": 3, "title": "Disruptor", "client": "Beacon Wealth Advisors", "industry": "Financial services / wealth management", "prompt": "Beacon manages $8B for 6,000 clients with a traditional advisor model charging 1% of assets. Low-cost robo-advisors and a national firm offering 0.4% hybrid advice are winning younger clients and some of Beacon's smaller accounts. Beacon's CEO asks how to respond.", "questions": [{"q": "What is the client base?", "a": "Average account $1.3M; 40% of clients under $500K generate 10% of revenue; average client age 61."}, {"q": "Who is leaving?", "a": "Mostly under-$500K accounts and heirs of deceased clients."}, {"q": "What is Beacon's cost structure?", "a": "Advisor compensation 45% of revenue; service cost similar for small and large accounts."}, {"q": "What capabilities exist?", "a": "Strong planning and tax advice; outdated digital experience."}], "buckets": [{"name": "What changed", "subs": ["Entry of robo and 0.4% hybrid models", "Generational transfer of assets", "Client expectations on digital"]}, {"name": "Where we are losing", "subs": ["Small accounts (<$500K) and heirs", "Age cohorts; new-client acquisition", "Service tiers and geographies"]}, {"name": "Why", "subs": ["Fee vs. perceived value for simple needs", "Digital experience gap", "Relationship transfer to heirs failing"]}, {"name": "Response options", "subs": ["Tiered offering: digital/hybrid tier for small accounts and heirs", "Defend core: planning, tax, complex needs at 1%", "Build vs. partner for digital; economics and cannibalization"]}], "generic": "Competitive response", "tailored": "'Where' highlights the small-account/heir segment that drives 10% of revenue; response is a tiered model to defend the core rather than a fee cut across $8B.", "hyp": "Beacon should launch a hybrid lower-fee tier for small accounts and heirs and keep 1% for complex clients; cutting fees across the book would sacrifice far more than the revenue at risk.", "trap": "Cutting the headline fee for everyone. The revenue at risk is 10%; a fee cut on the other 90% is a self-inflicted wound.", "start": "Where we are losing", "startWhy": "Quantifying that losses sit in a 10%-of-revenue segment immediately rules out a book-wide response and points to tiering."}, {"id": "invest-1", "type": "invest", "diff": 1, "title": "Second Oven", "client": "Golden Wheat Bakery", "industry": "Consumer / food manufacturing", "prompt": "Golden Wheat supplies bread to 300 grocery stores and restaurants in Ohio. Its single bakery runs near capacity. Management is deciding whether to invest $6M in a second production line. Should they?", "questions": [{"q": "What is current demand and capacity?", "a": "Running at 92% capacity; turning away about $3M of annual orders; demand growing 8%."}, {"q": "What are the economics of the new line?", "a": "Adds 60% capacity; incremental contribution margin 30%; $6M capex plus $500K annual fixed cost."}, {"q": "What alternatives exist?", "a": "Co-packing with another bakery at lower margin; night shift on the existing line (limited)."}, {"q": "Any risks?", "a": "Largest customer (25% of sales) is re-bidding its contract next year."}], "buckets": [{"name": "Demand", "subs": ["Unmet orders ($3M) and growth (8%)", "Customer concentration and contract risk", "Mix and margin of the incremental demand"]}, {"name": "Economics", "subs": ["Incremental revenue × 30% margin − $500K fixed", "Capex $6M; payback, NPV", "Utilization ramp of the new line"]}, {"name": "Alternatives", "subs": ["Co-packing: lower margin, no capex", "Night shift / line efficiency improvements", "Phased or smaller investment"]}, {"name": "Risks", "subs": ["Loss of the 25% customer", "Demand slowdown; stranded capacity", "Execution: construction, hiring"]}], "generic": "Investment / go-no-go", "tailored": "Demand bucket names the turned-away orders and contract risk; alternatives include co-packing, a bakery-specific option; economics kept to incremental contribution.", "hyp": "The line pays back within ~3 years on current unmet demand alone, but the decision should wait for or be conditioned on the 25% customer's contract renewal.", "trap": "Comparing to do-nothing. The real comparison is to the best alternative (co-packing or a night shift), not to standing still.", "start": "Economics", "startWhy": "If the payback on existing unmet demand is already attractive, the discussion becomes about risk timing; if not, no amount of growth story helps."}, {"id": "invest-2", "type": "invest", "diff": 2, "title": "Warehouse Robots", "client": "Crestline Grocery Distribution", "industry": "Logistics / grocery distribution", "prompt": "Crestline runs five distribution centers serving 400 supermarkets. Leadership is considering a $45M investment to automate picking in its largest DC. The CFO asks whether it is worth it.", "questions": [{"q": "What is the current operation?", "a": "800 pickers; labor cost $40M a year at that DC; turnover 60%; error rate 1.5%."}, {"q": "What does automation deliver?", "a": "Cuts picking labor 50%, errors to 0.3%, throughput up 25%; 18-month install."}, {"q": "Alternatives?", "a": "Incremental tech (voice picking, better layouts) at $5M for ~15% labor savings; outsourcing."}, {"q": "Risks?", "a": "Vendor newness, disruption during install, union negotiations."}], "buckets": [{"name": "Demand & need", "subs": ["Volume growth and throughput constraints", "Labor availability and turnover (60%)", "Service and accuracy requirements"]}, {"name": "Economics", "subs": ["Labor savings $20M/yr, error-cost savings", "Capex $45M, maintenance, software; NPV and payback", "Throughput value if DC is a bottleneck"]}, {"name": "Alternatives", "subs": ["$5M incremental tech for 15% savings", "Outsourcing or partial automation", "Phasing: pilot one zone first"]}, {"name": "Risks", "subs": ["Installation disruption to store service", "Technology and vendor risk", "Union response; stranded investment if volumes shift"]}], "generic": "Investment / go-no-go", "tailored": "Demand framed as labor scarcity and throughput, not sales; alternatives include a cheaper partial option so the case compares against it; risks include service disruption to stores.", "hyp": "Automation pays back in ~2.5 years on labor alone and solves a turnover problem that cheaper options do not; a phased install limits disruption risk.", "trap": "Evaluating against do-nothing. The $5M alternative captures a chunk of the savings; the question is the incremental return of the extra $40M.", "start": "Economics", "startWhy": "$20M of annual labor savings against $45M is a strong headline; confirming it (and the incremental return over the $5M option) focuses the rest of the discussion on risk."}, {"id": "invest-3", "type": "invest", "diff": 2, "title": "Upgrade", "client": "Harbor City Water Authority", "industry": "Public sector / utilities", "prompt": "Harbor City's water authority must decide whether to spend $220M to replace an aging treatment plant now or spend $60M on repairs that extend its life ten years. The board wants a recommendation.", "questions": [{"q": "What is the condition of the plant?", "a": "50 years old; failure risk rising; meets current standards but not expected 2032 regulations."}, {"q": "How would it be funded?", "a": "Municipal bonds; rate increases of 12% for replacement vs. 4% for repairs."}, {"q": "What is demand doing?", "a": "Population flat; per-capita use declining; capacity is not the issue."}, {"q": "What are the risks of each path?", "a": "Repair: regulatory non-compliance in 2032, failure risk. Replace: construction risk, rate-payer pushback."}], "buckets": [{"name": "Need", "subs": ["Service reliability and failure risk now", "Regulatory compliance timeline (2032)", "Capacity (not a driver here)"]}, {"name": "Economics (lifecycle)", "subs": ["NPV of replace-now vs. repair-then-replace", "Operating cost differences (energy, chemicals)", "Rate impact (12% vs. 4%) and affordability"]}, {"name": "Alternatives", "subs": ["Repair now, replace in 10 years", "Phased replacement; regional sharing with neighbors", "Design for smaller capacity given demand trend"]}, {"name": "Risks & stakeholders", "subs": ["Failure and public-health risk under repair path", "Construction and cost-overrun risk", "Rate-payer and political acceptance"]}], "generic": "Investment / go-no-go", "tailored": "Economics framed as lifecycle NPV with affordability (rate impact) rather than profit; need bucket led by reliability and regulation since the authority is not profit-seeking.", "hyp": "Repair-then-replace defers cost but likely costs more over the lifecycle once 2032 compliance is included; a right-sized replacement designed for falling demand is the better value.", "trap": "Replacing like-for-like. Demand is falling; a smaller plant could cut the $220M and the rate increase considerably.", "start": "Alternatives", "startWhy": "The two options presented are not the only ones; a right-sized or phased plant may dominate both, and that reshapes the economics."}, {"id": "invest-4", "type": "invest", "diff": 3, "title": "In-House", "client": "Juniper Apparel", "industry": "Consumer / apparel", "prompt": "Juniper, a $500M apparel brand, outsources all e-commerce fulfillment to a 3PL. Leadership is weighing a $40M investment to build its own fulfillment center. Make a recommendation.", "questions": [{"q": "What does the 3PL cost?", "a": "$28M a year; costs rise with volume; service issues during peak season."}, {"q": "What would in-house cost?", "a": "$40M capex plus $18M annual operating cost at current volume; 2-year build."}, {"q": "What are the strategic drivers?", "a": "Faster delivery, control over customer experience, and returns handling."}, {"q": "What is the growth outlook?", "a": "E-commerce growing 15%; the 3PL contract renews in 18 months."}], "buckets": [{"name": "Strategic need", "subs": ["Is fulfillment core to the customer experience?", "Speed and control vs. flexibility", "Peak-season performance requirements"]}, {"name": "Economics", "subs": ["$28M (rising) vs. $18M + capex; NPV over 7-10 years", "Volume sensitivity and breakeven volume", "Returns-handling cost savings"]}, {"name": "Alternatives", "subs": ["Renegotiate or switch 3PL at renewal", "Hybrid: in-house core, 3PL for peak", "Partner or lease an automated facility"]}, {"name": "Risks", "subs": ["Execution: build, hiring, systems", "Fixed-cost exposure if volume disappoints", "Transition during peak season"]}], "generic": "Investment / go-no-go (build vs. buy variant)", "tailored": "Build-vs-buy framing: strategic need leads because the decision is about control; alternatives include renegotiation at the 18-month renewal and a hybrid model.", "hyp": "In-house saves ~$10M a year at current volume and more with growth, but a hybrid (own core, 3PL for peak) likely captures most of the savings with less fixed-cost risk.", "trap": "Underestimating build time and fixed-cost risk. A 2-year build and $18M fixed cost turn a volume dip into a loss; the 3PL is at least variable.", "start": "Economics", "startWhy": "The 10-year NPV with volume sensitivity settles whether control is worth paying for; strategic benefits matter only if the numbers are close."}, {"id": "invest-5", "type": "invest", "diff": 3, "title": "Spin-Off", "client": "Westfall Media Holdings", "industry": "Media / diversified", "prompt": "Westfall owns a declining newspaper group and a growing events business. The board is considering divesting the newspaper group, which still generates $30M of cash but is shrinking 8% a year. Should they sell, and what should they consider?", "questions": [{"q": "What would the newspapers fetch?", "a": "Indicative offers at 3x cash flow, ~$90M; buyers are consolidators."}, {"q": "How are the businesses connected?", "a": "Shared printing, HR, finance, and offices; events business uses newspaper brands for marketing."}, {"q": "What would Westfall do with the proceeds?", "a": "Invest in events (growing 12%, 20% margin) and pay down debt."}, {"q": "What are the stranded costs?", "a": "About $8M of shared overhead would remain after a sale."}], "buckets": [{"name": "Standalone performance", "subs": ["Newspaper cash flow trajectory (−8%/yr)", "Events growth and capital needs", "Value of each inside vs. outside Westfall"]}, {"name": "Interdependence", "subs": ["Shared services and stranded costs ($8M)", "Brand and marketing links to events", "Customer and advertiser overlap"]}, {"name": "Value & economics", "subs": ["$90M now vs. NPV of a declining $30M stream", "Tax and transaction costs", "Use of proceeds: events investment, debt"]}, {"name": "Execution & risks", "subs": ["Buyer universe and deal certainty", "Transition services; employee and community reaction", "Alternatives: harvest, partial sale, JV"]}], "generic": "Investment / go-no-go (divestiture variant)", "tailored": "Divest version: interdependence and stranded costs are their own bucket; value compares sale proceeds with the NPV of a declining stream; use of proceeds is explicit.", "hyp": "Selling at 3x likely beats holding a stream shrinking 8% a year, but only if stranded costs are cut and the proceeds earn more in events; the brand link needs a licensing arrangement.", "trap": "Forgetting stranded costs. $8M of remaining overhead cuts the effective sale value substantially; a divestiture plan must cut it, not just reallocate it.", "start": "Value & economics", "startWhy": "$90M today vs. the NPV of a declining stream is the core comparison; it frames whether interdependence and stranded costs change the answer."}, {"id": "public-1", "type": "ops", "diff": 1, "title": "Line Out the Door", "client": "Fairview County DMV", "industry": "Public sector / services", "prompt": "Fairview County's DMV has average wait times of 95 minutes, triple the state target. The county executive wants wait times under 30 minutes within a year without increasing the budget.", "questions": [{"q": "What is the demand pattern?", "a": "3,000 visits a day across four offices; peaks Mondays and lunch hours; 40% of visits are renewals that could be done online."}, {"q": "What is the capacity?", "a": "80 clerks; average transaction 12 minutes; 15% of clerk time lost to system downtime and lookups."}, {"q": "Where is the bottleneck?", "a": "Initial check-in and document verification; many customers arrive with incomplete documents and come back."}, {"q": "What is off limits?", "a": "Headcount and budget are fixed; union rules limit schedule changes."}], "buckets": [{"name": "Demand", "subs": ["Volume by transaction type and time of day", "Avoidable visits: online renewals (40%), repeat visits", "Appointment vs. walk-in mix"]}, {"name": "Capacity", "subs": ["Clerks × hours × productivity", "Lost time: downtime, lookups (15%)", "Skill mix and cross-training"]}, {"name": "Process", "subs": ["Bottleneck at check-in/verification", "Transaction time by type; rework from incomplete documents", "Queue design and triage"]}, {"name": "Levers", "subs": ["Shift demand online and to appointments", "Pre-check documents; express lanes", "Fix the bottleneck; staff to peaks within union rules"]}], "generic": "Operations / public sector (throughput)", "tailored": "Throughput structure (demand / capacity / process / levers); demand bucket names avoidable visits because 40% could be online; levers constrained by fixed budget and union rules.", "hyp": "Wait times fall under 30 minutes by removing avoidable visits (online renewals, document pre-check) and fixing the check-in bottleneck; no new clerks needed.", "trap": "Adding capacity to a process with avoidable demand. Removing 40% of visits and the rework beats any staffing change you cannot afford anyway.", "start": "Demand", "startWhy": "Avoidable visits are the largest and cheapest lever; quantifying them tells you how much of the problem disappears before touching process."}, {"id": "public-2", "type": "public", "diff": 2, "title": "Enrollment Gap", "client": "State Department of Health — Childcare Subsidy Program", "industry": "Public sector / social services", "prompt": "A state childcare sub
