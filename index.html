function itemsFor(t){const a=[{id:t.id+':b',kind:'buckets'},{id:t.id+':cut',kind:'cut'}];t.buckets.forEach((b,i)=>a.push({id:t.id+':c:'+i,kind:'clicks',bi:i}));a.push({id:t.id+':trap',kind:'trap'},{id:t.id+':start',kind:'start'});return a;}
function parse(id){const [tid,kind,bi]=id.split(':');return{t:T(tid),kind:kind==='b'?'buckets':kind==='c'?'clicks':kind,bi:bi!==undefined?+bi:undefined};}
function schedule(id,ok){const it=item(id);it.reps++;if(ok){it.ok++;it.iv=Math.min(it.iv+1,IV.length-1);}else{it.lapses++;it.iv=0;}const days=IV[it.iv];it.due=ok?(days===0?now()+10*60e3:now()+days*864e5):now()+10*60e3;it.fmt=(it.fmt+1)%4;}
function dueItems(){const out=[];TYPES.forEach((t,i)=>{if(!unlocked(i))return;const L=lv(t.id);itemsFor(t).forEach(x=>{const it=S.items[x.id];if(!it||!it.reps)return;if(it.due<=now())out.push(x);});});return out;}

/* ================= XP ================= */
function award(base,fast){let m=1;if(S.combo>=6)m=2;else if(S.combo>=3)m=1.5;let xp=Math.round(base*m)+(fast?5:0);S.xp+=xp;const d=today();if(S.daily.date!==d){S.daily.date=d;S.daily.xp=0;}S.daily.xp+=xp;touchStreak();save();return xp;}
function touchStreak(){const d=today();if(S.streak.last===d)return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);if(S.streak.last===y||!S.streak.last)S.streak.n+=1;else{const y2=new Date(Date.now()-2*864e5).toISOString().slice(0,10);if(S.streak.last===y2&&S.streak.freeze>0){S.streak.freeze--;S.streak.n+=1;toast('Streak freeze used');}else S.streak.n=1;}S.streak.last=d;}
function badge(id,title,desc){if(S.badges.some(b=>b.id===id))return null;const b={id,title,desc,at:now()};S.badges.push(b);save();return b;}

/* ================= QUESTION GENERATORS =================
 q = {kind:'mcq'|'build'|'type'|'select', prompt, path, opts:[{t,ok}], answer:[...], check(fn)->{ok,score,detail}, after:html}
*/
const FMT={buckets:['build','mcq','odd','type'],clicks:['select','mcq','odd','type'],cut:['mcq','cloze'],trap:['mcq','type'],start:['mcq','mcq']};
function otherBuckets(t,n){const pool=[];TYPES.forEach(o=>{if(o.id!==t.id)o.buckets.forEach(b=>pool.push(bname(b)));});return pick(pool.filter(x=>!t.buckets.some(b=>bname(b)===x)),n);}
function otherSubs(t,bi,n){const pool=[];t.buckets.forEach((b,i)=>{if(i!==bi)b.subs.forEach(s=>pool.push(s));});return pick(pool,n);}
function foreignSubs(t,n){const pool=[];TYPES.forEach(o=>{if(o.id!==t.id)o.buckets.forEach(b=>b.subs.forEach(s=>pool.push(s)));});return pick(pool,n);}
const pathLabel=(t,b)=>t.name+(b?' → '+bname(b):'');

function genBuckets(t,fmt){
 const names=t.buckets.map(bname);
 if(fmt==='build')return{kind:'build',path:t.name,prompt:'Put the buckets in order.',chips:shuffle(names.concat(otherBuckets(t,2))),answer:names,strict:true};
 if(fmt==='mcq'){const i=Math.floor(Math.random()*names.length);const o=shuffle([{t:names[i],ok:true},...otherBuckets(t,3).map(x=>({t:x,ok:false}))]);return{kind:'mcq',path:t.name,prompt:`Bucket ${i+1} of ${names.length} is …`,opts:o,after:treeHTML(t,i)};}
 if(fmt==='odd'){const x=otherBuckets(t,1)[0];const o=shuffle([{t:x,ok:true},...pick(names,3).map(n=>({t:n,ok:false}))]);return{kind:'mcq',path:t.name,prompt:'Which of these is NOT a bucket in this framework?',opts:o};}
 return{kind:'type',path:t.name,prompt:`Type all ${names.length} buckets, in order.`,hint:'One per line. Key words are enough.',expect:names,lines:true};
}
function genClicks(t,bi,fmt){
 const b=t.buckets[bi],subs=b.subs,pathL=pathLabel(t,b);
 if(fmt==='select'){const decoys=otherSubs(t,bi,2).concat(foreignSubs(t,1));return{kind:'select',path:pathL,prompt:`Tap the ${subs.length} click-downs that belong under ${bname(b)}.`,chips:shuffle(subs.concat(decoys)),answer:subs};}
 if(fmt==='mcq'){const i=Math.floor(Math.random()*subs.length);const o=shuffle([{t:subs[i],ok:true},...otherSubs(t,bi,2).map(x=>({t:x,ok:false})),...foreignSubs(t,1).map(x=>({t:x,ok:false}))]);return{kind:'mcq',path:pathL,prompt:`Which is a click-down under ${bname(b)}?`,opts:o,after:treeHTML(t,bi)};}
 if(fmt==='odd'){const x=otherSubs(t,bi,1)[0];const o=shuffle([{t:x,ok:true},...pick(subs,Math.min(3,subs.length)).map(s=>({t:s,ok:false}))]);return{kind:'mcq',path:pathL,prompt:`Which does NOT belong under ${bname(b)}?`,opts:o,after:treeHTML(t,bi)};}
 return{kind:'type',path:pathL,prompt:`Type the ${subs.length} click-downs under ${bname(b)}.`,hint:'One per line. Key words are enough.',expect:subs,lines:true};
}
function genCut(t,fmt){
 if(fmt==='mcq'){const o=shuffle([{t:t.cut,ok:true},...pick(TYPES.filter(x=>x.id!==t.id),3).map(x=>({t:x.cut,ok:false}))]);return{kind:'mcq',path:t.name,prompt:'Which statement is the MECE cut for this framework — why these buckets and no others?',opts:o};}
 // cloze: blank a key phrase (longest clause)
 const parts=t.cut.split(/[—·;:,.]/).map(s=>s.trim()).filter(s=>s.length>12);const gap=parts.sort((a,b)=>b.length-a.length)[0];const others=[];TYPES.forEach(x=>{if(x.id!==t.id)x.cut.split(/[—·;:,.]/).map(s=>s.trim()).filter(s=>s.length>12).forEach(s=>others.push(s));});const o=shuffle([{t:gap,ok:true},...pick(others,3).map(x=>({t:x,ok:false}))]);return{kind:'mcq',path:t.name,prompt:'Fill the blank: “'+esc(t.cut.replace(gap,'______'))+'”',opts:o};
}
function genTrap(t,fmt){
 if(fmt==='mcq'){const o=shuffle([{t:t.trap,ok:true},...pick(TYPES.filter(x=>x.id!==t.id),3).map(x=>({t:x.trap,ok:false}))]);return{kind:'mcq',path:t.name,prompt:'Which is the trap in this case type?',opts:o};}
 return{kind:'type',path:t.name,prompt:'Name the trap — the predictable mistake in this case type.',hint:'A sentence is fine.',expect:[t.trap],lines:false};
}
function genStart(t){const names=t.buckets.map(bname);const o=shuffle(names.map(n=>({t:n,ok:n===bname({name:t.start})})));return{kind:'mcq',path:t.name,prompt:'Which bucket do you start with?',opts:o,after:t.startWhy?`<div class="tip"><b>Why</b>${esc(t.startWhy)}</div>`:''};}
function genRecall(t){const expect=[];t.buckets.forEach(b=>{expect.push(bname(b));b.subs.forEach(s=>expect.push(s));});return{kind:'type',path:t.name,prompt:'Blank recall: every bucket, in order, with its click-downs.',hint:'Example prompt: “'+esc(t.prompt)+'”. Buckets then click-downs, one per line.',expect,lines:true,recall:true,groups:t.buckets.map(b=>1+b.subs.length)};}
function genFor(id,fmtOverride){const {t,kind,bi}=parse(id);const it=item(id);const fmts=FMT[kind];const fmt=fmtOverride||fmts[it.fmt%fmts.length];let q;if(kind==='buckets')q=genBuckets(t,fmt);else if(kind==='clicks')q=genClicks(t,bi,fmt);else if(kind==='cut')q=genCut(t,fmt);else if(kind==='trap')q=genTrap(t,fmt);else q=genStart(t);q.id=id;q.t=t;return q;}
function treeHTML(t,hi){return `<div class="tree fam-${t.fam}">`+t.buckets.map((b,i)=>`<div class="bk" style="${hi===i?'background:var(--soft);border-radius:0 8px 8px 0;padding:6px 8px':''}"><b>${i+1}. ${esc(b.name)}</b><ul>${b.subs.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`).join('')+'</div>';}

/* boss + bonus */
function genBoss(t){const c=rnd(D.cases.filter(c=>c.type===t.id));const qs=[];
 qs.push({kind:'mcq',path:'Boss · '+c.client,prompt:'<div class="sm mute" style="margin-bottom:8px">'+esc(c.prompt)+'</div>What type of case is this?',opts:shuffle([{t:t.name,ok:true},...pick(TYPES.filter(x=>x.id!==t.id),3).map(x=>({t:x.name,ok:false}))]),base:20});
 const tb=c.buckets.map(b=>b.name);qs.push({kind:'mcq',path:'Boss · '+c.client,prompt:'Which tailored bucket would you start with?',opts:shuffle(tb.map(n=>({t:n,ok:n===c.start}))),after:`<div class="tip"><b>Why</b>${esc(c.startWhy||'')}</div>`,base:20});
 const gi=Math.floor(Math.random()*c.buckets.length);const gb=c.buckets[gi];const gen=t.buckets.map(bname);
 // map tailored bucket to the generic bucket it tailors: best keyword overlap
 let best=0,bi=0;gen.forEach((g,i)=>{const sc=keysOf(g+' '+t.buckets[i].subs.join(' ')).filter(k=>hitKey(k,norm(gb.name+' '+gb.subs.join(' ')))).length;if(sc>best){best=sc;bi=i;}});
 qs.push({kind:'mcq',path:'Boss · '+c.client,prompt:`The tailored bucket “${esc(gb.name)}” (${esc(gb.subs.join(' · '))}) is this client’s version of which generic bucket?`,opts:shuffle(gen.map((g,i)=>({t:g,ok:i===bi}))),after:`<div class="tip"><b>How it was tailored</b>${esc(c.tailored||'')}</div><div class="tip"><b>Hypothesis</b>${esc(c.hyp)}</div><div class="tip"><b>Trap</b>${esc(c.trap)}</div>`,base:20,lenient:true});
 return{qs,c};}
function genBonus(){const qs=[];pick(D.math,2).forEach(m=>qs.push({kind:'mcq',path:'Bonus · numbers cold',prompt:esc(m.q),opts:shuffle([{t:m.a,ok:true},...m.d.map(x=>({t:x,ok:false}))]),base:15,fastOnly:true}));const b=rnd(D.brain);const L=D.lenses.find(l=>l.id===b.lens);if(L)qs.push({kind:'mcq',path:'Bonus · brainstorm lens',prompt:'<div class="sm mute" style="margin-bottom:8px">'+esc(b.prompt)+'</div>Which lens structures this best?',opts:shuffle([{t:L.name,ok:true},...pick(D.lenses.filter(l=>l.id!==b.lens),3).map(l=>({t:l.name,ok:false}))]),after:`<div class="tip"><b>Why</b>${esc(b.why)}</div>`+b.model.map(m=>`<div class="tip"><b>${esc(m.bucket)}</b>${m.ideas.map(esc).join(' · ')}</div>`).join(''),base:15});return qs;}

/* ================= PLAY ENGINE ================= */
let P=null; // {qs, i, ok, t, stage, mode, started, results:[]}
function startStage(tid,k){const t=T(tid);let qs=[];const its=itemsFor(t);
 if(k===1)qs=Array.from({length:6},(_,i)=>genFor(t.id+':b',FMT.buckets[i%4]));
 else if(k===2)qs=[genFor(t.id+':cut','mcq'),genFor(t.id+':cut','cloze'),genFor(t.id+':cut','mcq'),genFor(t.id+':cut','cloze')];
 else if(k===3){t.buckets.forEach((b,i)=>{qs.push(genFor(t.id+':c:'+i,'select'));});t.buckets.forEach((b,i)=>{qs.push(genFor(t.id+':c:'+i,rnd(['mcq','odd'])));});t.buckets.forEach((b,i)=>{qs.push(genFor(t.id+':c:'+i,'type'));});}
 else if(k===4)qs=[genFor(t.id+':trap','mcq'),genFor(t.id+':start'),genFor(t.id+':trap','type'),genFor(t.id+':start')];
 else if(k===5)qs=[Object.assign(genRecall(t),{id:t.id+':b'})];
 else if(k===6){const b=genBoss(t);qs=b.qs;}
 P={qs,i:0,ok:0,t,stage:k,mode:'stage',results:[],started:now()};S.combo=0;go('play');}
function startReview(){let its=dueItems();if(!its.length){const open=TYPES.filter((t,i)=>unlocked(i));its=[];open.forEach(t=>itemsFor(t).forEach(x=>{if(item(x.id).reps)its.push(x);}));}its=pick(its,Math.min(10,its.length));if(!its.length){toast('Nothing to review yet — play a stage');return;}P={qs:its.map(x=>genFor(x.id)),i:0,ok:0,t:null,stage:0,mode:'review',results:[],started:now()};S.combo=0;go('play');}
function startBonus(){P={qs:genBonus(),i:0,ok:0,t:null,stage:0,mode:'bonus',results:[],started:now()};S.combo=0;go('play');}

function renderPlay(){const q=P.qs[P.i];const t=q.t||P.t;const fam=t?t.fam:'eval';const title=P.mode==='stage'?`${P.t.short} · ${STAGES[P.stage-1].name}`:P.mode==='review'?'Review':'Bonus round';
 let h=`<div class="fam-${fam}"><div class="playhead"><button class="ghost" onclick="quit()" style="color:var(--mute);font-size:22px;line-height:1">×</button><div class="prog"><i style="width:${P.i/P.qs.length*100}%"></i></div><span class="combo">${S.combo>=3?'×'+(S.combo>=6?2:1.5)+' '+S.combo+'🔥':''}</span></div>
 <div class="xs mute b" style="margin-bottom:4px">${esc(title)} · ${P.i+1}/${P.qs.length}</div>
 <div class="q"><span class="path">${q.path}</span>${q.prompt}</div><div id="qbody">`;
 if(q.kind==='mcq')h+=q.opts.map((o,i)=>`<button class="opt" onclick="ansMcq(${i})">${esc(o.t)}</button>`).join('');
 else if(q.kind==='build')h+=`<div class="slots" id="slots"></div><div class="chips" id="chips">${q.chips.map((c,i)=>`<button class="chip" data-i="${i}" onclick="chipTap(${i})">${esc(c)}</button>`).join('')}</div><button class="btn" id="chk" onclick="ansBuild()" disabled>Check</button>`;
 else if(q.kind==='select')h+=`<div class="chips" id="chips">${q.chips.map((c,i)=>`<button class="chip" data-i="${i}" onclick="chipSel(${i})">${esc(c)}</button>`).join('')}</div><button class="btn" id="chk" onclick="ansSelect()" disabled>Check</button>`;
 else if(q.kind==='type')h+=`<textarea class="ans" id="ta" placeholder="${q.lines?'One per line…':'Type here…'}" autocapitalize="off" autocorrect="off"></textarea><div class="hint">${q.hint||''}</div><button class="btn" id="chk" onclick="ansType()">Check</button>`;
 h+=`</div><div id="fb"></div></div>`;$('#view').innerHTML=h;q._t0=now();P._sel=[];P._order=[];if(q.kind==='type')setTimeout(()=>{const ta=$('#ta');ta&&ta.focus();},50);window.scrollTo(0,0);}

function chipTap(i){const q=P.qs[P.i];if(P._order.includes(i))return;P._order.push(i);const c=document.querySelector(`.chip[data-i="${i}"]`);c.classList.add('ghost');$('#slots').innerHTML=P._order.map((k,n)=>`<div class="slot"><span class="n">${n+1}</span>${esc(q.chips[k])}<button onclick="chipUndo(${k})" style="margin-left:auto;color:var(--mute)">×</button></div>`).join('');$('#chk').disabled=P._order.length!==q.answer.length;buzz(6);}
function chipUndo(k){P._order=P._order.filter(x=>x!==k);document.querySelector(`.chip[data-i="${k}"]`).classList.remove('ghost');const q=P.qs[P.i];$('#slots').innerHTML=P._order.map((k,n)=>`<div class="slot"><span class="n">${n+1}</span>${esc(q.chips[k])}<button onclick="chipUndo(${k})" style="margin-left:auto;color:var(--mute)">×</button></div>`).join('');$('#chk').disabled=P._order.length!==q.answer.length;}
function chipSel(i){const q=P.qs[P.i];const c=document.querySelector(`.chip[data-i="${i}"]`);if(P._sel.includes(i)){P._sel=P._sel.filter(x=>x!==i);c.classList.remove('pick');}else{P._sel.push(i);c.classList.add('pick');}$('#chk').disabled=P._sel.length!==q.answer.length;buzz(6);}

function ansMcq(i){const q=P.qs[P.i];const ok=q.opts[i].ok;document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(q.opts[k].ok)b.classList.add('ok');else if(k===i)b.classList.add('bad');});finish(ok,ok?1:0,q.after||'');}
function ansBuild(){const q=P.qs[P.i];$('#chk').classList.add('hide');const got=P._order.map(k=>q.chips[k]);let right=0;got.forEach((g,n)=>{if(g===q.answer[n])right++;});const ok=right===q.answer.length;document.querySelectorAll('.slot').forEach((s,n)=>s.classList.add(got[n]===q.answer[n]?'ok':'bad'));finish(ok,right/q.answer.length,ok?'':`<div class="sm">Correct order: ${q.answer.map((a,n)=>`<b>${n+1}.</b> ${esc(a)}`).join(' &nbsp; ')}</div>`);}
function ansSelect(){const q=P.qs[P.i];$('#chk').classList.add('hide');const got=P._sel.map(k=>q.chips[k]);let right=0;got.forEach(g=>{if(q.answer.includes(g))right++;});const ok=right===q.answer.length;document.querySelectorAll('.chip').forEach(c=>{const v=q.chips[+c.dataset.i];if(q.answer.includes(v))c.classList.add('ok');else if(P._sel.includes(+c.dataset.i))c.classList.add('bad');c.disabled=true;});finish(ok,right/q.answer.length,'');}
function ansType(){const q=P.qs[P.i];const text=$('#ta').value;if(!text.trim())return;const res=q.expect.map(e=>matchText(e,text));const n=res.filter(r=>r.hit).length;const score=n/q.expect.length;const ok=score>=(q.recall?.85:.99-1e-9);$('#ta').disabled=true;$('#chk').classList.add('hide');let html=`<div class="sm b">${n}/${q.expect.length} found</div><div class="kw">`+q.expect.map((e,i)=>`<span class="${res[i].hit?'ok':'bad'}">${esc(e)}</span>`).join('')+'</div>';if(n<q.expect.length)html+=`<button class="btn ghost sm" onclick="override()">I said it differently — count it</button>`;P._typeRes={score,n,total:q.expect.length};finish(ok,score,html);}
function override(){const q=P.qs[P.i];P.results.pop();if(P.ok>0&&P._lastOk)P.ok--;P._overrides=(P._overrides||0)+1;finish(true,1,'<div class="sm mute">Counted on your word.</div>',true);}

function finish(ok,score,extra,isOverride){const q=P.qs[P.i];const dt=(now()-q._t0)/1000;const fast=dt<8;
 if(ok){S.combo++;if(S.combo>S.best)S.best=S.combo;}else S.combo=0;
 const base=q.base||(q.kind==='type'?(q.recall?60:20):q.kind==='build'||q.kind==='select'?15:10);
 const xp=ok?award(base,fast&&!q.recall):(score>=.5?award(Math.round(base*score*.5),false):0);
 if(q.id&&!q.fastOnly)schedule(q.id,ok);
 S.totals.q++;if(ok)S.totals.ok++;P.results.push({ok,score,id:q.id});P._lastOk=ok;if(ok)P.ok++;
 const tip=(!ok&&P.mode!=='bonus')?coachTip(q):'';
 const fb=$('#fb');fb.innerHTML=`<div class="fb ${ok?'ok':'bad'} pop"><h3>${ok?rnd(['Nailed it.','Clean.','That’s the structure.','Yes.','Locked in.']):score>=.5?'Partly there.':'Not yet.'}</h3>${xp?`<div class="xp">+${xp} XP${fast&&ok&&!q.recall?' · speed':''}${S.combo>=3?' · combo':''}</div>`:''}${extra||''}${tip}</div><button class="btn" onclick="next()">${P.i+1<P.qs.length?'Next':'Finish'}</button>`;
 if(ok){buzz([10,30,10]);fly('+'+xp+' XP');}else buzz(40);
 if(!isOverride)fb.scrollIntoView({behavior:'smooth',block:'end'});save();renderTop();}
function coachTip(q){const t=q.t;if(!t)return '';const r=parse(q.id||t.id+':b');if(r.kind==='buckets'||r.kind==='clicks')return `<div class="tip"><b>The cut</b>${esc(t.cut)}</div>`;if(r.kind==='cut')return `<div class="tip"><b>Buckets</b>${t.buckets.map((b,i)=>(i+1)+'. '+esc(bname(b))).join(' · ')}</div>`;if(r.kind==='trap')return `<div class="tip"><b>Trap</b>${esc(t.trap)}</div>`;return '';}
function next(){P.i++;if(P.i<P.qs.length)renderPlay();else endPlay();}
function quit(){if(confirm('Leave this session? Progress on answered questions is kept.')){P=null;go('home');}}

function endPlay(){S.sessions++;const n=P.qs.length,ok=P.ok;let h='',passed=false,newBadges=[];
 if(P.mode==='stage'){const st=STAGES[P.stage-1];const L=lv(P.t.id);const score=P.stage===5?P.results[0].score:ok;const need=P.stage===3?Math.ceil(n*st.pass):P.stage===5?st.pass:st.pass;passed=P.stage===5?score>=need:score>=need;
  if(passed){const first=!L.passed[P.stage];L.passed[P.stage]=true;if(ok===n&&P.stage!==5)L.perfect[P.stage]=true;if(P.stage===5){const d=today();if(!L.recall.includes(d))L.recall.push(d);}if(P.stage<6&&L.stage===P.stage)L.stage=P.stage+1;if(P.stage===6)L.boss++;
   const xb=award(P.stage===5?100:P.stage===6?150:50,false);h+=`<div class="xp b" style="color:#B8860B">+${xb} XP stage bonus</div>`;
   if(first){const b=badge(`${P.t.id}-s${P.stage}`,`${P.t.short}: ${st.name}`,`Passed ${st.name} on ${P.t.name}`);if(b)newBadges.push(b);}
   if(ok===n&&P.stage!==5){const b=badge(`${P.t.id}-p${P.stage}`,'Perfect run',`${P.t.name} · ${st.name} with no misses`);if(b)newBadges.push(b);}
   if(P.stage===5&&L.recall.length>=3){const b=badge(`${P.t.id}-master`,`Mastered ${P.t.name}`,'Blank recall on three separate days');if(b)newBadges.push(b);confetti(220,'#F5B81C');}
   else if(P.stage===5&&L.recall.length===1){const idx=TYPES.findIndex(x=>x.id===P.t.id);if(idx+1<TYPES.length)h+=`<div class="badge"><div class="ic">🔓</div><div><b>${esc(TYPES[idx+1].name)} unlocked</b><div class="xs mute">Next level on the path</div></div></div>`;confetti();}
   else confetti(80);
   if(TYPES.slice(0,10).every(x=>mastered(x.id))){const b=badge('all10','The Ten','All ten standard frameworks mastered');if(b)newBadges.push(b);}
  }
  const pct=P.stage===5?Math.round(score*100)+'%':`${ok}/${n}`;
  h=`<div class="card" style="text-align:center"><div class="xs mute b">${esc(P.t.name)} · ${st.name}</div><div class="big" style="margin:8px 0">${pct}</div><h2 style="font-size:22px">${passed?'Stage passed':'Not yet — run it again'}</h2>${P.stage===5?`<div class="sm mute" style="margin-top:6px">Recall days: ${L.recall.length}/3${L.recall.length>=3?' · mastered':''}</div>`:''}${h}${newBadges.map(b=>`<div class="badge"><div class="ic">★</div><div><b>${esc(b.title)}</b><div class="xs mute">${esc(b.desc)}</div></div></div>`).join('')}</div>`;
  if(passed&&P.stage===6)h+=`<button class="btn fam" style="background:var(--gold)" onclick="startBonus()">Bonus round · +45 XP</button>`;
  h+=`<button class="btn ${passed?'sec':''}" onclick="startStage('${P.t.id}',${P.stage})">${passed?'Replay stage':'Try again'}</button>`;
  if(passed&&P.stage<6)h+=`<button class="btn" onclick="startStage('${P.t.id}',${P.stage+1})">Next: ${STAGES[P.stage].name}</button>`;
  h+=`<button class="btn ghost" onclick="go('level','${P.t.id}')">Back to level</button>`;
  h=`<div class="fam-${P.t.fam}">${h}</div>`;
 }else{const acc=Math.round(ok/n*100);if(acc===100)confetti(80);h=`<div class="card" style="text-align:center"><div class="xs mute b">${P.mode==='review'?'Review':'Bonus round'}</div><div class="big" style="margin:8px 0">${ok}/${n}</div><div class="sm mute">${acc===100?'Perfect.':acc>=70?'Solid.':'Those come back today.'}</div></div>`;if(P.mode==='review')h+=`<button class="btn" onclick="startReview()">Another set</button>`;h+=`<button class="btn sec" onclick="go('home')">Back to path</button>`;}
 const goalHit=S.daily.xp>=S.daily.goal;if(goalHit&&!S._goalToast){S._goalToast=today();}
 save();P=null;$('#view').innerHTML=h;renderTop();window.scrollTo(0,0);}

/* ================= VIEWS ================= */
function renderTop(){const r=rank();const pct=r.to?Math.round((S.xp-r.from)/(r.to-r.from)*100):100;$('#top').innerHTML=`<div class="rank">${r.name}<small>${S.xp.toLocaleString()} XP${r.next?' · '+(r.to-S.xp)+' to '+r.next:''}</small></div><div class="pill"><svg viewBox="0 0 24 24" fill="#F5B81C"><path d="M12 2c1 4 4 5 4 9a4 4 0 0 1-8 0c0-2 1-3 1-3s0 2 2 2c0-3-2-5 1-8z"/></svg>${S.streak.n}</div><div class="pill">${S.daily.date===today()?S.daily.xp:0}/${S.daily.goal}</div>`;$('#xprow').innerHTML=`<div id="xpbar" style="flex:1;margin:0"><i style="width:${pct}%"></i></div>`;}
function go(v,arg){V=v;VA=arg;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id==='nav-'+(v==='level'||v==='play'?'home':v)));renderTop();if(v==='home')home();else if(v==='level')level(arg);else if(v==='play')renderPlay();else if(v==='review')review();else if(v==='library')library(arg);else if(v==='stats')stats();window.scrollTo(0,0);}
let V='home',VA=null;

function home(){const d=today();const dx=S.daily.date===d?S.daily.xp:0;const pct=Math.min(100,Math.round(dx/S.daily.goal*100));const due=dueItems().length;
 // current level = first not mastered & unlocked with stage<6 or not passed5
 let cur=TYPES.findIndex((t,i)=>unlocked(i)&&!lv(t.id).passed[5]);if(cur<0)cur=TYPES.findIndex((t,i)=>unlocked(i)&&!mastered(t.id));if(cur<0)cur=TYPES.length-1;
 const ct=TYPES[cur];const L=lv(ct.id);
 let h=`<div class="card goal"><div class="ring"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" stroke="#E6E2DA" stroke-width="7" fill="none"/><circle cx="32" cy="32" r="27" stroke="#F5B81C" stroke-width="7" fill="none" stroke-dasharray="${2*Math.PI*27}" stroke-dashoffset="${2*Math.PI*27*(1-pct/100)}" stroke-linecap="round"/></svg><div class="n">${pct}%</div></div><div class="grow1"><div class="b">Daily goal · ${dx}/${S.daily.goal} XP</div><div class="sm mute">${pct>=100?'Done for today — keep the combo going.':'Streak '+S.streak.n+(S.streak.freeze?' · 1 freeze banked':'')}</div></div></div>`;
 h+=`<div class="fam-${ct.fam}"><button class="btn fam" style="background:var(--c)" onclick="${L.stage<=6?`startStage('${ct.id}',${Math.min(L.stage,6)})`:`go('level','${ct.id}')`}">Continue · ${esc(ct.short)} · ${STAGES[Math.min(L.stage,6)-1].name}</button></div>`;
 h+=`<button class="btn sec" onclick="startReview()">Review${due?' · '+due+' due':''}</button>`;
 h+=`<div class="sect">The ten</div><div class="path">`+TYPES.slice(0,10).map((t,i)=>node(t,i,i===cur)).join('')+`</div>`;
 h+=`<div class="sect">Beyond the ten</div><div class="path">`+TYPES.slice(10).map((t,i)=>node(t,i+10,i+10===cur)).join('')+`</div>`;
 $('#view').innerHTML=h;}
function node(t,i,cur){const L=lv(t.id);const un=unlocked(i);const m=mastered(t.id);return `<div class="node fam-${t.fam} ${un?'unlocked':'locked'} ${cur?'current':''} ${m?'mastered':''}" onclick="${un?`go('level','${t.id}')`:`toast('Pass Blank recall on ${esc(TYPES[i-1].short)} to unlock')`}"><div class="dot">${m?'★':un?i+1:'🔒'}</div><div class="body"><div class="row"><h3 class="grow1">${esc(t.name)}</h3><span class="tag fam">${FAMN[t.fam]}</span></div><div class="xs mute" style="margin-top:2px">“${esc(t.prompt)}”</div><div class="stages">${STAGES.map(s=>`<i class="${L.passed[s.k]?(s.k===5&&m?'gold':'on'):''}"></i>`).join('')}</div></div></div>`;}

function level(tid){const t=T(tid);const L=lv(tid);const i=TYPES.findIndex(x=>x.id===tid);
 let h=`<div class="fam-${t.fam}"><button class="btn ghost" style="justify-content:flex-start;padding:0 0 10px" onclick="go('home')">← Path</button>
 <div class="card"><div class="row"><span class="tag fam">${FAMN[t.fam]}</span><span class="tag soft">Level ${i+1}</span>${mastered(tid)?'<span class="tag" style="background:var(--gold);color:#fff">Mastered</span>':''}</div><h2 style="font-size:24px;margin:8px 0 4px">${esc(t.name)}</h2><div class="sm mute">“${esc(t.prompt)}”</div>
 <div class="ladder" style="margin-top:12px">${STAGES.map(s=>{const open=stageOpen(tid,s.k),done=L.passed[s.k];return `<div class="st ${done?'done':open?'open':'locked'}" onclick="${open?`startStage('${tid}',${s.k})`:''}"><div class="k">${done?'✓':s.k}</div><div class="t"><b>${s.name}</b><small>${s.sub}${s.k===5?` · ${L.recall.length}/3 days`:''}${L.perfect[s.k]?' · perfect':''}</small></div>${open?'<span class="mute">›</span>':''}</div>`;}).join('')}</div></div>
 <details class="card acc" ${L.passed[1]?'':'open'}><summary>Study the tree</summary><div class="xs mute b" style="margin:6px 0">The MECE cut</div><div class="sm">${esc(t.cut)}</div>${treeHTML(t)}<div class="tip"><b>Trap</b>${esc(t.trap)}</div><div class="tip"><b>Start with</b>${esc(t.start)}${t.startWhy?' — '+esc(t.startWhy):''}</div>${t.hyp?`<div class="tip"><b>Hypothesis starter</b>${esc(t.hyp)}</div>`:''}${t.formula?`<div class="tip"><b>Formula</b>${esc(t.formula)}</div>`:''}</details></div>`;
 $('#view').innerHTML=h;}

function review(){const due=dueItems();const byT={};due.forEach(x=>{const r=parse(x.id);byT[r.t.id]=(byT[r.t.id]||0)+1;});
 let h=`<div class="card"><h2 style="font-size:22px">Review</h2><div class="sm mute" style="margin:4px 0 12px">${due.length?due.length+' items due. Missed items come back within the session and again today.':'Nothing due right now.'}</div>${Object.keys(byT).map(k=>`<div class="row sm" style="padding:4px 0"><span class="grow1">${esc(T(k).name)}</span><b>${byT[k]}</b></div>`).join('')}<button class="btn" style="margin-top:10px" onclick="startReview()">${due.length?'Start review':'Mixed practice'}</button></div>`;
 h+=`<div class="card"><h3 style="font-size:16px;margin-bottom:6px">How items are scheduled</h3><div class="sm mute">Every bucket, click-down set, cut, trap and start bucket is its own item. Correct → 0 / 1 / 3 / 7 / 14 / 30 days. A miss resets it to today. Each return uses a different format: build → choose → odd-one-out → type.</div></div>`;
 $('#view').innerHTML=h;}

function library(tab){tab=tab||'frameworks';let h=`<div class="seg">${['frameworks','cases','brainstorms','numbers','coaching'].map(k=>`<button class="${tab===k?'on':''}" onclick="go('library','${k}')">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>`;
 if(tab==='frameworks')h+=`<div class="card">${TYPES.map((t,i)=>`<details class="acc fam-${t.fam}"><summary><span>${i+1}. ${esc(t.name)}</span></summary><div class="sm mute" style="margin-bottom:6px">${esc(t.cut)}</div>${treeHTML(t)}<div class="tip"><b>Trap</b>${esc(t.trap)}</div><div class="tip"><b>Start</b>${esc(t.start)}</div></details>`).join('')}</div>`;
 else if(tab==='cases')h+=`<div class="card">${TYPES.map(t=>{const cs=D.cases.filter(c=>c.type===t.id);return cs.length?`<details class="acc fam-${t.fam}"><summary><span>${esc(t.name)} <span class="mute">(${cs.length})</span></span></summary>${cs.map(c=>`<details class="acc"><summary><span>${esc(c.title)} · ${esc(c.client)} <span class="tag soft">D${c.diff}</span></span></summary><p>${esc(c.prompt)}</p>${(c.questions||[]).map(q=>`<p><b>${esc(q.q)}</b><br>${esc(q.a)}</p>`).join('')}<div class="tree">${c.buckets.map((b,i)=>`<div class="bk"><b>${i+1}. ${esc(b.name)}</b><ul>${b.subs.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`).join('')}</div><div class="tip"><b>Hypothesis</b>${esc(c.hyp)}</div><div class="tip"><b>Trap</b>${esc(c.trap)}</div><div class="tip"><b>Start</b>${esc(c.start)} — ${esc(c.startWhy||'')}</div></details>`).join('')}</details>`:'';}).join('')}</div>`;
 else if(tab==='brainstorms')h+=`<div class="card">${D.brain.map((b,i)=>{const L=D.lenses.find(l=>l.id===b.lens);return `<details class="acc"><summary><span>Prompt ${i+1} · ${esc(L?L.name:'')}</span></summary><p>${esc(b.prompt)}</p><div class="tip"><b>Why this lens</b>${esc(b.why)}</div>${b.model.map(m=>`<div class="tip"><b>${esc(m.bucket)}</b>${m.ideas.map(esc).join(' · ')}</div>`).join('')}</details>`;}).join('')}</div>`;
 else if(tab==='numbers')h+=`<div class="card">${D.math.map(m=>`<div class="libcard row sm"><span class="grow1">${esc(m.q)}</span><b>${esc(m.a)}</b></div>`).join('')}</div>`;
 else h+=`<div class="card">${D.coach.map(c=>`<details class="acc"><summary><span>${esc(c.front)}</span></summary><p>${esc(c.back)}</p></details>`).join('')}</div>`;
 $('#view').innerHTML=h;}

function stats(){const acc=S.totals.q?Math.round(S.totals.ok/S.totals.q*100):0;const nm=TYPES.filter(t=>mastered(t.id)).length;
 let h=`<div class="card"><div class="stat"><div><b>${S.xp.toLocaleString()}</b><small>XP</small></div><div><b>${S.streak.n}</b><small>streak</small></div><div><b>${acc}%</b><small>accuracy</small></div><div><b>${nm}/18</b><small>mastered</small></div><div><b>${S.best}</b><small>best combo</small></div><div><b>${S.badges.length}</b><small>badges</small></div></div></div>`;
 h+=`<div class="card"><h3 style="font-size:16px;margin-bottom:8px">Mastery by framework</h3>${TYPES.map(t=>{const L=lv(t.id);const its=itemsFor(t);const known=its.filter(x=>S.items[x.id]&&S.items[x.id].iv>=2).length;const p=Math.round(known/its.length*100);const passed=Object.keys(L.passed).length;return `<div class="fam-${t.fam}" style="margin:8px 0"><div class="row sm"><span class="grow1">${esc(t.name)}</span><span class="mute xs">${passed}/6 stages · ${L.recall.length}/3 days</span></div><div class="meter"><i style="width:${p}%"></i></div></div>`;}).join('')}</div>`;
 h+=`<div class="card"><h3 style="font-size:16px;margin-bottom:8px">Badges</h3>${S.badges.length?S.badges.slice().reverse().map(b=>`<div class="badge"><div class="ic">★</div><div><b>${esc(b.title)}</b><div class="xs mute">${esc(b.desc)}</div></div></div>`).join(''):'<div class="sm mute">None yet.</div>'}</div>`;
 h+=`<div class="card"><h3 style="font-size:16px;margin-bottom:8px">Settings</h3><div class="row sm"><span class="grow1">Daily XP goal</span>${[100,150,250,400].map(g=>`<button class="chip ${S.daily.goal===g?'pick':''}" onclick="S.daily.goal=${g};save();go('stats')">${g}</button>`).join('')}</div><button class="btn ghost sm" style="margin-top:10px" onclick="if(confirm('Reset all progress?')){localStorage.removeItem('${KEY}');location.reload();}">Reset progress</button></div>`;
 $('#view').innerHTML=h;}

/* ================= BOOT ================= */
(function(){if(S.daily.date&&S.daily.date!==today()){/* new day: check streak break */const y=new Date(Date.now()-864e5).toISOString().slice(0,10);if(S.streak.last&&S.streak.last!==y&&S.streak.last!==today()){const y2=new Date(Date.now()-2*864e5).toISOString().slice(0,10);if(!(S.streak.last===y2&&S.streak.freeze>0))S.streak.n=0;}}
 if(S.streak.n>=7)badge('streak7','One week','Seven-day streak');
 save();go('home');
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 window.addEventListener('resize',()=>{});
})();
</script>
</body>
