uth Mentoring","industry":"Nonprofit / youth services","prompt":"Compass Rose Youth Mentoring is a Baltimore nonprofit that pairs about 1,100 middle- and high-school students a year with adult volunteer mentors in a structured 12-month program. Its budget is $6.5 million with 48 staff, mostly match-support coordinators. About 55% of revenue comes from a single national foundation grant that will end in 18 months as the funder shifts priorities. The organization has four months of operating reserves and evidence from a university evaluation that its students have better attendance and graduation rates than peers. The board chair has asked you for a sustainability plan that does not reduce the number of young people served.","questions":[{"q":"What is the outcome Compass Rose is funded to produce, and how strong is the evidence?","a":"Attendance and on-time graduation. The evaluation showed a meaningful graduation lift, which school districts and the juvenile justice system have noticed."},{"q":"What does a match cost, and how does that compare to similar mentoring organizations?","a":"About $5,900 per match per year. Peer organizations run $4,000 to $4,500, mainly through higher coordinator caseloads."},{"q":"What are the other revenue sources today?","a":"Local foundations about 25%, individual donors 12%, a small school-district contract 5%, events the rest."},{"q":"Are there public funders who would pay for these outcomes?","a":"The city school district and the state juvenile services agency both fund mentoring, but through multi-year procurement cycles that take 9 to 12 months."},{"q":"What development capacity does the organization have?","a":"Two fundraising staff, both focused on foundation reporting. No major-gifts program."}],"buckets":[{"name":"Mission outcomes & what funders buy","subs":["Graduation and attendance evidence as the selling proposition","Matches served as the non-negotiable measure","Outcome data funders require for contracts"]},{"name":"Program model & cost per match","subs":["Coordinator caseload (1:50 vs. peers at 1:70)","Volunteer recruitment and screening cost","Match length and re-match rates"]},{"name":"Revenue replacement options","subs":["School-district and juvenile-services contracts","Local foundations and corporate partners","Individual major gifts and earned revenue (curriculum licensing)"]},{"name":"Constraints & timing","subs":["18-month runway and 4 months of reserves","Procurement cycles of 9-12 months","Development staff capacity and bridge funding"]}],"generic":"Nonprofit sustainability (revenue concentration)","tailored":"Kept a cost bucket but framed it as cost per match rather than total cost because the board's constraint is matches served, not spending; revenue options are ranked by procurement timing because the runway is the binding constraint.","hyp":"The gap is roughly $3.6 million a year; individual giving cannot grow eightfold in 18 months. Bet: public contracts with the school district and juvenile services, backed by the graduation evidence, can replace two-thirds of the gap, and bringing cost per match from $5,900 toward $4,800 closes most of the rest without cutting matches. Start procurement now because of the 9-to-12-month cycle.","trap":"Treating this as purely a fundraising problem. A 30% higher cost per match than peers is a lever too, but cutting matches instead of cost per match would sacrifice the measure the mission is judged on.","start":"Revenue replacement options","startWhy":"With procurement cycles nearly as long as the runway, identifying which funders can realistically pay within 18 months decides whether a plan exists at all."},{"id":"public-n4","type":"public","diff":3,"title":"Dry Taps","client":"Maji Safi Initiative","industry":"Nonprofit / international development (water and sanitation)","prompt":"Maji Safi Initiative is an international NGO working in Tanzania's Dodoma and Singida regions. Since 2015 it has drilled boreholes and installed about 1,400 handpumps in villages, funded by two European government donors at about $9 million a year, with 120 staff. A recent independent survey found only 58% of the pumps installed three or more years ago are still working, and the reduction in diarrheal disease among children in program villages is less than half of what the program promised its donors. The donors' mid-term review is in 12 months and they have signaled that renewal depends on results. The country director has asked you how to get functionality to 85% and the health outcome back on track.","questions":[{"q":"What is the outcome the donors are funding: working pumps, or reduced illness?","a":"Reduced child illness. Working pumps are the means, and the review will look at both."},{"q":"Why are pumps failing, and how long do they stay broken?","a":"Mostly small parts: seals, rods, handles. Repairs often wait months because spare parts are two hundred kilometers away and village water committees have not collected enough money to pay a mechanic."},{"q":"Where working pumps exist, are households actually using safe water at the point of use?","a":"Not always. Water is often stored in open containers and some households still use nearer unprotected sources during the rainy season."},{"q":"How is the budget split between building new pumps and maintaining existing ones?","a":"About 80% to drilling and installation, 10% to community mobilization, under 10% to maintenance and monitoring. Donor agreements favor new installations."},{"q":"What role do district governments play?","a":"They are nominally responsible for rural water maintenance but have almost no budget for it."}],"buckets":[{"name":"Objective & how it is measured","subs":["Child diarrheal disease reduction as the outcome; pump functionality as a lead indicator","Safe water at point of use, not just at the pump","12-month review: what can move in time"]},{"name":"Coverage-to-health funnel","subs":["Villages served → pumps functional → households using the pump → water safe when consumed → illness reduced","The 58% functionality drop and seasonal reversion to unprotected sources","Storage and hygiene behavior at household level"]},{"name":"Delivery & maintenance system","subs":["Spare-parts supply chain and local mechanics","Water committee fee collection and repair financing","District government capacity and handover"]},{"name":"Resources & donor constraints","subs":["80% of budget locked in new drilling","Cost per new pump vs. cost per repair","Renegotiating donor agreements to fund maintenance"]}],"generic":"Public sector / nonprofit program outcomes","tailored":"The population funnel runs from villages covered through functional pumps to behavior at the point of use, because the health goal is three steps downstream of the asset the program counts; delivery is reframed as a maintenance system rather than a construction program.","hyp":"The outcome gap is maintenance and household behavior, not coverage. Roughly 40% of pumps are idle for want of a cheap part and a paid mechanic. Bet: redirect about 30% of the drilling budget into a district-level spare-parts and mechanic service plus water-committee fee collection, and add point-of-use storage and hygiene work; that gets functionality to 85% faster than any new borehole and is what moves illness.","trap":"Fixing the non-bottleneck by drilling more pumps, because that is what the budget and donor agreements reward, and treating a functional pump as the outcome when children still drink unsafe stored water.","start":"Coverage-to-health funnel","startWhy":"Walking the chain from pump to health shows the losses sit at maintenance and household use, which redirects the whole plan away from construction."},{"id":"public-n5","type":"public","diff":4,"title":"Blue Bin Blues","client":"City of Marrow Falls Department of Sanitation","industry":"Public sector / municipal solid waste and recycling","prompt":"Marrow Falls is a city of about 310,000 in upstate New York whose sanitation department collects curbside recycling weekly from 95,000 households. Five years ago the city earned about $25 a ton for its recyclables; after export markets closed and contamination rose to 28%, its processing contractor now charges the city $85 a ton, and the recycling program's net cost has grown from $4 million to $11 million a year. The city council has instructed the commissioner to cut recycling program cost by 30% within two budget cycles. At the same time, the city's adopted climate plan commits to diverting 50% of waste from landfill by 2030, up from 31% today. The commissioner has asked you how to meet the council's cost target without abandoning the diversion goal.","questions":[{"q":"What is the real objective here: lowest cost, highest diversion, or cost per ton diverted?","a":"The council said cost; the climate plan says diversion. Nobody has reconciled them, and the commissioner wants you to propose the measure."},{"q":"What drives the $85-a-ton processing fee?","a":"Contamination. The contract charges a penalty above 15% contamination, and glass and plastic film are the main offenders."},{"q":"How is the $11 million split between collection and processing?","a":"Roughly $7 million collection (trucks, crews, fuel) and $4 million net processing after material revenue."},{"q":"What does landfilling cost per ton, and how much of the 31% diversion is recycling versus yard waste?","a":"Landfill tipping is about $70 a ton. Recycling is about two-thirds of current diversion; yard waste is the rest. Food-waste composting does not exist yet."},{"q":"What levers have peer cities used?","a":"Every-other-week recycling collection, removing glass from the curbside bin to drop-off sites, cart tagging to enforce contamination, and renegotiating processing contracts."}],"buckets":[{"name":"Objective & the measure that matters","subs":["Cost per ton diverted as the reconciling metric","30% cost cut vs. 50% diversion: where they conflict","Greenhouse-gas value per material (cardboard and metal vs. glass)"]},{"name":"Material stream & contamination","subs":["Which materials carry value: cardboard, metals vs. glass, film, mixed plastics","Contamination from 28% toward the 15% penalty threshold","Single-stream vs. dual-stream and resident behavior"]},{"name":"Collection & processing model","subs":["Weekly vs. every-other-week routes ($7M collection base)","Processing contract: penalty terms, revenue-share floor, rebid","Cart size, tagging and enforcement"]},{"name":"Levers & constraints","subs":["Drop glass curbside with drop-off sites","Sanitation union work rules and route redesign","State recycling mandates and council politics"]}],"generic":"Cost reduction + public sector program","tailored":"Framed as a cost case whose denominator is the mission: cost per ton diverted, not total cost. The revenue bucket became material value by stream because 'revenue' in recycling is a commodity price the city does not control.","hyp":"Every-other-week collection saves roughly $2.5 million of the $7 million collection base, and cutting contamination below the 15% threshold saves about $1 million in penalties, together close to the $3.3 million target with diversion held flat. Bet: pair biweekly collection with cart tagging rather than dropping materials, and bank the diversion goal on a future organics program.","trap":"Hitting the cost target by removing glass and plastics from the curbside program. It cuts cost quickly but lowers the diversion rate the climate plan is judged on, and treats processing cost per ton as fixed when contamination is what drives it.","start":"Objective & the measure that matters","startWhy":"The council's cost target and the climate plan's diversion goal will pull in opposite directions; proposing cost per ton diverted as the measure is the only way the rest of the analysis can be judged."},{"id":"unconv-n1","type":"unconv","diff":1,"title":"Empty Galleries","client":"Wexford Museum of Industry","industry":"Nonprofit / cultural institution (museum)","prompt":"The Wexford Museum of Industry in Pittsburgh tells the story of the region's steel, glass and manufacturing past in a converted mill. It draws about 180,000 visitors a year, down from 260,000 in 2015, with a $12 million budget funded roughly 40% by an endowment draw, 30% by admissions and memberships, and 30% by gifts and grants, and it employs 85 people. The permanent exhibits were last refreshed in 2016 and the museum has no dedicated temporary-exhibition gallery. A new executive director has set a goal of 250,000 visitors within three years and has asked you how to get there.","questions":[{"q":"Is the goal attendance itself, or is attendance a proxy for mission reach or for financial health?","a":"The director sees attendance as the proof of relevance that unlocks donors and grants. Admissions revenue matters but is secondary."},{"q":"Which visitor groups have declined: school groups, tourists, or local repeat visitors?","a":"School groups are steady at about 40,000. Tourists are down modestly. The sharpest drop is local adults and families who used to come more than once a year."},{"q":"What has changed in the offer since 2015?","a":"Very little. Same permanent exhibits, hours cut by one day a week in 2020, and no new programming beyond a summer camp."},{"q":"How does Wexford compare to other Pittsburgh museums on price and refresh cadence?","a":"Admission is similar at about $20. Peers rotate temporary shows two or three times a year and have grown attendance."},{"q":"What capital and board support exists for new exhibits?","a":"The board would support a $3 to $4 million campaign for a changing-exhibition gallery if the plan is convincing."}],"buckets":[{"name":"Objective & how success is measured","subs":["250,000 visitors vs. mission reach vs. financial sustainability","Who counts: paid, member, school, free-day visitors","Donor and grant signals tied to attendance"]},{"name":"Audience segments & visit funnel","subs":["Local repeat visitors and families (the lost 60,000)","School groups and tourists","Awareness → first visit → repeat → membership"]},{"name":"Offer & experience","subs":["Exhibit refresh cadence and a changing-exhibition gallery","Programming: evenings, families, community events","Hours, pricing and free-day strategy"]},{"name":"Constraints & resources","subs":["Capital campaign for the gallery","Endowment draw limits and operating budget","Building, parking and location"]}],"generic":"Unconventional client (mission organization) — objective, stakeholders, options, constraints","tailored":"Opened with an objective bucket because attendance is a proxy, not the mission; segmented visitors by visit frequency rather than demographics because the decline is in repeat local visits specifically.","hyp":"The 80,000-visitor decline is almost entirely local repeat visitors who have no reason to return to unchanged exhibits. Bet: a changing-exhibition gallery with two or three shows a year plus a membership push restores most of that segment; school and tourist volumes are stable and not the lever.","trap":"Reaching for a profit frame: raising admission or cutting hours to protect margin. The goal is visitors as proof of relevance; also treating all visitors as one segment when only one has moved.","start":"Audience segments & visit funnel","startWhy":"Knowing that the loss sits in local repeat visitors, not schools or tourists, directs every subsequent choice about offer and investment."},{"id":"unconv-n2","type":"unconv","diff":2,"title":"New Ballpark","client":"Salem Sawyers Baseball Club","industry":"Sports & entertainment / minor league baseball","prompt":"The Salem Sawyers are a High-A minor league baseball team in Salem, Oregon, owned by a local family for 25 years. They play 66 home games and average about 3,100 fans in a 6,500-seat city-owned stadium, generating roughly $7.5 million in revenue: 35% tickets, 30% concessions, 25% sponsorship, the rest merchandise and events, with 22 full-time staff. Major League Baseball's new facility standards require about $18 million of stadium upgrades by 2028 or the team loses its affiliation. The city has offered to fund half if the club signs a 20-year lease. A fast-growing suburb 20 miles away has offered a brand-new stadium if the team relocates, and a buyer has expressed interest in the franchise. The family has asked you whether to upgrade in Salem, relocate, or sell.","questions":[{"q":"What does the family want: to keep the team in Salem, to maximize financial return, or to exit?","a":"They would like to keep the team in Salem if it is financially sound. Selling is the fallback, not the goal."},{"q":"What happens to the franchise's value and revenue if it loses MLB affiliation?","a":"Affiliated franchises sell for $20 to $30 million. An unaffiliated independent-league team is worth a fraction and loses most sponsorship."},{"q":"What revenue uplift have comparable teams seen from new or renovated stadiums, and does it last?","a":"Attendance and sponsorship typically jump 25 to 35% in the first two years and then fade toward the prior level, with premium seating and naming rights the sticky gains."},{"q":"What are the terms of the suburban offer?","a":"A new stadium funded by the suburb, but the team pays rent of about $1.2 million a year and loses its Salem fan base and sponsors."},{"q":"Can the club finance $9 million of upgrades?","a":"Yes, over 20 years at roughly $650,000 a year in debt service."}],"buckets":[{"name":"Owner's objective & measure","subs":["Keep the team in Salem at a sound return vs. maximize sale value","Franchise value preserved by affiliation","Time horizon of a 20-year lease"]},{"name":"Stakeholders","subs":["MLB and the parent club setting facility standards","City of Salem, suburb, fans and sponsors","Family members with different goals"]},{"name":"Options & their economics","subs":["Upgrade in Salem: $650k/yr debt service vs. premium seating and sponsorship gains","Relocate: $1.2M rent, honeymoon uplift, lost local sponsors","Sell now at an affiliated valuation"]},{"name":"Constraints & risks","subs":["2028 compliance deadline and construction timeline","Lease terms and city politics","Attendance uplift fading after two years"]}],"generic":"Unconventional client — objective, stakeholders, options, constraints (investment variant)","tailored":"The affiliation, not revenue, is the asset being protected, so the objective bucket is about franchise value and staying in Salem; options are compared on durable revenue, not the honeymoon year.","hyp":"Upgrading in Salem costs the club about $650,000 a year and durable gains from premium seating, naming rights and renewed sponsorship should exceed $1 million a year, so it pays for itself and preserves a $20 to $30 million affiliated franchise. Bet: upgrade and sign the lease; relocation's uplift fades while its rent and lost sponsors do not.","trap":"Comparing a new stadium's first-year attendance bump to 20 years of rent or debt service, and forgetting that the affiliation is the asset: without it, the franchise and most sponsorship evaporate regardless of which stadium it plays in.","start":"Owner's objective & measure","startWhy":"Whether the family is optimizing for staying in Salem or for sale value changes which option wins, so the objective must be fixed before comparing economics."},{"id":"unconv-n3","type":"unconv","diff":2,"title":"Three-Year Degree","client":"Wendover College","industry":"Education / private liberal arts college","prompt":"Wendover College is a private liberal arts college in Vermont with about 1,450 undergraduates, down from 1,900 in 2015. Sticker tuition is $62,000 but the discount rate is 58%, so net tuition averages around $26,000 per student; the operating budget is $78 million, the endowment is $140 million, and there are 320 faculty and staff. Several trustees want to launch a three-year accelerated bachelor's degree, using summer terms, to attract price-sensitive students and reverse the enrollment slide. Faculty are skeptical and the regional accreditor will need to approve it. The president has asked you whether Wendover should do it and how to judge it.","questions":[{"q":"What is the college's goal: more students, more net tuition revenue, or financial sustainability more broadly?","a":"Ultimately net tuition revenue to cover the budget. Headcount is what the trustees talk about, but the money is what matters."},{"q":"How would the three-year program be priced, and how many of its students would be new rather than students who would have enrolled anyway?","a":"Same annual price, so each three-year student pays 25% less over their degree. Nobody has estimated what share would be genuinely incremental."},{"q":"What is campus utilization in summer today?","a":"Very low. Dorms are mostly empty and most faculty are off contract."},{"q":"What do faculty and the accreditor object to?","a":"Faculty worry about summer teaching loads and academic quality. The accreditor will want evidence of equivalent learning outcomes and credit hours."},{"q":"Have peer colleges tried this, and what happened?","a":"A handful have. Uptake has been modest, typically 5 to 10% of a class, with the main benefit being a marketing message about affordability."}],"buckets":[{"name":"Objective & the right measure","subs":["Net tuition revenue vs. headcount vs. mission and access","Lifetime net tuition per student under three vs. four years","Sustainability of the $78M budget"]},{"name":"Stakeholders","subs":["Faculty governance and summer contracts","Regional accreditor and credit-hour equivalence","Current students, alumni, athletics eligibility"]},{"name":"Options & economics","subs":["Three-year track: incremental students vs. cannibalized four-year students","Summer term revenue from otherwise empty dorms and classrooms","Alternatives: transfer pathways, new majors, pricing reset"]},{"name":"Constraints","subs":["Accreditation approval timeline","Faculty load and summer staffing cost","Financial aid rules for summer terms"]}],"generic":"Unconventional client — objective, stakeholders, options, constraints (new offering variant)","tailored":"Objective is net tuition revenue rather than enrollment because headcount growth can reduce revenue here; the options bucket splits incremental from cannibalized students, which is the entire economics of the idea.","hyp":"A three-year track cuts lifetime net tuition per student by about 25%, so it only helps if most of its students would not otherwise have enrolled. Peer uptake suggests 5 to 10% of a class, roughly 30 students a year, of whom perhaps half are incremental. Bet: a small, major-specific pilot that fills summer dorms is worth doing as a marketing and access message, but it will not reverse a 450-student decline; the president needs a bigger lever.","trap":"Counting every three-year enrollee as new revenue. Students who would have come anyway now pay 25% less, so cannibalization can make the program revenue-negative while headcount rises.","start":"Objective & the right measure","startWhy":"Headcount and net tuition move in opposite directions under this proposal, so agreeing that revenue, not enrollment, is the measure determines whether the idea can pass."},{"id":"unconv-n4","type":"unconv","diff":3,"title":"Starting Line","client":"City of Bellhaven","industry":"Public sector / city government (major event bid)","prompt":"Bellhaven is a US city of about 620,000 with a growing downtown and a convention and visitors bureau funded by a hotel occupancy tax. The mayor's office is considering a bid to host the US Olympic Marathon Trials and a three-day running festival in early 2028. The national governing body requires a $4 million host fee and the city estimates about $3 million of operating costs for road closures, police overtime and staging. A sports-marketing consultant hired by the bureau projects $40 million of economic impact. Several council members are skeptical and point to other needs. The mayor has asked you whether the city should bid and how the council should judge the decision.","questions":[{"q":"What does the mayor want out of this: net fiscal benefit to the city budget, resident benefit, or city branding and tourism growth?","a":"Honestly, all three, and that is the problem. The council will need you to say which one the decision should rest on."},{"q":"How was the $40 million economic impact calculated?","a":"Total spectator and participant spending, including local residents, multiplied by a regional multiplier. It does not separate out-of-town visitors or net it against costs."},{"q":"Who would pay the $7 million: the general fund, the hotel tax, sponsors?","a":"Currently assumed to be the general fund. The visitors bureau could contribute from hotel tax and sponsors have not yet been approached."},{"q":"How many out-of-town visitors would an event like this draw, and for how long?","a":"Comparable trials drew 20,000 to 30,000 out-of-town visitors for two to three nights. You should assume a number and the spend per visitor."},{"q":"What share of visitor spending comes back to the city as tax?","a":"Roughly 8 to 10% between sales tax and hotel tax, though some goes to the county and state."}],"buckets":[{"name":"Objective & the measure to judge it on","subs":["Net fiscal impact to the city vs. resident benefit vs. brand and tourism","Gross economic impact is spending, not city revenue","Who benefits and who bears disruption"]},{"name":"Stakeholders & who pays","subs":["Council, mayor, visitors bureau and hotel-tax fund","Sponsors, national governing body, residents and businesses on the route","Alternative uses of $7 million"]},{"name":"Sized costs & benefits","subs":["Out-of-town visitors × nights × spend, net of displaced regular visitors","City tax capture at ~8-10% of incremental spend","Host fee, police overtime, staging and contingency"]},{"name":"Risks & constraints","subs":["Weather, security and permitting","Sponsorship shortfall and attention split with the 2028 Olympics","Political risk if benefits are overstated"]}],"generic":"Unconventional client (city) — objective, stakeholders, cost-benefit, constraints","tailored":"The cost-benefit bucket is built from incremental out-of-town spend and city tax capture, not gross impact, and the objective bucket forces a choice among fiscal, resident and brand goals before any numbers are compared.","hyp":"25,000 out-of-town visitors × 2.5 nights × $250 a day is about $16 million of gross incremental spend, of which the city captures perhaps $1.5 million in tax against $7 million of cost. Bet: on a fiscal basis the bid loses money; it is defensible only as a branding and resident-experience investment, and only if the hotel-tax fund and sponsors cover most of the host fee rather than the general fund.","trap":"Treating the $40 million 'economic impact' as the benefit. It is gross spending including locals who would have spent anyway, not revenue to the city; and skipping the question of what goal the council is actually optimizing, since the answer is not profit.","start":"Objective & the measure to judge it on","startWhy":"The same numbers support a yes on branding and a no on fiscal grounds, so the council has to pick its measure before any sizing can decide the question."},{"id":"unconv-n5","type":"unconv","diff":4,"title":"Fewer Steeples","client":"Diocese of Castlemere","industry":"Nonprofit / religious organization (diocesan footprint)","prompt":"The Diocese of Castlemere covers a Rust Belt region of the United States with 142 parishes, about 310,000 registered Catholics, down 30% in twenty years, and weekly Mass attendance of roughly 62,000. It has 190 active priests, projected to fall to about 120 within ten years as retirements outpace ordinations. Combined parish operating revenue is about $95 million; 65 parishes run deficits, and the diocese estimates $140 million of deferred maintenance across church buildings, many of them historic. The bishop has asked for a five-year plan to consolidate to a sustainable footprint while preserving reasonable access to Mass and the sacraments for every community, and he is acutely aware that previous closures elsewhere were appealed to Rome and reversed.","questions":[{"q":"What does the bishop mean by 'reasonable access', and is there a measure he would accept?","a":"He has suggested that no community should be more than about 20 minutes' drive from a church with regular Sunday Mass. He is open to a better definition."},{"q":"Is the binding constraint money or priests?","a":"Both are pressing, but priests are the harder limit. A pastor can realistically serve two or three worship sites; beyond that, Mass schedules break down."},{"q":"How full are the churches on a typical Sunday?","a":"On average about 40% of seating capacity, but it ranges from under 15% in some rural and inner-city parishes to standing room in a few suburban ones."},{"q":"What options exist short of closing a church?","a":"Merging parishes into one canonical parish with several churches, clustering parishes under one pastor, or reducing a church to occasional use. Full closure and sale carries the most appeal risk."},{"q":"Which stakeholders have derailed past consolidations?","a":"Parishioners of ethnic and historic parishes, pastors who resist mergers, and parish schools that depend on their church. Appeals under canon law can take years."}],"buckets":[{"name":"Objective & what must be preserved","subs":["Sacramental access: drive time and Mass schedule, not savings","Sustainable priest workload (2-3 sites per pastor)","Financial viability and maintenance backlog as constraints, not the goal"]},{"name":"Stakeholders & governance","subs":["Parishioners, ethnic and historic parishes, parish schools","Pastors and the presbyteral council","Canon law consultation and appeal process"]},{"name":"Footprint options & criteria","subs":["Merge vs. cluster vs. reduce to occasional use vs. close","Criteria: attendance vs. capacity, drive time, building condition, deficit","Target: priests × sites per pastor = feasible worship sites"]},{"name":"Constraints & transition","subs":["Ten-year priest decline sets the pace","Restrictions on selling or repurposing churches","Sequencing, communication and avoiding appeals"]}],"generic":"Footprint / cost restructuring + unconventional stakeholder case","tailored":"Replaced profitability with access and priest capacity as the binding constraints; stakeholder process is its own bucket because closures that are legally appealed and reversed save nothing.","hyp":"The binding constraint is priests: 120 pastors at two or three sites each supports roughly 100 to 110 worship sites, not 142, and 62,000 weekly attendees at 65% utilization need about 90 churches. Bet: move to about 95 clustered parishes over five years, starting where a deficit parish has another church within 15 minutes, and keep historic churches open for occasional use rather than selling them.","trap":"Ranking parishes by deficit alone. The smallest deficit may be the only church within 30 minutes for a rural community, and the goal is access, not savings; underestimating canon-law appeals that can reverse closures and freeze the whole plan.","start":"Objective & what must be preserved","startWhy":"Defining access and priest workload as the measures, rather than money, is what makes a consolidation plan defensible to parishioners and to Rome."},{"id":"sales-n1","type":"sales","diff":1,"title":"Quiet Showroom","client":"Fenlow Mattress Company","industry":"Consumer / specialty retail","prompt":"Fenlow Mattress Company is a family-owned chain of 42 mattress showrooms across Texas and Oklahoma with about $95M in annual revenue and 310 employees. It sells mid-to-premium mattresses from three national brands plus its own private label, earning a 45% gross margin, and most sales come from walk-in traffic driven by local TV and radio. Store traffic has been flat for three years while online-only mattress brands have grown. The CEO, who is the founder's daughter, wants to grow revenue 15% over the next 18 months without opening new stores. She has asked us where the growth should come from and what to change in how the stores sell.","questions":[{"q":"How does a typical sale work — ticket size, conversion of walk-ins, financing?","a":"Average ticket is about $1,400; roughly one in four walk-ins buys; a third of buyers use in-store financing."},{"q":"Is the 15% goal revenue only, or does margin have to hold?","a":"Revenue, but the CEO will not accept a gross margin below 40%."},{"q":"Does Fenlow sell online at all, and can customers buy the private label elsewhere?","a":"There is a brochure website with no checkout; the private label is exclusive to Fenlow stores."},{"q":"Are competitors in Texas seeing the same flat traffic, or is this specific to Fenlow?","a":"National retailers report traffic down low single digits; the online brands are growing fast. Fenlow is roughly tracking the market."},{"q":"What do stores sell besides the mattress — bases, pillows, protectors, delivery?","a":"Accessories are about 8% of revenue; the CEO suspects that is low versus peers."}],"buckets":[{"name":"Get more shoppers through the door","subs":["Local media mix and cost per store visit","Website that books showroom appointments and sells online","Referral and repeat programs (mattress replaced every 8–10 years)"]},{"name":"Close more of the shoppers who come","subs":["Walk-in conversion by store and by salesperson","Financing approval rates and offer design","Floor model lineup and sleep-trial guarantee"]},{"name":"Earn more per ticket","subs":["Attach rate on adjustable bases, pillows, protectors","Private label vs. national brand mix (private label carries higher margin)","Delivery, haul-away and setup fees"]},{"name":"Sales engine behind the floor","subs":["Commission plan and how it rewards accessories","Staffing by hour vs. traffic pattern","Lead follow-up on shoppers who leave without buying"]}],"generic":"Increasing sales (volume × price / more customers × more per customer)","tailored":"Split 'more customers' into traffic and conversion because a showroom business controls them with different levers, and made per-ticket economics about attach rate and private-label mix rather than list price.","hyp":"Conversion and attach rate are the fastest 15%: lifting conversion from 25% to 28% is worth ~12% of revenue on its own, and raising accessories from 8% to 12% of sales adds the rest, without new media spend.","trap":"Spending the whole case on how to get more traffic. Fenlow already has the shoppers; a one-in-four close rate and an 8% attach rate are where the money is leaking.","start":"Close more of the shoppers who come","startWhy":"Conversion sits on existing traffic and existing cost, so each point of improvement is nearly pure incremental revenue and reaches the 15% target fastest."},{"id":"sales-n2","type":"sales","diff":2,"title":"Leaky Bucket","client":"Fernwood Lawn & Pest","industry":"Consumer services / home services","prompt":"Fernwood Lawn & Pest is a residential lawn-treatment and pest-control company serving suburbs around Atlanta, Charlotte and Nashville. It has about 68,000 recurring customers on annual service plans, $110M in revenue and 900 technicians and office staff. Customers pay per visit on a 6- to 8-visit annual schedule, and almost all revenue is recurring. New-customer sales have grown 12% a year through door-to-door reps and digital leads, yet total revenue has grown only 3% a year. The CEO, backed by a growth-equity investor, wants revenue growth of 10% next year and has asked us why new sales are not showing up in the top line and what to do about it.","questions":[{"q":"What is annual customer churn, and how has it trended?","a":"Around 28% of customers do not renew each year, up from 22% three years ago."},{"q":"When in the customer lifecycle do people leave — first year or later?","a":"About half of first-year customers do not make it to year two; after year two, retention is strong."},{"q":"Is the 10% target top-line revenue or does it need to hold contribution margin?","a":"Revenue, but the investor wants customer acquisition cost to stay roughly flat."},{"q":"What does it cost to acquire a customer versus to keep one, and what is the average plan worth?","a":"Acquisition cost is about $350 per customer; average plan revenue is about $1,600 a year. Retention spend is minimal today."},{"q":"Are competitors in these metros seeing similar churn — is it the market or Fernwood?","a":"National peers report churn in the high teens, so Fernwood is worse than the industry."}],"buckets":[{"name":"Keep the customers we already have","subs":["First-year cancellations: service quality, missed visits, billing surprises","Renewal mechanics: auto-renew, prepay discounts, save desk","Technician continuity and route density by neighborhood"]},{"name":"Earn more per household","subs":["Cross-sell lawn customers into pest and vice versa","Add-on treatments: aeration, mosquito, termite","Price increases at renewal by tenure band"]},{"name":"Win new households efficiently","subs":["Door-to-door rep productivity and cost per sale","Digital lead conversion and speed to quote","Neighborhood clustering so new sales densify routes"]}],"generic":"Increasing sales (retention variant)","tailored":"Led with retention instead of acquisition because a recurring-revenue business grows on net adds, not gross adds; acquisition is a bucket but third, and first-year churn gets its own click-down.","hyp":"Churn is eating the growth: 28% churn on 68,000 customers means ~19,000 lost a year, roughly what sales adds. Cutting first-year churn in half gets most of the way to 10% growth at near-zero acquisition cost.","trap":"Treating 12% new-customer growth as a healthy sales engine and hunting for more leads. Every retained customer is worth $1,600 of revenue for a fraction of the $350 it costs to replace them.","start":"Keep the customers we already have","startWhy":"The gap between 12% gross adds and 3% net growth is entirely churn, so size the churn problem before deciding how much new selling is needed."},{"id":"sales-n3","type":"sales","diff":2,"title":"Empty Calendars","client":"Corvid Analytics","industry":"TMT / B2B software","prompt":"Corvid Analytics sells supply-chain forecasting software to mid-sized manufacturers and distributors in North America. It has $48M in annual recurring revenue, about 420 customers, 260 employees and a direct sales force of 34 account executives based in Denver. The product is well regarded and gross retention is 93%, but new bookings came in 30% below plan last year and the sales team turned over heavily. The company has set a goal of adding $14M in net new ARR next year, almost double last year's result. The CEO and the new Chief Revenue Officer have asked us to diagnose the sales organization and tell them where the bookings will come from.","questions":[{"q":"How does Corvid sell — deal size, sales cycle, who buys?","a":"Average new deal is about $120K in annual value; the sales cycle runs seven to nine months; the buyer is usually a VP of Supply Chain."},{"q":"Is the $14M target all new logos, or does expansion of existing customers count?","a":"Both count. Historically about 60% of new ARR has come from new logos and 40% from expansion."},{"q":"How productive are the account executives — quota attainment, ramp time, tenure?","a":"Only a third hit quota; ramp to full productivity takes about nine months and the average rep has been there under two years."},{"q":"Where do leads come from and does marketing hand over enough pipeline?","a":"Roughly half of pipeline is self-sourced by reps; the pipeline covered about 2x quota when the rule of thumb is 3x."},{"q":"Is demand for this category slowing, or are competitors still growing bookings?","a":"The category is still growing in the mid-teens; two competitors reported record bookings."}],"buckets":[{"name":"Sales capacity and ramp","subs":["Number of ramped reps × quota × attainment","Rep turnover and nine-month ramp cost","Territory and account assignment fairness"]},{"name":"Pipeline generation and coverage","subs":["Marketing-sourced vs. rep-sourced pipeline and 3x coverage gap","Lead quality and ideal customer profile fit","Partner and channel referrals (ERP integrators)"]},{"name":"Win rate and deal velocity","subs":["Stage-by-stage conversion and where deals stall","Sales process, demo and proof-of-value discipline","Discounting and pricing authority"]},{"name":"Expansion within the installed base","subs":["Seat and module upsell across 420 customers","Account management ownership of renewals vs. expansion","Usage signals that flag ready-to-expand accounts"]}],"generic":"Increasing sales (sales-force effectiveness variant)","tailored":"Replaced customer/price buckets with the sales-funnel math a software CRO actually manages: capacity × pipeline × win rate, plus installed-base expansion as a distinct source because it has different economics.","hyp":"The $14M will not come from hiring; with a nine-month ramp new reps barely contribute next year. The bet is coverage and installed base: lifting pipeline coverage from 2x to 3x and pushing expansion from 40% to half of new ARR gets to roughly $14M.","trap":"Recommending more account executives. A rep hired in January is productive in October; the math has to work with the reps who are already ramped.","start":"Sales capacity and ramp","startWhy":"Reps × quota × attainment tells you what the existing team can physically produce next year, which sets how much pipeline and expansion have to cover."},{"id":"sales-n4","type":"sales","diff":3,"title":"Full Tanks","client":"Roadhouse Petroleum","industry":"Energy / fuel retail & convenience","prompt":"Roadhouse Petroleum operates 140 company-owned fuel stations with convenience stores along interstate corridors in Arizona, New Mexico and Nevada. Revenue is about $620M, of which roughly 80% is fuel, and about 1,900 people work in the stores. Fuel volumes are flat, fuel margins are thin and volatile, and the company earns most of its profit inside the store. The CEO wants to grow total sales by $60M over two years and has told the team to 'sell more gas.' The CFO quietly disagrees and has asked us to figure out where $60M of sales should actually come from and whether it should be fuel at all.","questions":[{"q":"How is profit split between fuel and store — what is the gross margin on each?","a":"Fuel earns about 8 cents a gallon, roughly 3% gross margin; the store runs about 30% gross margin and produces nearly 70% of gross profit."},{"q":"Is the $60M goal revenue only, or does the CEO ultimately care about gross profit?","a":"He said revenue, but the board compensates him on EBITDA. The CFO thinks that distinction matters."},{"q":"How many fuel customers come inside the store, and what do they spend?","a":"About 35% of fuel customers enter the store; those who do spend about $7. Peers report 40–45% conversion."},{"q":"Are there foodservice, car wash or loyalty programs today?","a":"Hot food is in 30 stores and is the fastest-growing category; no car washes; a loyalty app launched last year with low enrollment."},{"q":"Is flat fuel volume specific to Roadhouse or is the corridor traffic flat too?","a":"Interstate traffic counts are up slightly; two new competitors with large travel centers opened on the same corridors."}],"buckets":[{"name":"Pump-to-store conversion","subs":["Share of fuel customers who walk inside (35% vs. 40–45% peers)","Loyalty app enrollment and pump-screen offers","Forecourt layout, lighting, restroom quality that pull drivers in"]},{"name":"Basket inside the store","subs":["Hot food and dispensed beverage rollout beyond 30 stores","Private label and category mix (tobacco vs. foodservice margin)","Car wash and services as a new line"]},{"name":"Fuel volume and margin","subs":["Pump price positioning vs. the new travel centers","Fleet and commercial fueling accounts","Diesel vs. gasoline mix"]}],"generic":"Increasing sales (more per customer / mix variant)","tailored":"Built the structure around the store rather than the headline product because a $60M revenue target can be hit with fuel while destroying profit; the buckets are ordered by gross-profit contribution, not revenue share.","hyp":"The $60M should mostly come from converting pumps to baskets: moving store conversion from 35% to 42% and expanding hot food lifts store sales by roughly $45–50M at 30% margin, which is worth more profit than $60M of fuel at 3%.","trap":"Taking 'sell more gas' at face value. $60M of fuel at 8 cents a gallon is about $2M of gross profit; the same revenue inside the store is about $18M. Reframe the goal to gross profit before building anything.","start":"Pump-to-store conversion","startWhy":"Roadhouse already pays to bring the customer to the forecourt; getting seven more of every hundred inside is the cheapest incremental revenue and the highest-margin."},{"id":"sales-n5","type":"sales","diff":4,"title":"Harvest Orders","client":"Tollgate Seed Cooperative","industry":"Agriculture / seed & crop inputs","prompt":"Tollgate Seed Cooperative is a farmer-owned cooperative in central Iowa that sells corn and soybean seed, crop-protection chemicals and agronomy advice to about 4,200 member farms. Revenue is around $380M, with 180 employees including 45 field sales agronomists who each manage a book of farms. Members have been consolidating into fewer, larger operations, and the two national seed companies now sell direct to the largest farms, bypassing the co-op. Tollgate's seed unit sales have fallen 9% over three years while the acres its members farm have grown. The board of farmer-directors wants to restore seed sales to the prior peak within three years, but as a cooperative it must do so without raising prices to members above market. They have asked us how.","questions":[{"q":"How does the co-op make money on seed — margin structure, patronage dividends, how agronomists are paid?","a":"Seed margin is about 12%, paid partly back to members as patronage; agronomists are salaried with a small bonus on volume."},{"q":"Is the goal seed units, seed revenue or the co-op's total wallet share with members?","a":"The board said seed units, but the CEO privately thinks wallet share across seed, chemicals and services is the right measure."},{"q":"Where is the volume going — which farms have shifted to buying direct?","a":"The 300 largest farms, which farm about 40% of member acres, now buy roughly half their seed direct from manufacturers."},{"q":"What does a national company offer a large farm that Tollgate cannot?","a":"Volume rebates, early-pay discounts, and data tools. Tollgate's advantage is the agronomist in the field and the patronage dividend."},{"q":"How are the 45 agronomists deployed — are the largest farms getting the most attention?","a":"Books are assigned by geography, so a 10,000-acre operation and a 400-acre farm get roughly the same visit frequency."}],"buckets":[{"name":"Win back the large farms","subs":["Direct-buy leakage on the 300 largest farms (40% of acres)","Volume and early-pay programs funded by patronage rather than list price","Dedicated key-account agronomists for operations over 5,000 acres"]},{"name":"Deepen wallet share on every acre","subs":["Seed + chemical + service bundles per acre","Acres planned by the agronomist vs. acres actually bought from Tollgate","Seed treatment and trait upgrades per bag"]},{"name":"Redeploy the agronomy sales force","subs":["Book sizing by acres rather than geography","Incentives tied to share of a farm's acres, not units","Data and prescription tools that match the national companies"]},{"name":"Member economics and governance","subs":["Patronage dividend as a price lever within co-op rules","Membership value proposition for consolidating farms","Board acceptance of differentiated programs for large members"]}],"generic":"Increasing sales (hybrid: customer-segment defense + sales-force redesign, non-profit-maximizing owner)","tailored":"Combined a segment-defense structure with a sales-coverage redesign because the loss is concentrated in one segment and the co-op's sales model ignores it; added a governance bucket because a cooperative cannot simply discount, it must route price through patronage.","hyp":"The 9% decline is almost entirely the 300 large farms buying half their seed direct; recovering a third of that leakage with key-account agronomists and patronage-funded volume programs restores the peak. Spreading effort across all 4,200 members will not.","trap":"Treating the member base as an average farm. The 300 largest farms hold 40% of acres and all of the loss; a program designed for the median member does nothing for them, and 'cannot raise prices' does not mean 'cannot differentiate terms.'","start":"Win back the large farms","startWhy":"Size the leakage first: 40% of acres buying half their seed elsewhere is roughly a 20% volume hole, so this segment alone explains more than the entire 9% decline."},{"id":"growth-n1","type":"growth","diff":1,"title":"Second Tank","client":"Hollister Aquatics","industry":"Consumer / pet specialty retail","prompt":"Hollister Aquatics is a specialty aquarium and fish retailer with 22 stores in Florida and Georgia, about $70M in revenue and 400 employees. It sells live fish, tanks, equipment and supplies, with about 60% of revenue from recurring consumables like food, filters and water treatments. Revenue has grown about 4% a year for five years, mostly through two new store openings a year and modest same-store growth. The founder-CEO has set a goal of $120M in revenue in five years and has asked us to lay out where the growth will come from and which paths to prioritize.","questions":[{"q":"How does a Hollister store make money — ticket size, margin by category, how often customers return?","a":"Live fish are low margin but bring people in; equipment and consumables earn 45–50% gross margin; a regular customer visits roughly monthly."},{"q":"Is the $120M target revenue only, and is there a profitability floor?","a":"Revenue, but the CEO wants store-level margins to stay where they are."},{"q":"What does the trajectory look like if nothing changes — how much does 4% growth get us?","a":"The CFO projects about $85M in five years on the current pace."},{"q":"Is the aquarium category growing, and who are the competitors?","a":"The hobby is growing mid single digits; big-box pet chains have weak fish departments and online sells dry goods cheaply."},{"q":"Does Hollister sell online or offer services like tank maintenance for homes and offices?","a":"A small e-commerce site sells dry goods; two stores run a tank-maintenance service that the CEO calls promising but unmanaged."}],"buckets":[{"name":"Grow the stores we have","subs":["Consumables subscription and loyalty to raise visit frequency","Attach rate on tanks sold: stands, lighting, livestock packages","Store remodels and live-fish assortment as traffic driver"]},{"name":"Reach new customers in new places","subs":["New store openings in adjacent Southeast metros","E-commerce for dry goods and live-fish shipping","Commercial accounts: offices, restaurants, medical waiting rooms"]},{"name":"New offerings","subs":["Home and office tank-maintenance service as a recurring revenue line","Private-label consumables","Custom installation and aquascaping"]},{"name":"Buy growth","subs":["Acquire independent fish stores in target metros","Acquire a regional tank-maintenance operator"]}],"generic":"Growth strategy (Core · New reach · New products · Inorganic)","tailored":"Kept the four-path frame but sized it against the gap first: trajectory gets to ~$85M, so the structure has to find ~$35M, which rules out same-store growth alone and forces new stores and services onto the table.","hyp":"The $35M gap is roughly $15M of same-store growth from consumables subscriptions and attach, and $20M from doubling the pace of new stores to four a year plus scaling maintenance; acquisitions are not needed to hit the number.","trap":"Jumping into a profitability frame or listing ideas without sizing. The first move is: $120M target minus $85M trajectory equals a $35M gap, then ask which paths can plausibly fill it.","start":"Grow the stores we have","startWhy":"Same-store growth is the cheapest and fastest path and tells you how much of the $35M gap the other, more expensive paths have to cover."},{"id":"growth-n2","type":"growth","diff":2,"title":"Blocked Shots","client":"Ravenna Sports Medicine","industry":"Healthcare / outpatient physical therapy","prompt":"Ravenna Sports Medicine runs 38 outpatient physical-therapy and sports-rehab clinics in the Pacific Northwest, with about $62M in revenue and 520 staff. Most revenue comes from insurance-reimbursed therapy visits referred by orthopedic surgeons and primary-care physicians, plus a small cash-pay performance program for athletes. Revenue has grown 6% a year for four years, driven by adding two or three clinics a year. The CEO has committed to the board a target of $100M in revenue in four years, while reimbursement rates from the largest commercial payer are being cut 3% next year. She wants to know which growth paths to pursue and whether the target is realistic.","questions":[{"q":"How does a clinic make money — visits per day per therapist, revenue per visit, utilization?","a":"A therapist sees about 11 patients a day at roughly $105 per visit; clinics run at about 75% of capacity."},{"q":"Where does 6% growth get us in four years, and does the target include acquisitions?","a":"The CFO says about $78M on the current path; the board is open to acquisitions but has not budgeted for them."},{"q":"Where do patients come from and how many referred patients actually show up and complete their plan?","a":"About 70% are physician referrals; roughly a quarter of referred patients never book and a third drop out before completing care."},{"q":"Is demand growing in the market, and who else is competing for referrals?","a":"Outpatient PT is growing mid-to-high single digits; two national chains and hospital-owned clinics are expanding in Seattle and Portland."},{"q":"What can Ravenna offer outside insured therapy — cash programs, employer contracts, telehealth?","a":"The cash performance program is 5% of revenue and growing fast; two employer contracts exist; telehealth is minimal."}],"buckets":[{"name":"Fill the clinics we have","subs":["Referral capture: 25% of referrals never book","Plan-of-care completion: a third drop out early","Utilization from 75% toward 85–90% with scheduling and extended hours"]},{"name":"New geographies and referral channels","subs":["De novo clinics in Boise, Spokane, Eugene","Direct-access marketing so patients come without a physician referral","Employer on-site and near-site contracts"]},{"name":"New services beyond insured PT","subs":["Cash-pay performance and wellness programs","Occupational health and workers' comp","Hybrid telehealth follow-up visits"]},{"name":"Acquire clinics","subs":["Independent clinic roll-up in existing metros","Valuation vs. de novo cost per clinic"]}],"generic":"Growth strategy (Core · New reach · New products · Inorganic)","tailored":"Made the core bucket about leakage in the referral funnel rather than 'sell more,' because in insured healthcare the patients already exist and the lever is capture and completion; priced the reimbursement cut into the gap.","hyp":"Gap is about $22M, plus roughly $1M from the payer cut. Closing the referral and dropout leaks fills clinics toward 85% utilization and is worth roughly $8M; the remaining $15M needs five or six new clinics a year or a small roll-up, so the target is realistic only with inorganic help.","trap":"Ignoring the reimbursement cut when sizing the gap, and counting referral volume as revenue when a quarter never arrive and a third do not finish. Growth here is funnel repair before footprint.","start":"Fill the clinics we have","startWhy":"Lifting utilization in 38 existing clinics needs no capital and a clinic at 75% capacity is leaving a quarter of its revenue on the table."},{"id":"growth-n3","type":"growth","diff":2,"title":"Crowded Pier","client":"Thornbury Coastal Hotels","industry":"Hospitality / lodging","prompt":"Thornbury Coastal Hotels owns and operates 14 upscale beach hotels on the Carolina and Georgia coasts, about 2,100 rooms, $210M in revenue and 1,600 employees. It earns roughly 70% of revenue from rooms and 30% from food and beverage, events and spa. Occupancy averages 68% for the year but swings from over 90% in summer to under 40% in winter. Revenue has grown 5% a year, mostly through rate increases. The family that owns Thornbury wants to reach $300M in revenue in five years and is debating between building new hotels, buying hotels, or getting more from the existing ones. They have asked us to structure the decision.","questions":[{"q":"What does the business look like at the hotel level — average daily rate, RevPAR, margin by season?","a":"Average daily rate is about $270; summer months make essentially all the profit and most winter months lose money."},{"q":"Where does the current trajectory land, and is there a capital constraint?","a":"About $268M in five years at the current pace. The family will take on debt for one or two projects but not a portfolio."},{"q":"Is the coastal upscale market growing, and are new hotels coming?","a":"Leisure demand is up high single digits; three competitor resorts are under construction nearby."},{"q":"How full are the non-room businesses — events, spa, restaurants — and who uses them?","a":"Event space is booked about 35% of available dates; spa and restaurants are mostly hotel guests, little local trade."},{"q":"Does Thornbury manage hotels for other owners or run a loyalty program?","a":"No management contracts and no loyalty program; repeat guests are about 30% and book direct."}],"buckets":[{"name":"Fill the shoulder and off-season","subs":["Winter occupancy below 40%: group, conference and wedding business","Rate and package mix by season","Loyalty and direct booking to cut OTA commissions"]},{"name":"Grow non-room revenue per guest","subs":["Event space booked 35% of dates","Spa and dining open to local residents","Experiences: fishing, golf, beach clubs"]},{"name":"Add rooms","subs":["Expand or build on land already owned","Acquire independent coastal hotels and rebrand","Management contracts for third-party owners (asset-light)"]}],"generic":"Growth strategy (Core · New reach · New products · Inorganic)","tailored":"Collapsed 'new reach' and 'inorganic' into one 'add rooms' bucket because in lodging both are footprint decisions bounded by the same capital constraint, and promoted off-season occupancy as the core lever since summer is already sold out.","hyp":"The $32M gap splits: roughly $20M from the existing hotels by lifting winter occupancy to 55% and events to 50% of dates, and $12M from one acquired or built hotel plus a management-contract line; a building program is not needed.","trap":"Treating 68% occupancy as 32% headroom. Summer is full, so the only room-night upside is in months that lose money today; you need to show those nights clear variable cost at winter rates before counting them.","start":"Fill the shoulder and off-season","startWhy":"Empty winter rooms are sunk capacity in hotels the family already owns, so filling them is the only path that needs no new debt."},{"id":"growth-n4","type":"growth","diff":3,"title":"Off the Grid","client":"Ashcombe Microgrids","industry":"Energy / distributed generation & storage","prompt":"Ashcombe Microgrids, based in Austin, designs, installs and operates solar-plus-battery microgrids for hospitals, data centers and university campuses across Texas and the Southwest. Revenue is about $140M, split roughly 85% from one-time project installation and 15% from recurring operations and energy-services contracts, with 380 employees. Revenue has grown 25% a year but is lumpy, with a handful of large projects driving each year. A new CEO has set a target of $400M in revenue in five years with at least half recurring. She has asked us to lay out the growth path and whether the recurring target changes which paths to take.","questions":[{"q":"How do the two revenue lines differ in economics — margin, contract length, capital required?","a":"Projects earn about 15% gross margin and are paid by the customer; energy-services contracts run 10–15 years at 35–40% margin but Ashcombe has to finance the asset."},{"q":"What does the trajectory look like if growth slows from 25%, and what does the recurring line reach on its own?","a":"The CFO assumes growth fades to about 15% as the company gets larger, reaching about $280M; recurring would be about $50M of that."},{"q":"Is the microgrid market growing fast enough, and how concentrated are Ashcombe's customers?","a":"The market is growing 20%-plus; the top five customers are about 45% of revenue."},{"q":"Are competitors pursuing the same energy-as-a-service model, and who finances their assets?","a":"Two national players have infrastructure-fund partners financing their fleets; Ashcombe uses its own balance sheet."},{"q":"Which new segments or regions is the CEO considering?","a":"Industrial sites, municipal utilities and the Mountain West; she is also fielding inbound interest from a small operations-and-maintenance company for sale."}],"buckets":[{"name":"Convert the project pipeline into recurring contracts","subs":["Share of new projects sold as energy-as-a-service vs. one-time install","Third-party financing partner so contracts do not consume Ashcombe's balance sheet","Attach operations contracts to the existing installed base"]},{"name":"New customer segments and regions","subs":["Industrial sites and municipal utilities with similar resilience needs","Mountain West expansion and local permitting and interconnection","Concentration: top five customers at 45% of revenue"]},{"name":"New offerings on the platform","subs":["Grid-services revenue: demand response and capacity payments from stored energy","Software and monitoring subscriptions","EV fleet charging integrated with microgrids"]},{"name":"Acquire capability or fleet","subs":["Buy the operations-and-maintenance company for recurring revenue and skills","Acquire operating microgrid assets from developers exiting"]}],"generic":"Growth strategy (Core · New reach · New products · Inorganic) with a revenue-quality constraint","tailored":"Sized two gaps, not one: $120M of total revenue and $150M of recurring revenue ($200M target minus $50M trajectory). The recurring gap is bigger than the total gap, which means the core bucket is about changing the business model of what Ashcombe already sells, not selling more projects.","hyp":"Growth should be led by converting projects into financed energy-as-a-service contracts with an infrastructure-fund partner; if 60% of new installs are sold that way the recurring line reaches ~$200M, and the O&M acquisition is a small accelerator, not the strategy.","trap":"Sizing only the $400M gap and building a plan that hits it with more projects, which fails the 50% recurring condition. Also missing that recurring contracts need financing, so the balance sheet, not demand, is the binding constraint.","start":"Convert the project pipeline into recurring contracts","startWhy":"The recurring gap ($150M) is larger than the total gap ($120M), so the mix shift is the whole case and determines what the other paths need to add."},{"id":"growth-n5","type":"growth","diff":4,"title":"Exit Window","client":"Gallatin Veterinary Partners","industry":"Healthcare services / veterinary (PE-owned)","prompt":"Gallatin Veterinary Partners is a private-equity-owned group of 64 companion-animal veterinary clinics across the Mountain West and Midwest, with $190M in revenue, about 1,400 staff, and roughly 15% EBITDA margins. The sponsor bought it three years ago at the start of a five-year hold and has grown it from 40 clinics mostly by acquiring independent practices. Same-clinic revenue grows about 5% a year and a veterinarian shortage limits how many appointments each clinic can take. The sponsor needs the platform at $320M in revenue within two years to hit the exit case it has promised its investors. The operating partner has asked us how to get there and what the plan does to the exit multiple.","questions":[{"q":"How does a clinic earn revenue — visits, revenue per visit, services vs. pharmacy and retail?","a":"About 60% is medical services, 25% pharmacy and food, 15% surgery and dental; revenue per visit is around $240 and is rising with price."},{"q":"Where does the current trajectory land in two years, and what has the sponsor been paying for clinics?","a":"About $210M organically. Acquisitions have run about 8x EBITDA for single clinics; the platform is expected to trade at 13–14x on exit."},{"q":"Is the vet shortage specific to Gallatin or industry-wide, and what is it doing to capacity?","a":"Industry-wide; Gallatin has about 15% of veterinarian positions open and clinics are turning away new clients."},{"q":"How much acquisition capacity does the balance sheet have?","a":"Leverage is about 5x; the sponsor would add equity for the right deals but the lenders cap total debt."},{"q":"What does the buyer at exit care about — size, growth, margin, organic vs. acquired?","a":"Scale and same-clinic growth. Buyers discount platforms that are only roll-ups and reward evidence of organic growth and integration."}],"buckets":[{"name":"Buy clinics at a multiple arbitrage","subs":["Pipeline of independent clinics at ~8x vs. ~13x exit multiple","Integration speed: systems, pricing, purchasing within 90 days","Debt capacity and equity top-up needed for ~$90M of acquired revenue"]},{"name":"Lift revenue per clinic within the vet constraint","subs":["Price and service mix: dental, surgery, wellness plans","Vet-tech leverage: more appointments per veterinarian","Pharmacy and food capture vs. online pharmacies"]},{"name":"Add capacity: veterinarians and hours","subs":["Recruiting, relocation and sign-on vs. 15% open positions","Extended and weekend hours in high-demand clinics","Telehealth triage to free in-clinic slots"]},{"name":"Protect the exit multiple","subs":["Organic growth rate buyers will underwrite","Margin dilution from acquiring lower-margin clinics","Integration track record as a diligence item"]}],"generic":"Growth strategy (Core · New reach · New products · Inorganic), inorganic-led under a hard horizon","tailored":"Reordered the paths: with a two-year window and a vet shortage capping organic capacity, M&A is the primary path and the core is secondary. Added an exit-multiple bucket because the goal is exit value, not revenue, so a plan that hits $320M as a pure roll-up can still fail.","hyp":"The $110M gap cannot come from clinics that cannot hire vets; roughly $85–90M must be acquired (about 25–30 clinics) at 8x, with the remaining $20–25M from price, mix and tech leverage to show buyers organic growth. The arbitrage from 8x to 13x funds the equity.","trap":"Building a balanced four-path growth plan when the horizon is two years and capacity is the constraint; new services and new geographies take longer than the hold period. Equally, forgetting that a buyer discounts a pure roll-up, so organic levers are about the multiple, not the revenue.","start":"Buy clinics at a multiple arbitrage","startWhy":"Only acquisitions can close most of a $110M gap in 24 months, so start by testing whether the pipeline and debt capacity can physically deliver ~25–30 clinics."},{"id":"launch-n1","type":"launch","diff":1,"title":"Cold Brew Can","client":"Dunmore Roasters","industry":"Consumer / packaged beverages","prompt":"Dunmore Roasters is a Vermont specialty coffee roaster that sells whole-bean and ground coffee through grocery stores and its own website across the Northeast. Revenue is about $45M with 120 employees, and gross margin on bagged coffee is around 40%. Sales have grown steadily but the grocery coffee aisle is crowded and shelf space is hard to win. The CEO wants to launch a canned ready-to-drink cold brew under the Dunmore name, selling through the same grocery accounts and convenience stores. She has asked us whether the launch makes sense and what it would take to make money on it within three years.","questions":[{"q":"How does Dunmore make money today — channel mix, margin per bag, how much is private website?","a":"About 75% grocery and 25% direct online; a bag earns about $3.50 of gross margin; online is more profitable."},{"q":"What is the goal for the new product — revenue, profit, share, or protecting the brand?","a":"Profitability within three years and at least $10M in revenue; the CEO also hopes it brings younger shoppers to the brand."},{"q":"Would Dunmore make the cold brew itself or use a co-packer, and what does distribution require?","a":"A co-packer initially; convenience stores require refrigerated distribution Dunmore does not have today."},{"q":"How big and how competitive is ready-to-drink cold brew in the Northeast?","a":"It is one of the fastest-growing beverage segments but two national brands hold most of the shelf."},{"q":"Would cold brew replace any bagged-coffee purchases from existing Dunmore customers?","a":"Some; the team thinks a minority of regular bag buyers would switch a portion of their coffee occasions to cans."}],"buckets":[{"name":"Who buys it and how much","subs":["Ready-to-drink cold brew segment size and growth in Dunmore's markets","Attainable shelf share vs. two national brands","Dunmore brand pull in grocery and convenience"]},{"name":"Unit economics of a can","subs":["Co-packer cost, cans, cold-chain distribution per unit","Retail price point and retailer margin","Slotting fees and launch marketing as upfront cost"]},{"name":"Effect on the bagged business","subs":["Cannibalization of bag purchases by existing customers","Shelf-space negotiations: does cold brew help or hurt the bag facings","Brand halo with younger shoppers"]},{"name":"Ability to deliver","subs":["Refrigerated distribution partner","Co-packer capacity and quality","Sales team bandwidth for a second category"]}],"generic":"New product launch (market → economics → fit → capability)","tailored":"Gave cannibalization its own bucket instead of a line item because Dunmore is launching to its own customers through its own retailers; a can that replaces a bag at lower margin is a loss even if the can itself is profitable.","hyp":"The launch works only if most volume is incremental: with ~$1 of margin per can against $3.50 per bag, every bag lost needs three or four cans to replace it. Bet that convenience stores, where Dunmore has no presence today, must carry the volume.","trap":"Judging the product on its own P&L. The right test is incremental company margin after subtracting lost bag sales, and cold-chain distribution is a fixed cost that needs scale before the can earns anything.","start":"Unit economics of a can","startWhy":"Margin per can versus margin per bag sets the cannibalization hurdle, and until you know that you cannot tell whether the market bucket's volume is good news."},{"id":"launch-n2","type":"launch","diff":2,"title":"Lite Policy","client":"Wexley Life Assurance","industry":"Financial services / life insurance","prompt":"Wexley Life Assurance is a mid-sized life insurer headquartered in Hartford with about $2.8B in annual premiums, 3,500 employees and 1.6 million policies, sold mostly through independent agents who earn first-year commissions. Its core product is fully underwritten term life, which requires a medical exam and takes four to six weeks to issue. Younger customers increasingly buy simplified, instant-decision policies from digital insurers. The Chief Product Officer wants to launch a no-exam, digitally underwritten term product with coverage capped at $500,000, sold both online and through agents. The CEO has asked us whether to launch it and how to keep it from undermining the core book.","questions":[{"q":"How does a term policy make money — premiums vs. claims, agent commission, and how long policies stay in force?","a":"Profit comes from pricing mortality correctly and keeping policies in force 10-plus years; agents earn most of the first-year premium as commission."},{"q":"What is the goal — new premium, new customers, defending share, or profitability by a date?","a":"$150M of new annual premium in three years from customers Wexley would not otherwise reach, with the product profitable on a lifetime basis."},{"q":"How would a no-exam product be priced relative to the fully underwritten one, and what does that do to claims risk?","a":"Typically 15–25% higher premium per dollar of coverage to cover less information about the applicant; mispricing shows up as higher claims years later."},{"q":"Who buys simplified-issue term today, and are those Wexley's current customers?","a":"Mostly under-40 buyers purchasing smaller policies online; about 30% of Wexley's current applicants fall into that age band."},{"q":"How would agents react if an online product competes with what they sell?","a":"The agent force is worried about channel conflict and about customers who would have bought a larger exam-based policy choosing the capped product."}],"buckets":[{"name":"Market and reachable buyers","subs":["Under-40 simplified-issue segment size and digital insurer share","Wexley brand recognition outside the agent channel","Customers who would never take a medical exam"]},{"name":"Economics of a no-exam policy","subs":["Premium uplift vs. extra mortality risk from less underwriting","Acquisition cost online vs. agent commission","Persistency: do digital buyers lapse sooner"]},{"name":"Impact on the underwritten book and agents","subs":["Applicants who downgrade from exam-based to capped no-exam coverage","Agent commission design so agents sell both","Adverse selection: do riskier applicants self-select into no-exam"]},{"name":"Build and regulatory readiness","subs":["Digital underwriting data sources and model approval","State filings and rate approvals","Technology build vs. partner platform"]}],"generic":"New product launch","tailored":"Cannibalization here has two faces, downgrading and adverse selection, so the fit bucket is about risk pool and channel rather than shelf space; economics are lifetime claims, not unit margin.","hyp":"The product is worth launching if the premium uplift covers the extra mortality and at least two-thirds of buyers are genuinely new to Wexley; the under-40 group is 30% of current applicants, so without a coverage cap and agent incentive design, downgrades could wipe out the gain.","trap":"Measuring success as new premium written. In insurance a policy can be 'sold' profitably and lose money ten years later if the pool is adversely selected; and a $500K no-exam policy sold to someone who would have bought $1M underwritten is a revenue loss disguised as a launch win.","start":"Economics of a no-exam policy","startWhy":"If the premium uplift cannot cover the extra claims risk the product fails regardless of demand, so the pricing-versus-mortality test comes first."},{"id":"launch-n3","type":"launch","diff":2,"title":"Bolt-On Hitch","client":"Kessler Trailer Works","industry":"Industrial / commercial vehicle equipment","prompt":"Kessler Trailer Works is a 70-year-old manufacturer of utility and equipment trailers in Elkhart, Indiana, with about $260M in revenue, 900 employees, and sales through 400 independent dealers in the US and Canada. It earns about 18% gross margin on trailers, which are sold mostly to landscapers, contractors and farms. Dealers have been asking for a factory-installed telematics unit, a small device that tracks trailer location, tire pressure and brake wear, sold as an option with a monthly subscription. The CEO likes the recurring revenue idea but worries the company has never sold software or subscriptions. He has asked us whether Kessler should launch the telematics option and how to make it pay.","questions":[{"q":"How does Kessler make money — units per year, average price, dealer margin, aftermarket parts?","a":"About 24,000 trailers a year at an average of $11,000; dealers earn roughly 15%; parts and accessories are about 8% of revenue."},{"q":"What is the goal — profit on the device, recurring revenue, or selling more trailers?","a":"The CEO wants a profitable new line with recurring revenue reaching $10M a year in three years, and hopes it helps dealers win fleet customers."},{"q":"Who would buy it — single-trailer landscapers or fleet operators with many trailers?","a":"Mostly fleet customers with five or more trailers, who are about 20% of units but growing; individual buyers are price-sensitive."},{"q":"Would Kessler build the hardware and software or partner with a telematics company?","a":"Partner on the device and platform; Kessler would install, brand and bill."},{"q":"Do competitors offer it, and does a telematics option change which trailer a fleet buys?","a":"One large competitor launched a similar option last year; fleet buyers say it is becoming expected in bids."}],"buckets":[{"name":"Fleet demand for connected trailers","subs":["Fleet share of 24,000 units and attach rate on fleet purchases","Willingness to pay per trailer per month vs. competitor pricing","Retrofit of the existing installed base"]},{"name":"Device and subscription economics","subs":["Hardware cost, install labor and partner revenue share per unit","Monthly subscription margin and churn","Fixed cost: billing, support and platform integration"]},{"name":"Effect on trailer sales and dealers","subs":["Win rate in fleet bids with vs. without telematics","Dealer commission on subscriptions so dealers sell it","Parts and service revenue from predictive maintenance alerts"]},{"name":"Capability to run a subscription business","subs":["Partner selection and contract terms","Recurring billing and customer support","Data ownership and privacy"]}],"generic":"New product launch (attach / add-on variant)","tailored":"Cannibalization flips sign: this add-on protects trailer sales instead of eating them, so the fit bucket is about bid win rate and dealer behavior. Economics split hardware (one-time) from subscription (recurring) because they have different margins and risks.","hyp":"The device itself barely breaks even; the case rests on fleet attach rate and defended trailer sales. If 60% of fleet units attach at about $20 a month, recurring revenue is around $7M in year three, and the real payoff is not losing fleet bids worth tens of millions in trailer revenue.","trap":"Evaluating the telematics line as a standalone product and rejecting it on thin device margins. The incremental economics include trailer sales that would be lost to the competitor without it; equally, assuming individual buyers will attach when only fleets will.","start":"Fleet demand for connected trailers","startWhy":"Attach rate among fleet buyers determines both the subscription volume and the defensive value, so sizing that segment comes before any device cost math."},{"id":"launch-n4","type":"launch","diff":3,"title":"Weekend Degree","client":"Linden College of Business","industry":"Education / private higher education","prompt":"Linden College of Business is a private, nonprofit business school in Richmond, Virginia, with about 2,400 students, $95M in revenue and 380 faculty and staff. Its flagship is a two-year full-time MBA that enrolls 180 students a year at about $70,000 in annual tuition before scholarships. Full-time MBA applicatio
